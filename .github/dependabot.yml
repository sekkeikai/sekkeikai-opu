# 依存パッケージの更新 PR を月 1 回、なるべくまとめて作る
# - 小さな更新（minor / patch）は 1 つの PR にまとめる。大きな更新（major）は壊れやすいので別の PR にする
# - TypeScript は @astrojs/check が対応している版まで、@types/node は .node-version の Node と同じ大きな版に留める
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
