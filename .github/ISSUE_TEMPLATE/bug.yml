name: 不具合の報告
description: 表示が崩れている、リンクが切れている、など
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: ページの URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何が起きているか
      description: スクリーンショットがあると助かります
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 使っている端末・ブラウザ（任意）
      placeholder: iPhone 15 / Safari
