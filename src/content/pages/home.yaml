title: 設計会
description: 岡山県立大学の公認サークル「設計会」。何を・誰のために・なぜつくるかを決める「設計」の力を、学部の違う仲間と磨きます。初めての人も歓迎します。
# トップページは「なぜ今、設計が大事なのか」を長文で伝える。書き方の決まりは docs/writing-guide.md。
#   - 章の見出し(title)は主張の形で。見出しだけ追っても話がつながるようにする
#   - eyebrow は読者が心の中で持っている問い。point はその章の要点(まとめにも自動で出る)
#   - 読者の大半はこのページしか見ない。概要が分かるところから、興味がわくところまでを、このページだけで伝える
#   - 問いかけ(question)や例(example)で身近な場面から入り、抽象的な話につなげる。例は学生生活の場面から選ぶ
#   - 短い出典は段落の note(本文の右)に。折りたたみ(aside)は、本題でない長い補足だけに使う
sections:
  - type: hero
    eyebrow: 岡山県立大学 公認サークル
    title: つくる前に、考え抜く。
    lead: ものづくりが身近になった現代。成果物の価値の差を生むのは、何を・誰のためにつくるかを決める「設計」の力です。設計会は、学部の違う仲間とその力を磨くサークルです。

  - type: summary
    title: 設計会の考え方

  - type: chapter
    id: why-now
    eyebrow: なぜ今、設計なの?
    title: 「つくる」より「決める」が難しい時代
    point: AIに頼めば、動くアプリが数時間で作れます。CADと3Dプリンターを用いれば、複雑な造形物が一晩で完成します。そんな時代、差がつくのは何を・誰のために・なぜつくるかを決める力です。
    blocks:
      - type: question
        text: 「便利な時間割アプリをつくって」とAIに頼んだら、どんなアプリが返ってくるでしょう?
        answer: 「便利」が誰にとって、どんな場面での便利なのかを決めずに頼めば、出てくるのは「全ての人にとって少し便利なアプリ」であって、それはあまり価値の無いものです。
      - type: p
        text: 少し前まで、アプリを一つつくるには、プログラムを何千行も書く必要がありました。今はその多くをAIが書き、3Dプリンターがあれば部品も一晩で手に入ります。
      - type: p
        text: つくる手間が小さくなるほど、仕上がりを左右するのは「何を、なぜ、どうつくるか」を決める部分になります。指示があいまいなら、AIはあいまいなものをつくります。
      - type: example
        title: グループ課題で起きること
        text: 「いい感じのスライドをつくろう」とだけ決めて分担すると、締め切りの前日に、色も主張もばらばらの資料が集まります。手を動かす前に「誰に、何を一つ伝えるか」を10分話せば、作業はむしろ早く終わります。AIに頼むときも、同じことが起きます。
      - type: p
        text: 同じ材料、同じ技術でも、何をどう決めたかで、できあがるものは全く変わります。
      - type: compare
        fromLabel: 思いつきで決めると
        toLabel: 考え抜いて決めると
        rows:
          - from: 機能を全部入れたアプリ
            to: よく使う3つがすぐ押せるアプリ
          - from: 座れるだけの車いす
            to: 押す人も楽な車いす
          - from: 情報を詰め込んだポスター
            to: 一目で伝わるポスター
      - type: heading
        text: 設計が重要になった理由は、AIの他にもある
      - type: list
        items:
          - "**物が複雑につながった。**スマートフォンも車も家電も、ソフトウェアとネットワークでつながっています。一部だけを見て決めると、全体のどこかで困る人が出ます。"
          - "**多様な人への配慮が求められるようになった。**高齢の人、目や耳が不自由な人、日本語が母語でない人。日本では2024年4月から、障害のある人に求められたときの「合理的配慮」が、事業者の義務になりました。"
          - "**環境への責任が、つくる前に問われるようになった。**製品が環境に与える影響の大部分は、設計の段階で決まると言われます。EUでは2024年、設計の段階から環境への配慮を求める規則が発効しました。"
      - type: p
        text: どれも、つくり始める前に手を打つべき問題です。だから今、つくる前に考える力が求められています。
      - type: aside
        title: 仕事の現場で起きていることと、新しい規則
        body:
          - "ソフトウェア開発の現場では、まず「何をつくるか」を仕様書(つくる人に渡す設計の書類)にまとめ、それをAIに渡してプログラムを書かせる進め方が広がり始めています。「仕様駆動開発」と呼ばれ、2025年頃から、そのための道具が次々に公開されています(例: [GitHub「Spec Kit」2025年9月](https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/))。人の仕事の中心が「書くこと」から「決めること」へ移りつつあるのです。"
          - 「製品の環境への影響の8割以上は設計の段階で決まる」という見積もりは、欧州でよく引用されます([欧州委員会の冊子「Ecodesign Your Future」2012年](https://build-up.ec.europa.eu/sites/default/files/content/Brochure-Ecodesign-Your-Future-15022012.pdf))。EUの規則は「[持続可能な製品のためのエコデザイン規則(ESPR)](https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1785880)」です(2024年7月発効)。
          - 合理的配慮の義務は、2024年4月に施行された[改正障害者差別解消法](https://www8.cao.go.jp/shougai/suishin/sabekai.html)によるものです。前もって誰でも使えるように整える「環境の整備」は、努力義務にとどまります([令和6年版 障害者白書(概要)](https://www8.cao.go.jp/shougai/whitepaper/r06hakusho/gaiyou/h01.html))。

  - type: chapter
    id: upstream
    eyebrow: いつ手を打てばいいの?
    title: 直すなら、つくる前が一番安い
    point: 完成してから直すと、つくる前に直すより何十倍もの手間がかかることがあります。つくる前に考える時間は、少ない手間で結果を大きく変えられる時間です。
    blocks:
      - type: question
        text: 家を建てた後で「窓をもう一つ増やしたい」と言ったら、どうなるでしょう?
        answer: 壁を壊し、柱を確かめ、工事をやり直すことになります。図面の段階なら、線を一本書き足すだけで済みました。
      - type: p
        text: ものづくりは、どの分野でもこれと同じです。決めたことの上に次の作業が積み重なっていくので、土台の間違いほど、直すときに崩すものが多くなります。
      - type: p
        text: 大規模な宇宙機の開発を想定したNASAの見積もりでは、要件(設計が満たすべき条件)を決める最初の段階で紛れ込んだ誤りを、完成して使い始めてから直そうとすると、紛れ込んだ段階で直す場合の数十倍、ときには千倍以上の手間がかかります。
      - type: figure
        name: cost-escalation
      - type: p
        text: 逆に言えば、同じ手間をかけるなら、つくる前にかけるのが一番効きます。設計会が「つくる前」にこだわるのは、そのためです。

  - type: chapter
    id: logic
    eyebrow: センスがないと無理?
    title: 良い設計は、センスだけでなく論理で語れる
    point: 設計の良し悪しは、好みだけでなく筋道を立てて説明できます。だから設計は、学んで身に付けられる技術です。
    blocks:
      - type: question
        text: ワットの蒸気機関は、それまでの機関と同じ仕事を、ずっと少ない石炭でこなしました。変えたのは、部品の役割の分け方です。何をどう分けたのでしょう?
        answer: 蒸気を冷やす場所を、シリンダーとは別に分けました。それまでのニューコメンの機関は、一つのシリンダーを毎回温めては冷やしていたので、熱を捨て続けていたのです。
      - type: p
        text: 工学者のナム・P・スーは、設計を「やりたいこと(要求機能)」と「設計で決めるもの(設計パラメーター)」の対応で書き表しました。その上で、良い設計がまず守るべき決まり(公理)として「要求機能どうしの独立を保て」を立てました。公理的設計と呼ばれる考え方で、スー自身がこの2つの蒸気機関を例に挙げています。
        note: "[N. P. Suh, The Principles of Design, Oxford University Press, 1990](https://ndlsearch.ndl.go.jp/books/R100000136-I1970023484892350465)。蒸気機関の例は、[スーの教科書 Axiomatic Design の第1章の草稿(MIT, 1996)](https://web.mit.edu/2.882/www/chapter1/chapter1.htm)の Example 1.3 による。"
      - type: figure
        name: steam-engine
      - type: p
        text: ニューコメンの機関(1712年)では、蒸気を入れることと冷やすことが、互いの邪魔をしていました。ワットは1765年、冷やす役を別の容器(復水器)に分けることを思いつき、1769年に特許を取りました。図の表では●が対角線上に並び、2つの要求機能を一つずつ調節できるようになりました。
        note: "[ロンドンの科学博物館の解説](https://blog.sciencemuseum.org.uk/james-watt-and-the-separate-condenser/)では、同じ仕事に使う石炭はおよそ3分の2減ったとされる(資料によって数字は異なる)。1712年と1765年は、科学博物館の所蔵品の記録([ニューコメン機関](https://collection.sciencemuseumgroup.org.uk/objects/co50900/newcomen-atmospheric-engine-atmospheric-steam-engine)、[ワットの復水器の模型](https://collection.sciencemuseumgroup.org.uk/objects/co50928/watts-second-separate-condenser-1765-condensers))による。"
      - type: p
        text: 公理的設計は、設計を論理で考えるための道具の一つです。設計は、問題を見つける・要件を定める・案を広げる・比べて選ぶ・形を詰める、という[[process|5つの工程]]で進みます。
      - type: p
        text: どの工程にも、観察の仕方、要件の書き方、案の比べ方といった**考え方の道具**がそろっています。道具の使い方を学べば、誰でも設計の質を上げられます。
      - type: link
        label: 設計の進め方を詳しく読む
        href: /design/process/

  - type: chapter
    id: map
    eyebrow: 何を学ぶの?
    title: 設計には、いくつもの見方が要る
    point: 一枚の案内表示にも、人を観察する目、数を数える目、図にして試す目が要ります。設計に必要な知識は、いくつもの学部にまたがります。
    blocks:
      - type: example
        title: 病院の案内表示を設計するなら
        text: 迷っている人を観察し、話を聞くのは「[[human-interface|人から考える]]」見方。どの分かれ道で何人が迷っているかを数えるのは「[[data-analysis|データで考える]]」見方。館内を単純な図にして、案内の置き場所を試すのは「[[modeling|モデルで考える]]」見方です。
      - type: p
        text: 5つの工程のどれでも、上の例のような見方をいくつも同時に使います。ここでは、この見方を「視点」と呼びます。下の表は、工程と視点の組み合わせです。
      - type: map
        variant: compact
      - type: link
        label: 工程と視点を、図と一緒に詳しく読む
        href: /design/

  - type: chapter
    id: together
    eyebrow: 一人じゃだめなの?
    title: だから、違う専門の仲間と設計する
    point: これだけの知識と視点をそろえるには、何人もの力が要ります。違う専門を持つ人が集まると、一人で考えるより、広い範囲から答えを探せます。
    blocks:
      - type: question
        text: 病院の案内表示を、情報工学の学生だけで設計したら、何を見落としそうでしょう?
        answer: 例えば、文字の大きさや色の見え方(デザイン)や、患者さんや付き添いの人の動き方(保健福祉)。逆にデザインの学生だけなら、表示を切り替える仕組みやデータの扱いで困るかもしれません。
      - type: p
        text: 岡山県立大学には、情報工学、デザイン、保健福祉の学部があります。専門の違う人が見方を持ち寄れば、互いの見落としを見つけ合えます。

  - type: chapter
    id: place
    eyebrow: 設計会では何をするの?
    title: 設計会は、考えをぶつけ合う場所
    point: 好きなことを話し、違う考えとぶつかり、それを設計に落とし込む。そのための3つの場をつくっています。
    blocks:
      - type: cards
        items:
          - title: 発信の場
            body: 好きなこと、つくりたいものをプレゼンで話し、仲間から意見をもらう。設計のテーマの種は、ここから生まれます。
          - title: 対話の場
            body: 学部も価値観も違う人が意見をぶつけ合い、みんなで新しい考えにたどり着く。
          - title: 設計の場
            body: 一つのテーマを、問題を見つけるところから仕様書(つくる人に渡す設計の書類)の完成まで、チームで設計しきる。
            note: 仕上げた仕様書は、ポートフォリオに載せられる
      - type: p
        text: 発信の場で話すテーマは、「物」に限りません。サービスも、イベントも、説明書も、誰かのために形を決めるものは、どれも設計の対象です。あなたの専門や趣味も、設計のテーマになります。
      - type: tags
        label: 設計できるものの例
        items:
          - ウェブアプリ
          - ゲーム
          - ロボット
          - 建築
          - 介護用品
          - 病院の案内表示
          - ポスター
          - 地域イベント
          - 町おこし
          - マニュアル
      - type: link
        label: 設計の場での進め方の例を見る
        href: /design/#cases-title
      - type: p
        text: ここで練習する「決める力」は、授業の課題でも、卒業研究でも、就職した先でも使えます。設計会は、その練習を、違う学部の仲間と一緒にできる場所です。

  - type: join
    eyebrow: 入部する
    title: 一緒に、考え抜こう。
    body: どの学部・学年の人も歓迎します。プログラムや絵が初めての人も、そのまま始められます。必要な考え方は、活動の中で一つずつ身に付きます。
    traitsTitle: 設計会で身に付く力
    traits:
      - title: 根拠で決める力
        body: 理由を示して、案を選べるようになる
      - title: 違う専門と組む力
        body: 学部の違う仲間と、一つの答えをつくれる
      - title: 形にして伝える力
        body: 考えを図と仕様書で、人に伝えられる

  - type: news
    title: お知らせ
    limit: 3

  - type: info
    title: 団体概要
    items:
      - label: 団体名
        value: 設計会
      - label: 所属
        value: 岡山県立大学
      - label: 代表
        value: 長岡 祥太郎
