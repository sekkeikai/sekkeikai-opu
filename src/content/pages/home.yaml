title: 設計会
description: 岡山県立大学の公認サークル「設計会」。何を、誰のために、なぜつくるかを決める「設計」を、学部の違う仲間と練習しています。初めての人も入れます。
# トップページは「なぜ今、設計が大事なのか」を長文で伝える。書き方の決まりは docs/writing-guide.md。
#   - 章の見出し(title)は主張の形で。見出しだけ追っても話がつながるようにする
#   - eyebrow は読者が心の中で持っている問い。point はその章の要点(まとめにも自動で出る)
#   - 読者の大半はこのページしか見ない。概要が分かるところから、興味がわくところまでを、このページだけで伝える
#   - 問いかけ(question)や例(example)で身近な場面から入り、抽象的な話につなげる。例は学生生活の場面から選ぶ
#   - 短い出典は段落の note(本文の右)に。折りたたみ(aside)は、本題でない長い補足だけに使う
sections:
  - type: hero
    eyebrow: 岡山県立大学 公認サークル
    title: つくる前に、何を誰のためにつくるかを決める
    lead: つくる道具が手軽になっても、できあがるものの良し悪しは、つくる前の決め方で変わります。この決める作業が「設計」です。設計会は、学部の違う学生が集まって設計を練習するサークルです。

  - type: summary
    title: 設計会の考え方

  - type: chapter
    id: why-now
    eyebrow: なぜ今、設計なの?
    title: つくる手間は減り、決める難しさが残った
    point: 動くアプリはAIに頼めば数時間で、複雑な造形物もCADと3Dプリンターがあれば一晩でできます。そうなると、何を、誰のために、なぜつくるかの決め方で、できあがるものに差がつきます。
    blocks:
      - type: question
        text: 「便利な時間割アプリをつくって」とAIに頼んだら、どんなアプリが返ってくるでしょう?
        answer: 誰が、どんな場面で便利になるのかを決めずに頼むと、誰にとっても少しだけ便利なアプリが返ってきます。誰の役にも少ししか立たないので、価値はあまりありません。
      - type: p
        text: 少し前まで、アプリを一つつくるには、プログラムを何千行も書く必要がありました。今はその多くをAIが書きます。
      - type: p
        text: つくる手間が小さくなるほど、仕上がりは「何を、なぜ、どうつくるか」の決め方で左右されます。指示があいまいなら、AIもあいまいなものをつくります。
      - type: example
        title: グループ課題で起きること
        text: 「いい感じのスライドをつくろう」とだけ決めて分担すると、締め切りの前日に、色も主張もばらばらの資料が集まります。手を動かす前に「誰に、何を一つ伝えるか」を10分話せば、作業はむしろ早く終わります。AIに頼むときも、同じことが起きます。
      - type: p
        text: 同じ材料、同じ技術でも、何をどう決めたかで、できあがるものは全く変わります。
      - type: compare
        fromLabel: 思いつきで決めると
        toLabel: 使う人と場面から決めると
        rows:
          - from: 機能を全部入れたアプリ
            to: よく使う3つがすぐ押せるアプリ
          - from: 座れるだけの車いす
            to: 押す人も楽な車いす
          - from: 情報を詰め込んだポスター
            to: 一目で伝わるポスター
      - type: heading
        text: 設計が重要になった理由は、AIの他にもある
      - type: list
        items:
          - スマートフォンも車も家電も、ソフトウェアとネットワークでつながりました。一部だけを見て決めると、全体のどこかで困る人が出ます。
          - 高齢の人、目や耳が不自由な人、日本語が母語でない人など、いろいろな人への配慮が求められるようになりました。日本では2024年4月から、障害のある人に求められたときの「合理的配慮」が事業者の義務です。
          - 製品が環境に与える影響の大部分は、設計の段階で決まると言われます。EUでは2024年、設計の段階から環境への配慮を求める規則が発効し、環境への責任がつくる前に問われるようになりました。
      - type: p
        text: どれも、つくり始める前に手を打っておくべき問題です。
      - type: aside
        title: 仕事の現場で起きていることと、新しい規則
        body:
          - "ソフトウェア開発の現場では、まず「何をつくるか」を仕様書(つくる人に渡す設計の書類)にまとめ、それをAIに渡してプログラムを書かせる進め方が広がり始めています。「仕様駆動開発」と呼ばれ、2025年頃から、そのための道具が次々に公開されています(例: [GitHub「Spec Kit」2025年9月](https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/))。プログラムを書く仕事の一部がAIに移り、人は何をつくるかを決めることに時間を使うようになりつつあります。"
          - 「製品の環境への影響の8割以上は設計の段階で決まる」という見積もりは、欧州でよく引用されます([欧州委員会の冊子「Ecodesign Your Future」2012年](https://build-up.ec.europa.eu/sites/default/files/content/Brochure-Ecodesign-Your-Future-15022012.pdf))。EUの規則は「[持続可能な製品のためのエコデザイン規則(ESPR)](https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1785880)」です(2024年7月発効)。
          - 合理的配慮の義務は、2024年4月に施行された[改正障害者差別解消法](https://www8.cao.go.jp/shougai/suishin/sabekai.html)によるものです。前もって誰でも使えるように整える「環境の整備」は、努力義務にとどまります([令和6年版 障害者白書(概要)](https://www8.cao.go.jp/shougai/whitepaper/r06hakusho/gaiyou/h01.html))。

  - type: chapter
    id: upstream
    eyebrow: いつ手を打てばいいの?
    title: 直すなら、つくる前が一番安い
    point: 完成してから直すと、つくる前に直すより何十倍もの手間がかかることがあります。つくる前なら、少ない手間で結果を大きく変えられます。
    blocks:
      - type: question
        text: 家を建てた後で「窓をもう一つ増やしたい」と言ったら、どうなるでしょう?
        answer: 壁を壊し、柱を確かめ、工事をやり直すことになります。図面の段階なら、線を一本書き足すだけで済みました。
      - type: p
        text: どの分野のものづくりも同じです。決めたことの上に次の作業が積み重なっていくので、土台の間違いほど、直すときに崩すものが多くなります。
      - type: p
        text: 大規模な宇宙機の開発を想定したNASAの見積もりでは、要件(設計が満たすべき条件)を決める最初の段階で紛れ込んだ誤りは、完成して使い始めてから直すと、その段階で直すときの数十倍、ときには千倍以上の手間がかかります。
      - type: figure
        name: cost-escalation
      - type: p
        text: 同じ手間なら、つくる前にかけるのが一番効きます。設計会が「つくる前」を練習しているのも、このためです。

  - type: chapter
    id: logic
    eyebrow: センスがないと無理?
    title: 良い設計は、センスだけでなく論理で語れる
    point: 設計の良し悪しは、好みだけでなく筋道を立てて説明できます。筋道で説明できるので、設計は学んで身に付けられます。
    blocks:
      - type: question
        text: ワットの蒸気機関は、それまでの機関と同じ仕事を、ずっと少ない石炭でこなしました。変えたのは、部品の役割の分け方です。何をどう分けたのでしょう?
        answer: 蒸気を冷やす場所を、シリンダーとは別に分けました。それまでのニューコメンの機関は、一つのシリンダーを毎回温めては冷やしていたので、熱を捨て続けていました。
      - type: p
        text: 工学者のナム・P・スーは、設計を「やりたいこと(要求機能)」と「設計で決めるもの(設計パラメーター)」の対応で書き表しました。その上で、良い設計がまず守るべき決まり(公理)として「要求機能どうしの独立を保て」を立てました。公理的設計と呼ばれる考え方で、スー自身がこの2つの蒸気機関を例に挙げています。
        note: "[N. P. Suh, The Principles of Design, Oxford University Press, 1990](https://ndlsearch.ndl.go.jp/books/R100000136-I1970023484892350465)。蒸気機関の例は、[スーの教科書 Axiomatic Design の第1章の草稿(MIT, 1996)](https://web.mit.edu/2.882/www/chapter1/chapter1.htm)の Example 1.3 による。"
      - type: figure
        name: steam-engine
      - type: p
        text: ニューコメンの機関(1712年)では、蒸気を入れることと冷やすことが、互いの邪魔をしていました。ワットは1765年、冷やす役を別の容器(復水器)に分けることを思いつき、1769年に特許を取りました。図の表では●が対角線上に並び、2つの要求機能を一つずつ調節できるようになりました。
        note: "[ロンドンの科学博物館の解説](https://blog.sciencemuseum.org.uk/james-watt-and-the-separate-condenser/)では、同じ仕事に使う石炭はおよそ3分の2減ったとされる(資料によって数字は異なる)。1712年と1765年は、科学博物館の所蔵品の記録([ニューコメン機関](https://collection.sciencemuseumgroup.org.uk/objects/co50900/newcomen-atmospheric-engine-atmospheric-steam-engine)、[ワットの復水器の模型](https://collection.sciencemuseumgroup.org.uk/objects/co50928/watts-second-separate-condenser-1765-condensers))による。"
      - type: p
        text: 公理的設計は、設計を論理で考えるための道具の一つです。設計は、問題を見つける・要件を定める・案を広げる・比べて選ぶ・形を詰める、という[[process|5つの工程]]で進みます。
      - type: p
        text: どの工程にも、観察の仕方、要件の書き方、案の比べ方といった**考え方の道具**がそろっています。道具の使い方を学べば、誰でも設計の質を上げられます。
      - type: link
        label: 設計の進め方を詳しく読む
        href: /design/process/

  - type: chapter
    id: map
    eyebrow: 何を学ぶの?
    title: 設計には、いくつもの見方が要る
    point: 一枚の案内表示にも、人を観察する目、数を数える目、図にして試す目が要ります。設計に必要な知識は、いくつもの学部にまたがります。
    blocks:
      - type: example
        title: 病院の案内表示を設計するなら
        text: 迷っている人を観察し、話を聞くのは「[[human-interface|人から考える]]」見方。どの分かれ道で何人が迷っているかを数えるのは「[[data-analysis|データで考える]]」見方。館内を単純な図にして、案内の置き場所を試すのは「[[modeling|モデルで考える]]」見方です。
      - type: p
        text: 5つの工程のどれでも、こうした見方をいくつも同時に使います。このサイトでは、この見方を「視点」と呼んでいます。工程と視点の組み合わせは、下の表のとおりです。
      - type: map
        variant: compact
      - type: link
        label: 工程と視点を、図と一緒に読む
        href: /design/

  - type: chapter
    id: together
    eyebrow: 一人じゃだめなの?
    title: 違う専門の仲間と一緒に設計する
    point: これだけの知識と視点は、一人ではそろいません。専門の違う人が集まれば、一人で考えるより広い範囲から答えを探せます。
    blocks:
      - type: question
        text: 病院の案内表示を、情報工学の学生だけで設計したら、何を見落としそうでしょう?
        answer: 例えば、文字の大きさや色の見え方(デザイン)や、患者さんや付き添いの人の動き方(保健福祉)。逆にデザインの学生だけなら、表示を切り替える仕組みやデータの扱いで困るかもしれません。
      - type: p
        text: 岡山県立大学には、情報工学、デザイン、保健福祉の学部があります。学部の違う人が同じテーマを見ると、互いの見落としに気付けます。

  - type: chapter
    id: place
    eyebrow: 設計会では何をするの?
    title: 設計会では、違う考えを持ち寄って設計する
    point: 活動は3つあります。好きなことを発表して意見をもらう場、学部の違う人と意見を交わす場、一つのテーマをチームで設計する場です。
    blocks:
      - type: cards
        items:
          - title: 発信の場
            body: 好きなことや、つくりたいものを発表して、仲間から意見をもらいます。ここで出た話が、設計のテーマの候補になります。
          - title: 対話の場
            body: 学部も価値観も違う人どうしで意見を出し合い、一人では思いつかない考えを探します。
          - title: 設計の場
            body: 一つのテーマを、問題を見つけるところから仕様書(つくる人に渡す設計の書類)ができるまで、チームで設計します。
            note: 仕上げた仕様書は、ポートフォリオに載せられる
      - type: p
        text: 発信の場で話すテーマは、「物」に限りません。サービスも、イベントも、説明書も、誰かのために形を決めるものは、どれも設計の対象です。自分の専門や趣味からテーマを選んでもかまいません。
      - type: tags
        label: 設計できるものの例
        items:
          - ウェブアプリ
          - ゲーム
          - ロボット
          - 建築
          - 介護用品
          - 病院の案内表示
          - ポスター
          - 地域イベント
          - 町おこし
          - マニュアル
      - type: link
        label: 設計の場での進め方の例を見る
        href: /design/#cases-title
      - type: p
        text: ここで練習する決め方は、授業の課題でも、卒業研究でも、就職してからも使えます。

  - type: join
    eyebrow: 入部する
    title: どの学部・学年からでも入れます
    body: プログラムや絵が初めてでもかまいません。必要な考え方は、活動しながら一つずつ身に付けていけます。
    traitsTitle: 設計会で身に付く力
    traits:
      - title: 理由を示して選ぶ
        body: いくつかの案から、根拠を言葉にして一つを選べるようになる
      - title: 違う専門の人と組む
        body: 学部の違う仲間と、一つの答えをまとめられるようになる
      - title: 図と仕様書で伝える
        body: 考えたことを、図と仕様書で人に伝えられるようになる

  - type: news
    title: お知らせ
    limit: 3

  - type: info
    title: 団体概要
    items:
      - label: 団体名
        value: 設計会
      - label: 所属
        value: 岡山県立大学
      - label: 代表
        value: 長岡 祥太郎
