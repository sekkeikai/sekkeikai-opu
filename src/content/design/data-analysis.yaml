    url: https://www.cna.org/analyses/1980/a-method-of-estimating-plane-vulnerability
  - text: W. A. Shewhart, Economic Control of Quality of Manufactured Product, Van Nostrand, 1931.
    url: https://ci.nii.ac.jp/ncid/BA11774525
  - text: MacTutor History of Mathematics Archive, "Walter Andrew Shewhart".
    url: https://mathshistory.st-andrews.ac.uk/Biographies/Shewhart/
