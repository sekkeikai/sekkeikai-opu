title: ロボット
en: "Case: Robot"
layer: case
order: 2
short: 物の設計
question: ロボットに任せること、人に残すことは何か
summary: 介護施設のお茶の時間に、人のそばで熱い飲み物を運ぶロボット。その安全を、止まる距離と、こぼさずに止まれる減速度の式で決め、ロボットに任せる仕事と人に残す仕事も分ける。
lead: もし設計会で、介護施設のお茶の時間に使うロボットを設計するなら、こう進めます。何に困っているかを観察で確かめ、安全を試して確かめられる要件にし、ロボットに任せることと人に残すことを分け、段ボールの模型で寸法を試します。
chapters:
  - id: goal
    heading: 安全は、止まる距離とこぼれ方の式で決める
    blocks:
      - type: point
        text: ぶつかる・こぼれる・取り違えるの事故ごとに、止まる距離や、こぼさずに止まれる減速度を式から求め、試し方と合格の線を決めます。
      - type: cards
        items:
          - title: "目的"
            body: "お茶の時間を、安全を保ったまま、職員にとっても利用者にとっても楽にする"
          - title: "誰のため"
            body: "飲み物を用意して配る職員と、受け取る利用者"
          - title: "計画の終わりにできるもの"
            body: "寸法と性能の数字に、どの試験で確かめるかの計画を付けた、つくる人に渡す仕様書。設計会が扱うのはここまで"
          - title: "届いたかの確かめ方"
            body: "模型と模擬の試験で測る要件(止まる距離、取り違えの数など)。その回数の試験で何まで言えるかも、試験の計画に書く"

  - id: walkthrough
    step: 1
    heading: 観察の許しを得て、お茶の時間を一度通して見る
    blocks:
      - type: point
        text: お茶の時間を一度通して見て、誰が、どこで、何を、どの順にするかを書き出します。何が問題かは、この流れをつかんでから見分けます。
      - type: p
        text: 介護施設は利用者が暮らす場所なので、観察の前に施設の許しを得て、利用者と家族にも目的を説明します。記録には名前を書かず、席の番号で書きます。写真は、顔が写らないように物と場所だけを撮ります。
      - type: p
        text: 1回目の観察では、まだ数えません。台所で飲み物を用意するところから、器を下げるところまでを見て、手順と場所を書き出します。台所から食堂までの道のりと、通路の一番狭い所の幅も測ります。
      - type: list
        items:
          - "時刻: お茶の時間のどのあたりで起きることか"
          - "場所: 台所、廊下、食堂の席など"
          - "誰が: 職員、利用者、家族など"
          - "何をする: 用意する、載せる、運ぶ、渡す、話す、下げるなど"
          - "手と目: 両手に何を持ち、どこを見ているか"
      - type: p
        text: 書き出しは、上の欄を1行に1つの動きで並べた表にします。次の観察では、この表を見て何をどこで数えるかを決めます。後で仕事を細かく分けるときも、この表を元にします。見たことと、見て思ったことは、欄を分けて書きます。

  - id: problem
    step: 1
    heading: 困りごとの候補を挙げ、何を数えれば見分けられるかを決める
    blocks:
      - type: point
        text: 職員の困りごとには、いくつかの候補があります。例えば、運ぶ物が重いことか、運ぶ間両手と注意を取られて利用者と話せないことか。候補ごとに、正しければ何が数えられるかと判断の線を先に決め、観察で数えます。
      - type: p
        text: 職員に聞くと、「お茶の時間は忙しい」という答えが返ってくるでしょう。その忙しさが重さから来るのか、両手と注意から来るのかは、この答えからは分かりません。人は困りごとを印象に残った場面で語るので、話を聞くことに加えて、行動を数えて確かめます。
      - type: table
        caption: 候補ごとに、正しければ見えるはずのこと(確かめる候補の例)
        head:
          - 候補
          - 数えること
          - この候補が正しければ
        rows:
          - - 重さ
            - 1回に運ぶ杯数と重さ、往復の回数
            - 途中で持ち替えたり、休んだりする
          - - 重さ
            - 腰や腕の負担を口にする回数(話を聞く)
            - 運んだ後に、負担を口にする
          - - 両手と注意
            - 運ぶ間に声をかけられた回数と、その場で応じた回数
            - 「後でね」と応じる回数が多い
          - - 両手と注意
            - 手渡しのとき、目を合わせて言葉を交わしたか
            - 黙って置いていく回数が多い
          - - 両手と注意
            - 両手が塞がっている時間の割合
            - お茶の時間の大半で、両手が塞がる
      - type: p
        text: 候補は、流れの書き出しから挙げます。ここに示した2つは見当の例で、書き出しを見て別の候補(器を下げる手間、利用者を待たせることなど)が浮かべば、それも表に足します。
      - type: heading
        text: 判断の線は、数える前に決めて書いておく
      - type: p
        text: 線は「〈数えること〉が〈値〉以上なら、〈候補〉を選ぶ」の形で書きます。値は「この数がいくつなら、つくるものを変えるか」を考えて、施設の職員と相談して決めます。決めた線は、日付と一緒に記録用紙の先頭に書きます。
      - type: p
        text: 両方の候補が線を超える場合と、どちらも超えない場合も、先に決めておきます。両方なら、2つの問題として並べ、どちらに取り組むかを施設と決めます。どちらも超えないなら、候補の挙げ方が外れているので、流れの書き出しに戻って候補を挙げ直します。
      - type: steps
        items:
          - title: 数えることを言葉で決める
            body: 「声をかけられた」「その場で応じた」が何を指すかを、1行で書いておく。2人の記録係が同じ場面を同じように数えられるようにするため。
          - title: 記録用紙を用意する
            body: 書き出した流れに沿って、数えることの欄を並べる。声をかけられたら「時刻・席の番号・その場で応じたか」を書く欄を付ける。
          - title: 2人で見る
            body: 1人は職員1人に付いて歩き、両手の様子と声かけを記録する。もう1人は食堂の端から、往復の回数とトレーの杯数を数える。
          - title: 曜日を変えて何回か見る
            body: 1回だけだと、その日の人数や行事で偏る。回数は、施設と相談して決める。
          - title: 重さと歩く速さを測る
            body: いつものトレーに、いつもの杯数を載せて、はかりで量る。飲み物を持って廊下を歩くとき、印を付けた区間を何秒で歩くかも測る。後で、速さの要件に使う。
          - title: 終わってから話を聞く
            body: 数えた場面を示しながら、そのとき何を考えていたかを職員に聞く。

  - id: statement
    step: 1
    heading: 選んだ候補を、問題の一文に書く
    blocks:
      - type: point
        text: 観察で選んだ候補を、問題の一文にします。後で要件を決め、仕事を分け、案を比べるときは、この一文を元にします。
      - type: p
        text: 一文は「〈誰〉が、〈どの場面〉で、〈何〉のために、〈何ができない〉」の形で書きます。〈何ができない〉には、数えた記録のどの数が根拠かを添え、要件にしたときに確かめられるようにします。
      - type: p
        text: 書き方で、考える案が変わります。重さの候補を選んだなら、一文は運ぶ量や回数が中心になり、案は力を肩代わりする方向に向かいます。両手と注意の候補なら、運ぶ間の手と目の使い方が中心になり、案は手と注意を空ける方向に向かいます。
      - type: p
        text: 一文には、[[problem-finding#statement|手段]]の「ロボット」という言葉を入れません。
      - type: steps
        ordered: false
        items:
          - title: 一文から測る量が言えるか
            body: 一文を読んだ人が「何が何回減れば解けたか」を言えるか。言えなければ、〈何ができない〉をもっと具体的に書く。
          - title: 職員が自分のことだと思えるか
            body: 観察した職員に一文を見せ、その場面が自分の困りごとかを聞く。
          - title: 目的を一文に合わせて言い直す
            body: 最初の目的「お茶の時間を楽にする」を、一文が解けた状態の言葉で書き直す。何が楽になれば届いたかが、これで絞られる。

  - id: hazards
    label: 工程1と2の境
    heading: 届ける仕事を図にして、事故が起きる場所を探す
    blocks:
      - type: point
        text: 届ける仕事を機能ごとに分け、人のそばで熱い飲み物を運ぶときに、どこでどんな事故が起きうるかを洗い出します。
      - type: p
        text: 機能は[[requirements#functions|IDEF0]]で描きます。手段はまだ決めないので、運ぶ道具は「未定」と書きます。
      - type: idef0
        title: 「飲み物を届ける」をIDEF0で描く
        caption: 上から入る制御「利用者ごとの注意事項」(とろみが必要な人、温度に気をつける人など)が、どの機能に効くかを確かめる。効く場所は、取り違えの事故が起きうる場所でもある。
        function: 飲み物を利用者に届ける
        inputs:
          - 用意された飲み物
        controls:
          - 施設の安全の決まり
          - 利用者ごとの注意事項
        outputs:
          - 受け取られた飲み物
          - 届けた記録
        mechanisms:
          - 職員
          - 運ぶ道具(未定)
        steps:
          - name: 飲み物を載せる
            output: 載せた飲み物
          - name: 席まで運ぶ
            output: 席に着いた飲み物
          - name: 受け取ってもらう
            output: 受け取られた飲み物
      - type: p
        text: 分けた機能ごとに、「ここで何が起きたら人が傷つくか」を考えます。観察の記録にある、ぶつかりそうな場面やこぼしそうな場面も手がかりにします。洗い出しは、職員と一緒にします。施設で起きかけた事故(ヒヤリハット)の記録があれば、見せてもらえるかを聞きます。
      - type: list
        items:
          - "ぶつかる: 人、車いす、杖、歩行器に、正面や斜めから"
          - "ひく: 床に近い車いすの足台(フットサポート)や、人の足先"
          - "こぼれる・やけどする: 止まるとき、曲がるとき、段差を越えるとき"
          - "器がすべる・倒れる: トレーの上で、止まるときに"
          - "取り違える: 注意事項のある人に、別の飲み物が渡る"
          - "つまずく: 道具そのものや、その通り道に"
      - type: p
        text: 上の一覧は、確かめる候補の例です。施設ごとに、通路の幅、床の段差、利用者の体の様子が違うので、起きうる事故も変わります。
      - type: table
        caption: 洗い出しの表の欄(1行に1つの事故を書く)
        head:
          - 欄
          - 書くこと
          - 手がかり
        rows:
          - - 機能
            - IDEF0で分けた機能のどれで起きるか
            - IDEF0の分解図
          - - 起きうる事故
            - 人が傷つく出来事
            - 観察の記録、ヒヤリハットの記録
          - - きっかけ
            - 何が重なると起きるか
            - 流れの書き出しの、混み合う時刻と場所
          - - 害の重さ
            - 起きたときに、どんな害がどこまで及ぶか
            - 職員に聞く
          - - 起こりやすさ
            - 何回の配膳に1回くらい起きそうか
            - 観察で数えた回数
          - - 要件にするもの
            - 防げたかを確かめられる量
            - 次の手順で書く
      - type: p
        text: 飲み込む力が弱い人にとって、取り違えは事故になります。さらさらした水分でむせやすい人は、水分にとろみを付けて飲みます。その人に普通のお茶を渡すと、むせたり、気管に入って肺炎につながったりする恐れがあります。
        note: 水分でむせる人にはとろみを付けることは[健康長寿ネット「嚥下食とは」](https://www.tyojyu.or.jp/net/byouki/engeseihaishikkan/enge-shoku.html)、水や食べ物が肺に入ると肺炎を起こすことは[同「摂食・嚥下障害の症状」](https://www.tyojyu.or.jp/net/byouki/sesshokushougai/shoujou.html)(長寿科学振興財団)。
      - type: p
        text: 危険を洗い出すときは、生活を支えるロボットの安全の国際規格も参考にします。減らし方は、まず設計で危険そのものを小さくし、次に守る仕組みを足し、最後に使い方の注意で補う順に考えます。注意書きは忙しいお茶の時間には読まれにくいので、最後の補いにとどめます。
        note: 生活支援ロボットの安全の規格 [ISO 13482](https://www.iso.org/standard/53820.html)(日本ではJIS B 8445)。人のそばで動くロボットの危険の洗い出し方と、減らし方を定めている。減らし方の順(設計で除く→安全装置→使う人への注意)は、機械の安全の基本の規格[ISO 12100](https://www.iso.org/standard/51528.html)による。

  - id: safety
    step: 2
    heading: 安全を、試して確かめられる要件にする
    blocks:
      - type: point
        text: 洗い出した事故ごとに、測る量と試し方と合格の線を決めます。値は、式と、前の手順で測ったものから導きます。安全の要件は、選ぶ案が必ず満たす「必須」に入れます。
      - type: p
        text: 例として、ぶつかる・こぼれる・取り違えるの3つについて、[[requirements|要件]](確かめられる条件)を導きます。
      - type: heading
        text: 速さの上限は、歩く速さと止まる距離の両方から決める
      - type: p
        text: 速さの上限の候補は2つあります。1つ目は、観察で測った、配膳のときに職員が歩く速さです。運ぶ道具が職員と同じ速さなら、周りの人が驚かず、職員も待たされません。歩く速さは、印を付けた区間の長さL÷歩いた時間で求め、何回か測って真ん中の値を使います。2つ目は、次に示す止まる距離から決まる上限です。2つのうち、小さいほうを要件にします。
      - type: p
        text: 確かめるときは、床に長さLの区間を印し、飲み物を載せた状態で通る時間を測ります。上限の速さをvとすると、通る時間がL÷v以上なら合格です。
      - type: heading
        text: 止まる距離は、反応の間に進む距離と、減速して進む距離の和
      - type: p
        text: 止まるまでに進む距離dは、2つの和です。人に気付いてからブレーキが効き始めるまでに進む距離(速さv×反応時間t)と、ブレーキが効いてから止まるまでの距離(v²÷(2×減速度a))です。式にすると、d=v×t+v²÷(2a)です。人の手前に残したい余裕をmとすると、人を見つける距離Dは、d+m以上が必要です。
      - type: p
        text: 式の入力は、それぞれ別の手順から来ます。tは、人を見つける仕組みの候補の資料か、試作機で測った値です。aは、次に示す「こぼさない」上限です。mは、段ボールの模型で、近づかれた人が怖くない距離を試して決めます。Dは、見つける仕組みの候補が届く距離です。d+m≦Dをvについて解くと、v≦-a×t+√((a×t)²+2a(D-m))となり、これが止まる距離から決まる速さの上限です。
      - type: heading
        text: 減速度の上限は、こぼさないことから来る
      - type: p
        text: 強くブレーキをかければ早く止まれますが、トレーの飲み物がこぼれます。一定の減速度aで止まるとき、器の中の液面は傾き、その角度の正接(tan)はa÷g(gは重力加速度)になります。円筒の器なら、縁の側の液面はr×a÷g(rは器の半径)だけ上がります。これが縁までの余白hを超えるとこぼれるので、減速度の上限はg×h÷rです。rとhは、観察で見たいつもの器と、いつも注ぐ量から取ります。
      - type: p
        text: 器がトレーの上ですべらない条件も確かめます。器とトレーの間の静止摩擦係数をμとすると、aがμ×gを超えると器はすべり出します。背の高い器は、すべる前に倒れることがあります。底の半径をb、器と中身の重心の高さをHとすると、aがg×b÷Hを超えると倒れ始めます。上限には、g×h÷r、μ×g、g×b÷Hのうち一番小さい値を使います。急に止まると液面が揺れ、式より高く上がるので、式で見当をつけた後、水を入れた器を載せて止めてみて、こぼれた杯を数えて確かめます。とろみを付けた飲み物は揺れ方が違うので、それも一緒に試します。
      - type: p
        text: 止まる試験では、通り道に人の代わりの筒や車いすを置き、飲み物を載せて上限の速さで近づけます。止まった位置から相手までの距離を巻き尺で測り、こぼれた杯の数も数えます。正面からだけでなく斜めからも近づけます。見つける仕組みは低いものや細いものを見落としやすいので、床に近い車いすの足台や、細い杖の前でも止まるかを見ます。
      - type: heading
        text: 取り違えは、話しながら渡す場面で数える
      - type: p
        text: 取り違えは渡す人の注意に左右されるので、試すときも、話しながら渡す場面をつくります。利用者の役の人に席に座ってもらい、職員の役の人は、話しかけながら渡します。注意事項の札を付けた飲み物をn杯、模擬で渡し、取り違えの数を数えます。
      - type: p
        text: n杯で取り違えが0件でも、取り違えが起きない証明にはなりません。1杯あたり割合pで取り違える手順なら、n杯が全て正しく渡る確率は(1-p)のn乗で、pがかなり大きくても、この確率は0になりません。「割合はp₀以下」と95%の確からしさで言うには、(1-p₀)のn乗が0.05以下になるnが要り、およそn≧3÷p₀です。p₀を小さくするほど、nは大きくなります。
      - type: p
        text: 模擬の試験では、はっきり危ない手順までしか見つけられません。nは、施設と相談した許せる割合と、試験にかけられる手間から決め、そのnで何が言えて何が言えないかを要件の横に書きます。取り違えを減らす仕組みは、試験とは別に、案を考える手順で設計します。
      - type: table
        caption: 安全の要件の表の欄(1行に1つの要件を書く)
        head:
          - 欄
          - 書くこと
        rows:
          - - 要件
            - 何を、どこまで満たすか
          - - 元になった事故
            - 洗い出しの表のどの行か
          - - 測る量と試し方
            - 何を、どの条件で、何回測るか
          - - 合格の線
            - 数で言える線
          - - 線の根拠
            - どの式に、どの手順で測った値を入れたか

  - id: requirements
    step: 2
    heading: 他の要件も加え、必須とあればうれしいに分ける
    blocks:
      - type: point
        text: 安全の要件に、運ぶ量、取りやすい高さ、使いやすさなどの要件を加え、それぞれを必須とあればうれしいに分けて、要件・種類・値・確かめ方を並べた要件の表にします。
      - type: p
        text: 他の要件は、問題の一文と観察の記録から取ります。値は、その出どころを決めてから入れます。
      - type: table
        caption: 他の要件の候補と、値の出どころ(値はグループで決める)
        head:
          - 要件の候補
          - 値をどこから取るか
          - 確かめ方の形
        rows:
          - - 一度に運ぶ量
            - 観察で数えた、1回に運ぶ杯数と重さ
            - 載せて何往復かし、落とした杯を数える
          - - 取りやすい高さ
            - 段ボールの模型の試験
            - 車いすの利用者に、決めた高さで取ってもらう
          - - 通れる幅
            - 通路の一番狭い所の幅と、車いすの幅
            - 通路で車いすとすれ違ってもらう
          - - 説明なしで使える
            - 観察で見た、お茶の時間の忙しさ
            - 初めて使う職員に、説明なしで使ってもらう
          - - 動ける時間
            - お茶の時間の長さと1日の回数、充電できる時間
            - 載せて動かし続け、止まるまでの時間を測る
          - - 近づくことの知らせ方
            - 利用者と職員に聞く
            - 近づいたときに気付いたかを、利用者に聞く
      - type: p
        text: 必須か、あればうれしいか([[requirements#weight|要件の重み]])は、1つの問いで分けます。「この要件を満たさない案を、他が良ければ選ぶか」。選ばないなら必須、選ぶならあればうれしいです。どの案もふるいを通らないときは、必須にした理由が目的か安全に結び付くかを、一つひとつ見直します。
      - type: p
        text: ロボット以外の案も同じ要件で比べるために、要件にも手段を書かず、「ロボットのトレーの高さ」は「車いすに座ったまま取れる高さ」と書きます。

  - id: roles
    label: 工程2から4にまたがる
    heading: ロボットに任せる仕事と、人に残す仕事を分ける
    blocks:
      - type: point
        text: 届ける仕事を細かく分け、一つひとつを誰が担えるかを、決めた問いで考えます。分け方で、つくるものの難しさと確かめる試験の数が大きく変わるので、案を広げる前に、仮の分け方を2~3通りつくります。
      - type: p
        text: 要件の表は「何を満たすか」を決めるもので、「誰が満たすか」は決めません。担い手は、職員、運ぶ道具、利用者自身の3つが候補です。
      - type: p
        text: 仕事の欄は、流れの書き出しとIDEF0の分解図から取ります。分け方の細かさで、答えが変わることに気をつけます。例えば「運ぶ」と「手渡す」を1つの仕事と見ると、担い手は1つに決まります。2つに分けると、運ぶのと渡すのを別の担い手にする案が見えてきます。札と人を照らし合わせることも、手渡しとは別の仕事として欄に立てます。
      - type: steps
        ordered: false
        items:
          - title: 問題の一文が人に残したい仕事か
            body: 一文に書いた「できないこと」を、できるようにするための仕事か。そうなら、人に残す側に傾く。
          - title: 誤ったときの害が大きく、その場の判断が要るか
            body: 洗い出しの表で害が重い仕事で、利用者の様子を見て今するかを決めるなら、人に残す側に傾く。
          - title: 繰り返しで、できたかを数で測れるか
            body: 同じ動きの繰り返しで、速さや距離のように数で確かめられるなら、道具に任せる側に傾く。
          - title: 任せると、確かめる試験がどれだけ増えるか
            body: 道具に任せる仕事が増えるほど、それを確かめる試験も増える。試験にかかる手間と費用も見積もる。
      - type: p
        text: 4つの問いの答えがそろわない仕事もあります。例えば数では測れても、誤ったときの害が重い仕事です。そういう仕事は1つに決めず、担い手の違う分け方を両方残します。どちらが良いかは、次の手順で案にして、要件で比べて確かめます。
      - type: p
        text: 担い手を変えると、要件も変わります。例えば照らし合わせを道具に任せるなら、人や席を見分ける仕組みと、それが誤らないことを確かめる試験が要件に加わります。人に残すなら、その仕事をする職員の手と注意が空いていることが要件になります。
      - type: p
        text: 分け方を考えないまま進むと、「ロボットなのだから全部できたほうが良い」と考えて、全てを任せる案に傾きがちです。そうすると、試験が増えるだけでなく、問題の一文が人に残したい仕事まで消える恐れがあります。分け方の表には、仕事・担える人や物・4つの問いの答え・任せる先(仮)・理由を並べ、分け方ごとに1枚つくります。

  - id: ideas
    step: 3
    heading: 分け方の違う案も含めて、案を広げる
    blocks:
      - type: point
        text: 比べる相手がなければロボットの案を選ぶ理由も言えないので、テーマが「ロボット」でも、ロボット以外の案や、仕事の分け方の違う案も並べます。
      - type: p
        text: 案は、思いつきを待たずに、軸を決めて広げます。まず、前の手順でつくった分け方の表ごとに、少なくとも1つの案をつくります。その上で、下の軸を組み合わせて、まだ並んでいない組み合わせを探します。
      - type: table
        caption: 案を広げる軸の例
        head:
          - 軸
          - 問い
          - 出てくる案の方向
        rows:
          - - 誰が運ぶか
            - 職員、道具、利用者自身の誰が運ぶか
            - 押す道具、自分で動く道具、利用者が取りに行く仕組み
          - - 何を動かすか
            - 飲み物を動かすか、台所や席の場所を動かすか
            - 動線を変える、飲み物を置く場所を席の近くに移す
          - - 自動の度合い
            - 人が押すか、人について歩くか、決めた所まで自分で走るか
            - ワゴンの改良から、自分で走るロボットまで
          - - 照らし合わせの担い手
            - 札と人を、誰が、何で照らし合わせるか
            - 人が読み合わせる、色や形で見分ける、機械が見分ける
      - type: p
        text: 今のやり方(トレーを手で運ぶ)も、案の一つとして表に入れます。案ごとに、どの分け方の表に当たるかと簡単なスケッチを付けて、案の一覧にします。

  - id: selection
    step: 4
    heading: 必須の要件でふるい、残った案を今のやり方と比べる
    blocks:
      - type: point
        text: 必須の要件で案をふるいにかけ、残った案を、トレーを手で運ぶ今のやり方と比べます。選んだ案が、仮の分け方のどれに当たるかも確かめます。
      - type: p
        text: "[[selection#must|ふるい]]では、止まる距離のように試作機ができるまで測れない要件は、見つける仕組みの候補の資料にある反応時間と届く距離を式に入れて見当をつけます。見当がつかない案は「分からない」とし、何を調べれば決まるかを書きます。残った案は、要件の表の要件と費用を基準にして、[[selection#criteria|ピューの概念選定法]]で比べます。必須の要件も、満たし方に差があれば基準に入れます。"
      - type: p
        text: 必須の要件を満たさない案は、合計の点数が高くても選びません。ただし、点数だけで比べると何が起きるかを見て、必須にした理由を確かめ直すために、表からは消さずに残します。
      - type: p
        text: 見込んだ分け方と違う案が残ったなら、分け方の4つの問いに戻り、どの仕事の担い手の見立てが違ったかを考え直します。
      - type: link
        label: 工程4「比べて選ぶ」を詳しく読む
        href: /design/selection/

  - id: spec
    step: 5
    heading: 寸法と速さを、理由と出どころと一緒に仕様の数字にする
    blocks:
      - type: point
        text: 選んだ案の寸法と速さを決め、要件の値と同じく、数字ごとに理由と出どころを書きます。
      - type: table
        caption: 仕様の項目と、値の出どころ(決める値はグループで入れる)
        head:
          - 項目
          - 値の出どころ
          - 決める手順
        rows:
          - - 幅
            - 通路の一番狭い幅-車いすの幅-すれ違いの余裕
            - 机の上で計算する
          - - トレーの高さ
            - 車いすの座面の高さと手の届く範囲から見当をつける
            - 段ボールの模型で決める
          - - 速さの上限
            - 職員の歩く速さと、止まる距離の式から出る上限の小さいほう
            - 机の上で計算し、試作機で確かめる
          - - 減速度の上限
            - g×h÷r、μ×g、g×b÷Hの一番小さい値
            - 水を入れた器で確かめる
          - - 止まる位置の余裕
            - 近づかれた人が怖くない距離
            - 段ボールの模型で決める
          - - 動ける時間
            - 1回のお茶の時間×充電までの回数+余裕
            - 机の上で計算する
          - - 非常停止
            - 誰が、どこから、どの姿勢で押すか
            - 模型で、手の届く位置を試す
      - type: p
        text: 速さの上限、減速度の上限、止まる位置の余裕は、止まる距離の式でつながっていて、1つを変えると他も動きます。理由の欄には、どの式でつながっているかを書きます。
      - type: p
        text: 体との関係で決まる数字は、人に試してもらって初めて確かな値になります。机の上では見当までしか決められない項目は、値を「~前後(模型で決める)」と書いておき、次の手順で模型を使って決めます。

  - id: mockup
    step: 5
    heading: 段ボールの模型で、トレーの高さを車いすの利用者と試す
    blocks:
      - type: point
        text: 段ボールで高さを変えられる模型をつくり、車いすの利用者と職員に器を取ってもらって、トレーの高さを決めます。結果によっては、要件の表や案の比較まで戻って直します。
      - type: p
        text: 試作機をつくってから高さが合わないと分かると、本体の形からつくり直しになります。段ボールなら短い時間でつくれて、その場で切って高さを変えられます。動きや丈夫さは試せませんが、高さや幅を確かめるには、これで足ります。
      - type: steps
        items:
          - title: 合格の線を先に決める
            body: 「腕を肩より上げない」「体を大きく前に倒さない」「器を傾けない」のように、取りやすいとみなす線を、試す前に書いておく。
          - title: 模型をつくる
            body: 箱を重ねてトレーの台をつくり、机の上で見積もった範囲の低い所・真ん中・高い所の3つに変えられるようにする。トレーには、本番と同じ大きさの器を置く。
          - title: 水を入れた器で試す
            body: 熱いお茶の代わりに、水を同じ量だけ入れる。こぼれても危なくないようにするため。
          - title: 利用者に取ってもらう
            body: 職員が「どうぞ」と示した後、車いすの利用者に器を1つ取ってもらう。高さを試す順番は、人ごとに変える。慣れや疲れで、後の高さほど取りやすく見えたり、取りにくく見えたりするため。
          - title: 職員にも取ってもらう
            body: 立ったまま器を取って手渡す動きと、利用者の隣で腰を落として取る動きを、高さごとに試す。
          - title: 見ること・聞くこと
            body: 合格の線の項目を、人ごと・高さごとに記録する。終わったら、取りやすかった高さを聞く。
          - title: 近づく速さと距離も試す
            body: 職員が模型を押して、速さの上限の候補で近づけ、止まる位置の余裕の候補で止める。座っている利用者に、怖くなかったかを聞く。
      - type: p
        text: 試してもらう人数と時間は、施設と相談して決めます。利用者には、いつでもやめてよいことを先に伝え、職員にそばにいてもらいます。疲れた様子が見えたら、途中でも終えます。
      - type: p
        text: 結果は、記録を合格の線に照らして読みます。試した全員が線を満たす高さがあれば、その高さを仕様の値にします。利用者の取りやすさと職員の腰の負担が食い違い、1つの高さで両方を満たせないなら、**トレーの高さを変えられる仕組み**を要件に足すかを考えます。その仕組みは費用を上げるので、案の比較の表にも戻って確かめ直します。
      - type: p
        text: 近づく試しで怖いという声が多ければ、速さの上限か止まる位置の余裕を見直します。余裕mを大きくすると、止まる距離の式から出る速さの上限も変わるので、式に戻って計算し直します。模型では、近づかれた人の感じ方までしか分かりません。本当にその位置で止まれるかは、試作機ができてから、止まる距離の試験で確かめます。
      - type: p
        text: 高さと余裕の値は、それを決めた模型の試験の記録と一緒に残します。

  - id: specdoc
    step: 5
    heading: 試験の計画を付けて、仕様書にまとめる
    blocks:
      - type: point
        text: 仕様書には、数字と理由に加えて、どの要件をどの試験で確かめるかの計画を付けます。どの数字が変わったらどの試験をやり直すかも、この計画の欄に書きます。
      - type: table
        caption: 試験の計画の欄(1行に1つの要件を書く)
        head:
          - 欄
          - 書くこと
          - どこから取るか
        rows:
          - - 要件
            - 確かめる要件
            - 要件の表
          - - 試験
            - 何を、どの条件で、何回測るか
            - 安全の要件の表と、模型の試験
          - - 合格の線
            - 数で言える線
            - 安全の要件の式と、施設との相談
          - - 線の根拠
            - なぜその線か
            - 観察の記録、式、模型の試験の記録
          - - 言えること・言えないこと
            - その回数の試験で、何まで言えるか
            - 取り違えの試験のような、回数の計算
          - - やり直す条件
            - どの数字が変わったら、この試験をやり直すか
            - 仕様の理由の欄
      - type: p
        text: つくる人に渡す仕様書には、試験の計画と一緒に、問題の一文、要件の表、仕事の分け方、選んだ案とその理由、仕様の数字と理由と出どころを収めます。

