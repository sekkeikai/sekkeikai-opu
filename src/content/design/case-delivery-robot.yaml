title: ロボット
en: "Case: Robot"
layer: case
order: 2
short: 物の設計
question: ロボットに任せること、人に残すことは何か
summary: 介護施設のお茶の時間に飲み物を運ぶロボットを例に、困りごとを観察で確かめ、安全を要件にし、ロボットと人の役割を分けて仕様書にするまでの手順を示す。
lead: 例えば、設計会で、介護施設のお茶の時間を楽にするロボットを設計するとしましょう。目指すのは、安全を保ったまま、お茶の時間を職員にも利用者にも楽にすることです。そのために、何に困っているかを観察で確かめ、安全を試して確かめられる要件にし、ロボットに任せることと人に残すことを分け、段ボールの模型で寸法を試します。その手順を、取り組む順に計画として示します。
chapters:
  - id: goal
    heading: "目指すのは、安全を保ったまま、お茶の時間を楽にすること"
    blocks:
      - type: point
        text: "この設計の目的は、介護施設のお茶の時間を、安全を保ったまま、職員にとっても利用者にとっても楽にすることです。計画の終わりには、つくる人に渡す仕様書と、その確かめ方を決めた試験の計画ができます。"
      - type: cards
        items:
          - title: "目的"
            body: "お茶の時間を、安全を保ったまま、職員にとっても利用者にとっても楽にする"
          - title: "誰のため"
            body: "飲み物を用意して配る職員と、受け取る利用者"
          - title: "計画の終わりにできるもの"
            body: "仕様書(つくる人に渡す、寸法や性能とその確かめ方を決めた文書)と、試験の計画。設計会が扱うのはここまで"
          - title: "届いたかの確かめ方"
            body: "模型と模擬の試験で測る要件(止まる距離、取り違えの数など)。何を測るかは、要件を決める手順で決める"
      - type: p
        text: "「楽にする」は、まだ広い言い方です。[[case-delivery-robot#statement|問題の一文]]で「職員の何を楽にするか」が、[[case-delivery-robot#safety|安全の要件]]と[[case-delivery-robot#requirements|他の要件]]で「どこまでできれば届いたか」が決まります。ロボットは、目的に近づく手段の候補の一つです。"

  - id: walkthrough
    step: 1
    heading: 観察の許しを得て、お茶の時間を一度通して見る
    blocks:
      - type: point
        text: 何が問題かを見分ける前に、お茶の時間がどんな流れで進むかをつかみます。誰が、どこで、何を、どの順にするかを一度通して見て、流れを書き出します。
      - type: p
        text: 介護施設は、利用者が暮らす場所です。だから観察の前に施設の許しを得て、利用者と家族にも目的を説明します。記録には名前を書かず、席の番号で書きます。写真は、顔が写らないように物と場所だけを撮ります。
      - type: p
        text: 1回目の観察では、まだ数えません。台所で飲み物を用意するところから、器を下げるところまでを見て、手順と場所を書き出します。台所から食堂までの道のりと、通路の一番狭い所の幅も測ります。
      - type: list
        items:
          - "時刻: お茶の時間のどのあたりで起きることか"
          - "場所: 台所、廊下、食堂の席など"
          - "誰が: 職員、利用者、家族など"
          - "何をする: 用意する、載せる、運ぶ、渡す、話す、下げるなど"
          - "手と目: 両手に何を持ち、どこを見ているか"
      - type: p
        text: 書き出しは、上の欄を1行に1つの動きで並べた表にします。この表が、次の観察で何をどこで数えるかを決める地図になり、後で仕事を細かく分けるときの元にもなります。見たことと、見て思ったことは、欄を分けて書きます。混ぜると、次の手順で候補を見分けるときに、思い込みが記録に紛れ込むからです。

  - id: problem
    step: 1
    heading: 困りごとの候補を挙げ、何を数えれば見分けられるかを決める
    blocks:
      - type: point
        text: 職員の困りごとには、いくつかの候補があります。例えば、運ぶ物が重いことか、運ぶ間両手と注意を取られて利用者と話せないことか。候補ごとに、正しければ何が数えられるかと判断の線を先に決め、観察で数えます。
      - type: p
        text: 職員に聞くと、「お茶の時間は忙しい」という答えが返ってくるでしょう。けれど「忙しい」の中身は、重い物を何度も運ぶことかもしれず、手が塞がって声かけに応じられないことかもしれません。どちらかで、つくるものが変わります。人は困りごとを、印象に残った場面で語ります。だから話を聞くことに加えて、行動を数えて確かめます。
      - type: table
        caption: 候補ごとに、正しければ見えるはずのこと(確かめる候補の例)
        head:
          - 候補
          - 数えること
          - この候補が正しければ
        rows:
          - - 重さ
            - 1回に運ぶ杯数と重さ、往復の回数
            - 途中で持ち替えたり、休んだりする
          - - 重さ
            - 腰や腕の負担を口にする回数(話を聞く)
            - 運んだ後に、負担を口にする
          - - 両手と注意
            - 運ぶ間に声をかけられた回数と、その場で応じた回数
            - 「後でね」と応じる回数が多い
          - - 両手と注意
            - 手渡しのとき、目を合わせて言葉を交わしたか
            - 黙って置いていく回数が多い
          - - 両手と注意
            - 両手が塞がっている時間の割合
            - お茶の時間の大半で、両手が塞がる
      - type: p
        text: 候補は、流れの書き出しから挙げます。ここに示した2つは見当の例で、書き出しを見て別の候補(器を下げる手間、利用者を待たせることなど)が浮かべば、それも表に足します。
      - type: heading
        text: 判断の線は、数える前に決めて書いておく
      - type: p
        text: 線は「〈数えること〉が〈値〉以上なら、〈候補〉を選ぶ」の形で書きます。値は「この数がいくつなら、つくるものを変えるか」を考えて、施設の職員と相談して決めます。決めた線は、日付と一緒に記録用紙の先頭に書きます。**見た後で線を引くと、思い込みに都合の良い線を引きやすいからです**。
      - type: p
        text: 両方の候補が線を超える場合と、どちらも超えない場合も、先に決めておきます。両方なら、2つの問題として並べ、どちらに取り組むかを施設と決めます。どちらも超えないなら、候補の挙げ方が外れているので、流れの書き出しに戻って候補を挙げ直します。
      - type: steps
        items:
          - title: 数えることを言葉で決める
            body: 「声をかけられた」「その場で応じた」が何を指すかを、1行で書いておく。2人の記録係が同じ場面を同じように数えられるようにするため。
          - title: 記録用紙を用意する
            body: 書き出した流れに沿って、数えることの欄を並べる。声をかけられたら「時刻・席の番号・その場で応じたか」を書く欄を付ける。
          - title: 2人で見る
            body: 1人は職員1人に付いて歩き、両手の様子と声かけを記録する。もう1人は食堂の端から、往復の回数とトレーの杯数を数える。
          - title: 曜日を変えて何回か見る
            body: 1回だけだと、その日の人数や行事で偏る。回数は、施設と相談して決める。
          - title: 重さと歩く速さを測る
            body: いつものトレーに、いつもの杯数を載せて、はかりで量る。飲み物を持って廊下を歩くとき、印を付けた区間を何秒で歩くかも測る。後で、速さの要件に使う。
          - title: 終わってから話を聞く
            body: 数えた場面を示しながら、そのとき何を考えていたかを職員に聞く。
      - type: p
        text: この見分けを飛ばして「職員の負担を減らす」とだけ考えると、重さを肩代わりする力の強いロボットに進みがちです。困りごとが両手と注意のほうなら、それでは何も変わりません。できるものは、数えた記録と、線に照らして選んだ候補です。

  - id: statement
    step: 1
    heading: 選んだ候補を、問題の一文に書く
    blocks:
      - type: point
        text: 観察で選んだ候補を、問題の一文にします。この一文が、後で要件を決め、仕事を分け、案を比べるときの物差しになります。
      - type: p
        text: 一文は「〈誰〉が、〈どの場面〉で、〈何〉のために、〈何ができない〉」の形で書きます。〈何ができない〉には、数えた記録のどの数が根拠かを添えます。根拠のない言葉が一文に入ると、要件にしたときに確かめる手立てがなくなるからです。
      - type: p
        text: 書き方で、考える案が変わります。重さの候補を選んだなら、一文は運ぶ量や回数が中心になり、案は力を肩代わりする方向に向かいます。両手と注意の候補なら、運ぶ間の手と目の使い方が中心になり、案は手と注意を空ける方向に向かいます。だから一文は、選んだ候補の数えた中身から書きます。
      - type: p
        text: 一文には「ロボット」という言葉を入れません。手段を書くと、他の案と比べる前に答えが決まってしまうからです。
      - type: steps
        ordered: false
        items:
          - title: 一文から測る量が言えるか
            body: 一文を読んだ人が「何が何回減れば解けたか」を言えるか。言えなければ、〈何ができない〉をもっと具体的に書く。
          - title: 職員が自分のことだと思えるか
            body: 観察した職員に一文を見せ、その場面が自分の困りごとかを聞く。
          - title: 目的を一文に合わせて言い直す
            body: 最初の目的「お茶の時間を楽にする」を、一文が解けた状態の言葉で書き直す。何が楽になれば届いたかが、これで絞られる。

  - id: hazards
    heading: 届ける仕事を図にして、事故が起きる場所を探す
    blocks:
      - type: point
        text: 運ぶ道具は、人のそばで熱い飲み物を運びます。要件を書く前に、届ける仕事を細かく分け、どこでどんな事故が起きうるかを洗い出します。この手順は、問題を見つける工程と要件を定める工程の境にあります。
      - type: p
        text: まず、飲み物を届ける仕事をIDEF0で図にします。IDEF0は、機能を箱で表し、左から入る入力、右へ出る出力、上から入る制御(決まりや条件)、下から入る機構(人や道具)を矢印で描く図です。運ぶ道具を「未定」と書くのは、手段をまだ決めないためです。
      - type: idef0
        title: 「飲み物を届ける」をIDEF0で描く
        caption: 上から入る制御「利用者ごとの注意事項」(とろみが必要な人、温度に気をつける人など)が、どの機能に効くかを確かめる。効く場所は、取り違えの事故が起きうる場所でもある。
        function: 飲み物を利用者に届ける
        inputs:
          - 用意された飲み物
        controls:
          - 施設の安全の決まり
          - 利用者ごとの注意事項
        outputs:
          - 受け取られた飲み物
          - 届けた記録
        mechanisms:
          - 職員
          - 運ぶ道具(未定)
        steps:
          - name: 飲み物を載せる
            output: 載せた飲み物
          - name: 席まで運ぶ
            output: 席に着いた飲み物
          - name: 受け取ってもらう
            output: 受け取られた飲み物
      - type: p
        text: 分けた機能ごとに、「ここで何が起きたら人が傷つくか」を考えます。観察の記録にある、ぶつかりそうな場面やこぼしそうな場面も手がかりにします。洗い出しは、職員と一緒にします。施設で起きかけた事故(ヒヤリハット)の記録があれば、見せてもらえるかを聞きます。
      - type: list
        items:
          - "ぶつかる: 人、車いす、杖、歩行器に、正面や斜めから"
          - "ひく: 床に近い車いすの足台(フットサポート)や、人の足先"
          - "こぼれる・やけどする: 止まるとき、曲がるとき、段差を越えるとき"
          - "器がすべる・倒れる: トレーの上で、止まるときに"
          - "取り違える: 注意事項のある人に、別の飲み物が渡る"
          - "つまずく: 道具そのものや、その通り道に"
      - type: p
        text: 上の一覧は、確かめる候補の例です。施設ごとに、通路の幅、床の段差、利用者の体の様子が違うので、起きうる事故も変わります。
      - type: table
        caption: 洗い出しの表の欄(1行に1つの事故を書く)
        head:
          - 欄
          - 書くこと
          - 手がかり
        rows:
          - - 機能
            - IDEF0で分けた機能のどれで起きるか
            - IDEF0の分解図
          - - 起きうる事故
            - 人が傷つく出来事
            - 観察の記録、ヒヤリハットの記録
          - - きっかけ
            - 何が重なると起きるか
            - 流れの書き出しの、混み合う時刻と場所
          - - 害の重さ
            - 起きたときに、どんな害がどこまで及ぶか
            - 職員に聞く
          - - 起こりやすさ
            - 何回の配膳に1回くらい起きそうか
            - 観察で数えた回数
          - - 要件にするもの
            - 防げたかを確かめられる量
            - 次の手順で書く
      - type: p
        text: 取り違えが事故になるのは、飲み込む力が弱い人がいるからです。さらさらした水分でむせやすい人は、水分にとろみを付けて飲みます。その人に普通のお茶を渡すと、むせたり、気管に入って肺炎につながったりする恐れがあります。
        note: 水分でむせる人にはとろみを付けることは[健康長寿ネット「嚥下食とは」](https://www.tyojyu.or.jp/net/byouki/engeseihaishikkan/enge-shoku.html)、水や食べ物が肺に入ると肺炎を起こすことは[同「摂食・嚥下障害の症状」](https://www.tyojyu.or.jp/net/byouki/sesshokushougai/shoujou.html)(長寿科学振興財団)。
      - type: p
        text: 危険の洗い出し方は、生活を支えるロボットの安全の国際規格も手がかりになります。減らし方は、まず設計で危険そのものを小さくし、次に守る仕組みを足し、最後に使い方の注意で補う順に考えます。注意書きは、忙しいお茶の時間には読まれにくいからです。できるものは、事故ごとの洗い出しの表です。
        note: 生活支援ロボットの安全の規格 [ISO 13482](https://www.iso.org/standard/53820.html)(日本ではJIS B 8445)。人のそばで動くロボットの危険の洗い出し方と、減らし方を定めている。減らし方の順(設計で除く→安全装置→使う人への注意)は、機械の安全の基本の規格[ISO 12100](https://www.iso.org/standard/51528.html)による。

  - id: safety
    step: 2
    heading: 安全を、試して確かめられる要件にする
    blocks:
      - type: point
        text: 「安全に運ぶ」のままでは、満たしたかを確かめられません。洗い出した事故ごとに、測る量と試し方と合格の線を決めます。値は、式と、前の手順で測ったものから導きます。安全の要件は、選ぶ案が必ず満たす「必須」に入れます。
      - type: p
        text: 要件(設計が満たすべき、確かめられる条件)は、試し方と組にして書きます。試し方のない要件は、つくった後で満たしたかを判断できないからです。ここでは、ぶつかる・こぼれる・取り違えるの3つを例に、要件の導き方を示します。
      - type: heading
        text: 速さの上限は、歩く速さと止まる距離の両方から決める
      - type: p
        text: 速さの上限の候補は2つあります。1つ目は、観察で測った、配膳のときに職員が歩く速さです。運ぶ道具が職員より速いと周りの人が驚き、遅いと職員が待たされます。歩く速さは、印を付けた区間の長さL÷歩いた時間で求め、何回か測って真ん中の値を使います。2つ目は、次に示す止まる距離から決まる上限です。2つのうち、小さいほうを要件にします。
      - type: p
        text: 確かめるときは、床に長さLの区間を印し、飲み物を載せた状態で通る時間を測ります。上限の速さをvとすると、通る時間がL÷v以上なら合格です。
      - type: heading
        text: 止まる距離は、反応の間に進む距離と、減速して進む距離の和
      - type: p
        text: 止まるまでに進む距離dは、2つの和です。人に気付いてからブレーキが効き始めるまでに進む距離(速さv×反応時間t)と、ブレーキが効いてから止まるまでの距離(v²÷(2×減速度a))です。式にすると、d=v×t+v²÷(2a)です。人の手前に残したい余裕をmとすると、人を見つける距離Dは、d+m以上が必要です。
      - type: p
        text: 式の入力は、それぞれ別の手順から来ます。tは、人を見つける仕組みの候補の資料か、試作機で測った値です。aは、次に示す「こぼさない」上限です。mは、段ボールの模型で、近づかれた人が怖くない距離を試して決めます。Dは、見つける仕組みの候補が届く距離です。d+m≦Dをvについて解くと、v≦-a×t+√((a×t)²+2a(D-m))となり、これが止まる距離から決まる速さの上限です。
      - type: heading
        text: 減速度の上限は、こぼさないことから来る
      - type: p
        text: 強くブレーキをかければ早く止まれますが、トレーの飲み物がこぼれます。一定の減速度aで止まるとき、器の中の液面は傾き、その角度の正接(tan)はa÷g(gは重力加速度)になります。円筒の器なら、縁の側の液面はr×a÷g(rは器の半径)だけ上がります。これが縁までの余白hを超えるとこぼれるので、減速度の上限はg×h÷rです。rとhは、観察で見たいつもの器と、いつも注ぐ量から取ります。
      - type: p
        text: 器がトレーの上ですべらない条件も確かめます。器とトレーの間の静止摩擦係数をμとすると、aがμ×gを超えると器はすべり出します。背の高い器は、すべる前に倒れることがあります。底の半径をb、器と中身の重心の高さをHとすると、aがg×b÷Hを超えると倒れ始めます。上限は、g×h÷r、μ×g、g×b÷Hの一番小さいものです。急に止まると液面が揺れ、式より高く上がります。だから式で見当をつけた後、水を入れた器を載せて止めてみて、こぼれた杯を数えて確かめます。とろみを付けた飲み物は揺れ方が違うので、それも一緒に試します。
      - type: p
        text: 止まる試験では、通り道に人の代わりの筒や車いすを置き、飲み物を載せて上限の速さで近づけます。止まった位置から相手までの距離を巻き尺で測り、こぼれた杯の数も数えます。正面からだけでなく斜めからも近づけ、床に近い車いすの足台や、細い杖の前でも止まるかを見ます。見つける仕組みは、低いものや細いものを見落としやすいからです。
      - type: heading
        text: 取り違えは、話しながら渡す場面で数える
      - type: p
        text: 取り違えは、渡す人の注意に左右されます。だから試すときも、話しながら渡す場面をつくります。利用者の役の人に席に座ってもらい、職員の役の人は、話しかけながら渡します。注意事項の札を付けた飲み物をn杯、模擬で渡し、取り違えの数を数えます。
      - type: p
        text: n杯で取り違えが0件でも、取り違えが起きない証明にはなりません。1杯あたり割合pで取り違える手順なら、n杯が全て正しく渡る確率は(1-p)のn乗で、pがかなり大きくても、この確率は0になりません。「割合はp₀以下」と95%の確からしさで言うには、(1-p₀)のn乗が0.05以下になるnが要り、およそn≧3÷p₀です。p₀を小さくするほど、nは大きくなります。
      - type: p
        text: だから模擬の試験で見つけられるのは、はっきり危ない手順までです。nは、施設と相談した許せる割合と、試験にかけられる手間から決め、そのnで何が言えて何が言えないかを要件の横に書きます。取り違えを減らす仕組みは、試験とは別に、案を考える手順で設計します。
      - type: table
        caption: 安全の要件の表の欄(1行に1つの要件を書く)
        head:
          - 欄
          - 書くこと
        rows:
          - - 要件
            - 何を、どこまで満たすか
          - - 元になった事故
            - 洗い出しの表のどの行か
          - - 測る量と試し方
            - 何を、どの条件で、何回測るか
          - - 合格の線
            - 数で言える線
          - - 線の根拠
            - どの式に、どの手順で測った値を入れたか

  - id: requirements
    step: 2
    heading: 他の要件も加え、必須とあればうれしいに分ける
    blocks:
      - type: point
        text: 安全の要件に、運ぶ量、取りやすい高さ、使いやすさなどを加えて、要件の表にします。「必須」は選ぶ案が必ず満たす要件、「あればうれしい」は満たせば喜ばれる要件です。
      - type: p
        text: 他の要件は、問題の一文と観察の記録から取ります。値は、その出どころを決めてから入れます。出どころのない値は、後で変えたくなったときに、何を確かめ直せばよいかが分からなくなるからです。
      - type: table
        caption: 他の要件の候補と、値の出どころ(値はグループで決める)
        head:
          - 要件の候補
          - 値をどこから取るか
          - 確かめ方の形
        rows:
          - - 一度に運ぶ量
            - 観察で数えた、1回に運ぶ杯数と重さ
            - 載せて何往復かし、落とした杯を数える
          - - 取りやすい高さ
            - 段ボールの模型の試験
            - 車いすの利用者に、決めた高さで取ってもらう
          - - 通れる幅
            - 通路の一番狭い所の幅と、車いすの幅
            - 通路で車いすとすれ違ってもらう
          - - 説明なしで使える
            - 観察で見た、お茶の時間の忙しさ
            - 初めて使う職員に、説明なしで使ってもらう
          - - 動ける時間
            - お茶の時間の長さと1日の回数、充電できる時間
            - 載せて動かし続け、止まるまでの時間を測る
          - - 近づくことの知らせ方
            - 利用者と職員に聞く
            - 近づいたときに気付いたかを、利用者に聞く
      - type: p
        text: 必須か、あればうれしいかは、1つの問いで分けます。「この要件を満たさない案を、他が良ければ選ぶか」。選ばないなら必須、選ぶならあればうれしいです。必須が多すぎると、どの案もふるいを通らなくなります。そのときは、必須にした理由が目的か安全に結び付くかを、一つひとつ見直します。
      - type: p
        text: 要件に手段を書かないことにも気をつけます。「ロボットのトレーの高さ」ではなく「車いすに座ったまま取れる高さ」と書けば、ロボット以外の案にも同じ物差しを当てられます。
      - type: p
        text: "これで、目的に届いたかを確かめる物差しがそろいます。安全の要件は目的の「安全を保ったまま」を、他の要件は「楽にする」を、それぞれ試験で確かめられる形にしたものです。できるものは、要件・種類・値・確かめ方を並べた要件の表です。"

  - id: roles
    heading: ロボットに任せる仕事と、人に残す仕事を分ける
    blocks:
      - type: point
        text: 届ける仕事を細かく分け、一つひとつを誰が担えるかを、決めた問いで考えます。この分け方で、つくるものの難しさと、確かめる試験の数が大きく変わります。だから案を広げる前に、仮の分け方を2~3通りつくります。
      - type: p
        text: 要件の表は「何を満たすか」を決めるもので、「誰が満たすか」は決めません。担い手は、職員、運ぶ道具、利用者自身の3つが候補です。この手順は、要件を定める工程から、案を比べて選ぶ工程までにまたがります。
      - type: p
        text: 仕事の欄は、流れの書き出しとIDEF0の分解図から取ります。分け方の細かさで、答えが変わることに気をつけます。例えば「運ぶ」と「手渡す」を1つの仕事と見ると、担い手は1つに決まります。2つに分けると、運ぶのと渡すのを別の担い手にする案が見えてきます。札と人を照らし合わせることも、手渡しとは別の仕事として欄に立てます。
      - type: steps
        ordered: false
        items:
          - title: 問題の一文が人に残したい仕事か
            body: 一文に書いた「できないこと」を、できるようにするための仕事か。そうなら、人に残す側に傾く。
          - title: 誤ったときの害が大きく、その場の判断が要るか
            body: 洗い出しの表で害が重い仕事で、利用者の様子を見て今するかを決めるなら、人に残す側に傾く。
          - title: 繰り返しで、できたかを数で測れるか
            body: 同じ動きの繰り返しで、速さや距離のように数で確かめられるなら、道具に任せる側に傾く。
          - title: 任せると、確かめる試験がどれだけ増えるか
            body: 道具に任せる仕事が増えるほど、それを確かめる試験も増える。試験にかかる手間と費用も見積もる。
      - type: p
        text: 4つの問いの答えがそろわない仕事もあります。例えば数では測れても、誤ったときの害が重い仕事です。そういう仕事は1つに決めず、担い手の違う分け方を両方残します。どちらが良いかは、次の手順で案にして、要件で比べて確かめます。
      - type: p
        text: 担い手を変えると、要件も変わります。例えば照らし合わせを道具に任せるなら、人や席を見分ける仕組みと、それが誤らないことを確かめる試験が要件に加わります。人に残すなら、その仕事をする職員の手と注意が空いていることが要件になります。
      - type: p
        text: この手順を飛ばすと、「ロボットなのだから全部できたほうが良い」と考え、全てを任せる案に進みがちです。そうすると、試験が増えるだけでなく、問題の一文が人に残したい仕事まで消える恐れがあります。できるものは、仕事・担える人や物・4つの問いの答え・任せる先(仮)・理由を並べた分け方の表で、分け方ごとに1枚つくります。

  - id: ideas
    step: 3
    heading: 分け方の違う案も含めて、案を広げる
    blocks:
      - type: point
        text: 要件に書いたのは満たす条件で、運ぶ手段は自由です。テーマが「ロボット」でも、ロボット以外の案や、仕事の分け方の違う案も並べます。比べる相手がいて初めて、選ぶ理由が言えます。
      - type: p
        text: 案は、思いつきを待つのではなく、軸を決めて広げます。前の手順でつくった分け方の表ごとに、少なくとも1つの案をつくります。その上で、下の軸を組み合わせて、まだ並んでいない組み合わせを探します。
      - type: table
        caption: 案を広げる軸の例
        head:
          - 軸
          - 問い
          - 出てくる案の方向
        rows:
          - - 誰が運ぶか
            - 職員、道具、利用者自身の誰が運ぶか
            - 押す道具、自分で動く道具、利用者が取りに行く仕組み
          - - 何を動かすか
            - 飲み物を動かすか、台所や席の場所を動かすか
            - 動線を変える、飲み物を置く場所を席の近くに移す
          - - 自動の度合い
            - 人が押すか、人について歩くか、決めた所まで自分で走るか
            - ワゴンの改良から、自分で走るロボットまで
          - - 照らし合わせの担い手
            - 札と人を、誰が、何で照らし合わせるか
            - 人が読み合わせる、色や形で見分ける、機械が見分ける
      - type: p
        text: 今のやり方(トレーを手で運ぶ)も、案の一つとして表に入れます。次の手順で、比べる基準になるからです。案ごとに、どの分け方の表に当たるかと、簡単なスケッチを付けます。できるものは、分け方とスケッチの付いた案の一覧です。

  - id: selection
    step: 4
    heading: 必須の要件でふるい、残った案を今のやり方と比べる
    blocks:
      - type: point
        text: まず必須の要件で案をふるいにかけ、残った案を、今のやり方を基準にピューの概念選定法で比べます。点数は判断を助ける道具で、最後に判断するのは人です。
      - type: steps
        items:
          - title: 必須の要件でふるう
            body: 案ごとに、必須の要件を1つずつ「満たす・満たさない・分からない」で印す。分からないなら、何を調べれば決まるかを書き、調べてから印す。
          - title: 基準案を決める
            body: 今のやり方を基準案にする。新しい案が、今より良くなるかを見るため。
          - title: 評価の基準を並べる
            body: 要件の表の要件と、費用を並べる。必須の要件も、満たし方の差があれば基準に入れる。
          - title: +・-・Sを付ける
            body: 基準ごとに、基準案より良ければ+、悪ければ-、同じならS。何人かが別々に付けてから、食い違った所を話し合う。
          - title: 強みを組み合わせる
            body: "-の付いた所を、他の案の+の所で補えないかを考え、組み合わせた案を表に足す。"
          - title: 基準案を替えて、もう一度比べる
            body: 一番強い案を新しい基準案にして比べ直す。差がはっきりするまで繰り返す。
      - type: p
        text: 必須の要件を満たさない案は、合計の点数が高くても選びません。ただし、表から消さずに残しておくと、点数だけで比べると何が起きるかが見え、必須にした理由を確かめ直すきっかけになります。
      - type: p
        text: 選んだ案が、前の手順の仮の分け方のどれに当たるかを確かめます。見込んだ分け方と違う案が残ったなら、分け方の4つの問いに戻り、どの仕事の担い手の見立てが違ったかを考え直します。できるものは、比べた表と、選んだ理由・外した理由の記録です。
      - type: link
        label: 工程4「比べて選ぶ」を詳しく読む
        href: /design/selection/

  - id: spec
    step: 5
    heading: 寸法と速さを、理由と出どころと一緒に仕様の数字にする
    blocks:
      - type: point
        text: 選んだ案の寸法と速さを決めます。数字ごとに理由と出どころを書くのは、後で数字を変えたくなったとき、何を確かめ直せばよいかが分かるようにするためです。
      - type: table
        caption: 仕様の項目と、値の出どころ(決める値はグループで入れる)
        head:
          - 項目
          - 値の出どころ
          - 決める手順
        rows:
          - - 幅
            - 通路の一番狭い幅-車いすの幅-すれ違いの余裕
            - 机の上で計算する
          - - トレーの高さ
            - 車いすの座面の高さと手の届く範囲から見当をつける
            - 段ボールの模型で決める
          - - 速さの上限
            - 職員の歩く速さと、止まる距離の式から出る上限の小さいほう
            - 机の上で計算し、試作機で確かめる
          - - 減速度の上限
            - g×h÷r、μ×g、g×b÷Hの一番小さい値
            - 水を入れた器で確かめる
          - - 止まる位置の余裕
            - 近づかれた人が怖くない距離
            - 段ボールの模型で決める
          - - 動ける時間
            - 1回のお茶の時間×充電までの回数+余裕
            - 机の上で計算する
          - - 非常停止
            - 誰が、どこから、どの姿勢で押すか
            - 模型で、手の届く位置を試す
      - type: p
        text: 速さと止まる距離のように、1つの数字を変えると別の数字も動く項目があります。理由の欄に、どの式でつながっているかを書いておきます。
      - type: p
        text: 机の上では見当までしか決められない項目は、値を「~前後(模型で決める)」と書いておきます。体との関係で決まる数字は、人に試してもらって初めて確かな値になるからです。次の手順で、模型を使って決めます。

  - id: mockup
    step: 5
    heading: 段ボールの模型で、トレーの高さを車いすの利用者と試す
    blocks:
      - type: point
        text: トレーの高さは、体との関係で決まる数字です。段ボールで高さを変えられる模型をつくり、車いすの利用者と職員に器を取ってもらって決めます。結果によっては、要件の表や案の比較まで戻って直します。
      - type: p
        text: 試作機をつくってから高さが合わないと分かると、本体の形からつくり直しになります。段ボールなら短い時間でつくれて、その場で切って高さを変えられます。動きや丈夫さは試せませんが、高さや幅を確かめるには、これで足ります。
      - type: steps
        items:
          - title: 合格の線を先に決める
            body: 「腕を肩より上げない」「体を大きく前に倒さない」「器を傾けない」のように、取りやすいとみなす線を、試す前に書いておく。
          - title: 模型をつくる
            body: 箱を重ねてトレーの台をつくり、机の上で見積もった範囲の低い所・真ん中・高い所の3つに変えられるようにする。トレーには、本番と同じ大きさの器を置く。
          - title: 水を入れた器で試す
            body: 熱いお茶の代わりに、水を同じ量だけ入れる。こぼれても危なくないようにするため。
          - title: 利用者に取ってもらう
            body: 職員が「どうぞ」と示した後、車いすの利用者に器を1つ取ってもらう。高さを試す順番は、人ごとに変える。慣れや疲れで、後の高さほど取りやすく見えたり、取りにくく見えたりするため。
          - title: 職員にも取ってもらう
            body: 立ったまま器を取って手渡す動きと、利用者の隣で腰を落として取る動きを、高さごとに試す。
          - title: 見ること・聞くこと
            body: 合格の線の項目を、人ごと・高さごとに記録する。終わったら、取りやすかった高さを聞く。
          - title: 近づく速さと距離も試す
            body: 職員が模型を押して、速さの上限の候補で近づけ、止まる位置の余裕の候補で止める。座っている利用者に、怖くなかったかを聞く。
      - type: p
        text: 試してもらう人数と時間は、施設と相談して決めます。利用者には、いつでもやめてよいことを先に伝え、職員にそばにいてもらいます。疲れた様子が見えたら、途中でも終えます。
      - type: p
        text: 結果は、記録を合格の線に照らして読みます。試した全員が線を満たす高さがあれば、その高さを仕様の値にします。利用者の取りやすさと職員の腰の負担が食い違い、**1つの高さで両方を満たせないなら、トレーの高さを変えられる仕組みを要件に足すかを考えます**。その仕組みは費用を上げるので、案の比較の表にも戻って確かめ直します。
      - type: p
        text: 近づく試しで怖いという声が多ければ、速さの上限か止まる位置の余裕を見直します。余裕mを大きくすると、止まる距離の式から出る速さの上限も変わるので、式に戻って計算し直します。模型で確かめられるのは、近づかれた人がどう感じるかまでです。本当にその位置で止まれるかは、試作機ができてから、止まる距離の試験で確かめます。
      - type: p
        text: この手順を飛ばすと、トレーの高さは机の上で見当をつけた数字のまま仕様書に載ります。つくる人はその数字を基に形を決め、合わないと分かるのは、施設に置いた後です。できるものは、高さと余裕の値と、それを決めた模型の試験の記録です。

  - id: specdoc
    step: 5
    heading: 試験の計画を付けて、仕様書にまとめる
    blocks:
      - type: point
        text: 仕様書には、数字と理由に加えて、どの要件をどの試験で確かめるかの計画を付けます。つくる人が、仕様書だけで「何を、なぜ、どう確かめるか」を読み取れるようにします。
      - type: table
        caption: 試験の計画の欄(1行に1つの要件を書く)
        head:
          - 欄
          - 書くこと
          - どこから取るか
        rows:
          - - 要件
            - 確かめる要件
            - 要件の表
          - - 試験
            - 何を、どの条件で、何回測るか
            - 安全の要件の表と、模型の試験
          - - 合格の線
            - 数で言える線
            - 安全の要件の式と、施設との相談
          - - 線の根拠
            - なぜその線か
            - 観察の記録、式、模型の試験の記録
          - - 言えること・言えないこと
            - その回数の試験で、何まで言えるか
            - 取り違えの試験のような、回数の計算
          - - やり直す条件
            - どの数字が変わったら、この試験をやり直すか
            - 仕様の理由の欄
      - type: p
        text: 仕様書の中身は、問題の一文、要件の表、仕事の分け方、選んだ案とその理由、仕様の数字と理由と出どころ、そして試験の計画です。数字を変えたくなったときも、理由の欄と試験の計画を見れば、どの試験をやり直せばよいかが分かります。

