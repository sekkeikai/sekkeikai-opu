title: 介護施設でお茶を運ぶロボット
en: "Case: Robot"
layer: case
order: 2
short: 物の設計
question: ロボットに任せること、人に残すことは何か
summary: 介護施設のお茶の時間に、熱い飲み物を人のそばで運ぶロボット。起きうる事故を職員と洗い出して安全の要件にし、届ける仕事をロボットに任せるものと人に残すものに分ける。
lead: もし設計会で、介護施設のお茶の時間に使うロボットを設計するなら、こう進めます。止まる距離と、止まるときの飲み物のこぼれ方から速さの上限を決め、安全の要件の線を引きます。
chapters:
  - id: goal
    heading: お茶の時間の「忙しい」の中身を見分ける
    blocks:
      - type: point
        text: 最初の工程では、「お茶の時間は忙しい」の中身が運ぶ物の重さか、運ぶ間に両手と注意を取られて利用者と話せないことかを、観察で見分けます。
      - type: cards
        items:
          - title: "目的"
            body: "お茶の時間を、安全を保ったまま、職員にとっても利用者にとっても楽にする"
          - title: "誰のため"
            body: "飲み物を用意して配る職員と、受け取る利用者"
          - title: "計画の終わりにできるもの"
            body: "寸法と性能の数字に、どの試験で確かめるかの計画を付けた、つくる人に渡す仕様書。設計会の作業はここまで"
          - title: "届いたかの確かめ方"
            body: "模型と模擬の試験で、止まる距離や取り違えの数などを測る。その回数の試験で何まで言えるかも、試験の計画に書く"
      - type: p
        text: 観察は施設の許しを得て行います([[problem-finding#listen|聞き方と記録の仕方]])。同じ観察で、安全と寸法の要件に使う次の値も測ります。
      - type: list
        items:
          - "通路の一番狭い所の幅"
          - "いつものトレーに、いつもの杯数を載せた重さ"
          - "飲み物を持った職員が、印を付けた区間を歩く時間"

  - id: safety
    step: 2
    heading: 起きうる事故から安全の要件を導く
    blocks:
      - type: point
        text: 事故ごとに、測る量と試し方と合格の線を決めます。安全の要件は、選ぶ案が必ず満たす「必須」に入れます。
      - type: heading
        text: 事故の候補を職員と洗い出す
      - type: p
        text: 届ける仕事を「載せる」「席まで運ぶ」「受け取ってもらう」に分け([[requirements#functions|IDEF0]]で描けます)、仕事ごとに「ここで何が起きたら人が傷つくか」を職員と一緒に考えます。施設で起きかけた事故(ヒヤリハット)の記録があれば、見せてもらえるかを聞きます。
      - type: list
        items:
          - "ぶつかる: 人、車いす、杖、歩行器に、正面や斜めから"
          - "ひく: 床に近い車いすの足台(フットサポート)や、人の足先"
          - "こぼれる・やけどする: 止まるとき、曲がるとき、段差を越えるとき"
          - "器がすべる・倒れる: トレーの上で、止まるときに"
          - "取り違える: 注意事項のある人に、別の飲み物が渡る"
          - "つまずく: 道具そのものや、その通り道に"
      - type: p
        text: 上の一覧は候補の例で、通路の幅、床の段差、利用者の体の様子で変わります。洗い出しの表は1行に1つの事故とし、どの仕事で起きるかと、きっかけを並べます。きっかけには、観察の記録にある混み合う時刻と場所を書きます。害の重さは職員に聞き、起こりやすさは観察で数えた回数で表します。
      - type: p
        text: 利用者ごとの注意事項(とろみが必要な人、温度に気をつける人など)が効く仕事では、取り違えが事故になります。さらさらした水分でむせやすい人は、水分にとろみを付けて飲みます。その人に普通のお茶を渡すと、むせたり、気管に入って肺炎につながったりする恐れがあります。
        note: 水分でむせる人にはとろみを付けることは[健康長寿ネット「嚥下食とは」](https://www.tyojyu.or.jp/net/byouki/engeseihaishikkan/enge-shoku.html)、水や食べ物が肺に入ると肺炎を起こすことは[同「摂食・嚥下障害の症状」](https://www.tyojyu.or.jp/net/byouki/sesshokushougai/shoujou.html)(長寿科学振興財団)。
      - type: p
        text: 危険の減らし方は、生活を支えるロボットの安全の国際規格に沿って、まず設計で危険そのものを小さくし、次に守る仕組みを足し、最後に使い方の注意で補う順に考えます。注意書きは忙しいお茶の時間には読まれにくいので、最後の補いにとどめます。
        note: 生活支援ロボットの安全の規格 [ISO 13482](https://www.iso.org/standard/53820.html)(日本ではJIS B 8445)。人のそばで動くロボットの危険の洗い出し方と、減らし方を定めている。減らし方の順(設計で除く→安全装置→使う人への注意)は、機械の安全の基本の規格[ISO 12100](https://www.iso.org/standard/51528.html)による。
      - type: heading
        text: 速さの上限を2つの候補から選ぶ
      - type: p
        text: 速さの上限の候補は2つあります。1つ目は、観察で測った、配膳のときに職員が歩く速さです。運ぶ道具が職員と同じ速さなら、周りの人が驚かず、職員も待たされません。歩く速さは、印を付けた区間の長さL÷歩いた時間で求め、何回か測って真ん中の値を使います。2つ目は、次に示す止まる距離から決まる上限です。2つのうち、小さいほうを[[requirements|要件]]にします。
      - type: p
        text: 確かめるときは、床に長さLの区間を印し、飲み物を載せた状態で通る時間を測ります。上限の速さをvとすると、通る時間がL÷v以上なら合格です。
      - type: heading
        text: 止まる距離の式を立てる
      - type: p
        text: 止まるまでに進む距離dは、2つの和です。人に気付いてからブレーキが効き始めるまでに進む距離(速さv×反応時間t)と、ブレーキが効いてから止まるまでの距離(v²÷(2×減速度a))です。式にすると、d=v×t+v²÷(2a)です。人の手前に残したい余裕をmとすると、人を見つける距離Dは、d+m以上が必要です。
      - type: p
        text: 式の入力は、それぞれ別の手順から来ます。tは、人を見つける仕組みの候補の資料か、試作機で測った値です。aは、次に示す「こぼさない」上限です。mは、段ボールの模型で、近づかれた人が怖くない距離を試して決めます。Dは、見つける仕組みの候補が届く距離です。d+m≦Dをvについて解くと、v≦-a×t+√((a×t)²+2a(D-m))となり、これが止まる距離から決まる速さの上限です。
      - type: heading
        text: 器とトレーから減速度の上限を求める
      - type: p
        text: 強くブレーキをかければ早く止まれますが、トレーの飲み物がこぼれます。一定の減速度aで止まるとき、器の中の液面は傾き、その角度の正接(tan)はa÷g(gは重力加速度)になります。円筒の器なら、縁の側の液面はr×a÷g(rは器の半径)だけ上がります。これが縁までの余白hを超えるとこぼれるので、減速度の上限はg×h÷rです。rとhは、観察で見たいつもの器と、いつも注ぐ量から取ります。
      - type: p
        text: こぼれる前に、器がトレーの上ですべったり倒れたりすることがあります。器とトレーの間の静止摩擦係数をμとすると、aがμ×gを超えると器はすべり出します。背の高い器では、底の半径をb、器と中身の重心の高さをHとすると、aがg×b÷Hを超えると倒れ始めます。上限には、g×h÷r、μ×g、g×b÷Hのうち一番小さい値を使います。
      - type: p
        text: 急に止まると液面が揺れ、式より高く上がります。式で見当をつけた後、水を入れた器を載せて止めてみて、こぼれた杯を数えます。とろみを付けた飲み物は揺れ方が違うので、水とは別に試します。
      - type: p
        text: 止まる試験では、飲み物を載せて上限の速さで近づけ、止まった位置から相手までの距離を巻き尺で測り、こぼれた杯の数を数えます。見つける仕組みは低いものや細いものを見落としやすいので、近づける相手は人の代わりの筒と車いすに加えて床に近い車いすの足台と細い杖とし、向きは正面と斜めの2つにします。
      - type: heading
        text: 話しながら渡す場面で取り違えを数える
      - type: p
        text: 取り違えは渡す人の注意に左右されるので、試すときも、話しながら渡す場面をつくります。利用者の役の人に席に座ってもらい、職員の役の人は、話しかけながら渡します。注意事項の札を付けた飲み物をn杯、模擬で渡し、取り違えの数を数えます。
      - type: p
        text: n杯で取り違えが0件でも、取り違えが起きない証明にはなりません。1杯あたり割合pで取り違える手順なら、n杯が全て正しく渡る確率は(1-p)のn乗で、pがかなり大きくても、この確率は0になりません。「割合はp₀以下」と95%の確からしさで言うには、(1-p₀)のn乗が0.05以下になるnが要り、およそn≧3÷p₀です。p₀を小さくするほど、nは大きくなります。
      - type: p
        text: 模擬の試験では、はっきり危ない手順までしか見つけられません。nは、施設と相談した許せる割合と、試験にかけられる手間から決め、そのnで何が言えて何が言えないかを要件の横に書きます。取り違えを減らす仕組みは、試験とは別に、案を考える手順で設計します。
      - type: table
        caption: 安全の要件の表の欄(1行に1つの要件を書く)
        head:
          - 欄
          - 書くこと
        rows:
          - - 要件
            - 何を、どこまで満たすか
          - - 元になった事故
            - 洗い出しの表のどの行か
          - - 測る量と試し方
            - 何を、どの条件で、何回測るか
          - - 合格の線
            - 数で言える線
          - - 線の根拠
            - どの式に、どの手順で測った値を入れたか
      - type: p
        text: 安全以外の要件(一度に運ぶ量、取りやすい高さ、通れる幅、説明なしで使えること、動ける時間、近づくことの知らせ方)は、観察と模型の試験から値の出どころを決めて、[[requirements#weight|重み]]を付けて要件の表に加えます。どの案も同じ表で比べられるように、要件には手段を書きません(「ロボットのトレーの高さ」ではなく「車いすに座ったまま取れる高さ」)。

  - id: roles
    label: 工程2から4にまたがる
    heading: ロボットに任せる仕事と人に残す仕事を分ける
    blocks:
      - type: point
        text: 届ける仕事を細かく分け、一つひとつを誰が担えるかを、決めた問いで考えます。分け方でつくるものの難しさと試験の数が変わるので、案を広げる前に、仮の分け方を2~3通りつくります。
      - type: p
        text: 要件の表は「何を満たすか」を決めるもので、「誰が満たすか」は決めません。担い手は、職員、運ぶ道具、利用者自身の3つが候補です。
      - type: p
        text: 仕事の欄は、観察の記録と、洗い出しで分けた仕事から取ります。分け方の細かさで、答えが変わることに気をつけます。例えば「運ぶ」と「手渡す」を1つの仕事と見ると、担い手は1つに決まります。2つに分けると、運ぶのと渡すのを別の担い手にする案が見えてきます。札と人を照らし合わせることは、手渡しとは別の仕事として欄に立てます。
      - type: steps
        ordered: false
        items:
          - title: 職員がしたいのにできずにいる仕事か
            body: 観察で見分けた、職員が運ぶ間にできずにいること(利用者と話すなど)をするための仕事か。そうなら、人に残す側に傾く。
          - title: 誤ったときの害が大きく、その場の判断が要るか
            body: 洗い出しの表で害が重い仕事で、利用者の様子を見て今するかを決めるなら、人に残す側に傾く。
          - title: 繰り返しで、できたかを数で測れるか
            body: 同じ動きの繰り返しで、速さや距離のように数で確かめられるなら、道具に任せる側に傾く。
          - title: 任せると、確かめる試験がどれだけ増えるか
            body: 道具に任せる仕事が増えるほど、それを確かめる試験も増える。試験にかかる手間と費用も見積もる。
      - type: p
        text: 4つの問いの答えがそろわない仕事もあります。例えば数では測れても、誤ったときの害が重い仕事です。そういう仕事は1つに決めず、担い手の違う分け方を両方残し、次の手順で案にして要件で比べます。
      - type: p
        text: 担い手を変えると、要件が変わります。例えば照らし合わせを道具に任せるなら、人や席を見分ける仕組みと、それが誤らないことを確かめる試験が要件に加わります。人に残すなら、その仕事をする職員の手と注意が空いていることが要件になります。
      - type: p
        text: 分け方の表には、仕事・担える人や物・4つの問いの答え・任せる先(仮)・理由を並べ、分け方ごとに1枚つくります。

  - id: next
    label: 工程3から5
    heading: 分け方の表から案と試験の計画をつくる
    blocks:
      - type: p
        text: 案は分け方の表ごとに1つ以上つくり、誰が運ぶか、飲み物と席のどちらを動かすか、自動の度合いを軸に広げます([[ideation#methods|案を広げる]])。並べる案には、ワゴンの改良や飲み物を置く場所を席の近くに移す案のようなロボット以外の案と、トレーを手で運ぶ今のやり方を入れます。試作機がないうちは、見つける仕組みの候補の資料にある反応時間と届く距離を式に入れて止まる距離を見積もり、安全の[[selection#must|必須の要件]]を満たさない案を外します。
      - type: p
        text: トレーの高さと止まる位置の余裕mは、段ボールの模型で探ります([[detailing#steps|形を詰める]])。模型の高さを3通りに変え、車いすの利用者と職員に、いつでもやめてよいと伝えたうえで水を入れた器を取ってもらい、模型を押して近づけたときに怖くないかを聞きます。mを変えたら止まる距離の式で速さの上限を計算し直し、その位置で止まれるかは、試作機ができてから止まる試験で確かめます。
      - type: p
        text: 仕様書は、ロボットをつくる人に渡します。その試験の計画には、要件ごとの試験と合格の線に加えて、どの値が変わったらどの試験をやり直すかを書きます。mや器の半径rと余白hなら止まる試験とこぼれ方の試験、施設と相談した許せる割合なら取り違えの試験の杯数nの計算です([[detailing#output|仕様書]])。

