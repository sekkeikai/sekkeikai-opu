title: アプリ
en: "Case: App"
layer: case
order: 3
short: 情報の設計
question: 締め切りに遅れる本当の理由は、どこにあるか
summary: 遅れる理由を4つの候補に分けて聞き取りで数え、理由ごとに合う解き方を選んで、誰が、いつ、何を書くかまで決める。
lead: もし設計会で、課題の締め切りに遅れないための仕組みを設計するなら、こう進めます。最初に浮かぶ答えは「通知アプリをつくる」ですが、遅れる理由はいくつもあり、通知が効く理由はそのうちの一つです。
chapters:
  - id: goal
    heading: "遅れる理由ごとに、合う解き方が違う"
    blocks:
      - type: point
        text: "聞き取りで遅れる理由ごとの人数を数え、それぞれの理由に合う解き方の種類を、案を出す前に決めます。"
      - type: cards
        items:
          - title: "目的"
            body: "学生が、課題を締め切りまでに出せるようにする"
          - title: "誰のため"
            body: "授業の課題をいくつも抱える学生"
          - title: "計画の終わりにできるもの"
            body: "何を、誰が、いつ書き、どう知らせるかを決めた、仕組みの仕様書"
          - title: "届いたかの確かめ方"
            body: "数人に試してもらう期間に数える要件(締め切りまでに出した課題の割合など)。試す前の同じ長さの期間と比べる"
      - type: p
        text: 手元には「締め切りに遅れないようにしたい」という願いと、「通知アプリ」という思いつきがあります。願いを「学生が、課題を締め切りまでに出せるようにする」という目的の形に言い直し、通知アプリは確かめる仮説の一つとして置きます。[[problem-finding#statement|問題を一文にまとめる]]ときも、解き方の名前は入れません。
      - type: table
        caption: この設計の手順と、それぞれでできるもの
        head:
          - 手順
          - できるもの
        rows:
          - - 遅れる理由の候補を分ける
            - 理由の候補と、当てはまるとする事実
          - - どの理由が大きいかを確かめる
            - 聞き取りの記録、出どころ別の知らせの数、理由ごとの人数
          - - 問題の一文と要件を書く
            - 問題の一文、ペルソナ、要件の表
          - - 理由ごとに解き方の種類を決め、案を出す
            - 理由と解き方の対応表、効く理由を書き添えた案の一覧
          - - 案をふるいにかけ、組み合わせを選ぶ
            - 外す案とその理由、条件付きの案、選ぶ理由
          - - 誰が、いつ、何を書くかまで決める
            - 決めごとの表
          - - 短く試して、要件を満たすかを確かめる
            - 試す期間の記録、直すところと戻る先
          - - 使い始めてから、学期ごとに数えて直す
            - 仕組みの仕様書

  - id: causes
    step: 1
    heading: 締め切りに遅れる理由を、確かめる前に4つの候補に分ける
    blocks:
      - type: point
        text: 「遅れる」を、「知らない・見つけにくい」「通知に埋もれる」「手間を短く見積もる」「始めるのが遅い」の4つの候補に分けます。この4つが、後で理由ごとに解き方を決める[[case-deadline#cause-to-solution|対応表]]の行になります。
      - type: p
        text: 課題を知ってから出すまでの流れに沿って、遅れる理由の候補を並べておきます。課題の知らせは、LMS(学習管理システム。課題の提出や連絡に使う大学のウェブのシステム)、メール、授業中の口頭の連絡のどれかで届きます。
      - type: p
        text: 2つ目の「通知に埋もれる」に関わる調査に、スマートフォンの利用者15人に届く通知を1週間記録したものがあります。通知は1日平均63.5件で、多くはメッセージとメールです。課題の知らせも、この数十件の中の一つとして届き、通知アプリをつくれば、そこに1件が加わります。ただし、通知の多くは数分以内に見られると報告されているので、埋もれるかどうかは聞き取りで確かめます。
        note: '[M. Pielot, K. Church, R. de Oliveira, "An in-situ study of mobile phone notifications", MobileHCI 2014](https://doi.org/10.1145/2628363.2628364)。通知が多いほど、否定的な気持ちが増える傾向も報告している。'
      - type: p
        text: 3つ目は、心理学で計画錯誤(planning fallacy)と呼ばれる傾向です。人は、自分の作業にかかる時間を短く見積もりがちです。この傾向を調べた論文によれば、学業の課題でも見積もりは楽観的になります。過去の似た作業の経験と結び付けて見積もるよう求めた実験では、偏りが見られなくなったという報告もあります。
        note: '[R. Buehler, D. Griffin, M. Ross, "Exploring the ''planning fallacy'': Why people underestimate their task completion times", Journal of Personality and Social Psychology, 67(3), 366–381, 1994](https://doi.org/10.1037/0022-3514.67.3.366)。他人の作業の時間は、むしろ長く見積もる。'
      - type: p
        text: 4つ目の「始めるのが遅い」は、手間を分かっていても起きる点で、3つ目と違います。3つ目には見積もりを助ける仕組みが、4つ目には取りかかるきっかけをつくる仕組みが向いています。
      - type: heading
        text: 候補ごとに、当てはまるかを判断する基準を書く
      - type: p
        text: 候補の名前だけでは、聞き取りの答えをどの候補に入れるかを決められません。候補ごとに「どんな事実があれば当てはまるとするか」を、聞く前に書いておきます。理由3の「見積もりを大きく超える」のような境目の値も、ここで決めて記録します。
      - type: table
        caption: 理由の候補の一覧の形(〔境目の倍率〕は、グループで決める)
        head:
          - 候補
          - どんな理由か
          - 起きる場面
          - 当てはまるとする事実
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが散らばり、課題に気付かないか、締め切りを探す手間がかかる
            - 課題を知る
            - 知るのが遅い。または、締め切りを確かめるのに2か所以上を探す
          - - 2 通知に埋もれる
            - 知らせは届いても、他の通知にまぎれて読まれない
            - 課題を知る
            - 知らせが届いても開かず、後で気付く
          - - 3 手間を短く見積もる
            - 締め切りは知っていても、かかる時間を短く見積もる
            - 手間を見積もる
            - 実際の時間が、見積もりの〔境目の倍率〕倍を超える
          - - 4 始めるのが遅い
            - 手間は分かっていても、取りかかるのが直前になる
            - 取りかかる
            - 見積もりは合っているのに、取りかかるのが締め切りの直前
      - type: p
        text: 「起きる場面」の列で見ると、理由1と2は課題を知る場面で、理由3と4はその後で起きます。通知アプリが助けるのは、主に課題を知る場面です。
      - type: p
        text: 聞き取りで、どの候補にも当てはまらない答えが出たら、「その他」として事実のまま書き残し、似た答えが重なれば新しい候補にします。

  - id: measure
    step: 1
    heading: 聞き方と数え方を決めて、どの理由が大きいかを確かめる
    blocks:
      - type: point
        text: 遅れそうになった最近の課題を1人1件ずつ、時刻と時間で思い出してもらい、課題の知らせも出どころ別に数えます。その記録から、理由ごとに当てはまる人数を数えます。
      - type: p
        text: 4つの候補は、どれもありそうに見えます。話からは「なぜ遅れそうになるか」が、知らせの記録からは「知らせがどれだけ散らばっているか」が分かるので、両方を合わせて、どれが大きいかを確かめます。
      - type: p
        text: 聞く相手は、この設計で想定する学生(授業の課題をいくつも抱える学生)から選びます。学年や学科が1つに偏ると、その学年や学科に特有の事情を、学生全体の理由と取り違える恐れがあるので、なるべく散らします。
      - type: heading
        text: 意見より、出来事の時刻と時間を聞く
      - type: p
        text: 「締め切りに遅れる理由は何だと思いますか」と聞くと、答えは本人の思い込みや、よく聞く説明(「やる気が出ない」など)に寄りやすくなります。締め切りに遅れそうになった最近の課題を1つだけ思い出してもらい、その課題について出来事を順に聞きます。最近の1件なら記憶がはっきりしていて、LMSやメールの記録で日付も確かめられます。質問は次の5つです。
      - type: steps
        items:
          - title: その課題を、いつ、どこで知ったか
            body: 知らせの出どころ(LMS・メール・口頭)と日付を聞きます。締め切りの何日前に知ったかが分かり、理由1「知らない・見つけにくい」に当てはまるかを判断できます。
          - title: 締め切りを確かめるとき、何を見たか
            body: 確かめるために開いた場所の数を聞きます。2か所以上を探したなら、知らせが散らばっている表れとして、理由1に数えます。
          - title: 知らせは、どうやって目に入ったか
            body: 通知で見たか、自分でLMSを開いて見たかを聞きます。通知が届いても開かずに後で気付いたなら、理由2「通知に埋もれる」に数えます。
          - title: 何時間と見積もり、実際は何時間かかったか
            body: 見積もりと実際の時間を、数字で聞きます。実際の時間を見積もりで割った倍率が、前の手順で決めた境目を超えたら、理由3「手間を短く見積もる」に数えます。
          - title: いつ始めたか。その日に始めたきっかけは何か
            body: 始めた日と締め切りの間の日数と、きっかけを聞きます。見積もりは合っていても、取りかかるのが前の晩なら、理由4「始めるのが遅い」に数えます。
      - type: heading
        text: 答えを誘う聞き方を避ける
      - type: p
        text: 聞き手が「通知が足りないから遅れるのでは」と考えていると、「通知があれば間に合ったと思うか」のように、答えを誘う質問をしがちです。こう聞くと、答えが聞き手の考えに寄る恐れがあります。質問は出来事を聞く形(いつ・どこで・何時間)にし、解き方の名前(通知・アプリ)を質問に入れません。聞き手とは別の部員が質問の一覧を読み、誘う言葉がないかを確かめてから聞きます。
      - type: heading
        text: 知らせを、出どころ別に1週間数える
      - type: p
        text: 話だけでは、知らせがどれだけ散らばっているかの量が分かりません。聞き取りに答える人には、ある1週間に届く課題の知らせを、出どころ(LMS・メール・授業中の口頭)ごとに記録してもらいます。口頭の連絡は記録が残らないので、授業の後にその場でメモしてもらいます。課題の知らせの件数と日付だけを記録し、他のメールの中身は集めません。
      - type: heading
        text: 事実と解釈を分けて書き、理由ごとに数える
      - type: p
        text: 聞いた答えは、まず事実として書き、そこからの読み取り(解釈)を別の列に書きます([[problem-finding#listen|事実と解釈を書き分ける]])。1人の答えが2つ以上の理由に当てはまってもかまいません。
      - type: table
        caption: 聞き取りの記録の形(質問ごとに、事実と解釈を分けて書く)
        head:
          - 質問
          - 事実の列に書くこと
          - 解釈の列に書くこと
        rows:
          - - いつ、どこで知ったか
            - 知った日、出どころ(LMS・メール・口頭)、締め切りまでの日数
            - 理由1に当てはまるか
          - - 締め切りを確かめるとき、何を見たか
            - 開いた場所と、その数
            - 理由1に当てはまるか
          - - 知らせは、どうやって目に入ったか
            - 通知で見たか、自分で開いたか。通知を開かずに後で気付いたか
            - 理由2に当てはまるか
          - - 見積もりと実際の時間
            - 見積もった時間、実際にかかった時間、その比
            - 理由3に当てはまるか
          - - いつ始めたか、きっかけは何か
            - 始めた日から締め切りまでの日数、きっかけ
            - 理由4に当てはまるか(理由3との分け方は下の段落)
          - - どの質問にも収まらない答え
            - 本人の言葉のまま
            - 「その他」。新しい候補になるか
      - type: p
        text: 「締め切りの前の晩に始める」という事実だけでは、理由3と4のどちらかは決まりません。見積もりが短いせいで遅く始めるなら理由3、見積もりは合っているのに遅く始めるなら理由4です。4つ目の質問(見積もりと実際の時間)の答えで分けます。
      - type: heading
        text: 「大きい」の基準を、人数で書いておく
      - type: p
        text: 基準は「聞いた人のうち○人以上が当てはまる理由を、問題の中心にする」のような形で書き、○に入る数まで決めておきます。基準を超える理由が1つもなければ、聞く人を増やすか、候補の分け方を見直します。
      - type: p
        text: 聞く人が数人では、割合を言うには足りません。この結果は「どの理由を中心に設計するか」を決めるために使い、後で試す期間の記録で確かめ直します。
      - type: p
        text: 人数の表には、理由・当てはまる人数・基準を超えるか・根拠にした事実(記録のどの行か)を書きます。

  - id: requirements
    label: 工程1と2にまたがる
    heading: 基準を超えた理由だけを、問題の一文と要件に入れる
    blocks:
      - type: point
        text: 基準を超えた理由だけを入れて問題を一文で書き、その理由ごとに、試す期間に数える量と基準の値を決めます。個人の情報の扱いは、比べて点を付ける要件ではなく、どの案でも守る制約にします。
      - type: p
        text: 基準を超えた理由が2つなら、問題の一文には2つとも入れます。理由の言い方は、聞き取りの記録で多い事実に合わせます。例えば理由を「知らせが届かない」と書けば、案は通知に寄ります。「締め切りがどこに書いてあるかを探す」と書けば、知らせを集める案に寄ります。一文の各部分には根拠にした記録の行を書き添え、別の部員が後で確かめられるようにします。
      - type: p
        text: ペルソナ(想定する学生の人物像)には、学年や抱える課題の数、どこで課題を知り締め切りを確かめるか、見積もりと実際の時間の差を、聞き取りの記録から書きます。特徴ごとにどの記録から取ったかを書き添え、想像で足した特徴に気付けるようにします。一文ができたら、目的を「(一文に入れた理由)で遅れるのを減らす」の形に絞って書き直します。
      - type: heading
        text: 理由ごとに、試す期間に数える量を決める
      - type: table
        caption: 理由ごとに数える量(問題の一文に入れた理由の行だけを使う)
        head:
          - 理由
          - 試す期間に数える量
        rows:
          - - 1 知らない・見つけにくい
            - 締め切りの直前まで気付かない課題の数、締め切りを確かめるのに探す場所の数
          - - 2 通知に埋もれる
            - 知らせの数(上限を置く)
          - - 3 手間を短く見積もる
            - 見積もりと実際の時間の比
          - - 4 始めるのが遅い
            - 始める日から締め切りまでの日数
      - type: p
        text: 基準の値には、それぞれ出どころを書きます。理由1なら、数える量をどこまで減らすかで基準の値が決まります。理由2の上限は、聞き取りで、届いた知らせを開かずに後で気付いた件数が多ければ、それを根拠に置きます。要件の表には、要件ごとに元になった理由、数える量、基準の値、確かめ方(いつ、誰が、何と突き合わせて数えるか)を書きます([[requirements#write|確かめられる要件の書き方]])。どの値も、試す期間の結果で見直す前提で置きます。
      - type: heading
        text: 成績と提出の有無は、本人以外に見せない制約にする
      - type: p
        text: 課題の情報は、提出したかどうかや成績と結び付くと、本人が他の人に知られたくない情報になります。「成績や提出したかどうかを、本人以外に見せない」は、要件の表の制約の行に書き、ふるいの手順で使います。この制約は、仕組みに載せる項目と、それを見られる人の範囲の2つで確かめます。費用や、部員が入れ替わっても続けられるかも、制約の候補です。

  - id: cause-to-solution
    label: 工程1と3をつなぐ
    heading: 理由ごとに、解き方の種類を決める
    blocks:
      - type: point
        text: 遅れる理由と、それを減らす解き方の種類を結びます。問題の一文に理由が2つあるなら、解き方も2種類要ります。案を選ぶときは、どの理由を減らすかを言える案だけを残します。
      - type: p
        text: 要件が決まったら、案を出す前に、問題の一文に入れた理由ごとに、どんな種類の解き方が合うかを決めます。
      - type: p
        text: 理由と解き方は、理由が起きる仕組みを見て結びます。仕組みは、聞き取りの記録の事実から書きます。例えば理由1が、知らせが何か所にも散らばり、探す手間がかかることから起きるなら、知らせを集める解き方が合います。理由3が、過去の似た作業と照らさずに見積もることから起きるなら、[[case-deadline#causes|計画錯誤の研究]]の結果から、過去の記録で見積もりを助ける解き方が向いています。
      - type: table
        caption: 遅れる理由の候補と、効く解き方の種類(起きる仕組みは、聞き取りの記録で確かめる)
        head:
          - 遅れる理由
          - 起きる仕組み
          - 効く解き方の種類
          - 効きにくい解き方
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが何か所にも散らばり、探す手間がかかる
            - 知らせを一か所に集める
            - 前日に知らせる(気付いていない課題は知らせられない)
          - - 2 通知に埋もれる
            - 1日数十件の通知にまぎれる
            - 知らせの数を減らし、まとめる
            - 知らせを増やす
          - - 3 手間を短く見積もる
            - 過去の似た作業と照らさずに見積もる
            - 見積もりを助ける
            - 知らせを増やす(知っていても遅れる)
          - - 4 始めるのが遅い
            - 取りかかるきっかけが、締め切りの直前にしかない
            - 始める日を決める/人と報告し合う
            - 一か所に集める(見渡せても始めない)
      - type: p
        text: 対応表には、問題の一文に入れた理由の行だけを残します。理由が2つなら、案は少なくとも2つの種類から1つずつ要ります。1つの案で両方を減らせるものがなければ、2つの案を組み合わせます。
      - type: p
        text: 記録の事実と結び付かない仕組み(「やる気がない」など)を書くと、合う解き方を決められません。仕組みがはっきりしない理由は、聞き取りの記録に戻って、どの場面で何が起きるかを確かめ直します。
      - type: p
        text: 仕組みは使われているのに遅れが減らないときは、[[case-deadline#trial|短く試す手順]]で、この対応表のどの行の解き方が弱いかを絞ります。
      - type: heading
        text: 対応表の種類ごとに案を出す
      - type: p
        text: 案を書き出す紙には、対応表の「効く解き方の種類」を1つずつ見出しとして書いておき、種類ごとに[[ideation#methods|各自で書き出して]]から持ち寄ります。表計算のシートや紙の一覧、カレンダーの使い方を決めるだけの案、友人と報告し合うような人どうしで支える案も、同じ一覧に並べます。今のやり方も、比べるときの基準案として一覧に入れます。
      - type: p
        text: 調べたことも、案の出どころになります。理由3を問題に入れたなら、計画錯誤の研究で、過去の経験と結び付けて見積もると偏りが見られなくなったという結果から、過去にかかった時間を見積もりに使う案を考えられます。
      - type: p
        text: 案には、どの理由を減らすかを対応表の番号で書き添え、使う道具と人、気になる制約(個人の情報、費用、大学の決まりなど)も書きます。番号で書くと、同じ理由にだけ集まった案に気付けます。番号を書けない案は、比べる表に入れずに別に書き留めます。

  - id: screening
    step: 4
    heading: パスワードを預かる案を外し、どの理由も減らせる組み合わせを選ぶ
    blocks:
      - type: point
        text: "[[selection#must|必須の要件と制約]]を満たさない案を外し、残った案を今のやり方と比べます。合計が一番大きい案でも、減らせる理由が1つだけなら、もう1つの理由を減らす案を組み合わせます。"
      - type: p
        text: 例えばLMSから課題を自動で集める案が出たら、個人の情報の制約に照らします。自動で集めるには、学生のLMSのパスワードを預かるか、大学が認めた連携の手段が要ります。パスワードを預かる形は、個人の情報の制約を破るので外します。連携の手段があるかは大学に確かめ、分かるまでは「大学が連携を認めた場合」という条件付きの案として扱います。また、授業中の口頭の連絡のようにLMSに載らない知らせがあるなら、自動で集めるだけでは理由1の要件を満たせないので、手で書き加える仕組みが別に要ることも書き添えます。
      - type: p
        text: 比べる表には、残す案と、条件と確かめる先を書き添えた条件付きの案を入れます。[[selection#criteria|ピューの概念選定法]]の基準案を今のやり方にすると、今より何が良くなり、何が悪くなるかが、そのまま+と-で表れます。表の一番下には、案ごとの効く理由の番号を対応表から写します。組み合わせる案は、この行を見て+の付く基準が違うものを選び、組み合わせた案を新しい列にして、もう一度比べます。
      - type: p
        text: 案を組み合わせるときは、組み合わせた後も制約を守れるかを確かめ直します。例えば人と共有する案と、自分だけが使う案を組み合わせるなら、どの情報を共有の側に置き、どの情報を自分の側に置くかを分けて、個人の情報が共有の側に出ないかを見ます。あればうれしい要件のためだけの案は、試す期間の後に足すかを決める案として残します。

  - id: decisions
    step: 5
    heading: 誰が、いつ、何を書くかまで決める
    blocks:
      - type: point
        text: 選んだ組み合わせを、何を載せるか・誰が書くか・いつ知らせるか・見積もりをどう決めるかまで決めます。どの決めごとにも、どの要件のためかを書き添えます。
      - type: p
        text: 比べて選んだ組み合わせは、まだ方針です。例えば誰が書くかを決めておかないと、情報の更新が止まりやすく、漏れ(仕組みに載っていない課題)についての要件を満たせません。使う人が迷わずに動けるところまで、決めごとを詰めます。
      - type: table
        caption: 決めごとの表で決める項目(中身は、選んだ組み合わせで変わる)
        head:
          - 項目
          - 決めないと起きること
          - 結び付く要件の例
        rows:
          - - 載せる項目
            - 人によって書き方が変わり、正しいかを確かめられない
            - 漏れ、書き加える手間
          - - 載せない項目
            - 個人の情報が、見せたくない人に見える
            - 個人の情報の制約
          - - 書く人と確かめる人
            - 誰も書かず、漏れが出る
            - 漏れ
          - - 見積もりと取りかかる時期の決め方
            - 見積もりが短いまま、直前に始める
            - 見積もりのずれ、始める時期
          - - 知らせの時刻と数
            - 知らせが重なり、読まれなくなる
            - 知らせの数の上限
          - - 引き継ぎ
            - 担当が卒業すると止まる
            - 続けられるかの制約
      - type: heading
        text: 見積もりに足す余裕は、記録で見直す値として置く
      - type: p
        text: 理由3に向けた案を選ぶなら、見積もりにどれだけ余裕を足すかを決めます。[[case-deadline#causes|計画錯誤の研究]]の結果から、似た課題の記録があればその時間を使います。記録がないうちだけ、本人の見積もりに掛ける倍率を仮に置きます。倍率には根拠がないので、試す期間に見積もりと実際の時間の比を集めて決め直します。どちらの時間を使う場合も、1日に課題に使える時間で割って日数にし、締め切りからさかのぼると、取りかかる時期が決まります。
      - type: p
        text: 結び付く要件を書けない決めごとは、使う人の手間を増やすだけなので、外すか、要件の表に足りない行がないかを見直します。

  - id: trial
    label: 工程5から戻ることも
    heading: 短く試して、要件を満たすかを数で確かめる
    blocks:
      - type: point
        text: 少人数に、学期の途中の数週間だけ使ってもらい、要件の表の量を数えて、試す前の同じ長さの期間と比べます。
      - type: p
        text: 決めごとが紙の上でそろっても、実際に使うと、書く人が書かない、知らせが重なる、といったずれが出ることがあります。多くの学生が使い始めてから直すより、少人数で短く試すほうが、直す手間が小さく済みます。結果によっては、問題の一文まで戻ります。
      - type: heading
        text: 試す期間の長さと人を決める
      - type: p
        text: 締め切りが1つか2つでは遅れが減るかどうかを数で見られないので、試す期間は、1人あたりの締め切りがいくつも入る長さにします。試験の週や長い休みのように、課題の数がふだんと違う時期は避けます。試す人は、聞き取りに答えた人を中心に選ぶと、聞き取りの記録と比べられます。
      - type: heading
        text: 成功の条件を、試す前に書いておく
      - type: p
        text: 条件は、要件の表を基に次の形で書きます。比べる元にするため、試す前の同じ長さの期間も、同じ人に提出日と、見積もりと実際の時間を記録してもらいます。
      - type: table
        caption: 試す期間の成功の条件の形
        head:
          - 確かめること
          - 測り方
          - 成功とする条件
        rows:
          - - 要件の表の各行
            - 要件の表の「確かめ方」の通り
            - その要件の基準の値を満たす
          - - 個人の情報の制約
            - 載る項目と、見られる人の範囲を見直す
            - 見せないと決めた情報が、どこにも載っていない
          - - 見積もりのずれ
            - 課題ごとに、見積もりと実際の時間を記録する
            - 境目の倍率を超える課題が、試す前の期間より減る
          - - 締め切りに間に合うか
            - 課題の提出日を記録する
            - 締め切りに遅れる課題が、試す前の期間より減る
      - type: heading
        text: 結果ごとに、どの手順へ戻るかを決めておく
      - type: table
        caption: 試した結果と、戻る手順
        head:
          - こうなったら
          - 戻る手順
          - 直すこと
        rows:
          - - 載っていない課題がある
            - 決めごと
            - その知らせの出どころを調べ、書く人と確かめる人の決め方を直す
          - - 書き加える手間が、基準の値を超える
            - 決めごと
            - 載せる項目を減らすか、開く近道をつくる
          - - 知らせが上限を超える日がある
            - 決めごと
            - 知らせの時刻と、重なったときの決まりを見直す
          - - 仕組みが使われない
            - 要件
            - 使う手間の基準の値と、決めごとの重さを見直す
          - - 仕組みは使われるが、遅れが減らない
            - 理由と解き方の対応
            - 対応表のどの行の解き方が弱いかを、記録から絞る
          - - 問題の一文に入れていない理由で遅れる
            - 問題の一文
            - 聞き取りの記録と人数の表を見直し、一文を書き直す
      - type: p
        text: 少人数・数週間の数字は、傾向を見る目安です。条件を満たしても、学期全体や学年全体で同じになるかは、使い始めてから数えて確かめます。

  - id: spec
    step: 5
    heading: 学期ごとに漏れと遅れを数え、直す決めごとを絞る
    blocks:
      - type: point
        text: 使い始めてからも、漏れと遅れの数を学期ごとに数えます。基準の値を満たさなければ、その年度の担当が、決めごとの表から要件の表、対応表へとさかのぼり、直す決めごとを絞ります。
      - type: p
        text: さかのぼれるように、仕様書には決めごとの表に加えて、目的と問題の一文、要件の表、対応表、比較の表、試す期間の記録をつなげて書きます。選ばなかった案のうち、条件付きの案(例えば「大学が連携を認めた場合」)は、外した理由と一緒に、その条件も書いておきます。部員が入れ替わっても続けられることを制約にしたなら、担当を年度ごとに決め直す手順も書きます。
      - type: link
        label: 工程1「問題を見つける」を詳しく読む
        href: /design/problem-finding/

