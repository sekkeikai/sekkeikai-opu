title: 締め切りに遅れない仕組み
en: "Case: App"
layer: case
order: 3
short: 情報の設計
question: 締め切りに遅れる理由は、どこにあるか
summary: 課題の締め切りに遅れる学生がいるとき、知らせを足す前に、どの理由で遅れているかを聞き取りで数える。
lead: もし設計会で、課題の締め切りに遅れないための仕組みを設計するなら、こう進めます。遅れる理由を4つの候補に分けて、聞き取りで理由ごとの人数を数え、理由と解き方の対応表から案を出します。
chapters:
  - id: goal
    heading: "「遅れる」の中に、別々の理由が混ざっている"
    blocks:
      - type: point
        text: "課題に気付かない人と、手間を短く見積もる人とでは、遅れる理由が違います。最初に浮かぶ「通知アプリ」は主に気付かない人に向けた案なので、[[case-deadline#cause-to-solution|対応表]]の上で、他の理由に向けた案と並べて扱います。"
      - type: cards
        items:
          - title: "目的"
            body: "学生が、課題を締め切りまでに出せるようにする"
          - title: "誰のため"
            body: "授業の課題をいくつも抱える学生"
          - title: "計画の終わりにできるもの"
            body: "何を、誰が、いつ書き、どう知らせるかを決めた、仕組みの仕様書"
          - title: "届いたかの確かめ方"
            body: "締め切りまでに出した課題の割合などを、数人に試してもらう期間と、その前の同じ長さの期間とで比べる"

  - id: causes
    step: 1
    heading: 遅れる理由を4つの候補に分ける
    blocks:
      - type: point
        text: 「遅れる」を、「知らない・見つけにくい」「通知に埋もれる」「手間を短く見積もる」「始めるのが遅い」の4つの候補に分けます。この4つが、後で理由ごとに解き方を決める[[case-deadline#cause-to-solution|対応表]]の行になります。
      - type: p
        text: 課題を知ってから出すまでの流れに沿って、遅れる理由の候補を並べておきます。課題の知らせは、LMS(学習管理システム。課題の提出や連絡に使う大学のウェブのシステム)、メール、授業中の口頭の連絡のどれかで届きます。
      - type: p
        text: 2つ目の「通知に埋もれる」に関わる調査に、スマートフォンの利用者15人に届く通知を1週間記録したものがあります。通知は1日平均63.5件で、多くはメッセージとメールです。課題の知らせは、この数十件の中の一つとして届き、課題を知らせる通知を足せば、そこに1件が加わります。ただし、通知の多くは数分以内に見られると報告されているので、埋もれるかどうかは聞き取りで確かめます。
        note: '[M. Pielot, K. Church, R. de Oliveira, "An in-situ study of mobile phone notifications", MobileHCI 2014](https://doi.org/10.1145/2628363.2628364)。通知が多いほど、否定的な気持ちが増える傾向も報告している。'
      - type: p
        text: 3つ目は、心理学で計画錯誤(planning fallacy)と呼ばれる傾向です。人は、自分の作業にかかる時間を短く見積もりがちです。この傾向を調べた論文によれば、学業の課題でも見積もりは楽観的になります。過去の似た作業の経験と結び付けて見積もるよう求めた実験では、偏りが見られなくなったという報告があります。4つ目の「始めるのが遅い」は、手間を分かっていても起きる点で、3つ目と違います。
        note: '[R. Buehler, D. Griffin, M. Ross, "Exploring the ''planning fallacy'': Why people underestimate their task completion times", Journal of Personality and Social Psychology, 67(3), 366–381, 1994](https://doi.org/10.1037/0022-3514.67.3.366)。他人の作業の時間は、むしろ長く見積もる。'
      - type: heading
        text: 当てはまるとする事実を先に書く
      - type: p
        text: 候補の名前だけでは、聞き取りの答えをどの候補に入れるかを決められません。候補ごとに「どんな事実があれば当てはまるとするか」を、聞く前に書いておきます。境目の値(理由3なら、実際の時間が見積もりの何倍を超えたら当てはまるとするか)は、聞く前にここで決めます。
      - type: table
        caption: 理由の候補の一覧の形(〔境目の倍率〕は、グループで決める)
        head:
          - 候補
          - どんな理由か
          - 起きる場面
          - 当てはまるとする事実
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが散らばり、課題に気付かないか、締め切りを探す手間がかかる
            - 課題を知る
            - 知るのが遅い。または、締め切りを確かめるのに2か所以上を探す
          - - 2 通知に埋もれる
            - 知らせは届いても、他の通知にまぎれて読まれない
            - 課題を知る
            - 知らせが届いても開かず、後で気付く
          - - 3 手間を短く見積もる
            - 締め切りは知っていても、かかる時間を短く見積もる
            - 手間を見積もる
            - 実際の時間が、見積もりの〔境目の倍率〕倍を超える
          - - 4 始めるのが遅い
            - 手間は分かっていても、取りかかるのが直前になる
            - 取りかかる
            - 見積もりは合っているのに、取りかかるのが締め切りの直前
      - type: p
        text: 「起きる場面」の列で見ると、理由1と2は課題を知る場面で、理由3と4はその後で起きます。知らせの出し方を変える案は、主に前の2つを助けます。

  - id: measure
    step: 1
    heading: 理由ごとの人数を数える
    blocks:
      - type: point
        text: 遅れそうになった最近の課題を1人1件ずつ、時刻と時間で思い出してもらい、あわせて課題の知らせを出どころ別に数えます。その記録から、理由ごとに当てはまる人数を数えます。
      - type: p
        text: 4つの候補は、どれもありそうに見えます。話からは「なぜ遅れそうになるか」が、知らせの記録からは「知らせがどれだけ散らばっているか」が分かるので、両方を合わせて、どれが大きいかを確かめます。
      - type: heading
        text: 出来事の時刻と時間を聞く
      - type: p
        text: 「締め切りに遅れる理由は何だと思いますか」と聞くと、答えは本人の思い込みや、よく聞く説明(「やる気が出ない」など)に寄りやすくなります。締め切りに遅れそうになった最近の課題を1つだけ思い出してもらい、その課題について出来事を順に聞きます。最近の1件なら記憶がはっきりしていて、LMSやメールの記録で日付を確かめられます。質問には解き方の名前(通知・アプリ)を入れず、いつ・どこで・何時間の形にします([[problem-finding#listen|「この前」を聞く]])。
      - type: heading
        text: 知らせを出どころ別に1週間数える
      - type: p
        text: 話だけでは、知らせがどれだけ散らばっているかの量が分かりません。聞き取りに答える人には、ある1週間に届く課題の知らせを、出どころ(LMS・メール・授業中の口頭)ごとに記録してもらいます。口頭の連絡は記録が残らないので、授業の後にその場でメモしてもらいます。課題の知らせの件数と日付だけを記録し、他のメールの中身は集めません。
      - type: heading
        text: 答えを理由ごとに振り分ける
      - type: p
        text: 質問は、下の表の左の列の順に聞きます。答えは事実の列にそのまま書き、どの理由に当てはまるかは右の列で別に判断します。1人の答えが2つ以上の理由に当てはまってもかまいません。
      - type: table
        caption: 聞き取りの質問と記録の形(事実と、振り分ける理由を分けて書く)
        head:
          - 質問
          - 事実として書くこと
          - 振り分ける理由
        rows:
          - - その課題を、いつ、どこで知ったか
            - 知った日、出どころ(LMS・メール・口頭)、締め切りまでの日数
            - 理由1(知るのが遅い)
          - - 締め切りを確かめるとき、何を見たか
            - 開いた場所と、その数
            - 理由1(2か所以上を探す)
          - - 知らせは、どうやって目に入ったか
            - 通知で見たか、自分でLMSを開いたか。通知を開かずに後で気付いたか
            - 理由2(開かずに後で気付く)
          - - 何時間と見積もり、実際は何時間かかったか
            - 見積もった時間、実際にかかった時間、その比
            - 理由3(比が境目の倍率を超える)
          - - いつ始めたか。その日に始めたきっかけは何か
            - 始めた日から締め切りまでの日数、きっかけ
            - 理由4(理由3との分け方は下の段落)
          - - どの質問にも収まらない答え
            - 本人の言葉のまま
            - 「その他」。似た答えが重なれば新しい候補
      - type: p
        text: 「締め切りの前の晩に始める」という事実だけでは、理由3と4のどちらかは決まりません。見積もりが短いせいで遅く始めるなら理由3、見積もりは合っているのに遅く始めるなら理由4です。4つ目の質問(見積もりと実際の時間)の答えで分けます。
      - type: heading
        text: 「大きい」の基準を人数で書く
      - type: p
        text: 基準は「聞いた人のうち○人以上が当てはまる理由を、問題の中心にする」のような形で書き、○に入る数まで決めておきます。基準を超える理由が1つもなければ、聞く人を増やすか、候補の分け方を見直します。人数の表には、理由・当てはまる人数・基準を超えるか・根拠にした事実(記録のどの行か)を書きます。
      - type: p
        text: 聞く人が数人では、割合を言うには足りません。この人数は「どの理由を中心に設計するか」を決めるために使い、後で試す期間の記録で確かめ直します。

  - id: cause-to-solution
    label: 工程1から3をつなぐ
    heading: 理由と解き方の対応表をつくる
    blocks:
      - type: point
        text: 遅れる理由と、それを減らす解き方を、理由が起きる仕組みで結びます。案を選ぶときは、どの理由を減らすかを言える案だけを残します。
      - type: p
        text: 基準を超えた理由だけを入れて[[problem-finding#statement|問題を一文に]]まとめ、下の表の右端の量を[[requirements#write|確かめられる要件]]にします。理由の言い方は、聞き取りの記録で多い事実に合わせます(「知らせが届かない」と書けば案は通知に寄り、「締め切りがどこに書いてあるかを探す」と書けば知らせを集める案に寄るため)。
      - type: p
        text: 起きる仕組みは、聞き取りの記録の事実から書きます。例えば理由1が、知らせが何か所にも散らばり、探す手間がかかることから起きるなら、知らせを集める解き方が合います。理由3が、過去の似た作業と照らさずに見積もることから起きるなら、[[case-deadline#causes|計画錯誤の研究]]の結果から、過去の記録で見積もりを助ける解き方が考えられます。
      - type: table
        caption: 遅れる理由と、案を比べるときの問い、試す期間に数える量(起きる仕組みは、聞き取りの記録で確かめる)
        head:
          - 遅れる理由
          - 起きる仕組みの見込み
          - 案を比べるときの問い
          - 試す期間に数える量
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが何か所にも散らばり、探す手間がかかる
            - 探す場所の数を減らすか(前日に知らせても、気付いていない課題は知らせられない)
            - 締め切りの直前まで気付かない課題の数、締め切りを確かめるのに探す場所の数
          - - 2 通知に埋もれる
            - 1日数十件の通知にまぎれる
            - 届く知らせの数を増やさないか
            - 知らせの数(上限を置く)
          - - 3 手間を短く見積もる
            - 過去の似た作業と照らさずに見積もる
            - 見積もるときに、過去の似た作業の時間を見られるか
            - 見積もりと実際の時間の比
          - - 4 始めるのが遅い
            - 取りかかるきっかけが、締め切りの直前にしかない
            - 締め切りより前に、取りかかるきっかけ(始める日を決める、人と報告し合う、など)をつくるか
            - 始める日から締め切りまでの日数
      - type: p
        text: 対応表には、問題の一文に入れた理由の行だけを残します。理由が2つなら、案は少なくとも2つの行に1つずつ要ります。1つの案で両方を減らせるものがなければ、2つの案を組み合わせます。
      - type: p
        text: 記録の事実と結び付かない仕組み(「やる気がない」など)を書くと、合う解き方を考えられません。仕組みがはっきりしない理由は、聞き取りの記録に戻って、どの場面で何が起きるかを確かめ直します。仕組みは使われているのに遅れが減らないときは、[[case-deadline#trial|短く試す手順]]の記録から、この対応表のどの行の解き方が弱いかを絞ります。
      - type: heading
        text: 行ごとに案を出して絞る
      - type: p
        text: 案は対応表の行ごとに書き出し、アプリに限らず、表計算のシートや紙の一覧、カレンダーの使い方の決まり、友人と報告し合う仕組みを同じ一覧に並べます([[ideation#methods|案の出し方]])。案のカードには減らす理由の番号を書き、番号を書けない案は比べる表に入れません。
      - type: p
        text: 案を絞るときに照らす[[selection#must|制約]]の中心は、「成績や提出したかどうかを、本人以外に見せない」です。LMSから課題を自動で集める案なら、パスワードを預かる形は外し、大学が認めた連携の手段がある場合に限る条件付きの案として残します。

  - id: trial
    label: 工程5から戻ることも
    heading: 少人数で短く試す
    blocks:
      - type: p
        text: 選んだ案の決めごと(載せる項目、書く人と確かめる人、知らせの時刻と数)は、どの要件のためかを添えて表にします([[detailing#steps|詳細を決める手順]])。この表のとおりに、聞き取りに答えた人を中心にした少人数に締め切りがいくつも入る学期の途中の数週間だけ使ってもらい、要件の表の量を試す前の同じ長さの期間と比べます。
      - type: p
        text: 少人数・数週間の数字は傾向の目安なので、使い始めた後は学期ごとに漏れ(仕組みに載っていない課題)と遅れを数えます。次の年度の担当がさかのぼって直せるように、仕様書には目的から試す期間の記録までをつなげて書き、条件付きの案(「大学が連携を認めた場合」など)はその条件と一緒に残します([[detailing#output|「なぜこの形か」まで残す]])。
      - type: link
        label: 工程1「問題を見つける」を詳しく読む
        href: /design/problem-finding/

