title: アプリ
en: "Case: App"
layer: case
order: 3
short: 情報の設計
question: 締め切りに遅れる本当の理由は、どこにあるか
summary: 課題の締め切りに遅れないための仕組みを例に、遅れる理由を分けて確かめ、理由ごとに効く解き方を選び、短く試して仕様書にするまでの手順を示す。
lead: もし設計会で、課題の締め切りに遅れないための仕組みを設計するなら、こう進めます。最初に浮かぶ答えは「通知アプリをつくる」ですが、遅れる理由はいくつもあり、通知が効く理由はそのうちの一つです。どの理由が大きく、どの案が残るかはグループや時期で変わるので、決め方までを書きます。
chapters:
  - id: goal
    heading: "学生が課題を締め切りまでに出せるようにする"
    blocks:
      - type: point
        text: "計画の終わりには、数人の学生と試して直した、仕組みの仕様書ができます。"
      - type: cards
        items:
          - title: "目的"
            body: "学生が、課題を締め切りまでに出せるようにする"
          - title: "誰のため"
            body: "授業の課題をいくつも抱える学生"
          - title: "計画の終わりにできるもの"
            body: "何を、誰が、いつ書き、どう知らせるかを決めた、仕組みの仕様書"
          - title: "届いたかの確かめ方"
            body: "試す期間に数える要件(締め切りまでに出した課題の割合など)。何を数えるかは、要件を決める手順で決める"
      - type: p
        text: "この目的は、まだ広い言い方です。[[case-deadline#problem|問題の一文]]で「どの理由で遅れるのを減らすか」が、[[case-deadline#requirements|要件]]で「どこまで減れば届いたか」が決まります。"

  - id: start
    label: 始める前に
    heading: 「通知アプリをつくる」を、確かめる仮説の一つとして置く
    blocks:
      - type: point
        text: 設計を始めるとき、手元には「締め切りに遅れないようにしたい」という願いと、「通知アプリ」という思いつきがあります。思いつきを答えと決めずに、確かめる仮説の一つとして置きます。
      - type: p
        text: 道具の名前から始めると、その後の調べものが「通知アプリをどうつくるか」に限られ、通知では解けない理由が見えなくなります。最初に願いを「学生が、課題を締め切りまでに出せるようにする」という目的の形に言い直しておけば、通知アプリも、他の解き方も、同じ目的に照らして比べられます。
      - type: p
        text: 手順は、下の表の順に進めます。5つの工程のどれか1つにはっきり入る手順もあれば、2つの工程にまたがる手順もあります。どの手順も、前の手順でできたものを使います。
      - type: table
        caption: この設計の手順と、それぞれでできるもの
        head:
          - 手順
          - できるもの
        rows:
          - - 遅れる理由の候補を分ける
            - 理由の候補と、当てはまるかを判断する基準
          - - どの理由が大きいかを確かめる
            - 聞き取りの記録、出どころ別の知らせの数、理由ごとの人数
          - - 問題の一文とペルソナを書く
            - 問題の一文、ペルソナ(想定する学生の人物像)
          - - 課題を出すまでの仕事を図にする
            - 理由の場所を書き込んだ機能の図(IDEF0)
          - - 要件を、数えて確かめられる形に書く
            - 要件の表
          - - 理由ごとに、効く解き方の種類を決める
            - 理由と解き方の対応表
          - - 種類ごとに案を出す
            - 効く理由を書き添えた案の一覧
          - - 必須の要件と制約で案をふるいにかける
            - 残す案、条件付きの案、外す案とその理由
          - - 残った案を比べ、組み合わせを選ぶ
            - 比較の表、選ぶ理由
          - - 誰が、いつ、何を書くかまで決める
            - 決めごとの表
          - - 短く試して、要件を満たすかを確かめる
            - 試す期間の記録、直すところと戻る先
          - - 仕様書にまとめる
            - 仕組みの仕様書

  - id: causes
    step: 1
    heading: 締め切りに遅れる理由を、確かめる前に4つの候補に分ける
    blocks:
      - type: point
        text: 「遅れる」を、「知らない・見つけにくい」「通知に埋もれる」「手間を短く見積もる」「始めるのが遅い」の4つの候補に分けます。理由によって効く解き方が違うので、分けておくと、後で理由ごとに解き方を選べます。
      - type: p
        text: 「なぜ締め切りまでに出せないのか」の答えをここで1つに決めると、その後の調べものは、その理由を確かめるだけになります。課題を知ってから出すまでの流れに沿って、遅れる理由の候補を先に並べておきます。課題の知らせは、LMS(学習管理システム。課題の提出や連絡に使う大学のウェブのシステム)、メール、授業中の口頭の連絡のどれかで届きます。
      - type: p
        text: 2つ目の「通知に埋もれる」に関わる調査に、スマートフォンの利用者15人に届く通知を1週間記録したものがあります。通知は1日平均63.5件で、多くはメッセージとメールです。課題の知らせも、この数十件の中の一つとして届き、通知アプリをつくれば、そこに1件が加わります。ただし、通知の多くは数分以内に見られると報告されているので、埋もれるかどうかは聞き取りで確かめます。
        note: '[M. Pielot, K. Church, R. de Oliveira, "An in-situ study of mobile phone notifications", MobileHCI 2014](https://doi.org/10.1145/2628363.2628364)。通知が多いほど、否定的な気持ちが増える傾向も報告している。'
      - type: p
        text: 3つ目は、心理学で計画錯誤(planning fallacy)と呼ばれる傾向です。人は、自分の作業にかかる時間を短く見積もりがちです。この傾向を調べた論文によれば、学業の課題でも見積もりは楽観的になります。過去の似た作業の経験と結び付けて見積もるよう求めた実験では、偏りが見られなくなったという報告もあります。この結果は、後で理由と解き方の種類を結ぶときに使います。
        note: '[R. Buehler, D. Griffin, M. Ross, "Exploring the ''planning fallacy'': Why people underestimate their task completion times", Journal of Personality and Social Psychology, 67(3), 366–381, 1994](https://doi.org/10.1037/0022-3514.67.3.366)。他人の作業の時間は、むしろ長く見積もる。'
      - type: p
        text: 4つ目の「始めるのが遅い」は、手間を分かっていても起きる点で、3つ目と違います。3つ目には見積もりを助ける仕組みが効き、4つ目には取りかかるきっかけをつくる仕組みが効きます。
      - type: heading
        text: 候補ごとに、当てはまるかを判断する基準を書く
      - type: p
        text: 候補の名前だけでは、聞き取りの答えをどの候補に入れるかを決められません。候補ごとに「どんな事実があれば当てはまるとするか」を、聞く前に書いておきます。理由3の「見積もりを大きく超える」のような境目の値も、ここで決めて記録します。聞いた後で決めると、境目を答えに合わせて動かしたくなるからです。
      - type: table
        caption: 理由の候補の一覧の形(境目の値は、グループで聞く前に決める)
        head:
          - 候補
          - どんな理由か
          - 起きる場面
          - 当てはまるとする事実
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが散らばり、課題に気付かないか、締め切りを探す手間がかかる
            - 課題を知る
            - 知るのが遅い。または、締め切りを確かめるのに2か所以上を探す
          - - 2 通知に埋もれる
            - 知らせは届いても、他の通知にまぎれて読まれない
            - 課題を知る
            - 知らせが届いても開かず、後で気付く
          - - 3 手間を短く見積もる
            - 締め切りは知っていても、かかる時間を短く見積もる
            - 手間を見積もる
            - 実際の時間が、見積もりの〔境目の倍率〕倍を超える
          - - 4 始めるのが遅い
            - 手間は分かっていても、取りかかるのが直前になる
            - 取りかかる
            - 見積もりは合っているのに、取りかかるのが締め切りの直前
      - type: p
        text: 4つの候補で全部だとは限りません。聞き取りで、どの候補にも当てはまらない答えが出たら、「その他」として事実のまま書き残し、似た答えが重なれば新しい候補にします。
      - type: p
        text: 一覧の「当てはまるとする事実」の列は、次の手順で聞き取りの質問の元になります。

  - id: measure
    step: 1
    heading: 聞き方と数え方を決めて、どの理由が大きいかを確かめる
    blocks:
      - type: point
        text: 遅れそうになった最近の課題を1人1件ずつ、時刻と時間で思い出してもらい、課題の知らせも出どころ別に数えます。理由ごとに当てはまる人数を数えますが、どの理由を問題の中心にするかの基準は、聞く前に決めておきます。
      - type: p
        text: 4つの候補は、どれもありそうに見えます。どれが大きいかでつくるものが変わるので、案を考える前に、学生に話を聞き、知らせの記録を数えて確かめます。話からは「なぜ遅れそうになるか」が、記録からは「知らせがどれだけ散らばっているか」が分かります。
      - type: p
        text: 聞く相手は、この設計で想定する学生(授業の課題をいくつも抱える学生)から選びます。学年や学科が1つに偏ると、その学年や学科に特有の事情を、学生全体の理由と取り違える恐れがあるので、なるべく散らします。
      - type: heading
        text: 意見より、出来事の時刻と時間を聞く
      - type: p
        text: 「締め切りに遅れる理由は何だと思いますか」と聞くと、答えは本人の思い込みや、よく聞く説明(「やる気が出ない」など)に寄りやすくなります。締め切りに遅れそうになった最近の課題を1つだけ思い出してもらい、その課題について出来事を順に聞きます。最近の1件なら記憶がはっきりしていて、LMSやメールの記録で日付も確かめられます。質問は次の5つです。
      - type: steps
        items:
          - title: その課題を、いつ、どこで知ったか
            body: 知らせの出どころ(LMS・メール・口頭)と日付を聞きます。締め切りの何日前に知ったかが分かり、理由1「知らない・見つけにくい」に当てはまるかを判断できます。
          - title: 締め切りを確かめるとき、何を見たか
            body: 確かめるために開いた場所の数を聞きます。2か所以上を探したなら、知らせが散らばっている表れとして、理由1に数えます。
          - title: 知らせは、どうやって目に入ったか
            body: 通知で見たか、自分でLMSを開いて見たかを聞きます。通知が届いても開かずに後で気付いたなら、理由2「通知に埋もれる」に数えます。
          - title: 何時間と見積もり、実際は何時間かかったか
            body: 見積もりと実際の時間を、数字で聞きます。実際の時間を見積もりで割った倍率が、前の手順で決めた境目を超えたら、理由3「手間を短く見積もる」に数えます。
          - title: いつ始めたか。その日に始めたきっかけは何か
            body: 始めた日と締め切りの間の日数と、きっかけを聞きます。見積もりは合っていても、取りかかるのが前の晩なら、理由4「始めるのが遅い」に数えます。
      - type: heading
        text: 答えを誘う聞き方を避ける
      - type: p
        text: 聞き手が「通知が足りないから遅れるのでは」と考えていると、「通知があれば間に合ったと思うか」のように、答えを誘う質問をしがちです。こう聞くと、答えが聞き手の考えに寄る恐れがあります。質問は出来事を聞く形(いつ・どこで・何時間)にし、解き方の名前(通知・アプリ)を質問に入れません。聞き手とは別の部員が質問の一覧を読み、誘う言葉がないかを確かめてから聞きます。
      - type: heading
        text: 知らせを、出どころ別に1週間数える
      - type: p
        text: 話だけでは、知らせがどれだけ散らばっているかの量が分かりません。聞き取りに答える人には、ある1週間に届く課題の知らせを、出どころ(LMS・メール・授業中の口頭)ごとに記録してもらいます。口頭の連絡は記録が残らないので、授業の後にその場でメモしてもらいます。課題の知らせの件数と日付だけを記録し、他のメールの中身は集めません。
      - type: heading
        text: 事実と解釈を分けて書き、理由ごとに数える
      - type: p
        text: 聞いた答えは、まず事実として書き、そこからの読み取り(解釈)を別の列に書きます。分けておけば、別の部員が同じ事実から違う解釈をしたときに、どこで分かれるかを話し合えます。1人の答えが2つ以上の理由に当てはまってもかまいません。
      - type: table
        caption: 聞き取りの記録の形(質問ごとに、事実と解釈を分けて書く)
        head:
          - 質問
          - 事実の列に書くこと
          - 解釈の列に書くこと
        rows:
          - - いつ、どこで知ったか
            - 知った日、出どころ(LMS・メール・口頭)、締め切りまでの日数
            - 理由1に当てはまるか
          - - 締め切りを確かめるとき、何を見たか
            - 開いた場所と、その数
            - 理由1に当てはまるか
          - - 知らせは、どうやって目に入ったか
            - 通知で見たか、自分で開いたか。通知を開かずに後で気付いたか
            - 理由2に当てはまるか
          - - 見積もりと実際の時間
            - 見積もった時間、実際にかかった時間、その比
            - 理由3に当てはまるか
          - - いつ始めたか、きっかけは何か
            - 始めた日から締め切りまでの日数、きっかけ
            - 理由4に当てはまるか(理由3との分け方は下の段落)
          - - どの質問にも収まらない答え
            - 本人の言葉のまま
            - 「その他」。新しい候補になるか
      - type: p
        text: 「締め切りの前の晩に始める」という事実だけでは、理由3と4のどちらかは決まりません。見積もりが短いせいで遅く始めるなら理由3、見積もりは合っているのに遅く始めるなら理由4です。4つ目の質問(見積もりと実際の時間)の答えで分けます。
      - type: heading
        text: 「大きい」とする基準は、聞く前に決める
      - type: p
        text: 基準は「聞いた人のうち○人以上が当てはまる理由を、問題の中心にする」のような形で書き、○に入る数も、境目の値と同じく聞く前に決めます。基準を超える理由が1つもなければ、聞く人を増やすか、候補の分け方を見直します。
      - type: p
        text: 聞く人が数人では、割合を言うには足りません。この結果は「どの理由を中心に設計するか」を決めるために使い、後で試す期間の記録で確かめ直します。
      - type: p
        text: 人数の表には、理由・当てはまる人数・基準を超えるか・根拠にした事実(記録のどの行か)を書きます。

  - id: problem
    step: 1
    heading: 基準を超えた理由から、問題の一文とペルソナを書く
    blocks:
      - type: point
        text: 前の手順で基準を超えた理由だけを入れて、問題を一文で書きます。一文には解き方の名前を入れません。入れると、その時点で選べる案が一つに決まるからです。
      - type: p
        text: 問題の一文は、「(誰)が、(どの場面で)、(どの理由で)、(目的に届かない)」の形で書きます。理由の部分は、聞き取りで出た言葉に近い言い方にし、基準を超えた理由が2つなら、2つとも入れます。あわせて、想定する学生の人物像(ペルソナ)を書き、一文の「誰」を具体的にします。
      - type: table
        caption: 問題の一文とペルソナの形(中身は、聞き取りの結果で決まる)
        head:
          - 項目
          - 書くこと
          - どこから取るか
        rows:
          - - 一文の「誰」
            - 困っている学生。ペルソナで具体的にする
            - 聞き取りの相手
          - - 一文の「どの場面で」
            - 理由が起きる場面(知る・見積もる・取りかかる)
            - 理由の候補の一覧の「起きる場面」
          - - 一文の「どの理由で」
            - 基準を超えた理由
            - 理由ごとの人数の表
          - - 一文の「目的に届かない」
            - 締め切りまでに出せない、間に合う時期に取りかかれない、など
            - 目的
          - - ペルソナの暮らし
            - 学年、抱える課題の数、アルバイトやサークル
            - 聞き取りの記録
          - - ペルソナの知らせの受け取り方
            - どこで課題を知り、どこで締め切りを確かめるか
            - 1~3つ目の質問の答え
          - - ペルソナの見積もりと取りかかり方
            - 見積もりと実際の時間の差、始める時期
            - 4・5つ目の質問の答え
      - type: heading
        text: 一文の言い方で、案の向きが変わる
      - type: p
        text: 理由を「知らせが届かない」と書けば、案は通知に寄ります。「締め切りがどこに書いてあるかを探す」と書けば、知らせを集める案に寄ります。どちらの言い方にするかは、書く人の思いつきではなく、聞き取りの記録で多い事実に合わせます。一文の各部分に、根拠にした記録の行を書き添えておくと、別の部員が後で確かめられます。
      - type: p
        text: ペルソナは、聞いた人の平均ではなく、記録に実際に出た事実を組み合わせて書きます。一つひとつの特徴に、どの記録から取ったかを書き添えておくと、想像で足した特徴に気付けます。
      - type: p
        text: 一文ができたら、目的「締め切りまでに出せるようにする」を、「(一文に入れた理由)で遅れるのを減らす」の形に絞って書き直します。この絞った目的と問題の一文が、次の図と要件の出発点になります。

  - id: function
    label: 工程1と2にまたがる
    heading: 課題を出すまでの仕事を図にして、理由が起きる場所を示す
    blocks:
      - type: point
        text: 「課題を締め切りまでに出す」をIDEF0で箱に分け、問題の一文に入れた理由がどの箱で起きるかを書き込みます。理由の場所が分かると、要件と案を箱ごとに考えられます。
      - type: p
        text: 要件を書く前に、学生が課題を出すまでの仕事を図にします。問題の一文は「何が起きているか」を言葉で書いたもので、図は「仕事のどこで起きているか」を示します。
      - type: p
        text: 図はIDEF0で描きます。IDEF0は、機能を箱で表し、左から入る入力、右へ出る出力、上から入る制御(決まりや条件)、下から入る機構(人や道具)を矢印で描く図です。
      - type: idef0
        title: 「課題を締め切りまでに出す」をIDEF0で描く(描き始めの形)
        caption: 描き始めの形。理由の候補は、起きる箱が違う。理由1と2は「課題を知る」、理由3は「手間を見積もる」、理由4は「取りかかって仕上げる」の入り口で起きる。通知アプリは、主に最初の箱を助ける。
        function: 課題を締め切りまでに出す
        inputs:
          - 課題の知らせ
        controls:
          - 締め切り
          - 授業の提出の決まり
        outputs:
          - 提出した課題
        mechanisms:
          - 学生本人
          - LMSとカレンダー
          - 友人
        steps:
          - name: 課題を知る
            output: 知った課題
          - name: 手間を見積もる
            output: 始める日
          - name: 取りかかって仕上げる
            output: 提出した課題
      - type: p
        text: 箱の分け方は、この形で決まりではありません。聞き取りの記録を見て、学生が実際にたどる順に直します。例えば「締め切りを確かめる」を別の箱にしたほうが理由1の場所をはっきり示せるなら、箱を分けます。図には、問題の一文に入れた理由だけを書き込みます。
      - type: p
        text: 仕事を支えるものは道具だけとは限らないので、機構には「友人」も入れておきます。後で案を出すとき、人どうしで支える案を思い出すきっかけになります。
      - type: p
        text: 要件は、理由が起きる箱ごとに、その箱の出力がどうなれば解けたと言えるかの形で書きます。

  - id: requirements
    step: 2
    heading: 「忘れない」を、試す期間に数えられる要件にする
    blocks:
      - type: point
        text: 問題の一文に入れた理由ごとに、解けたと言える状態を、試す期間に数えられる量と基準の値で書きます。個人の情報の扱いは、比べて点を付ける要件ではなく、どの案でも守る制約にします。
      - type: p
        text: 解決したと言える状態も、[[case-deadline#causes|境目の値]]と同じく、案を出す前に決めます。「忘れない」「便利」のような言葉のままでは、後で試したときに、うまくいったかを判断できません。
      - type: p
        text: 要件は3つに分けます。必須の要件(満たさない案は選ばない)、制約(どの案でも守る条件)、あればうれしい要件です。ソフトウェアの設計では、仕組みが「何をするか」を機能要件、「どれだけよく、どんな条件で動くか」を非機能要件と呼んで分けます。例えば「課題の締め切りを本人に示す」は仕組みがすることなので機能要件、「1件の課題を登録するのにかかる時間」や「情報を見られる人の範囲」は非機能要件です。
      - type: table
        caption: 要件の表に書く列
        head:
          - 列
          - 書くこと
        rows:
          - - 要件
            - 何が、どうなるか。問題の一文と同じく、道具の名前は書かない
          - - 種類
            - 必須・制約・あればうれしいのどれか。機能要件か非機能要件か
          - - 元になった理由
            - 問題の一文のどの部分から来るか
          - - 数える量
            - 試す期間に数えるもの(気付くのが遅れた課題の数、知らせの数など)
          - - 基準の値
            - どこまで届けば満たすとするか。試す前に決める
          - - 確かめ方
            - いつ、誰が、何と突き合わせて数えるか
      - type: heading
        text: 基準の値は、問題の一文から逆算して決める
      - type: p
        text: 基準の値には、それぞれ出どころを書きます。理由1を問題に入れたなら、数える量は「締め切りの直前まで気付かない課題の数」や「締め切りを確かめるのに探す場所の数」になり、基準の値はそれをどこまで減らすかで決まります。理由2を入れたなら、知らせの数の上限が要件の候補になります。聞き取りで、届いた知らせを開かずに後で気付いた件数が多ければ、それが上限を置く根拠になります。理由3なら見積もりと実際の時間の比、理由4なら始める日から締め切りまでの日数を数えます。どの値も、試す期間の結果で見直す前提で置きます。
      - type: heading
        text: 個人の情報は、制約として先に決める
      - type: p
        text: 課題の情報は、提出したかどうかや成績と結び付くと、本人が他の人に知られたくない情報になります。「成績や提出したかどうかを、本人以外に見せない」のような条件は、比べて点を付ける要件ではなく、どの案でも守る制約にします。制約にしておけば、他の点で優れた案でも、これを破る案は比べる前に外せます。この制約は、仕組みに載せる項目と、それを見られる人の範囲の2つで確かめます。費用や、部員が入れ替わっても続けられるかも、制約の候補です。
      - type: p
        text: 表の基準の値は、案のふるい分け、比較、試す期間の成功の条件に、そのまま使います。

  - id: cause-to-solution
    label: 工程1と3をつなぐ
    heading: 理由ごとに、効く解き方の種類を決める
    blocks:
      - type: point
        text: 遅れる理由と、それに効く解き方の種類を結びます。問題の一文に理由が2つあるなら、解き方も2種類要ります。案を選ぶときは、どの理由に効くかを言える案だけを残します。
      - type: p
        text: 要件で「解けた状態」が決まったら、案を出す前に、要件の表の「元になった理由」の列を見ながら、理由ごとにどんな種類の解き方が効くかを決めます。この手順を飛ばして案を出すと、案は思いつきやすいもの(通知アプリ)に集まり、数は多くても、効く理由が同じものばかりになります。
      - type: p
        text: 理由と解き方は、理由が起きる仕組みを見て結びます。仕組みは、聞き取りの記録の事実から書きます。例えば理由1が、知らせが何か所にも散らばり、探す手間がかかることから起きるなら、知らせを集める解き方が効きます。理由3が、過去の似た作業と照らさずに見積もることから起きるなら、[[case-deadline#causes|計画錯誤の研究]]の結果から、過去の記録で見積もりを助ける解き方が効きます。
      - type: table
        caption: 遅れる理由の候補と、効く解き方の種類(起きる仕組みは、聞き取りの記録で確かめる)
        head:
          - 遅れる理由
          - 起きる仕組み
          - 効く解き方の種類
          - 効きにくい解き方
        rows:
          - - 1 知らない・見つけにくい
            - 知らせが何か所にも散らばり、探す手間がかかる
            - 知らせを一か所に集める
            - 前日に知らせる(気付いていない課題は知らせられない)
          - - 2 通知に埋もれる
            - 1日数十件の通知にまぎれる
            - 知らせの数を減らし、まとめる
            - 知らせを増やす
          - - 3 手間を短く見積もる
            - 過去の似た作業と照らさずに見積もる
            - 見積もりを助ける
            - 知らせを増やす(知っていても遅れる)
          - - 4 始めるのが遅い
            - 取りかかるきっかけが、締め切りの直前にしかない
            - 始める日を決める/人と報告し合う
            - 一か所に集める(見渡せても始めない)
      - type: p
        text: 対応表には、問題の一文に入れた理由の行だけを残します。理由が2つなら、案は少なくとも2つの種類から1つずつ要ります。1つの案で両方に効くものがなければ、2つの案を組み合わせます。この結び方は、後で案を比べるときにも使います。
      - type: p
        text: 記録の事実と結び付かない仕組み(「やる気がない」など)を書くと、効く解き方を決められません。仕組みがはっきりしない理由は、聞き取りの記録に戻って、どの場面で何が起きるかを確かめ直します。
      - type: p
        text: 結び方を表にしておくと、試した後で結果が良くないときにも役立ちます。例えば仕組みは使われているのに遅れが減らなければ、どの行の解き方が効いていないかを、試す期間の記録から絞れます。

  - id: ideas
    step: 3
    heading: 解き方の種類ごとに案を出し、アプリはその一つとして並べる
    blocks:
      - type: point
        text: 対応表の「効く解き方の種類」ごとに、案を出します。種類が先に決まっていると、「アプリをつくる」以外の案も、効く理由ごとに出てきます。
      - type: p
        text: 案は、部員が数分ずつ黙って書き出してから持ち寄ります。黙って書いておけば、誰かが先に出した案に考えが引っ張られる前に、一人ひとりの案が出そろいます。書き出すときは、対応表の種類を1つずつ見出しにして、種類ごとに書きます。
      - type: p
        text: 「アプリをつくる」と並んで、表計算のシートや紙の一覧、カレンダーの使い方を決めるだけの案、人どうしで支える案も出てきます。人どうしで支える案には、機能の図の機構に入れた「友人」がきっかけになります。今のやり方も、比べるときの基準案として一覧に入れます。
      - type: p
        text: 調べたことも、案の出どころになります。理由3を問題に入れたなら、計画錯誤の研究で、過去の経験と結び付けて見積もると偏りが見られなくなったという結果から、過去にかかった時間を見積もりに使う案を考えられます。
      - type: table
        caption: 案の一覧に書く列
        head:
          - 列
          - 書くこと
        rows:
          - - 案の名前
            - 短い名前
          - - 効く理由
            - 対応表のどの理由に効くか(番号)
          - - どう効くか
            - 理由が起きる仕組みの、どこを断つか
          - - 使う道具と人
            - アプリ、表計算、紙、カレンダー、友人など
          - - 気になる制約
            - 個人の情報、費用、大学の決まりなど、確かめが要ること
      - type: p
        text: 効く理由の番号を書くと、同じ理由にだけ集まった案や、どの理由に効くかを言えない案に気付けます。どの理由に効くかを言えない案は、比べる表に入れずに別に書き留めます。
      - type: p
        text: 「気になる制約」の列は、次の手順で案を制約に照らすときに、先に確かめる項目として使います。

  - id: screening
    step: 4
    heading: 比べる前に、必須の要件と制約で案をふるいにかける
    blocks:
      - type: point
        text: 案に点を付ける前に、必須の要件か制約を一つでも満たさない案を外します。満たすかどうかがすぐに分からない案は、確かめる先と条件を書いて、確かめてから比べる表に入れるかを決めます。
      - type: p
        text: 案を1つずつ、要件の表の必須の要件と制約の行に照らし、「満たす」「満たさない」「分からない」の印を付けます。満たさない案を比べる表に入れると、他の基準の点が高いせいで、満たしていないことが見過ごされる恐れがあるからです([[selection#must|必須の要件でふるいにかける]])。
      - type: p
        text: 例えばLMSから課題を自動で集める案が出たら、自動で集めるには、学生のLMSのパスワードを預かるか、大学が認めた連携の手段が要ります。パスワードを預かる形は、個人の情報の制約を破るので外します。連携の手段があるかは大学に確かめ、分かるまでは「大学が連携を認めた場合」という条件付きの案として扱います。また、授業中の口頭の連絡のようにLMSに載らない知らせがあるなら、自動で集めるだけでは理由1の要件を満たせないので、手で書き加える仕組みが別に要ることも書き添えます。
      - type: p
        text: 外した案は、外した理由と一緒に記録します。理由が「大学の連携の手段がない」のような外の事情なら、事情が変わったときに見直せます。
      - type: p
        text: 比べる表には、残す案と、条件と確かめる先を書き添えた条件付きの案を入れます。

  - id: comparison
    step: 4
    heading: 残った案を今のやり方と比べ、効く理由がそろう組み合わせを選ぶ
    blocks:
      - type: point
        text: 残った案を、今のやり方を基準にして比べます。合計が一番大きい案でも、効く理由が1つだけなら、もう1つの理由に効く案を組み合わせます。
      - type: p
        text: 比べ方には、ピューの概念選定法を使います。基準案を一つ決め、他の案が評価の基準ごとに基準案より良ければ+、悪ければ-、同じならSを付けて、数を合計します。ふるいを通った案は必須の要件と制約を全て満たしているので、満たすかどうかでは差が出ません。評価の基準には、案の間で差の出る要件、つまり必須の要件の満たし方の差と、あればうれしい要件を使います。
      - type: steps
        items:
          - title: 基準案を決める
            body: 今のやり方を基準案にします。今より何が良くなり、何が悪くなるかが、そのまま+と-で表れるからです。
          - title: 評価の基準を写す
            body: 要件の表から、案によって満たし方に差の出る必須の要件と、あればうれしい要件を行に写します。基準の言い方は、要件の表と同じにします。
          - title: 1マスずつ+・-・Sを付ける
            body: 2人以上で付け、意見が分かれるマスには、そう判断する根拠を書き添えます。判断できないマスは、確かめることとして残します。
          - title: 合計と、効く理由を並べる
            body: +と-の数を数え、表の一番下に、その案が効く理由の番号を書きます。
          - title: 弱いところを補う組み合わせを考える
            body: 効く理由が足りない案には、その理由に効く案を組み合わせます。組み合わせた案を新しい列として、もう一度比べます。一番良い案を基準案に替えて比べ直すと、残った弱いところが見えます。
      - type: table
        caption: 比較の表の形(マスには、基準案と比べて+・-・Sのどれかを書く)
        head:
          - 評価の基準
          - 基準案(今のやり方)
          - 案A
          - 案B
          - 組み合わせ
        rows:
          - - 必須の要件(満たし方に差の出るものを1行ずつ)
            - S
            - +・-・S
            - +・-・S
            - +・-・S
          - - あればうれしい要件
            - S
            - +・-・S
            - +・-・S
            - +・-・S
          - - +の数、-の数
            - 0、0
            - 数える
            - 数える
            - 数える
          - - 効く理由の番号
            - ―
            - 対応表から
            - 対応表から
            - 対応表から
      - type: p
        text: 合計が一番大きい案でも、効く理由が問題の一文の一部だけなら、その案だけでは問題を解きません。組み合わせる案は、表の一番下の「効く理由の番号」の行を見て、+の付く基準が違うものを選びます。
      - type: p
        text: 案を組み合わせるときは、組み合わせた後も制約を守れるかを確かめ直します。例えば人と共有する案と、自分だけが使う案を組み合わせるなら、どの情報を共有の側に置き、どの情報を自分の側に置くかを分けて、個人の情報が共有の側に出ないかを見ます。あればうれしい要件にだけ効く案は、試す期間の後に足すかを決める案として残します。
      - type: p
        text: 選ぶ組み合わせには、どの理由に効くかを書き添えます。選ばない案とその理由は、仕様書にも載せます。

  - id: decisions
    step: 5
    heading: 誰が、いつ、何を書くかまで決める
    blocks:
      - type: point
        text: 選んだ組み合わせを、何を載せるか・誰が書くか・いつ知らせるか・見積もりをどう決めるかまで決めます。どの決めごとにも、どの要件のためかを書き添えます。
      - type: p
        text: 比べて選んだ組み合わせは、まだ方針です。例えば誰が書くかを決めておかないと、情報の更新が止まりやすく、漏れ(仕組みに載っていない課題)についての要件を満たせません。使う人が迷わずに動けるところまで、決めごとを詰めます。
      - type: table
        caption: 決めごとの表で決める項目(中身は、選んだ組み合わせで変わる)
        head:
          - 項目
          - 決めないと起きること
          - 結び付く要件の例
        rows:
          - - 載せる項目
            - 人によって書き方が変わり、正しいかを確かめられない
            - 漏れ、書き加える手間
          - - 載せない項目
            - 個人の情報が、見せたくない人に見える
            - 個人の情報の制約
          - - 書く人と確かめる人
            - 誰も書かず、漏れが出る
            - 漏れ
          - - 見積もりと取りかかる時期の決め方
            - 見積もりが短いまま、直前に始める
            - 見積もりのずれ、始める時期
          - - 知らせの時刻と数
            - 知らせが重なり、読まれなくなる
            - 知らせの数の上限
          - - 引き継ぎ
            - 担当が卒業すると止まる
            - 続けられるかの制約
      - type: heading
        text: 見積もりに足す余裕は、記録で見直す値として置く
      - type: p
        text: 理由3に効く案を選ぶなら、見積もりにどれだけ余裕を足すかを決めます。[[case-deadline#causes|計画錯誤の研究]]の結果から、似た課題の記録があればその時間を使います。記録がないうちだけ、本人の見積もりに掛ける倍率を仮に置きます。倍率には根拠がないので、試す期間に見積もりと実際の時間の比を集めて決め直します。どちらの時間を使う場合も、1日に課題に使える時間で割って日数にし、締め切りからさかのぼると、取りかかる時期が決まります。
      - type: p
        text: 結び付く要件を書けない決めごとは、どの要件にも効いていません。使う人の手間を増やすだけなので、外すか、要件の表に足りない行がないかを見直します。
      - type: p
        text: 試す期間には、この決めごとの表の通りに使ってもらいます。

  - id: trial
    label: 工程5から戻ることも
    heading: 短く試して、要件を満たすかを数で確かめる
    blocks:
      - type: point
        text: 少人数に、学期の途中の数週間だけ使ってもらい、要件の表の量を数えます。どの値を満たせば成功とするかは、試す前に決めておきます。
      - type: p
        text: 決めごとが紙の上でそろっても、実際に使うと、書く人が書かない、知らせが重なる、といったずれが出ることがあります。多くの学生が使い始めてから直すより、少人数で短く試すほうが、直す手間が小さく済みます。結果によっては、問題の一文まで戻ります。
      - type: heading
        text: 試す期間の長さと人を決める
      - type: p
        text: 試す期間は、1人あたりの締め切りがいくつも入る長さにします。締め切りが1つか2つでは、遅れが減るかどうかを数で見られないからです。試験の週や長い休みのように、課題の数がふだんと違う時期は避けます。試す人は、聞き取りに答えた人を中心に選ぶと、聞き取りの記録と比べられます。
      - type: heading
        text: 成功の条件を、試す前に書いておく
      - type: p
        text: 条件は、要件の表を基に次の形で書きます。比べる元にするため、試す前の同じ長さの期間も、同じ人に提出日と、見積もりと実際の時間を記録してもらいます。
      - type: table
        caption: 試す期間の成功の条件の形
        head:
          - 確かめること
          - 測り方
          - 成功とする条件
        rows:
          - - 要件の表の各行
            - 要件の表の「確かめ方」の通り
            - その要件の基準の値を満たす
          - - 個人の情報の制約
            - 載る項目と、見られる人の範囲を見直す
            - 見せないと決めた情報が、どこにも載っていない
          - - 見積もりのずれ
            - 課題ごとに、見積もりと実際の時間を記録する
            - 境目の倍率を超える課題が、試す前の期間より減る
          - - 締め切りに間に合うか
            - 課題の提出日を記録する
            - 締め切りに遅れる課題が、試す前の期間より減る
      - type: heading
        text: 結果ごとに、どの手順へ戻るかを決めておく
      - type: p
        text: 条件を満たさないときに、どこを直すかも先に決めておきます。戻る先は、決めごとだけとは限りません。
      - type: table
        caption: 試した結果と、戻る手順
        head:
          - こうなったら
          - 戻る手順
          - 直すこと
        rows:
          - - 載っていない課題がある
            - 決めごと
            - その知らせの出どころを調べ、書く人と確かめる人の決め方を直す
          - - 書き加える手間が、基準の値を超える
            - 決めごと
            - 載せる項目を減らすか、開く近道をつくる
          - - 知らせが上限を超える日がある
            - 決めごと
            - 知らせの時刻と、重なったときの決まりを見直す
          - - 仕組みが使われない
            - 要件
            - 使う手間の基準の値と、決めごとの重さを見直す
          - - 仕組みは使われるが、遅れが減らない
            - 理由と解き方の対応
            - 対応表のどの行の解き方が弱いかを、記録から絞る
          - - 問題の一文に入れていない理由で遅れる
            - 問題の一文
            - 聞き取りの記録と人数の表を見直し、一文を書き直す
      - type: p
        text: 少人数・数週間では、数字は傾向を見る目安にとどまります。条件を満たしても、学期全体や学年全体で同じになるとは言えないので、使い始めてからも、漏れと遅れの数を学期ごとに数えて見直します。

  - id: spec
    step: 5
    heading: 試して直した決めごとを、仕様書にまとめる
    blocks:
      - type: point
        text: 試して直した決めごとを、初めて使う学生が読めばその通りに使える仕様書にまとめます。選ばなかった案と外した理由も、後で見直せるように残します。
      - type: p
        text: 仕様書には、次の項目を書きます。
      - type: list
        items:
          - 仕組みの全体の形
          - 載せる項目と載せない項目
          - 書く人と確かめる人の決め方
          - 見積もりと取りかかる時期の決め方
          - 知らせの時刻と数
          - 引き継ぎの手順
          - どの要件を、どうやって確かめるか
      - type: p
        text: 選ばなかった案と外した理由のうち、条件付きの案(例えば「大学が連携を認めた場合」)は、その条件も書いておけば、条件が変わったときにこの記録から比べ直せます。部員が入れ替わっても続けられることを制約にしたなら、担当を年度ごとに決め直す手順も書きます。
      - type: p
        text: 仕様書は、ここまでの手順でできたものをつなげて書きます。目的と問題の一文、要件の表、対応表、比較の表、決めごとの表、試す期間の記録です。どの決めごとがどの要件のためで、どの要件がどの理由から来るかをたどれれば、次の年度に見直す人が、どこから直せばよいかを判断できます。
      - type: link
        label: 工程1「問題を見つける」を詳しく読む
        href: /design/problem-finding/

