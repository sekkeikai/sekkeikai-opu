title: イベント
en: "Case: Event"
layer: case
order: 1
short: 企画と運営
question: 高校生が「来てよかった」と思える体験を、どう設計するか
summary: オープンキャンパスの体験コーナーを、去年の受付の記録から組み立てる。来場者が体験の前と途中のどちらで抜けるかを見分け、1時間に回せる人数を計算する。
lead: もし設計会でオープンキャンパスの体験コーナーを設計するなら、次のように進めます。去年の記録からつまずく場所を見極め、「楽しい」を当日に測れる要件にし、回せる人数を計算して、当日の動きを分単位で決めます。
chapters:
  - id: goal
    heading: "来場者には当日まで会えないので、去年の記録と計算で準備する"
    blocks:
      - type: point
        text: "去年の受付の記録から、体験の前で抜けた人と途中で抜けた人の割合を別々に求めます。どちらが大きいかで、直すのが体験の中身か、順番を待つ間かが決まります。"
      - type: cards
        items:
          - title: "目的"
            body: "来場した高校生が、大学で学ぶことを短い時間で体験し、「来てよかった」と思って帰る"
          - title: "誰のため"
            body: "来場する高校生と、付き添う保護者"
          - title: "計画の終わりにできるもの"
            body: "係が自分の役目から、開始何分に何を言い、何を配るかを引ける、運営の仕様書"
          - title: "届いたかの確かめ方"
            body: "受付の記録とアンケートで、当日に測る要件(待ち時間、内容が「分かった」と答える人の割合など)"

  - id: givens
    label: 工程1の前
    heading: まず、動かせない前提を集める
    blocks:
      - type: point
        text: 体験の中身を考える前に、日時・教室・予算・人手・安全の決まりのように、設計会では変えられない前提を集めます。集めた前提は、後で要件の表の「制約」になります。
      - type: p
        text: 前提を先に集めておけば、守れない案に時間を使わずに済みます。ただし、「何をやるか」はまだ決めません。先に決めるとその案に合う問題ばかりが目に入るので、やることは、次の手順で問題を確かめてから決めます。
      - type: p
        text: 前提は、オープンキャンパスを担当する大学の部署と、当日に入れる部員に確かめます。開催の時間帯、使える教室の数と広さ、机や電源、使える費用、当日に入れる部員の数、使ってはいけない道具や材料の決まりを聞きます。
      - type: p
        text: 人手は「何人」だけでなく、「誰が何時から何時まで」も聞きます。昼の時間帯だけ人が減ることもあります。後で回せる人数を計算するときは、その時間帯の人数を入力に使います。
      - type: table
        caption: 前提の一覧の形(項目ごとに1行)
        head:
          - 項目
          - 値
          - 確かめた相手
          - 変えられるか
        rows:
          - - (開催の時間帯、教室、費用、人手、安全の決まりなど)
            - (数や時刻を具体的に)
            - (大学の部署、部員など)
            - 変えられない/相談すれば変わる
      - type: p
        text: 「変えられるか」の列は、後で案をふるいにかけるときに使います。「相談すれば変わる」前提で案を外すときは、外す前に相談するかどうかを決められます。

  - id: evidence
    step: 1
    heading: 去年の記録を集め、事実と解釈を分けて書き出す
    blocks:
      - type: point
        text: 問題を確かめる材料は、去年の体験コーナーの記録です。見たこと・聞いたこと(事実)と、そこからの読み取り(解釈)を分けて、カードに1枚ずつ書き出します。
      - type: p
        text: 去年の様子が、今年の来場者に一番近い材料になります。体験コーナーの写真、来場者アンケート、受付の記録(何時に何人が来たか)、手伝った部員の話の4つを集めます。去年の記録がなければ、他の団体の企画を当日に見に行くか、高校生に年が近い1年生に、高校のときに大学の企画を回った経験を聞いて代えます。
      - type: p
        text: 受付の記録からは、並び始めた人数、体験を始めた人数、体験を終えた人数の3つを、時間帯ごとに取り出します。1時間でならすと人がまとまって来た時間が見えなくなるので、時間帯は1時間より短く区切ります。記録に体験を始めた人数がない年は、並び始めた人数と終えた人数だけを取り出し、始めた人数がないことを書き添えます。
      - type: p
        text: 部員に全体の感想を聞くと、印象に残った出来事だけが返ってきやすくなります。「一番混んだとき、列はどこまで伸びた?」「並ぶのをやめた人はいた?」のように、具体的な場面を聞きます([[problem-finding#listen|「この前」を聞く]])。
      - type: p
        text: アンケートには偏りがあります。体験を終えた人しか答えないので、並ぶのをやめた人や、のぞいて帰った人の声は入りません。その人たちの様子は、写真と部員の話から拾います。
      - type: table
        caption: カードの形(1枚に事実は1つだけ)
        head:
          - 事実
          - 出どころ
          - 解釈
        rows:
          - - (いつ・どこで・誰が・何をしたか)
            - 写真/アンケート/受付の記録/部員の話
            - (その事実から考えたこと。「~かもしれない」の形で)
      - type: p
        text: 解釈だけのカード(「つまらなかったのだろう」など)は、元になった事実を探して書き足し、見つからなければ別に分けておきます([[problem-finding#listen|見たことと、読み取ったことを分けて書く]])。

  - id: problem
    step: 1
    heading: つまずく場所が、体験の前か中かを見極める
    blocks:
      - type: point
        text: カードを整理して「なぜ」をたどり、もっともらしい2つの説明を受付の記録の数で区別してから、問題を一文にします。
      - type: p
        text: カードは[[problem-finding#kj|KJ法]](似たカードを集めて、まとまりから問題を見つける方法)で整理します。分類の枠を先に決めず、近いカードを寄せてから、まとまりに名前を付けます。「体験の前」「体験の中」のような枠を先に置くと、その枠に合うカードしか目に入らなくなります。
      - type: p
        text: 名前を付けたら、まとまりごとに、カードの枚数と出どころの種類の数を数えます。1人の部員の話だけでできたまとまりより、写真・記録・アンケートがそろうまとまりのほうが、確かな手がかりです。
      - type: p
        text: 大きなまとまりについては、[[problem-finding#why-why|「なぜ」を繰り返し]]ます。「なぜ帰るのか」の答えを書いたら、その答えにまた「なぜ」を聞きます。たどる先は、体験の中身だけとは限りません。並んでいる間に何が見え、何が分からないか、一回の長さがどう決まっているかも原因になりうるので、確かめます。答えが「やる気がない」のように人のせいで止まったら、その人がそうなる場面に戻って聞き直します。
      - type: heading
        text: もっともらしい説明が2つあれば、数で区別する
      - type: p
        text: 「中身がつまらないから帰る」と「待つ間に帰る」は、どちらもありえます。この見極めを飛ばして「楽しくなかった」という声だけを受け取ると、中身を派手にする方向に進みがちです。中身を足すと一回が長くなり、待ち時間が延びます。問題が待つ間にあるなら、直したつもりの変更が、問題を大きくします。
      - type: p
        text: 2つを区別するには、前の手順で取り出した数から、体験の前で抜けた割合を求めます。体験の前で抜けた割合=(並び始めた人数−体験を始めた人数)÷並び始めた人数。(体験を始めた人数−体験を終えた人数)÷体験を始めた人数は、中身の途中で抜けた割合として別に見ます。前で抜けた割合が大きく、体験を終えた人のアンケートの評価が高ければ、問題は中身より手前にある見込みが高くなります。前で抜けた割合が小さく、途中で抜けた割合が大きいか、終えた人の評価が低ければ、問題は中身にあります。
      - type: p
        text: 始めた人数がない年は、2つを分けられないので、並び始めた人数と終えた人数の差を、前と途中を合わせた数として扱い、そう書き添えます。記録そのものがなければ、手伝った部員の見積もりで代え、見積もりだと書いておきます。
      - type: heading
        text: 問題の一文とペルソナを書く
      - type: p
        text: 見えてきた問題は、「誰が・どんな場面で・何に困っているか」の形の一文にまとめ、解決の仕方は入れません([[problem-finding#statement|問題を一文にまとめる]])。
      - type: p
        text: あわせて、想定する来場者の人物像(ペルソナ)を書き、問題の一文の「誰」を具体的にします。ペルソナは、カードの事実から組み立てます。事実の裏付けがない項目には印を付け、後で確かめます。
      - type: table
        caption: ペルソナに書く項目と、後の手順での使い道
        head:
          - 項目
          - 書くこと
          - 後でどう使うか
        rows:
          - - 学年と興味
            - (どの分野に、どれくらい興味があるか)
            - 体験の中身の案を出すとき
          - - 誰と来るか
            - (ひとりで、友人と、保護者と、など)
            - 一緒に来た人が、その間何をするかを考えるとき
          - - 一か所にいられる時間
            - (他に回りたい場所や、その日の予定から)
            - 待ち時間の上限を計算するとき
          - - 来る前に知っていること
            - (体験コーナーを何で知ったか、何をすると思っているか)
            - 案内の案を出すとき

  - id: functions
    step: 2
    heading: 体験コーナーの仕事を、IDEF0で図にする
    blocks:
      - type: point
        text: 体験コーナーが果たす機能を図にして、問題の一文が、受付から感想を聞くまでのどの箱の中にあるかを確かめます。図の箱は、次の手順で要件を探す単位になります。
      - type: p
        text: "[[requirements#functions|IDEF0]](機能を箱と矢印で描く図)の描き始めは、大きな箱を一つ置き、それを3つ前後の箱に分けます。箱の名前は「~する」の形にし、道具や案の名前は入れません。体験コーナーなら、例えば次の形から始め、自分たちの流れに合わせて箱を足したり分けたりします。"
      - type: idef0
        title: 「高校生に体験してもらう」の描き始めの形
        caption: 受付から感想を聞くまでを一つの流れとして描く。制御には前提の一覧の決まりを、機構には人手と道具を置く。
        function: 高校生に体験してもらう
        inputs:
          - 来場した高校生
        controls:
          - 大学の安全の決まり
          - 開催の時間
        outputs:
          - 体験を終えた高校生
          - アンケートの回答
        mechanisms:
          - 当日の部員
          - 教材と機材
        steps:
          - name: 受付して待ってもらう
            output: 順番を待つ高校生
          - name: 体験してもらう
            output: 体験を終えた高校生
          - name: 感想を聞く
            output: アンケートの回答
      - type: p
        text: 問題の一文がある箱の要件は、次の手順で一番丁寧に書きます。目立つ箱「体験してもらう」だけを考えていると、他の箱の要件が抜けます。
      - type: p
        text: 機構の矢印(箱を支える人や道具)も確かめます。同じ部員が、いくつもの箱を支えることがあります。人手は箱どうしで取り合いになるので、何人を同時に体験させられるかは、人手から決まります。どの箱に何人の係が要るかを書き出しておくと、後で回せる人数を計算するときの入力になります。

  - id: requirements
    step: 2
    heading: 「楽しい」を、当日に測れる要件にする
    blocks:
      - type: point
        text: 待ち時間や1時間に回す人数は、ペルソナと去年の記録から計算します。一番測りにくい「楽しい」は、楽しさのうち何を測るかを問題の一文から選びます。どれも、図の箱ごとに、何を、どの値で、どう測るかを要件の表に書きます。
      - type: p
        text: 一つひとつの[[requirements#why|要件]](確かめられる形で書いた条件)は、何を測るか(指標)、どの値なら合格か(しきい値)、いつ誰がどう測るか、の3つがそろって使えるようになります([[requirements#write|要件の書き方]])。表の「種類」の列の分け方は、[[requirements#weight|要件の重み]]と同じです。
      - type: p
        text: 指標は、図の箱ごとに探します。箱の出力が「うまくできた」と言えるのはどんなときかを考え、それを数えられる量にします。最初の箱なら待つ間の時間、2つ目の箱なら一回の長さや1時間に回せる人数、最後の箱なら内容が分かったかどうか、が候補になります。問題の一文がある箱には、問題そのものを測れる指標を必ず置きます。
      - type: heading
        text: しきい値は、気分で決めず、前の手順でできたものから計算する
      - type: p
        text: 例えば待ち時間の上限は、ペルソナの「一か所にいられる時間」から求めます。待てる時間の上限=一か所にいられる時間(ペルソナ)−一回の長さ−次の場所への移動の時間。一回の長さはまだ決まっていないので、この時点では見積もりで置き、後で回せる人数を計算するときに見直します。
      - type: p
        text: 1時間に回す人数の要件は、受付の記録から求めます。1時間に回す人数=去年の一番混む1時間に並び始めた人数×(1+余裕の割合)。余裕の割合は、今年の来場者の見込みを大学の部署に聞いて決めます。
      - type: p
        text: この式には、体験を終えた人数ではなく、並び始めた人数を入れます。終えた人数を使うと、途中で帰った人の分だけ少なく見積もり、去年と同じ列をまたつくることになります。どの数字も、根拠と一緒に表に書きます。根拠が変われば、数字も見直します。
      - type: heading
        text: 「内容が分かった」は、2つの問いで確かめる
      - type: p
        text: 問題が「中身が分からない」ことに関わるなら、「体験の内容が分かったか」をアンケートで4段階で聞き、上の2つを選んだ人の割合を数えます。
      - type: p
        text: ただ、係の前で答えると、気をつかって高めに答える人もいるので、「今日考えたことを、一言で書いてください」という問いも置きます。書いた内容が体験のお題に触れているかを見れば、4段階の答えを裏付けられます。
      - type: p
        text: 合格の割合を決めたら、1時間に回す人数に当てはめて、何人までのつまずきを許すことになるかを計算します。許せる人数=1時間に回す人数×(1−合格の割合)。割合が高すぎると、1人がつまずいただけで不合格になり、説明の問題か、その人だけの事情かを区別できません。低すぎると、多くの人が分からないまま帰っても合格になります。「この人数を超えたら説明を直す」と言える線を、当日の結果を見る前に選びます。
      - type: table
        caption: 要件の表の形(1つの要件を1行に)
        head:
          - 要件
          - 種類
          - 根拠
          - 確かめ方
        rows:
          - - (指標と、しきい値)
            - 必須
            - (問題の一文、ペルソナ、去年の記録のどれから計算したか)
            - (当日、誰が、何を記録するか)
          - - (前提の一覧の項目)
            - 制約
            - (前提を確かめた相手)
            - (本番の前に、何と照らして確かめるか)
          - - (なくても目的に届くが、あると目的に近づくもの)
            - あればうれしい
            - (目的やペルソナのどこにつながるか)
            - (アンケートの自由記述など)
      - type: p
        text: アンケートの問いは、体験の終わりの短い時間で答えられる数に絞り、要件を確かめる問い(内容が分かったか、今日考えたことを一言)と、次の年に向けた問い(良かったところと直してほしいところ)を入れます。問いが多いと、答えずに帰る人が増え、要件を確かめる数が減ります。

  - id: ideas
    step: 3
    heading: 体験の中身と、待つ間の両方で案を出す
    blocks:
      - type: point
        text: 案は、図の全ての箱について出します。目立つ体験の中身だけでなく、問題の一文がある箱の案を必ず含めます。この手順では、案の良し悪しを言わずに数を出します。
      - type: p
        text: 案は、各自が黙って書き出してから持ち寄ります([[ideation#methods|各自で書き出してから持ち寄る]])。書き出す前に箱ごとの問いを用意しておくと、案の偏りが減ります。例えば、次のような問いです。
      - type: list
        items:
          - "「受付して待ってもらう」の箱: 待つ時間そのものを短くできないか。待つ時間を、他のことに使える時間に変えられないか"
          - "「体験してもらう」の箱: 大学で学ぶことのどこを、短い時間で手を動かして試せるか"
          - "「感想を聞く」の箱: 考えたことを、持ち帰れる形にできないか"
          - "場所と人の使い方: 教室の分け方や、他の企画との回り方を変えられないか"
      - type: p
        text: ペルソナも、案の出どころになります。問題を見極める手順で書いた人物像に「この人物は、どの箱で、何に困るか」「一緒に来た人は、その間何をしているか」と問うと、体験の中身だけを考えるときには出ない案が出ます。
      - type: p
        text: 案は、カードに1枚ずつ、案の名前、どの箱の案か、一文の説明、気になる点(費用や人手など)を書きます。気になる点まで書いておくと、次の手順でふるいにかけるのが速くなります。似た案は、まだまとめずに残します。
      - type: p
        text: 出し終えたら、箱ごとにカードの枚数を数えます。問題の一文がある箱の案が少なければ、その箱の問いだけでもう一度書き出します。

  - id: screening
    step: 4
    heading: 必須の要件と制約で、まず案をふるいにかける
    blocks:
      - type: point
        text: 比べる前に、必須の要件と制約を満たさない案を外し、比べる手間を実現できる案だけにかけます。外した案は、理由と一緒に記録に残します([[selection#must|必須の要件でふるいにかける]])。
      - type: p
        text: 案のカードを1枚ずつ、要件の表の「必須」と「制約」の行に照らし、行ごとに「満たす」「満たさない」「分からない」の印を付けます。人手(係が2か所以上に要るか)、費用(材料の見積もりが予算に収まるか)、調整(他の団体との調整が要り、設計会だけでは当日までに決めきれないか)、安全(使う道具が決まりに触れるか)の行で、よく引っかかります。
      - type: p
        text: 「分からない」が付いた案は、外さずに残し、何を調べれば分かるかを書きます。分からないまま外すと、見積もりの誤りで良い案を落とすことがあります。
      - type: p
        text: 外した案の記録には、どの前提で外したかも書きます。当日に入れる部員が増えれば、人手で外した案は候補に戻ります。前提の一覧で「相談すれば変わる」とした前提で外す案は、相談してから外すかを決めます。

  - id: pugh
    step: 4
    heading: 残った案を、ピューの概念選定法で比べる
    blocks:
      - type: point
        text: 残った案を、要件の表から取り出した基準で、箱ごとに比べます。
      - type: p
        text: "[[selection#criteria|ピューの概念選定法]]は、点数を細かく付けずに済むので、見積もりの段階でも比べられます。基準案には、一番手堅い案(去年の企画のように、やり方が分かっているもの)を置きます。"
      - type: p
        text: 体験の中身の案と待つ間の案は役目が違うので、一つの表に並べても比べられません。表は箱ごとにつくり、後で組み合わせます。
      - type: table
        caption: ピューの概念選定法の表の形(基準案に比べて、良ければ+、悪ければ-、同じならS)
        head:
          - 評価の基準
          - 案A
          - 案B
          - 案C
        rows:
          - - (要件の表の行から取り出した基準)
            - +/-/S
            - +/-/S
            - +/-/S
          - - (同じように、要件の行ごとに1行)
            - …
            - …
            - …
          - - 合計
            - (+の数−-の数)
            - (+の数−-の数)
            - (+の数−-の数)
      - type: p
        text: 合計だけでは決めず、どの基準に-が付いたかを見ます。必須の要件から取り出した基準に-があれば、その案は直さない限り選べません。ある案の-を別の案の+で補えるなら、2つを組み合わせた案をつくって表に足し、もう一度比べます。一番良い案を基準案に替えて比べ直すと、残った弱いところが見えます。
      - type: p
        text: 見積もりの感覚で付けた+や-は、表の中で区別できるようにしておきます。何人を回せるか、何分で終わるかは、感覚と計算がずれやすいところです。表だけで決めず、次の手順で計算して確かめます。

  - id: throughput
    label: 工程4と5の間
    heading: 回せる人数を計算し、混んだときの待ち時間を確かめる
    blocks:
      - type: point
        text: 残った案で1時間に何人を回せるかを計算し、要件と比べます。平均で要件を満たしても、来場者がまとまって来ると列ができるので、混んだときの待ち時間も計算します。
      - type: heading
        text: 回せる人数は、一回の人数と回数の掛け算で求める
      - type: table
        caption: 回せる人数の求め方と、入力の出どころ
        head:
          - 項目
          - 求め方
          - 入力の出どころ
        rows:
          - - 一組の人数
            - 案の中身から(全員の手が届く人数など)
            - 案のカード
          - - 同時に組める数
            - 見守る係が目を届かせられる組の数と、机の数の小さいほう
            - 前提の一覧(人手、教室)、IDEF0の機構
          - - 一回の人数
            - 一組の人数×同時に組める数
            - この表
          - - 一回の長さ
            - 案の中身の見積もり
            - 案のカード、要件の表
          - - 入れ替えの時間
            - 前の回が出て、次の回が始められるまで
            - 見積もり(本番の前に試して測る)
          - - 1時間の回数
            - 60分÷(一回の長さ+入れ替えの時間)
            - この表
          - - 1時間に回せる人数
            - 一回の人数×1時間の回数
            - この表
          - - 休憩を入れたとき
            - 一回の人数×(1時間の回数−休憩で休む回数)
            - 前提の一覧(人手の時間帯)
      - type: p
        text: 求めた人数を、要件の表の「1時間に回す人数」と比べます。人手に余裕がなければ全員が持ち場を離れられず、休憩は回を休むことでしか取れないので、休憩を入れたときの人数でも要件を上回るかを必ず確かめます。
      - type: p
        text: 足りなければ、一回の人数を増やすか、一回を短くするかになります。人数を増やすには見守る係が要り、人手の制約に触れます。短くするには中身を削ることになり、「内容が分かった」の要件に触れます。どの要件に触れるかを表で確かめてから選びます。
      - type: heading
        text: 混んだときの待ち時間を、記録の山から計算する
      - type: p
        text: 平均で足りても、来場者は一定の間隔では来ません。学部の説明会が終わった直後のように、まとまって来る時間がありうるので、受付の記録の時間帯ごとの人数と、他の企画の時刻表から、一度に来うる人数を見積もります。
      - type: p
        text: 一度にN人が、ちょうど回が始まった直後に来たとします。最後の人の待ち時間は、およそ(一回の長さ+入れ替えの時間)×(N÷一回の人数。小数は切り上げ)です。この値を、要件の「待てる時間の上限」と比べます。上回るなら、平均では満たせても、混んだときには要件を満たせません。
      - type: p
        text: 上回ったときは、[[case-open-campus#ideas|案を出す手順]]に戻り、待つ間の箱の案から、組み合わせられるものを探します。組み合わせると、待ち時間をどこからどこまで測るかが変わることがあります。そのときは、要件の表の「確かめ方」を書き直します。後の手順で決めたことに合わせて、前の手順でつくった表を書き直すこともあります([[process#loop|工程の行き来]])。

  - id: runsheet
    step: 5
    heading: 当日の一回を、分単位で係ごとに決める
    blocks:
      - type: point
        text: 選んだ案を、当日の動きに落とし込みます。回せる人数の計算に使った一回の長さを当日に守れるように、誰が、いつ、何を言い、何を配るのかまで決めます。
      - type: p
        text: 一回の流れは、来場者がすることが変わるところで区切ります(説明を聞く、手を動かす、発表する、アンケートに答える、など)。区切りごとに、開始から何分までか、来場者がすること、係が言うことと配る物、担当する係を書きます。担当は人の名前ではなく、係の役目で書きます。当日に人が入れ替わっても、表がそのまま使えるようにするためです。
      - type: table
        caption: 一回の流れの表の形(運営の仕様書の中心になる)
        head:
          - 時間
          - やること
          - 担当
          - 使う物
        rows:
          - - (開始から何分まで)
            - (来場者がすることと、係が言うこと)
            - (係の役目)
            - (配る物、使う道具)
          - - (次の区切り)
            - …
            - …
            - …
          - - (入れ替え)
            - (前の回が出て、次の回が始まる)
            - …
            - …
      - type: p
        text: 書けたら、区切りの時間を足して、回せる人数の計算に使った「一回の長さ+入れ替えの時間」に収まるかを確かめます。同じ係が、同じ時刻に2か所に割り当てられていないかも見ます。
      - type: p
        text: 表に書いた時間の他にも、係には仕事があります。受付は回の間も次の回の人を集め、説明の係は次の回の道具をそろえます。係ごとに横の帯で時間を描くと、誰の手が空いているかが見え、休憩をどこに入れるかを決められます。

  - id: rehearsal
    label: 工程5から前へ戻る
    heading: 本番の前に、一回の流れを通しで試す
    blocks:
      - type: point
        text: 本番の前に、来場者に近い人に一回の流れを通しで体験してもらい、区切りごとの時間を測ります。ずれが見つかったら、そのずれを生んだ決定まで戻って直します。
      - type: p
        text: 一回の流れの表は、まだ机の上の見積もりです。次の回の開始時刻を前もって知らせるなら、一回でも時間が押すと、次の回の人がその分だけ待ちます。遅れは回ごとに積み重なり、積み重なった遅れ=一回あたりの押した時間×続いた回数、になります。待てる時間の上限から、混んでいないときの待ち時間を引いた残りを、休憩までに続く回数で割ると、一回あたり何分の押しまで許せるかが分かります。
      - type: heading
        text: 誰に、どう試してもらうか
      - type: p
        text: 体験の中身を知らない人に試してもらいます。部員の友人や、高校生に年が近い1年生に頼みます。中身を知っている部員では、説明が短くても通じてしまい、説明に要る時間を測れません。できれば一回の人数をそろえ、見守る係の人数で目が届くかも確かめます。1人が時計を持ち、表の区切りごとに、予定と実際の時刻を記録します。通しの試しは、直す前と直した後の少なくとも2回行います。
      - type: heading
        text: 試すときに見ること
      - type: list
        items:
          - 説明が予定の時間に収まるか。収まらなければ、どこで聞き返されるか
          - 説明の後、全員の手が動き始めるまでに何分かかるか
          - 初めて会う人どうしが、組になって話し始められるか
          - 手を動かす区切りのうちに、作業が終わるか
          - 発表や感想の区切りが、予定の時間に収まるか
          - アンケートに、予定の時間で答えられるか
          - 次の回の人と、何分で入れ替われるか(入れ替えが延びると、1時間の回数が減る)
      - type: heading
        text: ずれは、それを生んだ決定まで戻って直す
      - type: p
        text: 説明が収まらなければ、説明の仕方(話す量や、図の入ったカードにするか)を直します。作業が終わらなければ、お題の大きさを直します。区切りの時間を延ばして吸収するやり方は、他に直し方がないときだけに使います。
      - type: p
        text: 一回を延ばす直し方を選ぶ前に、[[case-open-campus#throughput|回せる人数の計算]]をやり直します。延ばした長さを表に入れ、休憩を入れたときの人数が要件を上回るかを確かめます。延ばすと1時間の回数が減り、休憩で1回休む影響も大きくなるので、平均では足りても休憩を入れると足りなくなることがあります。
      - type: p
        text: 本番で時間が押したときの決まりも、この手順でつくっておきます。どの区切りを短くして吸収するか、回の終わりの時刻を守るかを決めておかないと、係がその場で判断することになり、回ごとに対応がばらつきます。

  - id: spec
    step: 5
    heading: 仕様書は、係の役目ごとに引ける形にまとめる
    blocks:
      - type: point
        text: 試して直した結果を、運営の仕様書にまとめます。当日の係は、自分の役目の行から、開始何分に何を言い、何を配るかを引きます。なぜそう決めたかも、同じ仕様書からたどれるようにします。
      - type: p
        text: 仕様書は、一回の流れの表(区切りごとの時間、やること、担当、使う物)を中心にし、そのまわりに次のものを添えます。
      - type: list
        items:
          - 係の人数と役目、当番と休憩の時間
          - 順番の回し方(来た人をどう案内し、来ない人がいたらどうするか)
          - 時間が押したときの決まり
          - 使う物の一覧と費用
          - 雨の日の場所と、気分が悪くなった人がいたときの連絡先
          - 受付の記録とアンケートの取り方(要件の表の「確かめ方」の列を、係ごとに分けたもの)
      - type: p
        text: 決めたことの理由も残します。要件の数字の根拠、外した案とその理由、試して直したところです。次の年に部員の数や教室が変わっても、どの決定を見直せばよいかがすぐに分かります([[detailing#output|「なぜこの形か」まで残す]])。
      - type: p
        text: 書けたら、設計に加わっていない部員に読んでもらい、「開始から何分のとき、あなたは何をするか」を聞きます。答えに詰まるところや、人によって答えが分かれるところが、書き足すところです。

  - id: on-day
    label: 本番の日とその後
    heading: 当日に要件を測り、次の年の記録にする
    blocks:
      - type: point
        text: 当日は、要件の表の「確かめ方」の通りに測り、要件を満たせたかを見ます。測った記録は、次の年に問題を確かめるときにも使います。
      - type: p
        text: 受付の係は、並び始めた時刻と各回の開始の時刻を、並び始めた人数・体験を始めた人数・体験を終えた人数と一緒に記録します。並ぶのをやめた人や、のぞいて帰った人も数えます。アンケートは、終わってから集計し、要件の表のしきい値と比べます。比べるしきい値は、前の手順で決めたものから動かしません。満たせない要件があれば、どの手順の決定が原因かをたどり、仕様書に書き足します。
      - type: p
        text: 受付の記録がそろっていれば、次の年は、写真や記憶に頼らず、並び始めた人数・体験を始めた人数・体験を終えた人数から、体験の前と中のどちらで抜けたかを確かめられます。

