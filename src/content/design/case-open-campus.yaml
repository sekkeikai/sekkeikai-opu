title: オープンキャンパスの体験コーナー
en: "Case: Event"
layer: case
order: 1
short: 企画と運営
question: 体験コーナーで、高校生はどこで抜けていくか
summary: 高校生が来るオープンキャンパスの体験コーナー。来場者には当日まで会えないので、去年の記録と大学の部署に確かめた前提をもとに、係が役目ごとに引ける運営の仕様書をつくる。
lead: もし設計会でオープンキャンパスの体験コーナーを設計するなら、次のように進めます。去年の受付の記録で体験の前と途中に抜けた人の割合を分けて求め、1時間に回せる人数と、混んだときの最後の人の待ち時間を式で見積もります。
chapters:
  - id: goal
    heading: "体験を考える前に前提の一覧をつくる"
    blocks:
      - type: point
        text: "来場者には当日まで会えないので、使える時間・教室・人手などを、オープンキャンパスを担当する大学の部署と部員に先に確かめます。"
      - type: cards
        items:
          - title: "目的"
            body: "来場した高校生が、大学で学ぶことを短い時間で体験し、「来てよかった」と思って帰る"
          - title: "誰のため"
            body: "来場する高校生と、付き添う保護者"
          - title: "計画の終わりにできるもの"
            body: "係が自分の役目から、開始何分に何を言い、何を配るかを引ける、運営の仕様書"
          - title: "届いたかの確かめ方"
            body: "待ち時間は受付の記録から、内容が「分かった」と答える人の割合などはアンケートから、当日に出す"
      - type: p
        text: 確かめたことは前提の一覧にし、項目ごとに変えられるかどうかの欄を設けます。項目は次のとおりです。
      - type: list
        items:
          - "開催の時間帯"
          - "教室の数と広さ、机や電源"
          - "費用"
          - "当日に入れる部員の数。「誰が何時から何時まで」で聞き、昼の時間帯だけ人が減るなら、[[case-open-campus#throughput|回せる人数の計算]]ではその時間帯の人数を使う"
          - "使ってはいけない道具や材料の決まり"

  - id: problem
    step: 1
    heading: 体験の前と中のどちらでつまずくかを見極める
    blocks:
      - type: point
        text: 「中身がつまらないから帰る」と「待つ間に帰る」の2つの説明を、受付の記録の数で区別してから、問題を一文にします。
      - type: p
        text: 2つの説明は、どちらもありえます。「楽しくなかった」という声だけを受け取って中身を足すと、一回が長くなり、待ち時間が延びます。
      - type: heading
        text: 時間帯ごとに3つの人数を取り出す
      - type: p
        text: 材料は、去年の体験コーナーの写真、来場者アンケート、受付の記録、手伝った部員の話です。受付の記録からは、並び始めた人数、体験を始めた人数、体験を終えた人数を、時間帯ごとに取り出します。1時間でならすと人がまとまって来た時間が見えなくなるので、時間帯は1時間より短く区切ります。
      - type: p
        text: アンケートは体験を終えた人しか答えないので、並ぶのをやめた人や、のぞいて帰った人の様子は、写真と、部員に「一番混んだとき、列はどこまで伸びた?」と聞いた答えから拾います([[problem-finding#listen|「この前」を聞く]])。去年の記録がなければ、他の団体の企画を当日に見に行くか、高校生に年が近い1年生に、高校のときに大学の企画を回った経験を聞いて代えます。
      - type: heading
        text: 抜けた割合で2つの説明を区別する
      - type: p
        text: 取り出した数から、体験の前で抜けた割合を求めます。体験の前で抜けた割合=(並び始めた人数−体験を始めた人数)÷並び始めた人数。(体験を始めた人数−体験を終えた人数)÷体験を始めた人数は、中身の途中で抜けた割合として別に見ます。前で抜けた割合が大きく、体験を終えた人のアンケートの評価が高ければ、問題は中身より手前にある見込みが高くなります。前で抜けた割合が小さく、途中で抜けた割合が大きいか、終えた人の評価が低ければ、問題は中身にあります。
      - type: p
        text: 記録に体験を始めた人数がない年は、2つを分けられません。並び始めた人数と終えた人数の差を、前と途中を合わせた数として扱います。記録そのものがなければ、手伝った部員の見積もりで代えます。
      - type: heading
        text: 見極めた場面を問題の一文と要件に入れる
      - type: p
        text: 見極めた場面(体験の前か、中か)は、[[problem-finding#statement|問題の一文]]の「どんな場面で」に入れます。想定する来場者の人物像(ペルソナ)には、待てる時間の上限の計算に使う「一か所にいられる時間」を必ず書きます。
      - type: p
        text: 問題が中身にあるなら、「体験の内容が分かったか」をアンケートで4段階で聞き、上の2つを選んだ人の割合を[[requirements#write|要件]]にします。係の前では気をつかって高めに答える人がいるので、「今日考えたことを、一言で書いてください」という問いを置き、書いた内容がお題に触れているかで裏付けます。合格の割合は、許せる人数=1時間に回す人数×(1−合格の割合)が0人にならず、「この人数を超えたら説明を直す」と言える数になるように、当日の結果を見る前に選びます。

  - id: ideas
    step: 3
    heading: 体験の中身と待つ間の両方で案を出す
    blocks:
      - type: p
        text: 案は、体験の中身と、問題の一文に入れた場面の両方について出します([[ideation#methods|案の出し方]])。待つ間の案なら、「待つ時間を、他のことに使える時間に変えられないか」「一緒に来た人は、その間何をしているか」と問います。案のカードには、一組の人数と一回の長さの見積もり、気になる点(費用や人手など)を書き、次のふるいと回せる人数の計算に使います。

  - id: screening
    step: 4
    heading: 案を前提で絞り、比べる要件を数にする
    blocks:
      - type: p
        text: "[[selection#must|必須の要件と制約]]に合わない案を外すときは、人手・費用・他の団体との調整・安全の決まりのどの前提で外したかを書き添えます。当日に入れる部員が増えるなど前提が変われば、その前提で外した案を候補に戻します。体験の中身の案と待つ間の案は役目が違うので、別々に[[selection#criteria|比べて]]から組み合わせます。"
      - type: heading
        text: 比べる要件をペルソナと去年の記録から求める
      - type: p
        text: 待てる時間の上限=一か所にいられる時間(ペルソナ)−一回の長さ−次の場所への移動の時間。一回の長さは案ごとに違うので、案のカードの見積もりを入れ、次の章の表で計算し直すたびに見直します。
      - type: p
        text: 1時間に回す人数=去年の一番混む1時間に並び始めた人数×(1+余裕の割合)。余裕の割合は、今年の来場者の見込みを大学の部署に聞いて決めます。体験を終えた人数を式に入れると、途中で帰った人の分だけ少なく見積もり、去年と同じ列をまたつくることになるので、並び始めた人数を入れます。

  - id: throughput
    label: 工程4と5の間
    heading: 平均で足りても、まとまって来れば列ができる
    blocks:
      - type: point
        text: 残った案ごとに、1時間に回せる人数と、一度に人が来たときの待ち時間を計算し、それぞれ要件と比べます。
      - type: heading
        text: 一回の人数と1時間の回数を掛ける
      - type: table
        caption: 回せる人数の求め方と、入力の出どころ
        head:
          - 項目
          - 求め方
          - 入力の出どころ
        rows:
          - - 一組の人数
            - 案の中身から(全員の手が届く人数など)
            - 案のカード
          - - 同時に組める数
            - 見守る係が目を届かせられる組の数と、机の数の小さいほう
            - 前提の一覧(人手、教室)、受付や説明に回す係の人数
          - - 一回の人数
            - 一組の人数×同時に組める数
            - この表
          - - 一回の長さ
            - 案の中身の見積もり
            - 案のカード、要件の表
          - - 入れ替えの時間
            - 前の回が出て、次の回が始められるまで
            - 見積もり(本番の前に試して測る)
          - - 1時間の回数
            - 60分÷(一回の長さ+入れ替えの時間)
            - この表
          - - 1時間に回せる人数
            - 一回の人数×1時間の回数
            - この表
          - - 休憩を入れたとき
            - 一回の人数×(1時間の回数−休憩で休む回数)
            - 前提の一覧(人手の時間帯)
      - type: p
        text: 求めた人数を、要件の表の「1時間に回す人数」と比べます。人手に余裕がなければ全員が持ち場を離れられず、休憩は回を休むことでしか取れないので、休憩を入れたときの人数でも要件を上回るかを必ず確かめます。
      - type: p
        text: 足りなければ、一回の人数を増やすか、一回を短くするかになります。人数を増やすには見守る係が要り、人手の制約に触れます。短くするには中身を削ることになり、「内容が分かった」の要件に触れます。どの要件に触れるかを表で確かめてから選びます。
      - type: heading
        text: 一度に来る人数から待ち時間を計算する
      - type: p
        text: 平均で足りても、来場者は一定の間隔では来ません。学部の説明会が終わった直後のように、まとまって来る時間がありうるので、受付の記録の時間帯ごとの人数と、他の企画の時刻表から、一度に来うる人数を見積もります。
      - type: p
        text: 一度にN人が、ちょうど回が始まった直後に来たとします。最後の人の待ち時間は、およそ(一回の長さ+入れ替えの時間)×(N÷一回の人数。小数は切り上げ)です。この値を、要件の「待てる時間の上限」と比べます。上回るなら、平均では満たせても、混んだときには要件を満たせません。
      - type: p
        text: 上回ったときは、[[case-open-campus#ideas|案を出す手順]]に戻り、待つ間の案から、組み合わせられるものを探します。組み合わせると、待ち時間をどこからどこまで測るかが変わることがあり、そのときは要件の表の「確かめ方」を書き直します([[process#loop|工程の行き来]])。
      - type: heading
        text: 一回あたり何分の押しまで許せるかを出す
      - type: p
        text: 次の回の開始時刻を前もって知らせるなら、一回でも時間が押すと、次の回の人がその分だけ待ちます。遅れは回ごとに積み重なり、積み重なった遅れ=一回あたりの押した時間×続いた回数、になります。待てる時間の上限から、混んでいないときの待ち時間を引いた残りを、休憩までに続く回数で割ると、一回あたり何分の押しまで許せるかが分かります。

  - id: runsheet
    label: 工程5と本番の日
    heading: 流れの表と通しの試しで一回の長さを守る
    blocks:
      - type: p
        text: 一回の流れは、来場者がすることが変わるところ(説明を聞く、手を動かす、発表する、アンケートに答える、など)で区切り、区切りごとに開始から何分までか、やること、担当(人の名前ではなく係の役目)、使う物を表にします。区切りの時間を足して、回せる人数の計算に使った「一回の長さ+入れ替えの時間」に収まるかを確かめます。
      - type: p
        text: 本番の前に、中身を知らない人(部員の友人や、高校生に年が近い1年生)に、直す前と後の少なくとも2回、通しで体験してもらい、区切りごとに予定と実際の時刻を記録します。ずれは説明の仕方やお題の大きさのように、それを生んだ決定まで戻って直し、一回を延ばすときは[[case-open-campus#throughput|回せる人数の計算]]をやり直して、休憩を入れたときの人数が要件を上回るかを確かめます。
      - type: p
        text: 当日は、受付の係が次の欄をつけ、前に決めたしきい値と、動かさずに比べます。
      - type: list
        items:
          - "並び始めた時刻と、各回の開始の時刻"
          - "並び始めた人数"
          - "体験を始めた人数"
          - "体験を終えた人数"
          - "並ぶのをやめた人の数"
      - type: p
        text: この記録は仕様書に残し、次の年に体験の前と中のどちらで抜けたかを確かめる材料にします。仕様書には、要件の数字ごとの出どころ(記録か見積もりか、前と途中を分けた数か)と根拠、外した案の理由を書き([[detailing#output|「なぜこの形か」まで残す]])、根拠が変われば数字を見直します。

