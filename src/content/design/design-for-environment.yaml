title: 環境と設計
en: Design for Environment
layer: topic
order: 2
short: 環境から考える
question: 製品の環境への影響は、いつ決まるのか
summary: 製品は、材料を採るところから捨てるまでの一生を通して環境に影響する。その影響の多くは、形と材料を決める設計の段階で決まる。長く使え、直せ、分けて資源に戻せることが、法律でも設計の要件になりつつある。
lead: 一本のペットボトル、一台のスマートフォン、一本のプラスチックのスプーン。どれも、材料を採り、つくり、運び、使い、捨てるまでの一生を通して、環境に影響を与えます。環境と設計は、その一生全体を見渡して、影響を小さくする形と材料を、つくる前に選ぶ分野です。
parent: process
chapters:
  - id: lifecycle
    heading: 環境への影響の多くは、設計の段階で決まる
    blocks:
      - type: question
        text: プラスチックのスプーン1本が環境に与える影響は、いつ決まるのでしょう?
        answer: 捨てるときだけではありません。材料を採る、つくる、運ぶ、使う、捨てる・リサイクルする、の全ての段階で影響が出ます。そして、何の材料で、どれだけの量で、どんな形でつくるかは、設計の段階で決まっています。
      - type: point
        text: 製品は、一生の全ての段階で環境に影響します。その影響の8割以上は設計の段階で決まる、という見積もりが欧州でよく引用されます。
      - type: p
        text: |-
          欧州委員会の冊子「Ecodesign Your Future」(2012年)は、全ての製品は、原材料や天然資源の利用、製造、包装、輸送、廃棄、リサイクルまで、ゆりかごから墓場までの一生を通して環境に影響すると書いています。そして、製品の環境への影響の80%以上は、設計の段階で決まるとしています。
        note: |-
          [European Commission, "Ecodesign Your Future", 2012](https://build-up.ec.europa.eu/sites/default/files/content/Brochure-Ecodesign-Your-Future-15022012.pdf)。
      - type: p
        text: |-
          [[process|設計のプロセス]]で言えば、環境への配慮は、形を詰める最後の工程で付け足すものではありません。[[requirements|要件を定める工程]]で「何年使えるか」「直せるか」「分けて捨てられるか」を要件に書いておくと、案を広げる工程から、それを満たす案を探せます。トップページの[直すなら、つくる前が一番安い](/#upstream)と同じ理由です。

  - id: law
    heading: 長く使え、直せることが、法律で求められ始めた
    blocks:
      - type: point
        text: 欧州連合は2024年、製品の長持ち、修理のしやすさ、リサイクルのしやすさなどを、設計の要件として定められる規則をつくりました。
      - type: example
        kind: real
        title: 欧州連合のエコデザイン規則
        text: |-
          2024年7月18日、欧州連合の「持続可能な製品のためのエコデザイン規則」が発効しました。この規則では、食品や医薬品、自動車などを除く、ほとんど全ての種類の製品に、要件を定められます。要件には、長持ちすること、再使用できること、性能を高められること、修理できることのほか、リサイクルされた材料の割合や、製品が環境に与える影響(フットプリント)などが含まれます。製品の環境の情報を記録する「デジタル製品パスポート」も設けられました。売れ残った衣類と靴を捨てることも、2026年7月19日から禁止されました(小さな会社は対象外)。
        source: '[欧州議会 立法監視室(OEIL)による規則の要約](https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1785880)による。'
      - type: p
        text: |-
          規則は、製品が早く使えなくなるように仕向ける「計画的陳腐化」と呼ばれるやり方に、エコデザインの要件で対抗することも掲げています。修理できる形か、ねじを外せば電池を交換できるかは、つくった後では変えられません。設計の段階での判断が、製品の寿命を決めます。

  - id: circular
    heading: 捨てる前提から、資源を巡らせる前提へ
    blocks:
      - type: point
        text: 採って、つくって、捨てる流れを、資源を巡らせる流れに変える考え方を、循環型経済(サーキュラーエコノミー)と呼びます。その原則は、どれも設計から始まります。
      - type: p
        text: |-
          今の経済は、地球から材料を採って製品をつくり、使い終わると捨てる流れになっています。捨てる前提でつくられたものは、捨てるしかありません。エレン・マッカーサー財団の説明では、循環型経済は、設計によって進む3つの原則に基づいています。廃棄物と汚染をなくすこと、製品と材料をできるだけ高い価値のまま巡らせること、自然を再生することです。
        note: |-
          [Ellen MacArthur Foundation, "What is a circular economy?"](https://www.ellenmacarthurfoundation.org/topics/circular-economy-introduction/overview)。
      - type: example
        kind: real
        title: プラスチック製品の設計指針
        text: |-
          日本の「プラスチックに係る資源循環の促進等に関する法律」に基づく「プラスチック使用製品設計指針」は、プラスチックを使う製品の製造事業者などが、設計で取り組むべきことを定めています。使う材料を減らす、包装を簡単にする、部品を交換・修理できる構造にして長く使えるようにする、使う素材の種類を減らす、部品ごとに分解・分別しやすくする、再生プラスチックを使う、などです。指針に沿った特に優れた設計は、国が認定します。
        source: '[環境省「プラスチック使用製品設計指針と認定制度」](https://plastic-circulation.env.go.jp/pro/seido)による。'
      - type: p
        text: |-
          同じ法律は、コンビニエンスストアなどで渡すフォーク、スプーン、ストローといった製品の使い方の見直しも求めています。有償にする、ポイントを還元する、要るかどうかを客に確かめる、薄く軽くする、木や紙などの素材に替える、といった方法です。ストローが要らない飲み口の付いた蓋に変えた例も紹介されています。客に要るかを確かめることは、[[behavioral-design|行動のデザイン]]で紹介した、選び方の設計の一つです。
        note: |-
          [環境省「特定プラスチック使用製品の使用の合理化」](https://plastic-circulation.env.go.jp/pro/gorika)。

  - id: tradeoff
    heading: 環境への配慮は、他の要件と比べて選ぶ
    blocks:
      - type: point
        text: 環境への配慮は、使いやすさ、費用、安全などの他の要件とぶつかることがあります。どこまでを必須にするかを、根拠をもって決めます。
      - type: p
        text: |-
          材料を減らして軽くすると、丈夫さが足りなくなるかもしれません。修理できる構造にすると、部品が増えて費用が上がるかもしれません。環境に良いと思われる案が、一生を通して見ると、かえって影響が大きいこともありえます。だから、製品の一生のどの段階で、どんな影響が出るかを比べてから決めます。この判断は、[[selection|比べて選ぶ工程]]で、目的どうしがぶつかる中で案を選ぶのと同じです。

