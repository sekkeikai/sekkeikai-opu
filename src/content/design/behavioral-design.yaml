title: 行動のデザイン
en: Behavioral Design
layer: topic
order: 2
short: 選び方の設計
question: 選ぶのは人なのに、なぜ設計が結果を変えるのか
summary: 選択肢の並べ方、初めから選ばれている選択肢、伝え方は、人の選び方を変える。人が選ぶ場面を設計するとき、設計者は中立ではいられない。人のためにも、人をだますためにも使えるので、選ぶ自由を残すことが問われる。
lead: 同じ中身でも、伝え方や選択肢の並べ方で、人の選び方は変わります。心理学と経済学をつなぐ行動経済学は、人がいつも損得を計算して選んでいるわけではないことを明らかにしてきました。行動のデザインは、その知見を、人が選ぶ場面の設計に生かす分野です。ヒューマンインターフェースの「人から考える」見方を、人の判断にまで広げたものです。
parent: human-interface
chapters:
  - id: what
    heading: 設計した人は、選び方にも影響している
    blocks:
      - type: question
        text: 申し込みの画面で、「お知らせのメールを受け取る」に初めからチェックが入っていたら、外しますか?
        answer: 外さずに進む人もいれば、外す人もいます。何もしなければそのまま決まる選択肢を「初期値(デフォルト)」と呼びます。初期値をどちらにするかは画面を設計する人が決めており、その決め方で、全体の結果が大きく変わることがあります。下の年金の例が、その大きさを示しています。
      - type: point
        text: 選択肢の並べ方、初期値、伝え方は、人の選び方を変えます。人が選ぶ場面を設計するとき、どの設計を選んでも、何かの方向へ人を導いています。
      - type: p
        text: |-
          2017年のノーベル経済学賞は、行動経済学への貢献で、リチャード・セイラーに贈られました。人の判断には、考える力に限りがあること、他人や公平さを気にかけること、目先の誘惑に負けやすいことといった、人らしい性質が表れます。セイラーは、こうした性質を経済の分析に取り入れました。そして、年金のための貯蓄などで人がより良く選べるように、そっと後押しする「ナッジ」という言葉をつくりました。
        note: |-
          [The Nobel Prize, "Press release: The Prize in Economic Sciences 2017"](https://www.nobelprize.org/prizes/economic-sciences/2017/press-release/)。
      - type: p
        text: |-
          セイラーとキャス・サンスティーンは、公共の機関も民間の会社も、選ぶ自由を残したまま、人を良い方向へ後押しするべきだと論じました。多くの場合、変えるのは単純なことです。その一つが、何もしなければ決まる選択肢、つまり初期値をどれにするかです。
        note: |-
          [The Nobel Prize, "Popular science background: Integrating economics with psychology", 2017](https://www.nobelprize.org/prizes/economic-sciences/2017/popular-information/)。

  - id: default
    heading: 初期値を変えるだけで、多くの人の結果が変わる
    blocks:
      - type: point
        text: 初めから選ばれている選択肢は、多くの人がそのまま受け入れます。初期値を変えると、選ぶ自由は同じでも、全体の結果が大きく変わります。
      - type: example
        kind: real
        title: 年金への加入を、初期値にする
        text: |-
          英国は2012年10月から、条件を満たす従業員を、会社が職場の年金に自動で加入させる決まりを段階的に始めました。まず従業員が250人を超える大きな会社から始め、2017年までには、全ての会社で、新しく雇われた条件を満たす人が自動で加入するようになりました。加入をやめたい人は、やめることもできます。英国の従業員のうち、職場の年金に入っている人の割合は、2012年の47%から2021年の79%に上がりました。
        source: '[英国 雇用年金省「Workplace pension participation and savings trends of eligible employees: 2009 to 2022」](https://www.gov.uk/government/statistics/workplace-pension-participation-and-savings-trends-2009-to-2022/workplace-pension-participation-and-savings-trends-of-eligible-employees-2009-to-2022)と[「Ten years of Automatic Enrolment in Workplace Pensions」](https://www.gov.uk/government/statistics/ten-years-of-automatic-enrolment-in-workplace-pensions/ten-years-of-automatic-enrolment-in-workplace-pensions-statistics-and-analysis)による。'
      - type: p
        text: |-
          加入するかどうかを選べることは、前と変わっていません。変わったのは、何もしなかった人がどちらに決まるかだけです。それでも結果がここまで変わったことは、初期値の力の大きさを示しています。
      - type: p
        text: |-
          日本でも、環境省が2017年4月に「日本版ナッジ・ユニット」を発足させ、行動科学の知見を政策に生かす取り組みを始めました。伝え方の設計で検診を受ける人を増やした例を、[[data-analysis#why|データ分析のページ]]で紹介しています。
        note: |-
          [環境省「日本版ナッジ・ユニット(BEST)について」](https://www.env.go.jp/earth/ondanka/nudge.html)。

  - id: dark
    heading: 同じ技術は、人をだますことにも使える
    blocks:
      - type: point
        text: 人の選び方を変える技術は、使う人の利益に反する方向にも使えます。日本では、注文の直前の画面に何を表示するかが、法律で決められるようになりました。
      - type: p
        text: |-
          使う人が望まない行動をとるように仕向ける画面の設計は、「ダークパターン」や「ディセプティブ・パターン(欺く設計)」と呼ばれます。デザイナーのハリー・ブリグナルは2010年から、こうした設計の例を集めて公開し、知らせる活動を続けています。
        note: |-
          [H. Brignull, "Deceptive Patterns"](https://www.deceptive.design/)。
      - type: example
        kind: real
        title: 注文の直前の画面に、表示の義務
        text: |-
          日本では2022年6月1日から、改正された特定商取引法により、注文を確定する直前の「最終確認画面」に、分量、価格、支払いの時期と方法、引き渡しの時期、申し込みの期間、申し込みの撤回や解約のことを表示することが義務になりました。表示しない場合や、誤認させる表示をする場合は、法律違反になります。画面の設計の一部が、法律で決められたのです。
        source: '[消費者庁「通販事業者の皆さんへ」](https://www.caa.go.jp/policies/policy/consumer_transaction/amendment/2021/notice02/index.html)と[事業者向けのチラシ「通信販売における“最終確認画面”について」](https://www.no-trouble.caa.go.jp/pdf/20230628ac01.pdf)による。'

  - id: freedom
    heading: 選ぶ自由を残し、後から知っても納得できる形にする
    blocks:
      - type: point
        text: 行動のデザインでは、何を後押しするかと同時に、選ぶ自由を残しているか、使う人が後から知って納得できるかを問います。
      - type: p
        text: |-
          ナッジとダークパターンは、使う技術がよく似ています。違いは、誰の利益のために使うのかと、使う人が選び直せるかにあります。セイラーとサンスティーンの考え方でも、後押しは、選ぶ自由を残すことが前提でした。
      - type: p
        text: |-
          設計の工程で言えば、初期値や伝え方を決めることは、[[requirements|要件]]を満たすための案の一つです。「使う人が自分の意思で選び直せる」ことも、要件に書いておけます。[[ai|人工知能]]が人に代わって提案や判断をする場面が増えるほど、どこまで後押しし、どこで本人に選ばせるかを決める設計は、大切になっていきます。

