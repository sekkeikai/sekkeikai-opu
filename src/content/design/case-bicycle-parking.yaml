title: 設備
en: "Case: Facility"
layer: case
order: 4
short: 物と場所の設計
question: ラックを増やす前に、何を数えるか
summary: 大学の駐輪場を例に、詰まる場所と倒れる理由を数えて確かめ、支える部品にかかる力を見積もり、実物大の模型で試して仕様書にするまでの手順を示す。
lead: 例えば、設計会で大学の駐輪場を使いやすくするとしましょう。目指すのは、朝に早く停められ、帰りに出しやすく、風で倒れない駐輪場です。台数が足りなく見えても、ラックを増やす前に、どこで詰まり、なぜ倒れるかを数えて確かめます。数え方、要件への書き直し方、案の比べ方、支える部品にかかる力の見積もり方、実物大の模型での試し方を、進める順に計画として示します。
chapters:
  - id: goal
    heading: "目指すのは、早く停められ、出しやすく、倒れない駐輪場"
    blocks:
      - type: point
        text: "この設計の目的は、大学の駐輪場を、朝に早く停められ、帰りに出しやすく、風で倒れない場所にすることです。計画の終わりには、寸法と強さを理由と一緒に書いた仕様書と、模型の試験の計画ができます。"
      - type: cards
        items:
          - title: "目的"
            body: "朝に早く停められ、帰りに出しやすく、風で倒れない駐輪場にする"
          - title: "誰のため"
            body: "自転車で通う学生と教職員(電動アシストやかごの大きい自転車の人も)"
          - title: "計画の終わりにできるもの"
            body: "仕様書(つくる人に渡す、配置・寸法・強さとその確かめ方を決めた文書)と、模型の試験の計画。設計会が扱うのはここまで"
          - title: "届いたかの確かめ方"
            body: "数えて確かめる要件(停めるのにかかる時間、倒れる台数など)。何を数えるかは、要件を決める手順で決める"
      - type: p
        text: "「使いやすく」は、まだ広い言い方です。[[case-bicycle-parking#reading|問題の一文]]で「何が使いにくさの原因か」が、[[case-bicycle-parking#requirements|要件]]で「どこまで直せば届いたか」が決まります。ラックを増やすことは、目的に近づく手段の候補の一つです。"

  - id: overview
    heading: 数えて、要件にし、力を見積もり、試してから仕様書にする
    blocks:
      - type: point
        text: この計画で一番大事な手順は3つです。ラックを増やすかを決める前に数えること、支える部品の強さを力の見積もりから決めること、注文する前に実物大の模型で試すことです。
      - type: list
        items:
          - "**数える**: 原因の候補ごとに確かめる数と判断の目安を先に決め、朝の到着・帰りの出しにくさ・風の翌朝・動かない自転車を数え、要る台数を計算して問題を一文にする"
          - "**要件にする**: 駐輪場の仕事をIDEF0で描き、問題の一文を数で確かめられる要件に書き直す"
          - "**選ぶ**: 4つの方向で案を出し、必須の要件でふるいにかけ、ピューの概念選定法で比べる"
          - "**寸法と力を決める**: ますと通路の寸法から配置を計算し、支える部品にかかる力、固定の仕方、鋼管の断面、公差を順に決める"
          - "**試してまとめる**: 実物大の模型で試し、合わない数字を直してから、数字ごとに理由を書いた仕様書にする"

  - id: what-to-count
    step: 1
    heading: 何を、いつ数えるかを、原因の候補から決める
    blocks:
      - type: point
        text: 「ラックが足りない」は、原因の候補の一つです。到着の集中、通路と並び方、風、動かない自転車も候補に挙げ、それぞれを確かめられる数と判断の目安を、数える前に決めます。何を数えるかで、見える原因が変わるからです。
      - type: question
        text: 満車に見える駐輪場は、本当に台数が足りないのでしょうか。
        answer: 満車に見えるのは、入口に近い列だけかもしれません。奥の列の空きと、使われていない自転車の数を数えて初めて、本当に足りない台数が分かります。
      - type: p
        text: 困りごとは、利用者の言葉では「停める場所がない」「朝は出しにくい」「よく倒れている」のように出てきます。ここからすぐ「ラックを増やす」に進むと、他の原因を確かめないまま、一番費用のかかる案を選ぶことになります。そこで、原因の候補ごとに、どの数を見れば確かめられるか、その数がどうなら何を考えるかを、先に表にします。ます(自転車1台分の区画)の数は、駐輪場の図面と現地で確かめておきます。
      - type: table
        caption: 原因の候補と、確かめる数と、判断の目安の形(目安の値は数える前に決める)
        head:
          - 原因の候補
          - 確かめる数
          - 判断の目安の形
          - そうなら考える方向
        rows:
          - - 台数が足りない
            - 一番多いときの台数(ますの中+ますの外)、動かない自転車の台数、ますの数
            - 要る台数(問題を一文にする手順の式)が、ますの数を超えるか
            - ますを増やす
          - - 到着が短い時間に集まる
            - 10分ごとに増える台数
            - 朝に着く台数のうち、決めた割合以上が、1限前の決めた時間に集まるか
            - 空きを早く見つけられるようにする
          - - 通路と並び方が悪い
            - 出すまでの秒数、動かした隣の台数
            - 出すときに隣を動かす人の割合が、決めた割合を超えるか
            - 配置を引き直す
          - - 風で列ごと倒れる
            - 倒れた台数、その列の位置、倒れた向き
            - 倒れた自転車が、風の当たる外周の列や、同じ向きに偏るか
            - 支え方を変える
          - - 動かない自転車が場所をとる
            - 2週間たっても札が残る台数
            - 札の残る台数が、ますの数の決めた割合を超えるか
            - 決まりを決めて撤去する
      - type: p
        text: 判断の目安の値を数える前に決めておくのは、数えた後で都合の良い読み方をしないためです。数を見てから基準を決めると、最初に思いつく「ラックが足りない」に合う読み方を選びがちです。目安の値は、大学の担当の部署と話して決め、決めた日と理由を記録に残します。
      - type: p
        text: この手順でできるのは、原因の候補・確かめる数・判断の目安を並べた表と、数える日と時刻の予定です。次の手順では、この表の「確かめる数」の列だけを数えます。

  - id: counting
    step: 1
    heading: 朝の到着、帰りの出しにくさ、風の翌朝、動かない自転車を数える
    blocks:
      - type: point
        text: 数える場面は4つです。朝の到着は列ごとに10分おき、帰りは出すまでの秒数と動かした隣の台数、風の強い日の翌朝は倒れた位置と向き、動かない自転車は荷札で確かめます。条件の違う日に繰り返して数えます。
      - type: heading
        text: "朝: 列ごとに、10分おきに数える"
      - type: p
        text: 授業のある日の朝、1限が始まるまでの1時間(例えば8時から9時)、10分ごとに列ごとの台数を数えます(同じ場所を決まった間隔で数える、定点観測)。合計だけでなく列ごとに数えるのは、「入口近くは満車、奥は空き」という偏りを見るためです。10分おきの数を並べると台数の増え方が分かり、どの時間に到着が集まるかが見えます。満車になると、ますの中の台数はますの数を超えないので、それだけでは来た台数を数えられません。そこで、ますの外(通路や周りの歩道など)に停めた台数も、同じ時刻に数えます。何人かについては、着いてから立ち去るまでの秒数も測ります。
      - type: p
        text: 数える日には、1限の授業が多い曜日、雨の日、学期の初めと半ばを含めます。雨の日は自転車で来る人が減るかもしれないので、晴れの日と分けて記録します。学期の初めと半ばでも台数が変わるかもしれないので、両方で数えます。一番多いときの台数(ますの中とますの外の合計)は、これらの日のうち最も多い日の値を使います。その時刻には、停まっている自転車の種類(電動アシスト、チャイルドシート付き、太いタイヤ)ごとの台数も数えます。
      - type: heading
        text: "帰り: 出すまでの秒数と、動かした隣の台数"
      - type: p
        text: 帰りの時間には、自転車の前に立ってから通路に出すまでの秒数と、その間に隣の自転車を何台動かしたかを記録します。朝は「停めにくさ」が、帰りは「出しにくさ」と「探しにくさ」が見えます。自分の自転車を探して列を行き来する人がいれば、探した時間も測ります。
      - type: heading
        text: "風の強い日の翌朝: 倒れた位置と向き"
      - type: p
        text: 風の強い日の翌朝には、倒れた自転車の位置と倒れた向きを駐輪場の図に書き込み、写真にも残します。倒れた向きがそろっていれば、風で倒れたと考えられます。その日の風向きと最大風速は、気象庁の過去の記録で調べ、図と並べます。写真には、人の顔や自転車の防犯登録の番号が写らないようにします。
        note: 気象庁「[過去の気象データ検索](https://www.data.jma.go.jp/stats/etrn/index.php)」。観測地点ごとに、日ごとの最大風速・最大瞬間風速とその風向を調べられる。
      - type: heading
        text: "動かない自転車: 荷札を付けて2週間待つ"
      - type: p
        text: 動かない自転車は、大学の担当の部署と相談したうえで、荷札を付けて確かめます。2週間たっても札がそのままなら、その自転車は使われていないと考えられます。この台数は、朝の台数から引きます。動かない自転車も停まっている台数に入るので、引かなければ、要る台数を多く見積もります。
      - type: p
        text: この手順でできるのは、日ごと・列ごと・10分ごとの台数とますの外の台数の表、停める秒数と出す秒数の記録、倒れた位置を書き込んだ図、札の残った台数です。数えた日の天気と授業の有無も、同じ表に書いておきます。

  - id: reading
    step: 1
    heading: 数から要る台数を計算し、問題を一文にする
    blocks:
      - type: point
        text: 要る台数は、一番多いときの台数(ますの中+ますの外)から動かない自転車を引き、余裕を足した数です。これをますの数と比べ、表の目安に照らして原因を絞ってから、問題を一文に書きます。
      - type: p
        text: 要る台数は、次の式で計算します。要る台数=一番多いときの台数(ますの中+ますの外)−動かない自転車の台数+余裕。一番多いときの台数は、朝の定点観測で数えた、ますの中とますの外の台数の合計の最大の値です。満車ではますの中の台数がますの数で頭打ちになるので、ますの外の台数を足さないと、要る台数を少なく見積もります。動かない自転車の台数は札の残った台数です。余裕は、数えた日ごとのばらつきや、翌年度の学生の増減に備える分で、一番多いときの台数に対する割合として、担当の部署と決めます。
      - type: p
        text: 要る台数がますの数を超えるなら、ますを増やす方向も候補に残します。超えないなら、満車に見える理由は台数の不足以外にあるので、列ごとの台数で入口近くと奥の偏りを、10分ごとの台数で到着の集中を確かめます。どちらの場合も、表の目安を超えた原因の候補は全て残します。目安を超えた候補が1つもなければ、数える場面が足りないと考え、数え方の表に戻ります。
      - type: p
        text: 問題の一文は、「誰が、いつ、どこで、何に困り、それがどれだけか」を入れて書きます。「どれだけか」には、数えた値を入れます。一文には、原因と困りごとだけを書き、解き方(「ラックを増やす」など)は入れません。解き方を書くと、その解き方以外の案が出にくくなるからです。原因が2つ以上残ったら、一文を原因ごとに分けて並べます。
      - type: p
        text: この手順でできるのは、要る台数の計算と、目安を超えた原因の候補と、問題の一文です。一文の言葉が、次の手順で要件の一つずつに書き直されます。

  - id: function
    label: 機能を描く
    heading: 駐輪場の仕事をIDEF0で描き、変えられるものを分ける
    blocks:
      - type: point
        text: 要件にする前に、駐輪場がする仕事を機能の図にします。図にすると、設計では変えられないもの(授業の時間割)と、変えられるもの(ラックと通路、空きの探しやすさ)が分かれます。
      - type: p
        text: IDEF0は、機能を箱で表し、左から入る入力、右へ出る出力、上から入る制御(決まりや条件)、下から入る機構(人や道具)を矢印で描く図です。
      - type: idef0
        title: 「自転車を停めて、また出す」をIDEF0で描く
        caption: 到着の時刻は、上から入る制御「授業の時間割」で決まり、駐輪場の形では変えられない。変えられるのは、下から入る機構「ラックと通路」と、3つの箱それぞれのしやすさ。
        function: 自転車を停めて、また出す
        inputs:
          - 到着した自転車
        controls:
          - 授業の時間割
          - 大学の駐輪の決まり
        outputs:
          - 出された自転車
          - 残された自転車
        mechanisms:
          - 利用者
          - ラックと通路
          - 大学の管理の係
        steps:
          - name: 空きますを探す
            output: 見つけた空きます
          - name: 停めて鍵をかける
            output: 停まった自転車
          - name: 自分の自転車を出す
            output: 出された自転車
      - type: p
        text: 図から2つのことが見えます。出力に「残された自転車」があるので、動かない自転車をどう扱うかも駐輪場の仕事に含まれます。最初の箱「空きますを探す」を機構で支えるのは、利用者の目だけです。この箱のしやすさを要件に入れると、案の幅が配置や表示に広がります。
      - type: p
        text: 問題の一文の原因が、どの箱で起きているかを図に書き込みます。原因が制御(時間割)にあるなら、駐輪場の側では、その影響を受けにくくする案を考えます。原因が機構や箱のしやすさにあるなら、そこが直接の設計の対象です。

  - id: requirements
    step: 2
    heading: 問題の一文を、数で確かめられる要件に書き直す
    blocks:
      - type: point
        text: 問題の一文の言葉を一つずつ、停める時間・出しやすさ・倒れにくさ・停められる自転車の種類の要件に書き直します。安全に関わる要件は「必須」に入れ、確かめ方まで決めます。
      - type: p
        text: 書き直すのは、問題の一文のままでは、案がそれを解けるかを確かめられないからです。例えば「時間がかかる」は「着いてから決めた秒数以内に停められる」に、「出しにくい」は「隣の自転車を動かさずに出せる」に、「まとめて倒れる」は「1台が倒れても、隣を巻き込まない」に書き直します。数の目標は、数えた今の値を出発点にし、どこまで縮めれば困りごとが消えるかを、担当の部署や利用者と話して決めます。
      - type: p
        text: 要件は3種類に分けます。「必須」は選ぶ案が必ず満たす要件、「制約」は費用や工事の日程のように守るべき条件、「あればうれしい」は満たせば喜ばれる要件です。確かめ方まで書くのは、誰が何で測れば満たしたといえるかを、案を選ぶ前に決めておくためです。
      - type: table
        caption: 要件の書き方の形(〔 〕の値は、数えた値を基に決める)
        head:
          - 要件の形
          - 種類の目安
          - 確かめ方
        rows:
          - - 朝の一番混む時間に、着いてから〔目標の秒数〕以内に停められる
            - 必須
            - 着いてから立ち去るまでを、ストップウォッチで測る
          - - 要る台数(前の手順の式)以上のますがある
            - 必須
            - 要る台数と、ますの数を比べる
          - - 隣の自転車を動かさずに出せる
            - 必須
            - 出すときに隣に触れた回数を数える
          - - 1台が倒れても、隣を巻き込まない
            - 必須(安全)
            - 端の1台を倒し、何台倒れるかを見る
          - - 支える部品の上端に横から〔力の値〕がかかっても、変形が残らない
            - 必須(安全)
            - 計算と、メーカーの強さの試験の記録で確かめる
          - - 太いタイヤや電動アシストの自転車も停められる
            - 必須
            - 形の違う自転車を停めてみる
          - - 主な通路は〔幅〕以上、それ以外の通路は〔幅〕以上
            - 制約
            - 図面と現地を巻き尺で測る
          - - 費用は、大学が出せる予算の範囲に収める
            - 制約
            - 見積もりを確かめる
          - - 授業期間中に駐輪場を閉めない
            - 制約
            - 工事の日程を確かめる
          - - 帰りに、自分の自転車を〔目標の秒数〕以内に見つけられる
            - あればうれしい
            - 出口で、探した時間を測る
      - type: p
        text: 通路の幅を決めるときは、自治体の基準を参考にします。例えば横浜市は、東戸塚駅の駐輪場を再整備するときの基準の案で、自転車の通路の幅の目安を示しています(詳しい幅は市との協議で決めます)。主な通路は、入口から奥まで人と自転車が一番多く通る通路です。
        note: 横浜市「[公共用自転車駐車場整備運営基準](https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/kotsu/bycycle/bicycle-parking/saiseibi/higashitotsuka.files/03.pdf)」(東戸塚駅の駐輪場の再整備)。自転車の通路の幅の目安は、主線通路1.5m、支線通路1.3m。
      - type: p
        text: 停められる自転車の種類を要件に入れるのは、自転車の形が多様になっているからです。国土交通省のガイドラインは、タイヤ幅の広い自転車が既存のラックに入らないこと、後ろの座席が高いチャイルドシート付きの自転車が二段式ラックの上段を使えないことを、駐輪場の課題に挙げています。
        note: 国土交通省 都市局「[自転車等駐車場の整備のあり方に関するガイドライン（第3版）](https://www.mlit.go.jp/toshi/content/001880113.pdf)」2025年、116ページ。二段式ラックの上段には重さの制限があることも挙げている。
      - type: p
        text: 安全の要件2つは、確かめ方が違います。「1台が倒れても、隣を巻き込まない」は実物大の模型で、「横からの力で変形が残らない」は計算とメーカーの強さの試験の記録で確かめます。力の値は、[[case-bicycle-parking#load|力を見積もる手順]]で決めます。
      - type: p
        text: 書き終えたら、目的の「早く停められ」「出しやすく」「倒れない」のそれぞれに、対応する要件があるかを確かめます。対応する要件のない言葉があれば、その目的に届いたかを確かめる手段がないので、要件を足します。この手順でできる要件の表が、次の案の比べ方の基準になります。

  - id: ideas
    step: 3
    heading: ラックの他に、配置・決まり・情報の案も並べる
    blocks:
      - type: point
        text: 要件が決めているのは、停める時間・出しやすさ・倒れにくさで、手段は自由です。ラックを増やす案の他に、配置・決まり・情報を変える案も並べます。比べる相手がいて初めて、選ぶ理由が言えます。
      - type: p
        text: 案を出す前に、配置・ラック・決まりと運用・情報の4つの方向を決めておきます。方向ごとに5分ずつ、各自が黙って書き出すと、思いつきやすいラックの案だけに偏りません。4つの方向は、それぞれ次のものを変える案です。
      - type: list
        items:
          - "**配置**: 通路の通し方と向き、列の向き、入口の数と位置"
          - "**ラック**: ラックやスタンドの形、間隔、高さ、どの列に置くか"
          - "**決まりと運用**: 動かない自転車の扱い、停める場所の決め方、掲示"
          - "**情報**: 空きの知らせ方、列の見分け方、自分の自転車の探しやすさ"
      - type: p
        text: 方向ごとの案は、問題の一文の原因と、IDEF0の図の箱に結び付けて書きます。帰りに自分の自転車を探す時間を数えていれば、「自分の自転車を出す」の箱に向けた情報の案も出てきます。困りごとは停めるときだけでなく、探して出すときにもあるからです。
      - type: p
        text: この手順でできるのは、方向ごとに並べた案の一覧です。似た案はまとめ、一つずつに短い名前を付けておくと、次の手順で比べやすくなります。

  - id: screening
    step: 4
    heading: 必須の要件でふるいにかけ、外す理由を要件の言葉で書く
    blocks:
      - type: point
        text: 比べる前に、必須の要件を満たせない案を外します。外す理由を要件の言葉で書いておくと、「なぜその案にしないのか」と聞かれたときに答えられます。
      - type: p
        text: 案を一つずつ、必須の要件の表の上から照らします。満たせるかどうかを、思い込みではなく資料や数で確かめます。例えば二段式ラックのような案なら、ガイドラインが挙げる上段の重さの制限と、チャイルドシート付きの自転車が上段を使えないことを、必須の要件「太いタイヤや電動アシストの自転車も停められる」と「要る台数以上のますがある」に照らします。上段を使えない自転車の割合は、数える手順の記録から見積もります。
      - type: p
        text: 外す理由は、「〔案〕は、必須の要件〔要件〕を、〔資料や数〕のため満たさない」の形で書きます。要件の表にない理由(好みや見た目)で外さないようにします。そうした理由があるなら、外す前に、それを要件として表に足すかを話し合います。
      - type: p
        text: 少しの手直しで必須の要件を満たせる案は、外さずに直した形で残します。例えば、ある列だけに使う、形の違う自転車用の列を別に設ける、のような直し方です。この手順でできるのは、残った案の一覧と、外した案とその理由の記録です。

  - id: comparison
    step: 4
    heading: 残った案を、ピューの概念選定法で基準案と比べる
    blocks:
      - type: point
        text: 残った案を、基準案との比較で採点します。合計の点だけで決めず、どの案も基準案より悪い行を探し、良いところを組み合わせた案をつくって、もう一度比べます。
      - type: p
        text: ピューの概念選定法は、基準案を一つ決め、他の案が評価の基準ごとに基準案より良ければ+、悪ければ-、同じならSを付けて、+と-の数を合計する比べ方です。基準案には、最初に思いつく「同じラックを空き地に足す」のように、誰でも思い浮かべられる案を選びます。比べる相手がはっきりしていれば、+か-かを判断しやすいからです。
      - type: table
        caption: 比べる表の形(評価の基準は、要件の表から選ぶ)
        head:
          - 評価の基準
          - 基準案
          - 案A
          - 案B
          - 案C
        rows:
          - - 〔目標の秒数〕以内に停められる
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 隣を動かさずに出せる
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 1台が倒れても、隣を巻き込まない
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 太いタイヤや電動アシストも停められる
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 費用
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 授業期間中に閉めずに済む
            - S
            - +/S/-
            - +/S/-
            - +/S/-
          - - 合計(+の数−-の数)
            - "0"
            - 計算する
            - 計算する
            - 計算する
      - type: steps
        items:
          - title: 一人ずつ記号を付ける
            body: 話し合う前に、各自が表に+・S・-を付けます。初めから全員で付けると、声の大きい人の判断に寄るからです。記号の違うマスだけを話し合い、理由を表の外に書きます。
          - title: 合計を出し、弱い行を探す
            body: 合計の高い案を見るだけでなく、どの案もSか-になっている行を探します。その行の要件は、どの案でも基準案より改善されないので、合計の高い案を選んでも困りごとが残ります。必須の要件の行なら、そのままでは選べません。
          - title: 良いところを組み合わせる
            body: 弱い行に+を付けた案があれば、その良いところを、合計の高い案に足せないかを考えます。配置の案と決まりの案のように、同時にできる案どうしは足し合わせやすいです。
          - title: 基準案を替えて、もう一度比べる
            body: 組み合わせた案を新しい基準案にして、もう一度比べます。+が付く案がなくなるまで繰り返すと、残った案の強みと弱みがはっきりします。
      - type: p
        text: 点数は判断を助ける道具で、最後に判断するのは人です。この手順でできるのは、選んだ案と、その案を選んだ理由を記号と言葉で示した表です。選んだ案に、自転車を支える部品(ラックやスタンド)が含まれるなら、次からの手順でその寸法と強さを決めます。詳しい比べ方は、[[selection|比べて選ぶ]]のページにあります。

  - id: layout
    step: 5
    heading: ますと通路の寸法から、列の数と台数を計算する
    blocks:
      - type: point
        text: 寸法は、自転車1台の大きさから決めます。ますの長さと通路の幅を足していくと、駐輪場の奥行きに入る列の数が決まります。数十cmの差で、列が1本増えたり減ったりします。
      - type: p
        text: 国土交通省のガイドラインは、普通自転車の大きさを長さ1.9m・幅0.6mとしています(法令が定める普通自転車の大きさの上限です)。横浜市の基準は、ますをこの大きさ以上とし、ラックを置くならメーカーの推奨寸法以上としています。実際の幅やハンドルの高さで隣との隙間は変わるので、ますの幅はこの値を出発点にし、後の模型の試験で決めます。
        note: 国土交通省 都市局「[自転車等駐車場の整備のあり方に関するガイドライン（第3版）](https://www.mlit.go.jp/toshi/content/001880113.pdf)」2025年、25ページ(普通自転車の長さ1.9m×幅0.6m)。横浜市の基準も、ますを1.9m×0.6m以上とする。
      - type: heading
        text: 奥行きから、帯の数を計算する
      - type: p
        text: 通路をはさんで両側に列を置いたものを、1つの帯と呼ぶことにします。ますの長さをL、通路の幅をwとすると、帯の奥行きはL+w+Lです。駐輪場の奥行きをこの値で割り、小数点以下を切り捨てた数が、入る帯の数です。割り切れずに残る長さには、片側だけの列(L+w)が入るかを確かめます。それでも残る長さは、通路に分けて広げる余裕として使えます。
      - type: p
        text: 帯が1本足りないとき、通路を少しずつ削れば入ることがあります。けれど、削った後の通路の幅が要件の制約を下回るなら、その配置は選べません。制約を守ったうえで、帯を減らして通路を広げる配置と、帯を増やす別の配置(列の向きを変えるなど)を比べます。
      - type: heading
        text: 幅から、1列の台数と合計を計算する
      - type: p
        text: 主な通路を、入口から奥へ列を横切って通すなら、その幅だけ列が短くなります。1列の長さ=駐輪場の幅−主な通路の幅です。1列の台数は、1列の長さをますの幅で割り、小数点以下を切り捨てた数です。合計の台数=1列の台数×列の数で、これを前に計算した要る台数と比べます。下回るなら、配置か、ますの幅か、列の向きを見直します。
      - type: p
        text: 計算は、ますの幅の候補ごとに表にしておきます。ますの幅を数cm広げると、1列の台数が数台減り、列の数を掛けると合計では大きく減ります。この表があれば、模型の試験でますの幅を変えたとき、すぐに要る台数を満たすかを確かめられます。この手順でできるのは、ますの幅の候補ごとの配置の図と台数の表です。

  - id: load
    step: 5
    heading: 支える部品にかかる横からの力を見積もる
    blocks:
      - type: point
        text: 支える部品の強さは、かかる力の見積もりから決めます。力は、風と、倒れかかる自転車から見積もり、見積もりの不確かさに備えて安全率をかけます。この手順で、要件の〔力の値〕が決まります。
      - type: p
        text: ラックやスタンドのように自転車を支える部品は、1台が倒れても隣を巻き込まないための部品です。弱すぎれば、強い風の日に曲がって役目を果たせません。強すぎれば、重くなり、費用もかさみます。どちらにも偏らないよう、まず「どれだけの力がかかるか」を数で見積もります。力が分からないまま鋼管を選ぶと、太さを決める根拠がありません。
      - type: heading
        text: 風の力を、動圧と面積から見積もる
      - type: p
        text: 風が面を押す圧力の目安は、動圧q=½ρv²です(ρは空気の密度で地上ではおよそ1.2kg/m³、vは風速)。物が受ける力はF=C×q×Aで、Aは風を受ける面積、Cは物の形で決まる係数(抗力係数)です。式から、力は風速の2乗に比例します。例えば風速が10m/sから20m/sになると、qは60Paから240Paになり、力は4倍です。
      - type: p
        text: 式に入れる値は、それぞれ出どころを決めて調べます。風速vは、駐輪場に近い観測地点の最大瞬間風速を、気象庁の過去の記録で何年分か調べ、そのうちの大きい値を使います。面積Aは、自転車を真横から撮った写真に方眼を重ね、フレームや車輪の占める面積を数えて見積もります。係数Cは、流体力学の教科書にある、似た形の物の値を使います。どの値をどこから取ったかは、全て記録します。
        note: 気象庁「[過去の気象データ検索](https://www.data.jma.go.jp/stats/etrn/index.php)」。数える手順で使う、風の強い日の記録と同じページで調べられる。
      - type: heading
        text: 倒れかかる自転車の力を足し、安全率をかける
      - type: p
        text: 外周の列では、風を受けた自転車が支える部品にもたれかかり、隣の自転車が倒れかかって重なることもあります。そこで、1つの部品に何台分の力がかかりうるかを、列の並び方から見込みます。倒れかかる1台が押す力は、もたれかけた自転車と支えの間にプッシュプルゲージを挟んで測れます。風の力と、倒れかかる台数分の力を足したものが、見積もった横からの力です。
      - type: p
        text: 見積もった力には、安全率(見込み違いに備えて、力を何倍かに見込む係数)をかけます。こうして求めた力を、部品の上端の高さにかかるものとして要件に書きます。上端で考えるのは、同じ力でも高いところにかかるほど、根元を曲げる働きが大きくなるからです。この手順でできるのは、横からの力の値と、その高さと、使った値の出どころの記録です。

  - id: structure
    step: 5
    heading: 力から、根元の曲げ、固定の仕方、鋼管の断面を順に決める
    blocks:
      - type: point
        text: 横からの力は、根元を曲げるモーメントになります。そのモーメントに台の重さで耐えるか、アンカーボルトで耐えるかを比べて固定の仕方を決め、最後に鋼管の断面を、曲げの応力が降伏点を安全率で割った値に収まるように選びます。
      - type: heading
        text: ①力を、根元を曲げるモーメントにする
      - type: p
        text: 上端を横に押すと、部品は根元を支点に倒れようとし、根元には曲げモーメント(力×支点からの距離)がかかります。前の手順で決めた横からの力をF、その高さをhとすると、M=F×hです。脚が2本ある形でも、取り付けの差で1本に力が偏ることがあるので、安全側に見て、1本の脚でMを受けるとして計算します。
      - type: heading
        text: ②置くだけか、アンカーボルトで固定するかを比べる
      - type: p
        text: 置くだけの台で耐えるなら、台の重さが、倒れようとするのを押し戻します。台が倒れるときは押された向きの台の端が支点になり、台の重さWは、支点から台の重心までの水平の距離aを腕にして押し戻します。倒れないためにはW×aがMより大きければよく、台の重さのばらつきや地面の傾きに備えて安全率fをかけると、要る重さはW=f×M÷aです。aが小さいほど、重い台が要ります。
      - type: p
        text: アンカーボルト(コンクリートに埋め込んで部品を留めるボルト)で固定するなら、部品を鋼の板(ベースプレート)で留め、モーメントをボルトの引き抜く力で受けます。押す力が来る側のボルトから、板の反対側の端(支点)までの距離をbとすると、ボルトにかかる引き抜く力はおおよそT=M÷bです。アンカーは、メーカーの資料の引き抜きの強さが、Tに安全率をかけた値を上回るものを選びます。
      - type: p
        text: 2つの方法は、計算した値を、運べるか・並べられるか・地面に穴を開けてよいかと突き合わせて比べます。要る重さWが、人の手で運べる重さを大きく超えるなら、置くだけの方法は難しくなります。地面がコンクリートでない、穴を開ける許しが得られない、工事が授業期間に重なる、といった条件があれば、固定する方法が難しくなります。選んだ方法と、選ばなかった方法を外した理由を、両方記録します。
      - type: heading
        text: ③鋼管の太さと厚さを、曲げの応力から選ぶ
      - type: p
        text: 曲げモーメントMがかかる管の表面には、曲げの応力σ=M÷Zが生じます。Zは断面係数で、断面の形だけで決まり、外径D・内径dの丸い管ではZ=π(D⁴−d⁴)÷(32D)です。このσを、降伏点(力を除いても変形が残り始める応力)を安全率で割った値と比べ、σがそれより小さければ、計算の上では変形は残りません。
      - type: p
        text: 選ぶ順は、要るZを先に出すと早く進みます。σ≦降伏点÷f(fは安全率)を書き換えると、要るZ=f×M÷降伏点です。使う鋼の降伏点は、JISの規格やメーカーの資料で確かめます。その上で、市販の鋼管の寸法表から、Zがこの値を上回る外径と厚さを選びます。厚さが同じ薄い管では、Zは外径のおよそ2乗と厚さに比例するので、同じ量の材料なら外径を大きくするほうが強くなります。
      - type: p
        text: 力の見積もりと耐える側の両方に安全率をかけるのは、備える不確かさの種類が違うからです。力の側は、風や倒れかかり方の見込み違いに備えます。耐える側は、台の重さ、材料の強さ、取り付けのばらつきに備えます。どの係数をいくつにしたかは、仕様書に理由と一緒に書きます。この手順でできるのは、固定の仕方、要る重さか引き抜く力、鋼管の外径と厚さと、それぞれの計算の記録です。

  - id: tolerance
    step: 5
    heading: 部品の位置の公差は、1つの基準点から測って決める
    blocks:
      - type: point
        text: 公差(つくるときにずれてよい幅)は、値だけでなく、どこから測るかも決めます。隣との間隔で決めると誤差が積もるので、列の端の1つの基準点から測ります。
      - type: p
        text: 隣との間隔それぞれに±eの公差を決めると、間隔がn個並んだ列の端では、ずれが最大n×eまで積もります。そこで、どの部品の位置も、列の端の1つの基準点から測って±eと決めます。こうすれば、どの部品も、図面の位置からe以内に収まります。
      - type: p
        text: 公差の値eは、模型の試験で決めた隙間を基に決めます。部品の位置がずれると、隣のますとの隙間が狭くなるからです。隣り合う2つの部品が逆の向きに最大までずれると、隙間は2×e狭くなります。この狭くなった隙間でも出し入れに困らないように、eを決めます。公差の考え方は、[[detailing|形を詰める]]のページにあります。

  - id: mockup
    label: 試す
    heading: 注文する前に、実物大の模型で出し入れと倒れ方を試す
    blocks:
      - type: point
        text: 図面の数字が人の動きに合うかは、図面だけでは確かめられません。地面に実物大の線を引き、木の模型で、いろいろな自転車を実際に出し入れして、ますの幅、通路の幅、支える高さを決めます。
      - type: p
        text: 実物大で試すのは、ますや通路の幅が、ハンドルどうしの当たり方や、自転車を押して向きを変える動きで決まるからです。隙間が数cm違うだけで出し入れがどれだけ楽になるかは、計算では出ません。注文した後で合わないと分かれば、ラックを買い直すことになります。地面の線と木の模型なら、何度でも引き直せます。
      - type: heading
        text: 実物大の模型を用意し、5つのことを試す
      - type: steps
        items:
          - title: 地面に実物大の線を引く
            body: 空き地にテープで、ますと通路を引きます。幅は、配置の手順で計算した候補のうち、狭いものと広いものの2通り以上にします。木の角材で、支える高さを変えられる部品の模型を数基つくります。
          - title: 出し入れを測る
            body: 通学用、電動アシスト、太いタイヤの自転車で、10人ほどに停めて出してもらいます。かかった秒数と、隣の自転車に触れた回数を、ますの幅ごとに記録します。
          - title: 通路で向きを変える
            body: 電動アシストの自転車を押して、通路で向きを変えてもらいます。切り返しの回数と、他の自転車に触れた回数を、通路の幅ごとに数えます。
          - title: 押して倒す試験
            body: 停めた自転車を、支えにもたれかけた角度まで傾け、支えの高さでプッシュプルゲージ(押す力を測る計器)を当てて、自転車が支えを押す力を読みます。支えがない場合に倒れ始める力も測って比べます。倒れるときの勢いの分は、安全率で見込みます。
          - title: 倒れかかり試験
            body: 列の端の1台をわざと倒し、隣の何台まで倒れるかを見ます。支えのある列では、1台で止まるかを確かめます。
      - type: p
        text: 試す人と自転車は、扱いにくい組み合わせを含めて選びます。通学用だけでなく、電動アシストや太いタイヤの自転車を入れ、背の高い人と低い人の両方に頼みます。扱いにくい組み合わせで合えば、他の組み合わせでも合うと考えられるからです。判断の目安(隣に触れる人の割合、切り返しの回数など)は、試す前に決めておきます。
      - type: heading
        text: 試験の記録を、数字の直し方につなげる
      - type: table
        caption: 試験の記録から、直す数字と戻る手順を決める(目安の値は試す前に決める)
        head:
          - 試験
          - こうなったら
          - 直す数字と戻る手順
        rows:
          - - 出し入れを測る
            - 隣に触れる人の割合が、目安を超える
            - ますの幅を広げ、配置の手順で台数を計算し直す
          - - 通路で向きを変える
            - 切り返しの回数が目安を超える人が多い
            - 通路を広げる。奥行きに収まらなければ帯の数を見直す
          - - 押して倒す試験
            - 測った力が、力の見積もりで使った値より大きい
            - 力の見積もりと、鋼管と固定の計算をやり直す
          - - 倒れかかり試験
            - 支えのある列で、隣まで倒れる
            - 支える点の高さか、部品の間隔を見直す
          - - どの試験でも
            - 上のパイプのない形の自転車を支えられない
            - 支える高さの範囲を見直す
      - type: p
        text: ますの幅を変えたら、[[case-bicycle-parking#layout|配置の手順]]の台数の表で、要る台数を満たすかを確かめます。満たさなければ、配置を決める手順に戻ります。木の模型では強さを確かめられないので、横からの力の要件は、注文する前に、計算とメーカーの試験の記録で確かめます。この手順でできるのは、試験の記録用紙と、直した数字とその理由です。

  - id: specification
    step: 5
    heading: 試した数字で仕様書をまとめ、数字ごとに理由を書く
    blocks:
      - type: point
        text: 仕様書には、決めた値と、その値にした理由と、確かめ方を書きます。理由が書いてあれば、つくる人や、後で直す人が、どの数字なら変えてよいかを判断できます。
      - type: table
        caption: 仕様書に書く項目と、値の出どころと、理由に書くこと
        head:
          - 項目
          - 値の出どころ
          - 理由に書くこと
        rows:
          - - 1台分のます
            - 自転車の大きさ(国土交通省のガイドライン)と、模型で決めた隙間
            - どの自転車を基準にし、隙間をどう決めたか
          - - 通路
            - 要件の制約と、模型の「向きを変える」試験
            - 参考にした基準と、試験の記録
          - - 配置と列の数
            - 配置の手順の計算
            - 要る台数を満たすこと
          - - 支える部品の形と高さ
            - 案の比較と、模型の試験
            - どの要件を満たすための形か
          - - 横からの力
            - 力を見積もる手順
            - 風速の出典、面積と係数の出どころ、倒れかかる台数、安全率
          - - 固定の仕方
            - 重さと引き抜く力の計算
            - 選ばなかった方法を外した理由
          - - 鋼管の断面
            - 曲げの応力の計算
            - 使った降伏点の出典と、安全率
          - - 取り付けの誤差(公差)
            - 基準点の位置と、模型で決めた隙間
            - どこから測るか、なぜその値か
          - - 材料と表面の処理
            - 屋外で使う条件
            - 雨にぬれたときのさびへの備え
          - - 表示や掲示(案に含むなら)
            - 情報の案の比較
            - どの困りごとに向けたものか
          - - 工事の時期
            - 要件の制約
            - 授業期間中に駐輪場を閉めないため
      - type: p
        text: 仕様書には、この表の他に、問題の一文、IDEF0の図、要件の表、案の比較の表、力と強さの計算、模型の試験の計画と記録用紙を添えます。どの数字も、数えた値・要件・計算・試験のどれかにさかのぼれるようにしておくのが、この仕様書で一番大事なことです。さかのぼれない数字は、根拠を確かめるまで仮の値と書いておきます。
      - type: link
        label: 工程5「形を詰める」を詳しく読む
        href: /design/detailing/

