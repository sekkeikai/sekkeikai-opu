title: 大学の駐輪場
en: "Case: Facility"
layer: case
order: 4
short: 物と場所の設計
question: ラックを増やす前に、何を数えるか
summary: 満車に見える駐輪場で、本当に足りない台数と、風で倒れないラックの強さを、数えた値と力の計算から割り出す。
lead: もし設計会で大学の駐輪場を使いやすくするなら、こう進めます。朝の台数を列ごとに数えて要る台数を式で出し、支える部品の鋼管の太さを、横からかかる力から計算します。
chapters:
  - id: goal
    heading: 出しやすさと停められる台数は引っ張り合う
    blocks:
      - type: point
        text: ますの幅を数cm広げると出しやすくなる一方で、1列の台数が数台減り、列の数を掛けた合計では大きく減ります。自転車を支える部品は、強くするほど重くなり、費用がかさみます。
      - type: cards
        items:
          - title: "目的"
            body: "朝に早く停められ、帰りに出しやすく、風で倒れない駐輪場にする"
          - title: "誰のため"
            body: "自転車で通う学生と教職員(電動アシストやかごの大きい自転車の人も)"
          - title: "計画の終わりにできるもの"
            body: "配置・寸法・支える部品の強さを、数字ごとに理由と確かめ方を付けて決めた仕様書と、注文の前に行う模型の試験の計画"
          - title: "届いたかの確かめ方"
            body: "数えて確かめる要件(停めるのにかかる時間、倒れる台数など)。目標の値は、今の値を数えてから決める"
      - type: table
        caption: 駐輪場を設計する手順のまとまりと、できるものの形
        head:
          - まとまり
          - やること
          - できるものの形
        rows:
          - - 数える
            - 原因の候補ごとに確かめる数を決めて数え、要る台数を計算する
            - 目安の表、台数の表、倒れた位置の図
          - - 要件にし、案を選ぶ
            - 数で確かめられる要件に書き直し、案を比べる
            - 要件の表、比べる表
          - - 寸法と力を計算する
            - 配置を計算し、支える部品にかかる力から固定の仕方と鋼管の断面を選ぶ
            - 配置の図と台数の表、力と強さの計算
          - - 試す
            - 実物大の模型で試してから注文する
            - 模型の試験の記録

  - id: what-to-count
    step: 1
    heading: 原因の候補ごとに数えるものを選ぶ
    blocks:
      - type: point
        text: 何を数えるかで見える原因が変わるので、満車に見える原因の候補ごとに、確かめる数と判断の目安を、数える前に決めます。
      - type: question
        text: 満車に見える駐輪場は、本当に台数が足りないと思いますか。
        answer: 入口に近い列だけが満車で、奥は空いているかもしれません。奥の列の空きと、使われていない自転車の数を数えて初めて、本当に足りない台数が分かります。
      - type: p
        text: 困りごとは、利用者の言葉では「停める場所がない」「朝は出しにくい」「よく倒れている」のように出てきます。原因の候補ごとに、どの数を見れば確かめられるか、その数がどうなら何を考えるかを、表にしておきます。ます(自転車1台分の区画)の数は、駐輪場の図面と現地で確かめます。
      - type: table
        caption: 原因の候補と、確かめる数と、判断の目安の形(数えるのは「確かめる数」の列だけ)
        head:
          - 原因の候補
          - 確かめる数
          - 判断の目安の形
          - そうなら考える方向
        rows:
          - - 台数が足りない
            - 一番多いときの台数(ますの中+ますの外)、動かない自転車の台数、ますの数
            - 要る台数(数えた後に式で出す)が、ますの数を超えるか
            - ますを増やす
          - - 到着が短い時間に集まる
            - 10分ごとに増える台数
            - 朝に着く台数のうち、決めた割合以上が、1限前の決めた時間に集まるか
            - 空きを早く見つけられるようにする
          - - 通路と並び方が悪い
            - 出すまでの秒数、動かした隣の台数
            - 出すときに隣を動かす人の割合が、決めた割合を超えるか
            - 配置を引き直す
          - - 風で列ごと倒れる
            - 倒れた台数、その列の位置、倒れた向き
            - 倒れた自転車が、風の当たる外周の列や、同じ向きに偏るか
            - 支え方を変える
          - - 動かない自転車が場所をとる
            - 2週間たっても札が残る台数
            - 札の残る台数が、ますの数の決めた割合を超えるか
            - 決まりを決めて撤去する
      - type: p
        text: 判断の目安の値と、数える日と時刻の予定は、数える前に大学の担当の部署と話して決めます。

  - id: counting
    step: 1
    heading: 場面ごとに数えて要る台数を出す
    blocks:
      - type: point
        text: どの場面も、条件の違う日に繰り返して数えます。満車の朝はますの中の台数が頭打ちになるので、ますの外に停めた台数を同じ時刻に数えます。
      - type: heading
        text: "朝: 列ごとに、10分おきに数える"
      - type: p
        text: 授業のある日の朝、1限が始まるまでの1時間(例えば8時から9時)、同じ場所を10分ごとに数えます(定点観測)。列ごとに数えると「入口近くは満車、奥は空き」という偏りが、10分おきの数を並べると台数の増え方と到着が集まる時間が見えます。数えるのは次の4つです。
      - type: list
        items:
          - 列ごとの台数(10分ごと)
          - ますの外(通路や周りの歩道など)に停めた台数(同じ時刻)
          - 何人かについて、着いてから立ち去るまでの秒数
          - 一番多い時刻に停まっている自転車の、種類(電動アシスト、チャイルドシート付き、太いタイヤ)ごとの台数
      - type: p
        text: 数える日には、1限の授業が多い曜日、雨の日、学期の初めと半ばを含めます。台数は学期の初めと半ばで変わるかもしれず、雨の日は自転車で来る人が減るかもしれないので、雨の日の台数は晴れの日と分けて表にします。一番多いときの台数(ますの中とますの外の合計)には、これらの日のうち最も多い日の値を使います。
      - type: heading
        text: "帰り: 出すまでの秒数と、動かした隣の台数"
      - type: p
        text: 帰りの時間には、自転車の前に立ってから通路に出すまでの秒数と、その間に隣の自転車を何台動かしたかを記録します。朝は「停めにくさ」が、帰りは「出しにくさ」と「探しにくさ」が見えます。自分の自転車を探して列を行き来する人がいれば、探した時間を測ります。
      - type: heading
        text: "風の強い日の翌朝: 倒れた位置と向き"
      - type: p
        text: 風の強い日の翌朝には、倒れた自転車の位置と倒れた向きを駐輪場の図に書き込み、写真に残します。倒れた向きがそろっていれば、風で倒れたと考えられます。その日の風向きと最大風速は、気象庁の過去の記録で調べ、図と並べます。写真には、人の顔や自転車の防犯登録の番号が写らないようにします。
        note: 気象庁「[過去の気象データ検索](https://www.data.jma.go.jp/stats/etrn/index.php)」。観測地点ごとに、日ごとの最大風速・最大瞬間風速とその風向を調べられる。
      - type: heading
        text: "動かない自転車: 荷札を付けて2週間待つ"
      - type: p
        text: 動かない自転車は、大学の担当の部署と相談したうえで、荷札を付けて確かめます。2週間たっても札がそのままなら、その自転車は使われていないと考えられます。この台数は、朝の台数から引きます。引かなければ、動かない自転車の分だけ、要る台数を多く見積もります。
      - type: p
        text: 数えた結果は、次の形にまとめます。
      - type: list
        items:
          - 日ごと・列ごと・10分ごとの台数と、ますの外の台数の表(数えた日の天気と授業の有無を入れる)
          - 停める秒数と出す秒数
          - 倒れた位置を書き込んだ図
          - 2週間たっても札の残った台数
      - type: heading
        text: 要る台数を式で出す
      - type: p
        text: 式で書くと、要る台数=一番多いときの台数(ますの中+ますの外)−動かない自転車の台数+余裕です。一番多いときの台数には、朝の定点観測で数えた、ますの中とますの外の台数の合計の最大の値を使います。満車ではますの中の台数がますの数で頭打ちになるので、ますの外の台数を足さないと、要る台数を少なく見積もります。動かない自転車の台数は、札の残った台数です。余裕は、数えた日ごとのばらつきや、翌年度の学生の増減に備える分で、一番多いときの台数に対する割合として、担当の部署と決めます。
      - type: p
        text: 要る台数がますの数を超えるなら、ますを増やす方向を候補に残します。超えないなら、満車に見える理由は台数の不足以外にあるので、列ごとの台数で入口近くと奥の偏りを、10分ごとの台数で到着の集中を確かめます。どちらの場合も、表の目安を超えた原因の候補は全て残します。

  - id: requirements
    label: 工程2から4
    heading: 要件に書き直して案を選ぶ
    blocks:
      - type: p
        text: 残った原因ごとに[[problem-finding#statement|問題の一文]]を書き、「出しにくい」は「隣の自転車を動かさずに出せる」に、「まとめて倒れる」は「1台が倒れても、隣を巻き込まない」に書き直します([[requirements#write|要件の書き方]])。目標の秒数や台数は数えた今の値を出発点に担当の部署や利用者と話し、支える部品には「上端に横から〔力の値〕がかかっても変形が残らない」という安全の必須の要件を立てて、その値は[[case-bicycle-parking#load|力を見積もる手順]]で出します。
      - type: p
        text: 国土交通省のガイドラインは、タイヤ幅の広い自転車が既存のラックに入らないことと、後ろの座席が高いチャイルドシート付きの自転車が二段式ラックの上段を使えないことを、駐輪場の課題に挙げています。停められる自転車の種類を要件に入れ、二段式ラックのような案は、数えた種類ごとの台数に照らします。
        note: 国土交通省 都市局「[自転車等駐車場の整備のあり方に関するガイドライン（第3版）](https://www.mlit.go.jp/toshi/content/001880113.pdf)」2025年、116ページ。二段式ラックの上段には重さの制限があることも挙げている。
      - type: p
        text: 配置・ラック・決まりと運用・空きの知らせ方の案を並べて[[selection#criteria|比べて選び]]、選んだ案に自転車を支える部品(ラックやスタンド)が含まれるなら、次の章からその寸法と強さを計算します。

  - id: layout
    step: 5
    heading: ますと通路の寸法から台数を出す
    blocks:
      - type: p
        text: ますの大きさは、国土交通省のガイドラインが示す普通自転車の大きさ(長さ1.9m・幅0.6m。法令が定める普通自転車の大きさの上限)を出発点にし、幅は後の模型の試験で詰めます。
        note: 国土交通省 都市局「[自転車等駐車場の整備のあり方に関するガイドライン（第3版）](https://www.mlit.go.jp/toshi/content/001880113.pdf)」2025年、25ページ(普通自転車の長さ1.9m×幅0.6m)。横浜市の基準も、ますを1.9m×0.6m以上とする。
      - type: p
        text: 帯(通路をはさんで両側に列を置いたもの)の奥行きはL+w+L(Lはますの長さ、wは通路の幅)なので、駐輪場の奥行きをこれで割って切り捨てると帯の数が出ます。1列の台数は、主な通路の幅を引いた駐輪場の幅を、ますの幅で割って切り捨てた数です。通路の幅は自治体の基準の下限を割らないようにし、ますの幅の候補ごとに配置の図と合計の台数の表をつくって、要る台数と比べます。
        note: 横浜市「[公共用自転車駐車場整備運営基準](https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/kotsu/bycycle/bicycle-parking/saiseibi/higashitotsuka.files/03.pdf)」(東戸塚駅の駐輪場の再整備)。自転車の通路の幅の目安は、主線通路1.5m、支線通路1.3m。

  - id: load
    step: 5
    heading: 支える部品にかかる横からの力を見積もる
    blocks:
      - type: point
        text: 支える部品の強さは、かかる力から決めます。風と、倒れかかる自転車の力を見積もり、見積もりの不確かさに備えて安全率をかけた値が、要件の〔力の値〕になります。
      - type: p
        text: ラックやスタンドのように自転車を支える部品は、1台が倒れても隣を巻き込まないための部品で、強い風の日に曲がらない強さが要ります。要る強さを出すために、まず「どれだけの力がかかるか」を数で見積もります。
      - type: heading
        text: 風の力を動圧と面積から見積もる
      - type: p
        text: 風が面を押す圧力の目安は、動圧q=½ρv²です(ρは空気の密度で地上ではおよそ1.2kg/m³、vは風速)。物が受ける力はF=C×q×Aで、Aは風を受ける面積、Cは物の形で決まる係数(抗力係数)です。式から、力は風速の2乗に比例します。例えば風速が10m/sから20m/sになると、qは60Paから240Paになり、力は4倍です。
      - type: p
        text: 式に入れる値は、それぞれ出どころを決めて調べます。風速vは、駐輪場に近い観測地点の最大瞬間風速を、気象庁の過去の記録で何年分か調べ、そのうちの大きい値を使います。面積Aは、自転車を真横から撮った写真に方眼を重ね、フレームや車輪の占める面積を数えて見積もります。係数Cは、流体力学の教科書にある、似た形の物の値を使います。
        note: 気象庁「[過去の気象データ検索](https://www.data.jma.go.jp/stats/etrn/index.php)」。数える手順で使う、風の強い日の記録と同じページで調べられる。
      - type: heading
        text: 倒れかかる自転車の力を足して安全率をかける
      - type: p
        text: 外周の列では、風を受けた自転車が支える部品にもたれかかり、隣の自転車が倒れかかって重なることもあります。1つの部品に何台分の力がかかりうるかを、列の並び方から見込みます。倒れかかる1台が押す力は、もたれかけた自転車と支えの間にプッシュプルゲージ(押す力を測る計器)を挟んで測れます。風の力と、倒れかかる台数分の力を足したものが、見積もった横からの力です。
      - type: p
        text: 見積もった力には、安全率(見込み違いに備えて、力を何倍かに見込む係数)をかけます。同じ力でも、高いところにかかるほど根元を曲げる働きが大きくなるので、求めた力は部品の上端の高さにかかるものとして要件に書きます。

  - id: structure
    step: 5
    heading: 固定の仕方と鋼管の断面を選ぶ
    blocks:
      - type: point
        text: 横からの力は、根元を曲げるモーメントになります。台の重さで耐えるか、アンカーボルトで耐えるかを比べて固定の仕方を決め、最後に、曲げの応力が降伏点を安全率で割った値に収まるように鋼管の断面を選びます。
      - type: heading
        text: ①力を根元の曲げモーメントにする
      - type: p
        text: 上端を横に押すと、部品は根元を支点に倒れようとし、根元には曲げモーメント(力×支点からの距離)がかかります。前の手順で決めた横からの力をF、その高さをhとすると、M=F×hです。脚が2本ある形でも、取り付けの差で1本に力が偏ることがあるので、安全側に見て、1本の脚でMを受けるとして計算します。
      - type: heading
        text: ②置くだけかアンカーボルトで留めるかを比べる
      - type: p
        text: 置くだけの台で耐えるなら、台の重さが、倒れようとするのを押し戻します。台が倒れるときは押された向きの台の端が支点になり、台の重さWは、支点から台の重心までの水平の距離aを腕にして押し戻します。倒れないためにはW×aがMより大きければよく、台の重さのばらつきや地面の傾きに備えて安全率fをかけると、要る重さはW=f×M÷aです。aが小さいほど、重い台が要ります。
      - type: p
        text: アンカーボルト(コンクリートに埋め込んで部品を留めるボルト)で固定するなら、部品を鋼の板(ベースプレート)で留め、モーメントをボルトの引き抜く力で受けます。押す力が来る側のボルトから、板の反対側の端(支点)までの距離をbとすると、ボルトにかかる引き抜く力はおおよそT=M÷bです。アンカーは、メーカーの資料の引き抜きの強さが、Tに安全率をかけた値を上回るものを選びます。
      - type: p
        text: 2つの方法は、計算した値を、運べるか・並べられるか・地面に穴を開けてよいかと突き合わせて比べます。要る重さWが、人の手で運べる重さを大きく超えるなら、置くだけの方法は難しくなります。地面がコンクリートでない、穴を開ける許しが得られない、工事が授業期間に重なる、といった条件があれば、固定する方法が難しくなります。
      - type: heading
        text: ③曲げの応力から鋼管の太さと厚さを選ぶ
      - type: p
        text: 曲げモーメントMがかかる管の表面には、曲げの応力σ=M÷Zが生じます。Zは断面係数で、断面の形だけで決まり、外径D・内径dの丸い管ではZ=π(D⁴−d⁴)÷(32D)です。このσを、降伏点(力を除いても変形が残り始める応力)を安全率で割った値と比べ、σがそれより小さければ、計算の上では変形は残りません。
      - type: p
        text: 選ぶ順は、要るZを先に出すと早く進みます。σ≦降伏点÷f(fは安全率)を書き換えると、要るZ=f×M÷降伏点です。使う鋼の降伏点は、JISの規格やメーカーの資料で確かめます。その上で、市販の鋼管の寸法表から、Zがこの値を上回る外径と厚さを選びます。厚さが同じ薄い管では、Zは外径のおよそ2乗と厚さに比例するので、同じ量の材料なら外径を大きくするほうが強くなります。
      - type: p
        text: 安全率は、力の見積もりと耐える側の両方にかけます。2つの側では、備える不確かさの種類が違います。力の側では風や倒れかかり方の見込み違いに、耐える側では台の重さ、材料の強さ、取り付けのばらつきに備えます。材料と表面の処理は、屋外で雨にぬれたときのさびへの備えから選びます。

  - id: mockup
    label: 試す
    heading: 実物大の模型で出し入れを試す
    blocks:
      - type: p
        text: 隙間が数cm違うだけで出し入れがどれだけ楽になるかは計算では出ないので、注文する前に、地面に実物大のますと通路を引き、木の模型で、通学用・電動アシスト・太いタイヤの自転車を出し入れしてもらいます([[detailing#review|形を詰める]])。ますの幅を変えたら[[case-bicycle-parking#layout|配置の手順]]の台数の表で要る台数を確かめ直し、木の模型では確かめられない横からの力の要件は、[[case-bicycle-parking#load|力の見積もり]]からの計算とメーカーの試験の記録で確かめます。

