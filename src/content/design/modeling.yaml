title: モデル化
en: Modeling
layer: lens
order: 1
short: モデルで考える
question: まだ存在しないものを、どう確かめるか
summary: まだ存在しないものを、図・模型・数式・シミュレーションで表し、つくる前に確かめる。何を残し、何を捨てるかの判断も、設計の一部になる。
lead: 設計しているものはまだできていないので、代わりのモデルで、実物をつくる前に確かめます。どのモデルも対象の一部を捨てているので、何を確かめたいかを先に決めます。
chapters:
  - id: basics
    heading: モデルは、目的のために何かを捨てている
    blocks:
      - type: question
        text: 駅の路線図は、本物の地図と比べると、距離も方角も正確ではありません。それなのに、なぜ乗り換えには路線図の方が役に立つのでしょう?
        answer: 乗り換えに必要な「駅の順番」と「つながり」だけを残しているからです。
      - type: point
        text: モデルは、目的に合わせて、対象の一部だけを取り出して表したものです。モデル化では、何を残し、何を捨てるかの判断が中心になります。
      - type: figure
        name: route-map
      - type: p
        text: |-
          この描き方は、1933年にロンドンの地下鉄の路線図として発行されました。地下鉄の信号の図面を描く仕事をしていたハリー・ベックが、駅の実際の位置を捨て、線を縦・横・斜めの直線だけで描きました。地理に正確な地図より、乗り換えがずっと分かりやすい図になりました。
        note: |-
          [K. Garland, Mr Beck's Underground Map, Capital Transport, 1994](https://ci.nii.ac.jp/ncid/BA27096263)。
      - type: p
        text: |-
          路線図は図のモデルですが、設計で使うモデルは他にもあります。スケッチや三面図のような「図のモデル」、縮尺模型や試作品のような「物理モデル」、方程式で表す「数理モデル」、数理モデルをコンピューターで細かく解いて振る舞いを調べる「計算モデル」(シミュレーション)、そして要素どうしの関係を表す「概念モデル」や「データモデル」です。どれを使うかは、何を確かめたいかで決まります。どれを選んでも対象の一部は捨てることになり、統計学者ジョージ・ボックスはそれを「全てのモデルは間違っている」と書きました。
        note: |-
          [G. E. P. Box, "Science and Statistics", Journal of the American Statistical Association, 71(356), 1976](https://doi.org/10.1080/01621459.1976.10480949)。のちに「しかし、役に立つものもある」と続けた形で広く引用される。
      - type: figure
        name: abstraction-ladder

  - id: why
    heading: 計算や模型なら、建てる前に何度でも試せる
    blocks:
      - type: point
        text: 棚板の厚さや、橋に当たる風の強さを変えるとどうなるかを、実物をつくる前に確かめられます。
      - type: p
        text: |-
          下の計算は、本棚の棚板がどれだけたわむかを、両端を支えた梁(単純支持梁)という単純なモデルで見積もるものです。板の厚さを18mmから12mmにすると、たわみは約3.4倍になります。直感より大きな差ですが、梁のモデルではたわみが厚さの3乗に反比例するので、すぐに計算できます。つまみで厚さを変えられます。
      - type: figure
        name: beam-calculator
      - type: example
        kind: real
        title: 明石海峡大橋の模型
        text: |-
          1940年、米国のタコマナローズ橋は、完成から4か月ほどで、秒速19m(時速68km)ほどの風を受けて大きくねじれ、落ちました。それ以来、長いつり橋は、風を当てた模型で揺れを確かめてから建てます。明石海峡大橋(1998年開通)は、それまでのつり橋の規模を大きく超える橋でした。そこで、長さ40m、実物の約100分の1の全橋模型を大きな風洞に入れ、本物が出会うかもしれない強い風を、建てる前に何度も当てて確かめました。この模型は今も神戸市の橋の科学館に展示されています。
        source: タコマナローズ橋は[ワシントン州運輸局「Tacoma Narrows Bridge history」](https://wsdot.wa.gov/tnbhistory/bridge-timeline.htm)、明石海峡大橋は本州四国連絡高速道路「橋の科学館」の[展示の解説](https://www.hashinokagakukan.jp/exhibition/build)と[館の紹介](https://www.hashinokagakukan.jp/about)による。
      - type: p
        text: |-
          3次元CADでつくった形は、そのままCAE(コンピューターで構造や流れ、熱などを解析すること)にかけて、試作の前に性能を確かめられます。自動車の衝突試験は、実車で行う前に、コンピューターの上で何度も繰り返されています。製品を出した後に、実物から集めた[[data-analysis|データ]]でモデルを直し続ける使い方があり、そのモデルはデジタルツインと呼ばれます。
      - type: p
        text: |-
          図面と模型で確かめる方法から、コンピューターで構造を解く方法までの移り変わりは、[[design-methods-history|設計の方法の歴史]]の年表に載せています。
      - type: heading
        text: 同じ図面を見れば、形や寸法を正確に共有できる
      - type: p
        text: |-
          関係者がそれぞれ違うモデルを頭に描いていると、議論は食い違い、ときには事故につながります。1999年には火星探査機マーズ・クライメート・オービターが、2つのソフトウェアのうち一方が取り決めと違う単位で数値を渡していたために失われました。
        note: |-
          [NASA, Mars Climate Orbiter Mishap Investigation Board Phase I Report, 1999](https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf)。地上のソフトウェアが、インターフェース仕様で定められたニュートン秒ではなく、ポンド重秒で値を出力していた。

  - id: how
    heading: 確かめたいことを先に一文で書く
    blocks:
      - type: point
        text: モデルが役に立つかは目的で決まるので、つくるときは目的を決めるところから始めます。一度つくって終わりにせず、使いながら直し続けます。
      - type: steps
        items:
          - title: 目的を決める
            body: そのモデルで何を確かめたいのかを、最初に一文で書きます。目的が決まれば、何を残し何を捨てるかも決まります。
          - title: 境界を決める
            body: どこまでを対象に含め、何を外から与えられる条件として扱うかを決めます。
          - title: 仮定を書き出す
            body: 「材料はどこも同じ」「荷重は均等」など、単純にするための仮定をはっきり書きます。仮定の一覧を見れば、どこでモデルが外れうるかが分かります。
          - title: 表し方を選ぶ
            body: 図、数式、表計算、シミュレーション、物理的な試作の中から、目的と手間に見合うものを選びます。
          - title: 確かめる
            body: 分かっている結果や実際に測った値と比べ、モデルが目的に足りる精度を持っているかを確かめます。
          - title: 使って、直す
            body: モデルの結果を設計の判断に使い、新しく分かったことに合わせてモデルを直します。
      - type: p
        text: |-
          アプリやサービスのような情報系の設計では、物の設計でよく使う式や模型より、構造や振る舞いを図で表すモデルをよく使います。記録する対象(実体)とその関係を表す実体関連図(ER図)は、1976年にピーター・チェンが提案しました。プログラムを組み立てるクラス(データとその処理をまとめた型)の関係を表すクラス図や、状態の移り変わりを表す状態機械図(状態遷移図とも呼ぶ)は、統一モデリング言語(UML)の図として描き方が標準化されています。機能のつながりを箱と矢印で表すIDEF0は、[[requirements#functions|要件を定める工程]]で機能を整理するのに役立ちます。
        note: |-
          UML は1997年にオブジェクト・マネジメント・グループ(OMG)が[標準(UML 1.1)](https://www.omg.org/spec/UML/1.1/)として採択した。IDEF0 は米空軍のICAM計画の中で開発され、1993年に米国の連邦情報処理規格([FIPS PUB 183](https://nvlpubs.nist.gov/nistpubs/Legacy/FIPS/fipspub183.pdf))となった。
      - type: figure
        name: er-state
      - type: p
        text: |-
          同じ部室の予約でも、確かめたいことで描く図が変わります。何を記録し、どうつなぐか(データの形)を決めたいならER図。一つの予約がどんな順番で状態を変えるかを決めたいなら状態遷移図です。状態遷移図を描くと、「取消にした予約を、また確定に戻せるか」のような決まりが矢印の有無として目に見えるので、つくる前に話し合って決めておけます。
      - type: per-step

perStep:
  - cell: 今の仕組みの流れを図にする
    body: 今の仕組みや生活の流れを図にして、どこで問題が起きているのかを見える形にします。
  - cell: 機能のつながりを図にする
    body: IDEF0やユースケース図で、果たすべき機能とその入出力、機能どうしのつながりを整理します。
  - cell: スケッチと簡単な模型
    body: 精度より速さを優先し、スケッチや紙・段ボールの模型で、形や大きさの感覚をつかみます。
  - cell: 計算やシミュレーションで比べる
    body: 上の棚板の例のような簡単な数理モデルで、案ごとの性能を見積もって比べます。
  - cell: 3次元CADとCAEで確かめる
    body: 3次元CADで形を決め、構造や流れをコンピューターで解析するCAEで、性能を確かめます。
