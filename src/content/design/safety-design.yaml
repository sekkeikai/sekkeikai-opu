title: 安全の設計
en: Safety Design
layer: topic
order: 3
short: 事故を設計で防ぐ
question: 「気をつけて」で、事故は防げるのか
summary: 人は間違え、物は壊れる。それを前提に、危険のもとを設計でなくし、それでも残る危険を仕組みで防ぎ、最後に使う人に伝える。守る順番を決め、つくる前に危険を洗い出すのが安全の設計。
lead: 注意書きを貼っても、うっかりは起きます。部品はいつか壊れます。安全の設計は人の注意に頼る前に、危険のもとを設計でなくす分野です。間違えても壊れても、けがにつながらない仕組みをつくります。ヒューマンインターフェースの「誤りの多くは、設計から生まれる」という見方を、事故を防ぐことに広げたものです。
parent: human-interface
chapters:
  - id: design-first
    heading: 「気をつけて」より先に、設計で防ぐ
    blocks:
      - type: question
        text: 子供がライターで遊んで火事になるのを防ぐには、「触らないで」と教えるだけで足りるでしょうか?
        answer: 教えることも大切ですが、教えが届かないこともあります。子供には簡単に火をつけられない作りにしておけば、ライターを手にしてしまっても事故を防げる見込みが高まります。
      - type: point
        text: 安全はまず設計で確保します。人の注意や注意書きに頼るのは、設計で防げなかった危険だけです。
      - type: example
        kind: real
        title: 子供が簡単に操作できないライター
        text: |-
          ライターによる子供の火遊びで家が焼け、子供が亡くなる事故が起きています。日本では使い捨てライターや多目的ライターは、2つの条件を満たさなければ売ることができません。子供が簡単に操作できない仕組み(チャイルドレジスタンス機能)を持つことと、国の技術基準を満たしたことを示すPSCマークが付いていることです。親への呼びかけに加えて、ライターの作りそのものに子供を守る要件が課されています。
        source: '[製品評価技術基盤機構(NITE)の注意喚起の資料](https://www.nite.go.jp/data/000004813.pdf)と[消費者庁などのリーフレット](https://www.caa.go.jp/publication/pamphlet/pdf/110929kouhyou_5.pdf)による。'

  - id: three-steps
    heading: 安全の手を打つ順番は、決まっている
    blocks:
      - type: point
        text: まず危険のもとを設計でなくすか小さくし、次に覆いや安全装置で防ぎ、最後に残る危険を使う人に伝えます。設計でできることを飛ばして注意書きに頼ってはいけません。
      - type: p
        text: |-
          機械の安全については国際規格ISO 12100(日本ではJIS B 9700)に考え方がまとめられています。厚生労働省の「機械の包括的な安全基準に関する指針」も、これを参考にしています。指針は、機械をつくる人が次の順番で危険を小さくすることを求めています。
        note: |-
          [厚生労働省 職場のあんぜんサイト「機械の包括的な安全基準」](https://anzeninfo.mhlw.go.jp/yougo/yougo14_1.html)。指針は2001年に策定され、2007年に改正された。
      - type: steps
        items:
          - title: 本質的安全設計
            body: 危険のもとそのものを、形や寸法や力の決め方でなくすか小さくします。
          - title: 安全防護
            body: なくしきれない危険を、覆い(ガード)や安全装置で人に届かないようにします。
          - title: 使用上の情報
            body: それでも残る危険を、表示や説明書で使う人に伝えます。
      - type: p
        text: |-
          本質的安全設計の例として、指針の解説は次のようなことを挙げています。鋭い端や突起を設けず角に丸みを付けること、はさまれるおそれのある部分を体が入らない程度に狭くするか、はさまれない程度に広くすること、ぶつかっても体に被害が出ない程度に動くものの勢い(運動エネルギー)を小さくすることです。そして設備で危険を小さくできるのに、それをせずに使用上の情報に頼ってはならないとしています。
        note: |-
          [厚生労働省「『機械の包括的な安全基準に関する指針』の解説等について」(2007年)](https://www.mhlw.go.jp/web/t_doc?dataId=00tb3488&dataType=1&pageNo=1)、[職場のあんぜんサイト「機械の包括的な安全基準」](https://anzeninfo.mhlw.go.jp/yougo/yougo14_1.html)。

  - id: error-failure
    heading: 人は間違え、物は壊れる。それを前提にする
    blocks:
      - type: point
        text: 間違った操作をしても事故にならない仕組みをフールプルーフ、部品が壊れても安全な側に止まる仕組みをフェールセーフと呼びます。
      - type: p
        text: |-
          人はうっかりしたり、思い違いをしたり、見落としたりします。厚生労働省の解説は、操作の表示を大きくする、色や形で区別するといった工夫をしても、なお期待に反した行動は起こりうると書いています。それが事故に直結するなら、前もって手を打っておく。この考え方がフールプルーフです。例えば動いている間は開かず、開いている間は動き出さない覆い(インターロック)や、両手で同時に押さないと動かない操作の仕方があります。
        note: |-
          [厚生労働省 職場のあんぜんサイト「フールプルーフ」](https://anzeninfo.mhlw.go.jp/yougo/yougo39_1.html)。
      - type: p
        text: |-
          部品はいつか壊れたり、働きが落ちたりします。壊れても、前もって決めた安全な側の状態に落ち着くようにしておく考え方がフェールセーフです。例えば安全装置の部品が壊れたら機械を急に止める、停電から電気が戻っても人が操作し直さなければ機械が動き出さない、といった仕組みです。
        note: |-
          [厚生労働省 職場のあんぜんサイト「フェールセーフ」](https://anzeninfo.mhlw.go.jp/yougo/yougo38_1.html)。
      - type: p
        text: |-
          形や色で区別して取り違えを防ぐ工夫や、表示が実際の状態を伝えなかったことで起きた事故は、[[human-interface#why|ヒューマンインターフェース]]のページで紹介しています。

  - id: find-hazards
    heading: つくる前に、どこで誰がけがをしうるかを洗い出す
    blocks:
      - type: point
        text: 安全の設計は危険を見つけるところから始まります。危険のもとを挙げ、それぞれの危険の大きさを見積もり、小さくする必要があるかを決めます。
      - type: p
        text: |-
          指針は機械をつくる人に、リスクアセスメントと呼ばれる一連の作業を求めています。まず使い方の範囲を決め、人が機械に関わる作業の中から危険のもとを特定します。次に、それぞれの危険の大きさを見積もり、小さくする必要があるかを決めます。
        note: |-
          [厚生労働省 職場のあんぜんサイト「機械の包括的な安全基準」](https://anzeninfo.mhlw.go.jp/yougo/yougo14_1.html)。
      - type: p
        text: |-
          [[problem-finding|問題を見つける工程]]で困りごとを集めるように、安全の設計では危険を集めます。設計の流れの例では[[case-delivery-robot#hazards|飲み物を運ぶロボットの仕事を図にして、事故が起きる場所を探す]]手順を紹介しています。部品の壊れ方から先に考える方法は、[[detailing#review|形を詰める工程]]の故障モード・影響解析(FMEA)で紹介しています。

