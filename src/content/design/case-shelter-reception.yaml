title: 防災
en: "Case: Disaster Preparedness"
layer: case
order: 5
short: 手順の設計
question: 雨の中で人が次々に着く避難所の受付を、どう設計するか
summary: 避難所の受付では、入口で聞く問いが多いほど列が伸びる。待ち行列の式で列の長さを見積もり、問いを許せる時間に収める。
lead: もし設計会で、大学の体育館を避難所として開くときの受付を設計するなら、こう進めます。道具を選ぶ前に、資料と訓練の見学で受付の仕事を確かめ、列の長さを見積もります。
chapters:
  - id: goal
    heading: 受付は、道具より先に列の長さを見積もる
    blocks:
      - type: point
        text: 入口で聞く問いを増やすほど、1世帯の時間が延びて列が伸びます。手助けが要る人を見落とさない問いが、列の見積もりで許せる時間に収まるまで、問いの数と窓口の数を行き来して決めます。
      - type: cards
        items:
          - title: "目的"
            body: "雨の中で着いた人を長く待たせず、手助けが要る人を見落とさずに居場所へ通し、正しい名簿を残す"
          - title: "誰のため"
            body: "避難してくる人(高齢の人、障害のある人、乳幼児のいる家族、日本語を読めない人も)と、受付に立つ人"
          - title: "計画の終わりにできるもの"
            body: "受付の手順書、受付カード、係の役目"
          - title: "届いたかの確かめ方"
            body: "避難所開設訓練で測る要件(屋根の下に入るまでの時間、見落とした人の数など)"
      - type: p
        text: "目的の3つは、互いに引っ張り合います。「見落とさず」は入口の問いの数で、「名簿を残す」は[[case-shelter-reception#card|受付カード]]の欄の数で、「待たせず」とぶつかります。"

  - id: overview
    label: 手順の一覧
    heading: 受付の設計は、8つの手順で進める
    blocks:
      - type: point
        text: 後の手順の数字は、手順1と2の記録から来ます。着く速さは過去の記録から、1世帯の時間は訓練の見学から取り、列の見積もり、入口の問いの数、係の人数はその2つから計算します。
      - type: table
        caption: 受付を設計する手順と、できるものの形
        head:
          - 手順
          - できるものの形
          - 工程
        rows:
          - - 1. 自治体の様式と過去の記録を読む
            - 受付の仕事の一覧(動詞で書き、誰が・いつ・何を使うかを並べる)
            - 1 問題発見
          - - 2. 避難所開設訓練を見学し、運営に関わる人に聞く
            - 時刻つきの観察の記録、問題の一文、ペルソナ
            - 1 問題発見
          - - 3. 列の長さを見積もり、要件の数字を決める
            - 見積もりの表(着く速さ、1世帯の時間、窓口の数、稼働率=受け付ける力のうち使っている割合)、要件
            - 2と5にまたがる
          - - 4. 電気がなくても動く案を出し、選ぶ
            - 案の一覧(電気や通信が要るか)、比較の表
            - 3 発想、4 評価・選定
          - - 5. 入口で聞く問いを決める
            - 問いの一覧(残した理由、言い方、答えごとの行き先)
            - 4と5にまたがる
          - - 6. 受付の流れと係の役目を決める
            - 受付の流れの表、係ごとの役目のカード
            - 5 詳細設計
          - - 7. 受付カードの欄を決める
            - 受付カードの案、欄ごとの使い道の表、しまい方の決まり
            - 5 詳細設計
          - - 8. 避難所開設訓練で試して直す
            - 測った結果の表、直した受付の手順書
            - 結果に応じて、前の手順に戻る

  - id: documents
    step: 1
    heading: 自治体の様式と過去の記録を読み、受付の仕事を書き出す
    blocks:
      - type: point
        text: 受付の道具を選ぶ前に([[problem-finding#statement|解き方は後で考える]])、受付が何をする場所かを、自治体の様式と過去の記録で確かめます。
      - type: p
        text: 避難所の受付は、着いた人の名前と人数を記録し、居場所へ案内する仕事です。名簿は、物資の数を決め、安否の問い合わせに答え、市の災害対策本部へ人数を報告する元になります。受付には、要配慮者を見つけるという役目もあります。要配慮者は、高齢者、障害者、乳幼児など、災害のときに特に配慮が要る人を指す、災害対策基本法の言葉です。この計画では、妊産婦や日本語を読めない人も含めて考えます。
        note: 法律の定義は「高齢者、障害者、乳幼児その他の特に配慮を要する者」。[災害対策基本法 第8条第2項第17号(e-Gov法令検索)](https://laws.e-gov.go.jp/law/336AC0000000223)
      - type: question
        text: 受付をアプリにすれば、速くなるのでは?
        answer: 速くなるかは、前提しだいです。全員がスマートフォンを持ち、電気と通信が使えるなら、速くなります。避難所では、停電、通信の混雑、充電の切れた電話、スマートフォンを持たずに来る人、雨にぬれた手のように、その前提が崩れることがあります。受付がどんな前提で動くかも、資料と聞き取りで確かめます。
      - type: heading
        text: 様式は、欄の中身と、いつ書く欄かを読む
      - type: p
        text: 読む資料は、自治体が公開している避難所運営のマニュアルと受付で使う様式、内閣府の「避難所運営等避難生活支援のためのガイドライン」、実際に避難所を開いた自治体の記録です。
        note: "[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)"
      - type: p
        text: 様式では、欄の中身に加えて、どの欄を、いつ、誰が書く決まりかを読みます。着いてすぐ全部の欄を書く形なら、仕事は入口に集まります。配慮が要るかを聞く欄が何番目にあり、誰がその答えを見るのかも確かめます。マニュアルでは、受付の係の人数、机を置く場所、市の災害対策本部へ人数を報告する間隔を読みます。報告の間隔は、名簿をいつまでにまとめればよいかを決める元になります。
      - type: p
        text: 過去の記録では、決められた手順より、実際に起きたことを読みます。何か所の避難所に何人が身を寄せたか、避難する人がどの時間帯に集中したか、配慮のための場所をどう分けたか。避難する人の数と時間帯は、手順3で「1時間に何世帯が着くか」を見積もる元になります。
      - type: example
        kind: real
        title: 西日本豪雨で倉敷市が開いた避難所
        text: 2018年の西日本豪雨(平成30年7月豪雨)で、倉敷市の避難所は最大で72か所、避難した人は最大で約5,500人になりました。真備地区の中で浸水に対応できる指定避難所は3か所だけだったため、市内の他の地区の避難所や、総社市が開いた避難所でも、真備地区の人を受け入れました。高齢者や障害のある人など配慮の必要な人を受け入れる避難所(最大24人)と、ペットと一緒に避難できる避難所(最大26人)も、別に開きました。
        source: "[倉敷市『平成30年7月豪雨災害から復興への記録』第5章(2020年)](https://www.city.kurashiki.okayama.jp/_res/projects/default_project/_page_/001/013/553/5syou.pdf)"
      - type: p
        text: 避難所が分かれ、同じ避難所の中にも配慮のための場所があるなら、着いた人をどこへ案内するかを、誰かが入口で決めることになります。このとき受付は、着いた人の様子を聞いて行き先を決める「振り分け」の場所になります。居場所はいったん決まると、後から動いてもらうのが難しくなります。
        note: 内閣府のガイドラインは、いったん「場所取り」が始まると再配置はとても難しいとし、配慮が必要な人の場所を事前に決めておくよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)
      - type: heading
        text: 書き出した仕事は、一覧の形にそろえる
      - type: p
        text: 読みながら、受付の仕事を「記録する」「行き先を決める」「案内する」「報告する」のように、動詞で1つずつ書き出します。この一覧は、手順3で入口に残す仕事と動かせる仕事を分けるときの材料になります。仕事ごとに、誰が、いつ、何を使ってするかと、どの資料に書いてあるかを並べ、資料によって書き方が違う仕事は、違いのまま残します。見学では、一覧に載っていない仕事を探します。

  - id: observe
    step: 1
    heading: 訓練を見学し、列ができる場所と後回しになる人を記録する
    blocks:
      - type: point
        text: 資料には、人がどこで何分待つかまでは書かれていません。その時間は手順3で列の長さを見積もる元になるので、避難所開設訓練を見学して測ります。
      - type: p
        text: 地域で開かれる避難所開設訓練(地域の人や職員が、避難所を開く手順を実際に試す訓練)を、主催する人の許可を得て見学します。写真や名前は記録せず、時刻と人の動きだけを書きます。
      - type: heading
        text: 時刻と一緒に、その間に何をしているかを書く
      - type: list
        items:
          - 世帯が入口に着いた時刻(1世帯ずつ書く。まとまって着くかが分かる)
          - 列の先頭と最後尾の位置と、並んでいる世帯の数(5分ごとに数える)
          - 1世帯が受付の机に着いてから離れるまでの時間(ストップウォッチで測る)と、その間にしていること(書く、ペンを待つ、質問する、係が様式を探す)
          - 長く立って待つのは誰か(杖をつく人、子供を抱く人、言葉が通じにくい人)と、立っている時間
          - 配慮が要るかを、いつ、誰が聞くか。聞かれないまま中に入る人がいるか
          - 係が迷う場面(手順書を見返す、他の係に聞く、受付を止める)
          - 入口の段差、雨と風の向き、机と明かりの位置
      - type: p
        text: "記録には、見たこと(書き方の例: 「杖をつく人が、机の前で8分立つ」)と、そこから考えたこと(「座って待てる場所が要るのでは」)を分けて書きます。"
      - type: p
        text: 訓練は参加者の数も天気も本番と違うので、時間は1世帯あたりで記録し、手順3で本番の人数に当てはめて計算し直します。1世帯の時間は、平均だけでなく、一番長くかかる世帯と、その間に何をしているかも残します。長くかかる世帯の記録は、手順3で、入口から動かせる仕事を探すときに使います。
      - type: heading
        text: 本番でしか起きないことは、運営に関わる人に「この前」を聞く
      - type: p
        text: 見学の後に、話を聞きます。聞く相手は、市の防災の担当、地域の自主防災組織(住民が自分たちで防災に取り組む組織)の人、大学で体育館を管理する担当、要配慮者の支援に関わる保健師や福祉の担当、日本語を母語としない留学生などです。
      - type: p
        text: 意見や予想より、[[problem-finding#listen|実際にあったこと]]を聞きます。「受付はアプリのほうが良いと思うか」と聞く代わりに、「前回の訓練で、受付で一番時間がかかったのはどこか」「中に入った後で、居場所を移ってもらった人はいるか。それはなぜか」と聞きます。体育館の担当には、入口の数、段差のない入口、停電のときに使える明かりと電源を聞きます。
      - type: p
        text: 聞いた話も、見たことと同じように、1つの事実を1枚のカードに書ける形で残します。話した人の名前は書かず、「市の防災の担当」のように立場だけを書きます。
      - type: heading
        text: 記録から、問題の一文と2人のペルソナを書く
      - type: p
        text: 資料・見学・聞き取りのカードは[[problem-finding#kj|KJ法]]でまとまりに分け、カードの数(どれだけ起きるか)と深刻さ(命や健康に関わるか、後から取り戻せるか)で選んだまとまりを、[[problem-finding#statement|問題の一文]]にします。
      - type: p
        text: ペルソナは、避難する側と受付に立つ側を1人ずつ、カードに書いた事実から深く書きます。目的の一つが「見落とさず」なので、避難する側には手助けが要る人を選びます。項目には、後で数字の元になるものを入れ、どのカードから来たかを書き添えます。
      - type: p
        text: 立って待っていられる時間は手順3の列の見積もりと要件に、誰と来るか(家族、付き添い、ペット)は手順5の「世帯の中の誰について聞くか」に使います。スマートフォンの有無と充電は手順4で電気や通信に頼る案が使えるかに、日本語を読めるかは手順5の問いの言い方に、受付に立つ側の経験と交代の間隔は手順6の役目のカードに使います。

  - id: queue
    label: 工程2と5にまたがる
    heading: 着く速さと処理の速さから、列が伸び続けるかを見積もる
    blocks:
      - type: point
        text: 1時間に着く世帯の数と、1時間に受け付けられる世帯の数を比べ、列が伸び続けるかを計算します。稼働率が1に近いと、いったんできた列はなかなか縮まりません。
      - type: p
        text: まず今の受付のままで列が伸び続けるかを計算し、次に入口の仕事をどこまで減らせば伸び続けずに済むかを、数にして確かめます。
      - type: heading
        text: 使う数は3つで、どれも前の手順から来る
      - type: table
        caption: 見積もりに使う数と、どこから得るか
        head:
          - 数
          - 意味
          - どこから得るか
          - 気をつけること
        rows:
          - - 着く速さλ
            - 1時間に入口へ着く世帯の数
            - 手順1の記録(避難した人の数と時間帯)、市が想定する避難者の数
            - 1日の平均ではなく、一番多く着く1時間の数を使う
          - - 1世帯の時間s
            - 1世帯が入口の机に着いてから離れるまでの分数
            - 手順2の観察の記録(その間にしていることごとの時間)
            - 訓練の参加者は手順に慣れている。本番は雨にぬれ、質問も増える
          - - 窓口の数c
            - 同時に受け付ける机や係の数
            - 入口と雨よけの屋根の広さ(手順2の聞き取り)、集められる係の数
            - 窓口を増やすと、机と明かりと係も増える
      - type: p
        text: 1つの窓口が1時間に受け付けられる世帯の数を、処理の速さμといいます。μは、60分を1世帯の分数sで割った数です。窓口がc個なら、入口全体では1時間にc×μ世帯を受け付けられます。この受け付ける力のうち、実際に使っている割合が稼働率ρです。式で書くと、ρ=λ÷(c×μ)になります。
      - type: p
        text: ρが1を超えるなら、着く世帯の数が受け付けられる数を上回るので、列は1時間に(λ−c×μ)世帯ずつ伸び続けます。最後尾に着いた世帯の待ち時間は、前に並んでいる世帯の数を、1時間に受け付けられる数c×μで割ると見積もれます。この待ち時間とペルソナの「立って待っていられる時間」を比べれば、立っていられない人が出るかが分かります。
      - type: heading
        text: 稼働率が1より小さくても、1に近いと列はなかなか縮まない
      - type: p
        text: 人は決まった間隔では着きません。車が続けば、数世帯がまとまって着きます。まとまって着いたときにできた列は、処理の速さに余裕があるときだけ縮み、余裕が小さいほど縮むのに時間がかかります。このような列の性質は、**待ち行列理論**で扱います。
      - type: p
        text: 一番簡単な待ち行列のモデル(窓口が1つで、着く間隔も1世帯の時間も指数分布に従ってばらつくとするモデル。M/M/1と呼ぶ)では、並んで待つ世帯の平均の数はρ²÷(1−ρ)になります。ρが0.5なら0.5世帯、0.8なら3.2世帯、0.9なら8.1世帯で、1に近づくほど急に増えます。車でまとまって着くと、列はこのモデルより長くなります。着く速さと受け付ける速さが「ちょうど同じ」では足りないので、稼働率に余裕を残します。どこまで残すかは、この章の終わりで要件として決めます。
      - type: p
        text: 待ち時間と列の長さは、2つの式でつながります。最後尾の世帯の待ち時間は、前に並ぶ世帯の数をc×μで割った値なので、許せる列の長さは「立って待っていられる時間×c×μ」です。平均どうしでは、リトルの法則(並ぶ世帯の平均の数=着く速さλ×平均の待ち時間)が成り立ちます。平均を上限に合わせると、それより長く待つ世帯が出るので、上限には最後尾の式を使います。
      - type: heading
        text: 入口に残す仕事と、入口から動かせる仕事を分ける
      - type: p
        text: 稼働率を下げるには、入口の1世帯の時間sを短くします。手順1で書き出した受付の仕事を「記録する」「行き先を決める」「案内する」のような機能の箱に分け([[requirements#functions|IDEF0]]で描けます)、箱ごとに次のことを確かめます。
      - type: list
        items:
          - その箱の出力を、誰が、いつまでに使うか(次の箱がすぐ要るのか、手順1で読んだ報告の間隔に間に合えばよいのか)
          - 後に回すと、取り戻せなくなるものはあるか(居場所が埋まる、急ぐ手当てが遅れる、など)
          - その箱の入力は、入口にしかないか(着いた本人がいれば、入口の外でもできるか)
          - 見学で測った1世帯の時間のうち、どれだけがその箱の分か
      - type: p
        text: 出力をすぐ使い、後に回すと取り戻せない箱は、入口に残す候補です。出力を使うまでに時間の余裕があり、入力が入口の外でもそろう箱は、入口から動かせる候補です。どちらに入るかは避難所によって変わるので、区分には、理由と元にした記録を書き添えます。
      - type: heading
        text: 仕事を動かした先にも、列ができないかを確かめる
      - type: p
        text: 動かせる候補にした仕事を入口から外すと、入口の1世帯の時間sが短くなり、稼働率が下がります。区分の候補ごとにsを見積もり直し、稼働率を表にします。ただし、動かした仕事にも窓口が要ります。動かした先で係が1世帯ずつ順に受け付ける形なら、そこにも同じ計算をします。世帯が自分で受付カードを書き、係は書き終えたカードを確かめるだけなら、係の時間は確かめる分だけで計算します。字を書けない人や日本語を読めない人には係が代わりに書くので、その分の時間が加わります。その割合は訓練で確かめるまで分からないので、見積もりの表に「確かめていない数」と印を付けます。
      - type: p
        text: 要件の数字と係の人数を決める元として、見積もりの表をつくります。行に入口のやり方の候補を、列に1世帯の時間・窓口の数・稼働率・列が伸び続けるかを並べ、どの数がどの記録から来たかを書きます。
      - type: heading
        text: 見積もりから、要件の数字を決める
      - type: p
        text: 「早く中に入りたい」は、「着いてから屋根の下に入るまで◯分以内」と書き直して[[requirements|要件]]にします。この時間は、ペルソナが立って待っていられる時間から決め、列で待つ時間と入口で聞かれる時間を足しても、その中に収まるようにします。入口で1世帯にかける時間は、見積もりの表で、稼働率に余裕が残る値から決めます。
      - type: p
        text: 「見落とさず」と「名簿を残す」にも、訓練で数えられる要件を立てます。手助けが要る人の見落としの数は、配慮のための場所を誰に使ってもらうかの市の決まりを元にし、人数の報告をまとめる時間は、市の災害対策本部へ報告する間隔に合わせます。初めての人が係を務めるまでの説明の時間は、受付に立つ側のペルソナから決めます。

  - id: ideas
    label: 工程3と4
    heading: 電気がなくても動く案も出し、停電で受付まで止まる案を外す
    blocks:
      - type: point
        text: 停電と通信の途絶を制約にするかは、決めつけずに、体育館の担当に聞いた電源と明かりの備えから決めます。制約にしたなら、電気がなくても動く方向でも案を出し、電気が止まると受付まで止まる案は、受付の中心の案から外します。
      - type: p
        text: 「電気がなくても動くか」と問うと、紙・配置・掲示・係の分け方のような、道具以外の方向の案も出てきます。電気を使う案も捨てずに、「電気が止まったら、どう続けるか」「通信が使えない間の記録を、戻ったときにどうまとめるか」とセットで考えます。電気が止まっても受付が続き、電気が使えるときだけ助けになる補助の案は、外さずに残せます。
      - type: p
        text: 案の出どころには、手順3で分けた機能の箱、2人のペルソナ、制約を使い([[ideation#methods|案を広げる道具]])、箱ごとの案は[[ideation#chart|機能ごとの解き方の表]]で組み合わせます。残った案は、今の受付を基準案にし、手順3の要件を評価の基準にして、[[selection#criteria|ピューの概念選定法]]で比べます。見積もりや記録に元のない印には「見積もり」と書き添え、手順8の訓練で確かめる項目にします。

  - id: questions
    label: 工程4と5にまたがる
    heading: 入口で聞くことは、答えで行き先が変わるかで選ぶ
    blocks:
      - type: point
        text: 入口で聞く問いは、候補を並べてから、答えで行き先が変わるか、後に回すと取り戻せないかなどの基準で選び、残した問いの秒数の合計が、要件の「入口で1世帯にかける時間」に収まるかを確かめます。
      - type: p
        text: 案を選んでも、入口で何を聞き、答えごとにどこへ通すかは、まだ決まっていません。
      - type: heading
        text: 候補の問いは、様式と聞き取りと市の決まりから集める
      - type: p
        text: 候補は、手順1で読んだ様式の欄、手順2の聞き取りで挙がった「後から居場所を移ってもらった理由」、市が配慮のための場所や福祉避難所を誰に使ってもらうと決めているか、の3つから集めます。どの人をどこへ通す決まりかが分かれば、それを見分けるために何を聞けばよいかが分かります。
      - type: heading
        text: 入口に残すかは、4つの基準で決める
      - type: table
        caption: 候補の問いを入口に残すかの基準
        head:
          - 基準
          - 確かめ方
          - 満たさないとき
        rows:
          - - 答えで行き先が変わるか
            - 答えが「はい」と「いいえ」で、通す場所や列や次の係が変わるかを書き出す
            - 入口では聞かず、受付カードの欄の候補にする
          - - 後に回すと取り戻せないか
            - 後で聞いたとき、居場所が埋まる、急ぐ手当てが遅れるなどが起きるか
            - 行き先が変わっても急がないなら、後で聞く候補にする
          - - 短く答えられるか
            - 「はい」か「いいえ」や指さしで答えられるか。かかる秒数を測る
            - 言い方を変えるか、他の問いとまとめる
          - - 周りに聞こえてよいか
            - 持病の名前など、周りに知られたくない中身に触れないか
            - 中身は聞かず、手助けが要るかだけを聞く
      - type: p
        text: 候補の問いごとに4つの基準を表にし、「入口で聞く」「後で受付カードに書く」「聞かない」のどれかに分けます。入口で聞く問いの数は、先に決め打ちしません。入口に残した問いの秒数を足し、手順3で決めた要件「入口で1世帯にかける時間」に収まるかを確かめます。収まらなければ、問いをまとめるか、窓口の数を見直します。
      - type: heading
        text: 問いの言い方と、迷ったときの決まり
      - type: p
        text: 問いは「はい」か「いいえ」で答えられる形にし、日本語を読めない人には、絵や外国語でも答えられる形を考えます。代表者に「手助けが要りますか」と聞くと、代表者が自分のことだと受け取り、家族の中の手助けが要る人が抜ける恐れがあります。「この中に、歩くのに手助けが要る人はいますか」のように、世帯の中の誰かについて聞く形にします。
      - type: p
        text: 答えに迷う人をどちらへ通すかは、2つの間違いの直しやすさを比べて決めます。手助けの要らない人を配慮のための場所へ通した場合と、手助けが要る人を一般の場所へ通した場合で、後から移ってもらう難しさを、体育館の配置と聞き取りの記録から見積もります。見積もった難しさの差を、迷ったときの決まりの根拠にします。
      - type: p
        text: 色の見分けやすさは人によって違うので、行き先を札や掲示で示すなら、[[human-interface#how|色だけでなく記号と文字も入れます]]。問いの一覧には、問いごとに、残した理由、言い方(日本語と、絵や外国語)、答えごとの行き先を書きます。

  - id: flow
    step: 5
    heading: 受付の流れと係の役目を、初めての人が動ける形に書く
    blocks:
      - type: point
        text: 入口から記録までの流れを、場所・やること・担当・目安の時間・使うものの表にします。係の役目は係ごとに1枚のカードにまとめ、交代した人がカードを受け取るだけで続けられるようにします。
      - type: p
        text: 流れの表の「やること」は、手順3で分けた機能の箱と手順5の問いの一覧から、「目安の時間」は手順3の見積もりから取ります。目安の時間を足し合わせ、要件の「屋根の下に入るまでの時間」に収まるかを確かめます。
      - type: p
        text: 担当ごとの1世帯の時間からは、手順3と同じ計算で、係ごとの稼働率が出ます。係の人数は、この計算で稼働率に余裕が残る数にします。着く速さは時間帯で変わるので、多く着く時間帯と少ない時間帯で、係の人数を分けて書きます。
      - type: heading
        text: 役目のカードには、迷ったときの決まりまで書く
      - type: list
        items:
          - やること(流れの表の、その係の行を、順番通りに)
          - 迷ったときの決まり(手順5で決めた、答えに迷う人の通し方など)
          - 誰に何を伝えるか(配慮のための場所の空き具合、人数の報告など)
          - 見てよい情報と、見てはいけない情報(手順7で決める)
          - 交代の仕方(カードと道具を、そのまま次の人に渡す)
      - type: p
        text: カードは、受付に立つ側のペルソナが、要件の説明の時間の中で読み切れる長さにします。停電を制約にしたなら、どの場所にも電気を使わない明かりがあるか、掲示が暗くても読めるかも、流れの表で確かめます。

  - id: card
    step: 5
    heading: 受付カードの欄を、使い道と個人情報の決まりから決める
    blocks:
      - type: point
        text: 受付カードには、使い道を説明できる欄だけを置きます。持病などの情報は、見てよい係としまう場所を決めてから集めます。
      - type: p
        text: 受付カードは、名簿の元になる記録です。欄を増やすほど書く時間が延び、扱いに気をつける情報も増えます。欄を決めずに白紙に書いてもらうと、書く中身が人によって変わり、人数を数えるのにも時間がかかります。書く時間と名簿の漏れ、人数の報告をまとめる時間は、手順8の訓練で、このカードを使って測ります。
      - type: heading
        text: 欄の候補は、名簿の使い道から逆にたどる
      - type: p
        text: まず、名簿が何に使われるかを並べます。手順1で読んだ通り、名簿は物資の数を決め、安否の問い合わせに答え、市の災害対策本部へ人数を報告する元になります。配慮が要る人を、保健師などの係へつなぐのにも使います。使い道ごとに、そのために要る情報を書き出すと、欄の候補になります。手順5で入口では聞かないことにした問いも、ここで候補に加えます。
      - type: p
        text: 候補の中には、持病や障害のように、個人情報保護法の「要配慮個人情報」(病歴など、不当な差別や偏見が生じないよう、取り扱いに特に配慮が要る情報)に当たるものがあります。名前の似た「要配慮者」とは別の言葉です。こうした欄は、見てよい係と、しまう場所を決めてから置きます。名簿と受付カードを見られる人の範囲は、個人情報保護法と市の決まりに合わせる制約として扱います。
        note: 要配慮個人情報の定義は[個人情報保護法 第2条第3項(e-Gov法令検索)](https://laws.e-gov.go.jp/law/415AC0000000057)。
      - type: table
        caption: 欄の候補ごとに確かめること
        head:
          - 書くこと
          - 確かめること
        rows:
          - - 使い道
            - 名簿のどの使い道のための欄か。使い道を言えない欄は置かない
          - - いつ要るか
            - 着いてすぐ要るか、後でよいか。すぐ要るなら、入口の問いで足りていないか
          - - 誰が見るか
            - 記録の係だけか、配慮に必要な係(保健師など)も見るか
          - - 書き方
            - チェックや丸で答えられるか。字を書けない人や日本語を読めない人も答えられるか
          - - 扱いの決まり
            - 要配慮個人情報に当たるか。安否の問い合わせに答えてよいかを、本人に聞く欄が要るか
      - type: heading
        text: しまい方の決まりも、欄と一緒に決める
      - type: list
        items:
          - 受付カードを見てよい係を、役目ごとに決める
          - カードをしまう場所と、その場所から持ち出してよいかを決める
          - 名簿を、他の避難者の目に触れる場所に置かない
          - 安否の問い合わせに、誰の、どの情報を答えるかと、本人の意向の確かめ方を決める
          - 手助けが要ることの中身を、どの係にまで伝えるかを決める
          - 避難所を閉じるときのカードの扱い(市に渡すか、いつ処分するか)を、市の決まりに合わせて手順書に書く

  - id: drill
    label: 試して直す
    heading: 役のカードを配った避難所開設訓練で、要件を一つずつ測る
    blocks:
      - type: point
        text: 手順書の案は、避難所開設訓練で試してから使います。参加者に役のカードを配り、見積もりに使った間隔で着いてもらって、手順3で決めた要件を一つずつ測ります。
      - type: p
        text: ここまでの時間や人数は、見積もりです。初めての係が、暗い中で、まとまって着く人を受け付けるときにも手順書の通りに動けるかは、試すまで分かりません。できた手順は、避難所を運営する市や地域の人に見てもらってから、避難所開設訓練で試してもらいます。
        note: 内閣府のガイドラインも、避難者の受付と名簿の作成について実動訓練を行い、個人情報保護と安否確認の知識を共有するよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)
      - type: heading
        text: 役のカードで、本番に来る人の幅をつくる
      - type: p
        text: 参加者には、車いすを使う人、日本語を読めない人、犬を連れた人などの役を書いたカードを配ります。役は、手順2のペルソナと、手順5の問いで通し分ける人がそろうように選びます。手助けが要る役のカードを何枚配ったかは、係には知らせずに記録しておきます。後で、通した先と突き合わせて、見落とした人数を数えるためです。車いすを使う人や留学生にも、できれば本人として参加してもらい、通った後に、迷った場所やつらかった場面を聞きます。
      - type: p
        text: 着く間隔も、本番に近づけます。手順3で使った「一番多く着く1時間」の世帯の数で3,600秒を割ると、平均の間隔が出ます。ただし、いつも同じ間隔で送り出すと、まとまって着く場面が抜けるので、ときどき数世帯を続けて送り出します。受付の係には、受付が初めての人を選び、手順6の流れの表と役目のカードを渡して、要件の説明の時間だけで始めてもらいます。停電を制約にしたなら、照明を消した状態で行います。
      - type: heading
        text: 測ることは、手順3で決めた要件から決める
      - type: table
        caption: 訓練で測ることと、要件に届かないときに戻る手順
        head:
          - 測ること
          - 測り方
          - 届かないときに戻る手順
        rows:
          - - 着いてから屋根の下に入るまでの時間
            - 着いた時刻を役のカードの裏に書き、屋根の下に入った時刻と比べる
            - 手順3と5に戻り、窓口の数か問いを見直す
          - - 入口の聞き取りの時間
            - 観察の係がストップウォッチで測る
            - 手順5に戻り、問いをまとめるか、言い方を変える
          - - 見落とした人数
            - 手助けが要る役のカードと、通した先を突き合わせる
            - 手順5に戻り、問いの言い方を変える
          - - 日本語を読めない役の人が止まった場所
            - 観察の係がついて歩き、止まった場所を書く
            - 手順6に戻り、掲示の絵と置き場所を変える
          - - 初めての係の手順の間違い
            - 観察の係が数え、係が役目のカードを見返した場面も書く
            - 手順6に戻り、役目のカードを書き直す
          - - 記録の場所で待つ世帯の数
            - 5分ごとに数える
            - 手順3に戻り、代わりに書く人の割合を入れて計算し直す
          - - 名簿の漏れと、人数の報告をまとめる時間
            - 訓練の後に、名簿と参加者の数を突き合わせ、まとめる時間を測る
            - 手順7に戻り、欄と並びを見直す
          - - 名簿と受付カードを見られる人の範囲
            - 置き場所と、見た人の記録を確かめる
            - 手順7に戻り、しまい方の決まりを見直す
      - type: p
        text: 試して要件とのずれが見つかったら、表の右の列の手順に戻って直し、直した手順書でもう一度試します。次の年の訓練の前に同じ計算を新しい数でやり直すために、見積もりから外れた数は、手順3の見積もりの表に書き戻します。

