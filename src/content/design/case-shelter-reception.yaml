title: 避難所の受付
en: "Case: Disaster Preparedness"
layer: case
order: 5
short: 手順の設計
question: 雨の中で次々に人が着く受付で、入口では何を聞くか
summary: 体育館の避難所の受付で、入口で聞くことと受付カードの欄を、列の伸び方の見積もりと名簿の使い道から絞り込む。
lead: もし設計会で、大学の体育館を避難所として開くときの受付を設計するなら、こう進めます。1時間に着く世帯の数が受け付けられる数を上回れば、列は伸び続けます。入口で聞く問いは、この列の長さの見積もりから絞ります。名簿の元になる受付カードには、使い道を説明できる欄だけを置きます。
chapters:
  - id: goal
    heading: 入口の問いと名簿の欄が、待ち時間とぶつかる
    blocks:
      - type: point
        text: 手助けが要る人を見落とさないための入口の問いと、名簿のための[[case-shelter-reception#card|受付カード]]の欄を増やすほど、1世帯にかかる時間が延びて列が伸びます。
      - type: cards
        items:
          - title: "目的"
            body: "雨の中で着いた人を長く待たせず、手助けが要る人を見落とさずに居場所へ通し、正しい名簿を残す"
          - title: "誰のため"
            body: "避難してくる人(高齢の人、障害のある人、乳幼児のいる家族、日本語を読めない人も)と、受付に立つ人"
          - title: "計画の終わりにできるもの"
            body: "受付の手順書、受付カード、係の役目と、数ごとに元にした記録と理由を書いた見積もりの表"
          - title: "届いたかの確かめ方"
            body: "要件に届いたかは、避難所開設訓練で測る。屋根の下に入るまでの時間、見落とした人の数など"
      - type: table
        caption: 受付を設計する手順と、できるもの
        head:
          - 手順
          - できるものの形
          - 工程
        rows:
          - - 1. 自治体の様式と過去の記録を読む
            - 受付の仕事の一覧
            - 工程1
          - - 2. 避難所開設訓練を見学し、運営に関わる人に聞く
            - 時刻つきの観察の記録、ペルソナ
            - 工程1
          - - 3. 列の長さを見積もり、要件の数字にする
            - 見積もりの表(着く速さ、1世帯の時間、窓口の数、稼働率)、要件
            - 工程2と5
          - - 4. 電気がなくても動く案を出し、選ぶ
            - 案の一覧、比較の表
            - 工程3と4
          - - 5. 入口で聞く問いを絞る
            - 問いの一覧(残した理由、言い方、答えごとの行き先)
            - 工程4と5
          - - 6. 受付カードの欄を選ぶ
            - 受付カードの案、欄ごとの使い道の表、しまい方の決まり
            - 工程5
          - - 7. 受付の流れと係の役目を書く
            - 受付の流れの表、係ごとの役目のカード
            - 工程5
          - - 8. 避難所開設訓練で試して直す
            - 測った結果の表、直した受付の手順書
            - 工程5の後。結果に応じて前の手順に戻る

  - id: documents
    step: 1
    heading: 資料を読んで訓練を見学する
    blocks:
      - type: point
        text: 着く速さは過去の記録から、1世帯の時間は訓練の見学から取ります。列の長さと係の人数は、この2つから計算します。
      - type: p
        text: 自治体の避難所運営のマニュアルと受付の様式、内閣府のガイドライン、避難所を開いた自治体の記録を読み、受付の仕事を「記録する」「行き先を決める」「案内する」「報告する」のように動詞で書き出します。記録からは避難する人が集中した時間帯を、マニュアルからは市の災害対策本部へ人数を報告する間隔を読み取ります。
        note: "[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)"
      - type: p
        text: 受付には、要配慮者(高齢者、障害者、乳幼児など、災害のときに特に配慮が要る人を指す災害対策基本法の言葉)を見つける役目があります。この計画では、妊産婦や日本語を読めない人を含めて考えます。
        note: 法律の定義は「高齢者、障害者、乳幼児その他の特に配慮を要する者」。[災害対策基本法 第8条第2項第17号(e-Gov法令検索)](https://laws.e-gov.go.jp/law/336AC0000000223)
      - type: example
        kind: real
        title: 西日本豪雨で倉敷市が開いた避難所
        text: 2018年の西日本豪雨(平成30年7月豪雨)で、倉敷市の避難所は最大で72か所、避難した人は最大で約5,500人になりました。真備地区の中で浸水に対応できる指定避難所は3か所だけだったため、市内の他の地区の避難所や、総社市が開いた避難所でも、真備地区の人を受け入れました。高齢者や障害のある人など配慮の必要な人を受け入れる避難所(最大24人)と、ペットと一緒に避難できる避難所(最大26人)も、別に開きました。
        source: "[倉敷市『平成30年7月豪雨災害から復興への記録』第5章(2020年)](https://www.city.kurashiki.okayama.jp/_res/projects/default_project/_page_/001/013/553/5syou.pdf)"
      - type: p
        text: 避難所が分かれ、同じ避難所の中に配慮のための場所があるなら、受付は着いた人の様子を聞いて行き先を決める「振り分け」の場所になります。居場所はいったん決まると、後から動いてもらうのが難しくなります。
        note: 内閣府のガイドラインは、いったん「場所取り」が始まると再配置はとても難しいとし、配慮が必要な人の場所を事前に決めておくよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)
      - type: p
        text: 地域の避難所開設訓練は、主催する人の許可を得て見学し、世帯が着いた時刻と1世帯が机に着いてから離れるまでの時間を[[problem-finding#listen|記録します]]。訓練の後に市や体育館の担当から入口の広さと停電のときの備えを聞き、記録からは、立って待っていられる時間を入れたペルソナ(避難する側と受付に立つ側)を書きます。

  - id: queue
    heading: 列の長さを見積もる
    blocks:
      - type: point
        text: 1時間に着く世帯の数と、1時間に受け付けられる世帯の数を比べ、列が伸び続けるかを計算します。稼働率が1に近いと、いったんできた列はなかなか縮まりません。
      - type: p
        text: まず今の受付のままで列が伸び続けるかを計算し、次に入口の仕事をどこまで減らせば伸び続けずに済むかを、数にして確かめます。
      - type: table
        caption: 見積もりに使う数と、どこから得るか
        head:
          - 数
          - 意味
          - どこから得るか
          - 気をつけること
        rows:
          - - 着く速さλ
            - 1時間に入口へ着く世帯の数
            - 自治体の記録(避難した人の数と時間帯)、市が想定する避難者の数
            - 1日の平均ではなく、一番多く着く1時間の数を使う
          - - 1世帯の時間s
            - 1世帯が入口の机に着いてから離れるまでの分数
            - 訓練の観察の記録(その間にしていることごとの時間)
            - 訓練の参加者は手順に慣れている。本番は雨にぬれ、質問が増える
          - - 窓口の数c
            - 同時に受け付ける机や係の数
            - 入口と雨よけの屋根の広さ(訓練の後の聞き取り)、集められる係の数
            - 窓口を増やすと、机と明かりと係が要る
      - type: p
        text: 1つの窓口が1時間に受け付けられる世帯の数を、処理の速さμといいます。μは、60分を1世帯の分数sで割った数です。窓口がc個なら、入口全体では1時間にc×μ世帯を受け付けられます。この受け付ける力のうち、実際に使っている割合が稼働率ρです。式で書くと、ρ=λ÷(c×μ)になります。
      - type: p
        text: ρが1を超えるなら、着く世帯の数が受け付けられる数を上回るので、列は1時間に(λ−c×μ)世帯ずつ伸び続けます。最後尾に着いた世帯の待ち時間は、前に並んでいる世帯の数を、1時間に受け付けられる数c×μで割ると見積もれます。この待ち時間とペルソナの「立って待っていられる時間」を比べれば、立っていられない人が出るかが分かります。
      - type: heading
        text: 稼働率に余裕を残す
      - type: p
        text: 人は決まった間隔では着きません。車が続けば、数世帯がまとまって着きます。まとまって着いたときにできた列は、処理の速さに余裕があるときだけ縮み、余裕が小さいほど縮むのに時間がかかります。このような列の性質は、**待ち行列理論**で扱います。
      - type: p
        text: 一番簡単な待ち行列のモデル(窓口が1つで、着く間隔も1世帯の時間も指数分布に従ってばらつくとするモデル。M/M/1と呼ぶ)では、並んで待つ世帯の平均の数はρ²÷(1−ρ)になります。ρが0.5なら0.5世帯、0.8なら3.2世帯、0.9なら8.1世帯で、1に近づくほど急に増えます。車でまとまって着くと、列はこのモデルより長くなります。着く速さと受け付ける速さが「ちょうど同じ」では足りないので、稼働率に余裕を残します。どこまで残すかは、この章の終わりで要件にします。
      - type: p
        text: 待ち時間と列の長さは、2つの式でつながります。最後尾の世帯の待ち時間は、前に並ぶ世帯の数をc×μで割った値なので、許せる列の長さは「立って待っていられる時間×c×μ」です。平均どうしでは、リトルの法則(並ぶ世帯の平均の数=着く速さλ×平均の待ち時間)が成り立ちます。平均を上限に合わせると、それより長く待つ世帯が出るので、上限には最後尾の式を使います。
      - type: heading
        text: 入口から動かせる仕事を探す
      - type: p
        text: 稼働率を下げるには、入口の1世帯の時間sを短くします。資料から書き出した受付の仕事を「記録する」「行き先を決める」「案内する」のような、[[requirements#functions|IDEF0]]で描ける機能の箱に分け、箱ごとに次のことを確かめます。
      - type: list
        items:
          - その箱の出力を、誰が、いつまでに使うか(次の箱がすぐ要るのか、マニュアルで読んだ報告の間隔に間に合えばよいのか)
          - 後に回すと、取り戻せなくなるものはあるか(居場所が埋まる、急ぐ手当てが遅れる、など)
          - その箱の入力は、入口にしかないか(着いた本人がいれば、入口の外でもできるか)
          - 見学で測った1世帯の時間のうち、どれだけがその箱の分か
      - type: p
        text: 出力をすぐ使い、後に回すと取り戻せない箱は、入口に残す候補です。出力を使うまでに時間の余裕があり、入力が入口の外でもそろう箱は、入口から動かせる候補です。どちらに入るかは避難所によって変わります。
      - type: heading
        text: 動かした先の列を確かめる
      - type: p
        text: 動かせる候補にした仕事を入口から外すと、入口の1世帯の時間sが短くなり、稼働率が下がります。区分の候補ごとにsを見積もり直し、稼働率と、列が伸び続けるかを見積もりの表に書きます。この表が、要件の数字と係の人数の元になります。
      - type: p
        text: ただし、動かした仕事にも窓口が要ります。動かした先で係が1世帯ずつ順に受け付ける形なら、そこにも同じ計算をします。世帯が自分で受付カードを書き、係は書き終えたカードを確かめるだけなら、係の時間は確かめる分だけで計算します。字を書けない人や日本語を読めない人には係が代わりに書くので、その分の時間が加わります。その割合は訓練で確かめるまで分からないので、見積もりの表に「確かめていない数」と印を付けます。
      - type: heading
        text: 見積もりを要件の数字にする
      - type: p
        text: 「早く中に入りたい」は、「着いてから屋根の下に入るまで◯分以内」と書き直して[[requirements|要件]]にします。この時間は、ペルソナが立って待っていられる時間を上限にし、列で待つ時間と入口で聞かれる時間を足しても、その中に収まるようにします。入口で1世帯にかける時間は、見積もりの表で、稼働率に余裕が残る値を選びます。
      - type: p
        text: 「見落とさず」と「名簿を残す」は、訓練で数えられる要件にします。手助けが要る人の見落としの数は、配慮のための場所を誰に使ってもらうかの市の決まりを元にし、人数の報告をまとめる時間は、市の災害対策本部へ報告する間隔に合わせます。初めての人が係を務めるまでの説明の時間は、受付に立つ側のペルソナから見積もります。

  - id: questions
    heading: 入口で聞く問いを絞る
    blocks:
      - type: p
        text: 避難所では、停電、通信の混雑、充電の切れた電話、スマートフォンを持たずに来る人、雨にぬれた手のように、アプリの受付が前提にすることが崩れる場合があります。停電を制約にするかは体育館の担当に聞いた電源と明かりの備えから判断し、制約にするなら、紙・配置・掲示・係の分け方のように電気がなくても動く案を、[[ideation#chart|機能ごとに]]出します。
      - type: p
        text: 入口で聞く問いの候補は、自治体の様式の欄と、配慮のための場所を誰に使ってもらうかの市の決まりから集め、答えで行き先が変わるか、後に回すと取り戻せないかを基準に、入口で聞くか後で受付カードに書くかに分けます。入口に残した問いの秒数の合計が、要件の「入口で1世帯にかける時間」に収まらなければ、問いをまとめるか窓口の数を見直します。
      - type: p
        text: 問いは「この中に、歩くのに手助けが要る人はいますか」のように、世帯の中の誰かについて聞く形にします(代表者に「手助けが要りますか」と聞くと、代表者が自分のことだと受け取り、家族の中の手助けが要る人が抜ける恐れがあるため)。答えに迷う人をどちらへ通すかは、間違えて通したときに後から移ってもらう難しさを、体育館の配置と聞き取りの記録から比べて決めます。

  - id: card
    step: 5
    heading: 受付カードの欄を選ぶ
    blocks:
      - type: point
        text: 持病などの扱いに気をつける欄は、見てよい係としまう場所を先に決めてから置きます。
      - type: p
        text: 受付カードは、名簿の元になる記録です。欄を増やすほど書く時間が延び、扱いに気をつける情報が増えます。欄を決めずに白紙に書いてもらうと、書く中身が人によって変わり、人数を数えるのに時間がかかります。書く時間と名簿の漏れ、人数の報告をまとめる時間は、開設訓練で、このカードを使って測ります。
      - type: heading
        text: 名簿の使い道から欄をたどる
      - type: p
        text: まず、名簿の使い道を並べます。物資の数を決めること、安否の問い合わせに答えること、市の災害対策本部へ人数を報告すること、配慮が要る人を保健師などの係へつなぐことの4つです。使い道ごとに、そのために要る情報を書き出すと、欄の候補になります。入口では聞かないことにした問いは、ここで欄の候補に入ります。
      - type: p
        text: 候補の中には、持病や障害のように、個人情報保護法の「要配慮個人情報」(病歴など、不当な差別や偏見が生じないよう、取り扱いに特に配慮が要る情報)に当たるものがあります。名前の似た「要配慮者」とは別の言葉です。名簿と受付カードを見られる人の範囲は、個人情報保護法と市の決まりに合わせる制約として扱います。
        note: 要配慮個人情報の定義は[個人情報保護法 第2条第3項(e-Gov法令検索)](https://laws.e-gov.go.jp/law/415AC0000000057)。
      - type: table
        caption: 欄の候補ごとに確かめること
        head:
          - 書くこと
          - 確かめること
        rows:
          - - 使い道
            - 名簿の4つの使い道のどれのための欄か
          - - いつ要るか
            - 着いてすぐ要るか、後でよいか。すぐ要るなら、入口の問いで足りていないか
          - - 誰が見るか
            - 記録の係だけか、配慮に必要な係(保健師など)も見るか
          - - 書き方
            - チェックや丸で答えられるか。字を書けない人や日本語を読めない人も答えられるか
          - - 扱いの決まり
            - 要配慮個人情報に当たるか。安否の問い合わせに答えてよいかを、本人に聞く欄が要るか
      - type: heading
        text: しまい方の決まり
      - type: p
        text: 欄と一緒に、次のことを手順書に書きます。
      - type: list
        items:
          - 受付カードを見てよい係を、役目ごとに決める
          - カードをしまう場所と、その場所から持ち出してよいかを決める
          - 名簿を、他の避難者の目に触れる場所に置かない
          - 安否の問い合わせに、誰の、どの情報を答えるかと、本人の意向の確かめ方を決める
          - 手助けが要ることの中身を、どの係にまで伝えるかを決める
          - 避難所を閉じるときのカードの扱い(市に渡すか、いつ処分するか)を、市の決まりに合わせる

  - id: drill
    heading: 訓練で受付の流れを試す
    blocks:
      - type: p
        text: 受付の流れは、場所ごとに、やることと担当、目安の時間、使うものを書いた表にします。目安の時間を合計し、係ごとの稼働率を、列の長さの見積もりと同じ計算で確かめます。係の役目は、交代した人が受け取るだけで続けられるように、迷ったときの決まりと見てよい情報まで書いたカードに、係ごとにまとめます。
      - type: p
        text: 手順書の案は、[[detailing#review|市や地域の人に見てもらって]]から、参加者に車いすを使う人や日本語を読めない人などの役を割り当てた避難所開設訓練で試し、要件を一つずつ測ります。手助けが要る役を何人に割り当てたかは係に知らせず、通した先と突き合わせて見落とした人数を数え、要件に届かなければその数字を出した手順に戻ります。
        note: 内閣府のガイドラインも、避難者の受付と名簿の作成について実動訓練を行い、個人情報保護と安否確認の知識を共有するよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)

related:
