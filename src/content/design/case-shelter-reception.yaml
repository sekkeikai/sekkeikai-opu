title: 防災
en: "Case: Disaster Preparedness"
layer: case
order: 5
short: 手順の設計
question: 雨の中で人が次々に着く避難所の受付を、どう設計するか
summary: 避難所の受付を例に、列ができる場所を確かめ、待ち時間を見積もり、入口で聞くことを選び、訓練で試して手順書にするまでの手順を示す。
lead: 例えば、設計会で、大学の体育館を避難所として開くときの受付を設計するとしましょう。目指すのは、雨の中で着いた人を長く待たせず、手助けが要る人を見落とさずに居場所へ通し、名簿を残すことです。道具を選ぶ前に、資料と訓練の見学で受付の仕事を確かめ、列の長さを見積もってから、入口の問い、受付の流れ、受付カードを決めて、訓練で試します。その手順を行う順に、計画として示します。
chapters:
  - id: goal
    heading: "目指すのは、待たせず、見落とさず、居場所へ通すこと"
    blocks:
      - type: point
        text: "この設計の目的は、雨の中で着いた人を長く待たせず、手助けが要る人を見落とさずに居場所へ通し、正しい名簿を残すことです。計画の終わりには、初めて受付に立つ人でも動ける受付の手順書と、受付カードができます。"
      - type: cards
        items:
          - title: "目的"
            body: "着いた人を長く待たせず、手助けが要る人を見落とさずに居場所へ通し、正しい名簿を残す"
          - title: "誰のため"
            body: "避難してくる人(高齢の人、障害のある人、乳幼児のいる家族、日本語を読めない人も)と、受付に立つ人"
          - title: "計画の終わりにできるもの"
            body: "受付の手順書、受付カード、係の役目"
          - title: "届いたかの確かめ方"
            body: "避難所開設訓練で測る要件(屋根の下に入るまでの時間、見落とした人の数など)。何を測るかは、要件を決める手順で決める"
      - type: p
        text: "この目的は、3つに分けて考えられます。「待たせず」は[[case-shelter-reception#queue|列の見積もり]]で、「見落とさず」は[[case-shelter-reception#questions|入口の問い]]で、「名簿を残す」は[[case-shelter-reception#card|受付カードの欄]]で、それぞれ具体的な決めごとになります。どれをどこまで満たせばよいかは、[[case-shelter-reception#requirements|要件]]で決めます。"

  - id: overview
    label: 手順の一覧
    heading: 受付の設計は、12の手順で進める
    blocks:
      - type: point
        text: 手順は、行う順に12あります。1つの工程にはっきり入る手順もあれば、2つの工程にまたがる手順もあります。時間をかけるのは、列ができる場所の確認、列の見積もり、入口の問い、受付カードの欄、訓練の5つです。
      - type: table
        caption: 受付を設計する手順と、できるものの形
        head:
          - 手順
          - できるものの形
          - 工程
        rows:
          - - 1. 自治体の様式と過去の記録を読む
            - 受付の仕事の一覧(動詞で書き、誰が・いつ・何を使うかを並べる)
            - 1 問題発見
          - - 2. 避難所開設訓練を見学し、運営に関わる人に聞く
            - 時刻つきの観察の記録、聞き取りの記録
            - 1 問題発見
          - - 3. 気付きをKJ法でまとめ、問題を一文にする
            - 問題の一文、ペルソナ(避難する側と、受付に立つ側)
            - 1 問題発見
          - - 4. 受付の仕事をIDEF0で描く
            - IDEF0の図、箱ごとに「入口に残すか、動かせるか」を分けた表
            - 1と2にまたがる
          - - 5. 列の長さを見積もる
            - 見積もりの表(着く速さ、1世帯の時間、窓口の数、稼働率=受け付ける力のうち使っている割合)
            - 2と5にまたがる
          - - 6. 要件を表にする
            - 要件の表(測ること、数字の元、確かめ方)
            - 2 要件定義
          - - 7. 制約から方向を決め、案を出す
            - 案の一覧(どの箱の案か、電気や通信が要るか)
            - 3 発想
          - - 8. ふるいにかけ、比べて選ぶ
            - 比較の表、選んだ理由、選ばなかった理由
            - 4 評価・選定
          - - 9. 入口で聞く問いを決める
            - 問いの一覧(残した理由、言い方、答えごとの行き先)
            - 4と5にまたがる
          - - 10. 受付の流れと係の役目を決める
            - 受付の流れの表、係ごとの役目のカード
            - 5 詳細設計
          - - 11. 受付カードの欄を決める
            - 受付カードの案、欄ごとの使い道の表、しまい方の決まり
            - 5 詳細設計
          - - 12. 避難所開設訓練で試して直す
            - 測った結果の表、直した受付の手順書
            - 結果に応じて、前の手順に戻る

  - id: documents
    step: 1
    heading: 自治体の様式と過去の記録を読み、受付の仕事を書き出す
    blocks:
      - type: point
        text: 道具を選ぶ前に、受付が何をする場所かを資料で確かめます。読むのは、自治体の様式とマニュアル、内閣府のガイドライン、実際に避難所を開いた自治体の記録です。受付の仕事を動詞で1つずつ書き出し、一覧にします。
      - type: p
        text: 「受付をアプリにすれば速くなる」は、受付が何をする場所かを確かめる前に浮かぶ答えです。道具を先に決めると、その道具が扱えない仕事が抜け落ちます。だから最初に、受付が担う仕事を、既にある資料から書き出します。
      - type: p
        text: 避難所の受付は、着いた人の名前と人数を記録し、居場所へ案内する仕事です。名簿は、物資の数を決め、安否の問い合わせに答え、市の災害対策本部へ人数を報告する元になります。受付ではもう一つ、要配慮者を見つけることが大事です。要配慮者は、高齢者、障害者、乳幼児など、災害のときに特に配慮が要る人を指す、災害対策基本法の言葉です。この計画では、妊産婦や日本語を読めない人も含めて考えます。
        note: 法律の定義は「高齢者、障害者、乳幼児その他の特に配慮を要する者」。[災害対策基本法 第8条第2項第17号(e-Gov法令検索)](https://laws.e-gov.go.jp/law/336AC0000000223)
      - type: question
        text: 受付をアプリにすれば、速くなるのでは?
        answer: 速くなるかは、前提しだいです。全員がスマートフォンを持ち、電気と通信が使えるなら、速くなります。避難所では、停電、通信の混雑、充電の切れた電話、スマートフォンを持たずに来る人、雨にぬれた手のように、その前提が崩れることがあります。だから道具を選ぶ前に、受付が何をする場所で、どんな前提で動くかを確かめます。
      - type: heading
        text: 様式は、欄の中身と、いつ書く欄かを読む
      - type: p
        text: 読む資料は3種類です。自治体が公開している避難所運営のマニュアルと、受付で使う様式。内閣府の「避難所運営等避難生活支援のためのガイドライン」。そして、実際に避難所を開いた自治体の記録です。
        note: "[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)"
      - type: p
        text: 様式では、欄の中身に加えて、どの欄を、いつ、誰が書く決まりかを読みます。着いてすぐ全部の欄を書く形なら、入口に仕事が集まる形です。配慮が要るかを聞く欄が何番目にあり、誰がその答えを見るのかも確かめます。マニュアルでは、受付の係の人数、机を置く場所、市の災害対策本部へ人数を報告する間隔を読みます。報告の間隔は、名簿をいつまでにまとめればよいかを決める元になります。
      - type: p
        text: 過去の記録では、決められた手順より、実際に起きたことを読みます。何か所の避難所に何人が身を寄せたか、避難する人がどの時間帯に集中したか、配慮のための場所をどう分けたか。避難する人の数と時間帯は、手順5で「1時間に何世帯が着くか」を見積もる元になります。
      - type: example
        kind: real
        title: 西日本豪雨で倉敷市が開いた避難所
        text: 2018年の西日本豪雨(平成30年7月豪雨)で、倉敷市の避難所は最大で72か所、避難した人は最大で約5,500人になりました。真備地区の中で浸水に対応できる指定避難所は3か所だけだったため、市内の他の地区の避難所や、総社市が開いた避難所でも、真備地区の人を受け入れました。高齢者や障害のある人など配慮の必要な人を受け入れる避難所(最大24人)と、ペットと一緒に避難できる避難所(最大26人)も、別に開きました。
        source: "[倉敷市『平成30年7月豪雨災害から復興への記録』第5章(2020年)](https://www.city.kurashiki.okayama.jp/_res/projects/default_project/_page_/001/013/553/5syou.pdf)"
      - type: p
        text: 避難所が分かれ、同じ避難所の中にも配慮のための場所があるなら、着いた人をどこへ案内するかを、誰かが入口で決めることになります。このとき受付は、名前を書いてもらう場所であると同時に、着いた人の様子を聞いて行き先を決める「振り分け」の場所にもなります。そして、居場所はいったん決まると、後から動いてもらうのが難しくなります。
        note: 内閣府のガイドラインは、いったん「場所取り」が始まると再配置はとても難しいとし、配慮が必要な人の場所を事前に決めておくよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)
      - type: heading
        text: 書き出した仕事は、一覧の形にそろえる
      - type: p
        text: 読みながら、受付の仕事を「記録する」「行き先を決める」「案内する」「報告する」のように、動詞で1つずつ書き出します。仕事ごとに、誰が、いつ、何を使ってするかと、どの資料に書いてあるかを並べます。資料によって書き方が違う仕事は、違いのまま残します。この一覧は、手順2の見学で「資料に書かれていない仕事」を見つける手がかりになり、手順4でIDEF0の図を描くときの箱の材料になります。

  - id: observe
    step: 1
    heading: 訓練を見学し、列ができる場所と後回しになる人を記録する
    blocks:
      - type: point
        text: 資料には、人がどこで何分待つかまでは書かれていません。避難所開設訓練を見学して、列ができる場所、1世帯にかかる時間、長く立って待つ人を記録します。見学の後に、運営に関わる人に話を聞きます。
      - type: p
        text: 資料で分かるのは、決められた手順です。手順通りに動いたときに人がどこで止まるかは、動いている受付を見て確かめます。そこで、地域で開かれる避難所開設訓練(地域の人や職員が、避難所を開く手順を実際に試す訓練)を、主催する人の許可を得て見学します。見学では、写真や名前を記録せず、時刻と人の動きだけを書きます。
      - type: heading
        text: 時刻と一緒に、その間に何をしているかを書く
      - type: list
        items:
          - 世帯が入口に着いた時刻(1世帯ずつ書く。まとまって着くかが分かる)
          - 列の先頭と最後尾の位置と、並んでいる世帯の数(5分ごとに数える)
          - 1世帯が受付の机に着いてから離れるまでの時間(ストップウォッチで測る)と、その間にしていること(書く、ペンを待つ、質問する、係が様式を探す)
          - 長く立って待つのは誰か(杖をつく人、子供を抱く人、言葉が通じにくい人)と、立っている時間
          - 配慮が要るかを、いつ、誰が聞くか。聞かれないまま中に入る人がいるか
          - 係が迷う場面(手順書を見返す、他の係に聞く、受付を止める)
          - 入口の段差、雨と風の向き、机と明かりの位置
      - type: p
        text: "記録には、見たこと(書き方の例: 「杖をつく人が、机の前で8分立つ」)と、そこから考えたこと(「座って待てる場所が要るのでは」)を分けて書きます。混ぜて書くと、後でまとめるときに、事実と思いつきの区別がつかなくなります。"
      - type: p
        text: 訓練は、参加者の数も天気も本番と違います。だから時間は1世帯あたりで記録し、手順5で本番の人数に当てはめて計算し直します。1世帯の時間は、平均だけでなく、一番長くかかる世帯と、その間に何をしているかも残します。長くかかる世帯がしていることの中に、入口から動かせる仕事の手がかりがあります。
      - type: heading
        text: 見学の後に、運営に関わる人に「この前」のことを聞く
      - type: p
        text: 見学だけでは、本番の避難所でしか起きないことが分かりません。そこで、避難所の運営に関わる人に話を聞きます。聞く相手は、市の防災の担当、地域の自主防災組織(住民が自分たちで防災に取り組む組織)の人、大学で体育館を管理する担当、要配慮者の支援に関わる保健師や福祉の担当、日本語を母語としない留学生などです。
      - type: p
        text: 聞くのは、意見や予想より、実際にあったことです。「受付はアプリのほうが良いと思うか」と聞く代わりに、「前回の訓練で、受付で一番時間がかかったのはどこか」「中に入った後で、居場所を移ってもらった人はいるか。それはなぜか」と聞きます。体育館の担当には、入口の数、段差のない入口、停電のときに使える明かりと電源を聞きます。
        note: 聞き取りで実際にあったことを聞く理由は、[[problem-finding#listen|「もしも」ではなく「この前」を聞く]]に書いています。
      - type: p
        text: 聞いた話も、見たことと同じように、1つの事実を1枚のカードに書ける形で残します。話した人の名前は書かず、「市の防災の担当」のように立場だけを書きます。この手順でできるのは、時刻つきの観察の記録と、聞き取りの記録です。どちらも手順3でカードにし、時刻と時間の数字は手順5の見積もりに使います。

  - id: problem
    step: 1
    heading: 気付きをKJ法でまとめ、問題を一文にする
    blocks:
      - type: point
        text: 資料・見学・聞き取りの気付きを1枚ずつカードに書き、まとまりに分けます。一番大きく深刻なまとまりから、問題の一文と、避難する側と受付に立つ側のペルソナを書きます。この2つが、後の手順の出発点になります。
      - type: p
        text: 3つの手がかりから集まった気付きは、そのままでは量が多く、ばらばらです。気付きをカードに1枚ずつ書き出し、[[problem-finding#kj|KJ法]](似たカードを集めて、まとまりから問題を見つける方法)で整理します。カードには見たことを書き、まとまりに付ける名前に、そこから考えたことを書きます。
      - type: steps
        items:
          - title: カードを1枚1つの事実にする
            body: 見たこと・聞いたことを、1枚に1つだけ書きます。「列が長い」のような感想ではなく、どこで、誰が、何をして、どれだけかかるかを入れます。どの資料・見学・聞き取りから来たかも書き添えます。
          - title: 黙って並べ、近いカードを寄せる
            body: 分類の名前を先に決めず、似ていると感じるカードを近くに置きます。枠を先に決めると、枠に合わない事実が捨てられます。並べる間は話さず、一人ひとりがカードを動かします。
          - title: まとまりに名前を付ける
            body: 名前は「受付」のような名詞1つではなく、「誰が、どこで、どうなる」の一文にします。一文にすると、まとまりがそのまま問題の形に近づきます。
          - title: まとまりどうしの関係を描く
            body: 原因と結果、対立などを矢印でつなぎます。他のまとまりの原因になっているまとまりが、問題の芯の候補です。
          - title: 大きさと深刻さで1つ選ぶ
            body: カードの数(どれだけ起きるか)と、深刻さ(命や健康に関わるか、後から取り戻せるか)を並べて、問題にするまとまりを選びます。選ばなかったまとまりも、要件や案の手がかりとして残します。
      - type: heading
        text: 問題の一文には、解決策を入れない
      - type: p
        text: 問題の一文には、「誰が、どんな場面で、何に困っているか」を書きます。「受付にアプリがない」のように解決策の欠けた形で書くと、答えがアプリに決まってしまいます。困っている人と場面と困りごとだけを書けば、紙・配置・係の分け方など、いくつもの方向の案を後で出せます。一文にまとめにくいときは、[[problem-finding#why-why|「なぜ」を繰り返して]]原因をたどります。
      - type: heading
        text: ペルソナには、後で数字の元になる項目を書く
      - type: p
        text: ペルソナ(想定する人物像)は、カードに書いた事実から組み立てます。思いつきで書き足すと、後の数字の元が確かめられなくなります。避難する側と、受付に立つ側の両方を書き、項目ごとに、どのカードから来たかを書き添えます。
      - type: table
        caption: ペルソナに書く項目と、後の手順での使い道
        head:
          - 項目
          - 書くこと
          - 使う手順
        rows:
          - - "避難する側: 体の状態"
            - 立って待っていられる時間、段差や長い距離を歩けるか
            - 手順6(屋根の下に入るまでの時間の要件)
          - - "避難する側: 誰と来るか"
            - 1人か家族か、付き添いがいるか、ペットがいるか
            - 手順9(世帯の中の誰について聞くか)
          - - "避難する側: 持ち物"
            - スマートフォンの有無と充電、筆記具、雨具
            - 手順7(電気や通信に頼る案が使えるか)
          - - "避難する側: 言葉"
            - 日本語を読めるか、話せる言葉
            - 手順9と10(問いの言い方、掲示)
          - - "受付に立つ側: 経験"
            - 受付をしたことがあるか、手順をいつ知るか
            - 手順6(説明の時間の要件)、手順10
          - - "受付に立つ側: 状況"
            - 交代の間隔、他に抱えている仕事
            - 手順10(役目のカード)
      - type: p
        text: ペルソナは、1人を深く書きます。いろいろな人の平均を書くと、誰にも当てはまらない人物になり、数字の元に使えません。目的の一つが「見落とさず」なので、避難する側のペルソナには、手助けが要る人を1人は選びます。

  - id: functions
    label: 工程1と2にまたがる
    heading: 受付の仕事をIDEF0で描き、入口から動かせる仕事を探す
    blocks:
      - type: point
        text: 手順1で書き出した受付の仕事を、IDEF0で図にします。箱ごとに「その出力を、誰が、いつまでに使うか」を確かめ、入口に残す仕事と、入口から動かせる仕事を分けます。
      - type: p
        text: 手順3の問題の一文とペルソナは、受付のどこで困りごとが起きるかを示します。それを直す手がかりを得るには、受付の仕事を一つひとつに分け、それぞれが何を受け取り、何を生むかを見ます。そのための図が、[[requirements#functions|IDEF0]]です。IDEF0は、機能を箱で表し、左から入る入力、右へ出る出力、上から入る制御(決まりや条件)、下から入る機構(人や道具)を矢印で描く図です。
      - type: p
        text: 最初に描くのは、新しい受付ではなく、今の受付です。手順1の様式と、手順2の見学で見た順に、仕事を箱にして並べます。例えば様式が、着いてすぐ全部の欄を書く形なら、今の受付は次のように描けます。
      - type: idef0
        title: 今の受付をIDEF0で描く(描き方の見本)
        caption: 様式が、着いてすぐ全部の欄を書く形の場合。全体の箱を3つの仕事に分け、今のやり方の順に並べている。どの箱を入口から動かせるかは、この図の上で考える。
        function: 避難した人を受け付ける
        inputs:
          - 着いた人
        controls:
          - 避難所運営の手順
          - 個人情報の決まり
        outputs:
          - 居場所に着いた人
          - 避難者名簿
        mechanisms:
          - 受付の係
          - 受付の様式
          - 案内の掲示
        steps:
          - name: 様式に記録する
            output: 記録を終えた人
          - name: 行き先を決める
            output: 行き先の決まった人
          - name: 居場所へ案内する
            output: 居場所に着いた人
      - type: heading
        text: 箱ごとに、出力を使う時期と、入口でしかできないかを確かめる
      - type: table
        caption: 箱ごとに確かめる問いと、調べる場所
        head:
          - 問い
          - 見ること
          - どこで調べるか
        rows:
          - - その箱の出力を、誰が、いつまでに使うか
            - 次の箱がすぐ要るのか、報告の間隔に間に合えばよいのか
            - 手順1のマニュアル(報告の間隔)
          - - 後に回すと、取り戻せなくなるものはあるか
            - 居場所が埋まる、急ぐ手当てが遅れる、など
            - 手順1の記録と内閣府のガイドライン、手順2の聞き取り
          - - その箱の入力は、入口にしかないか
            - 着いた本人がいれば、入口の外でもできる仕事か
            - 手順2の観察の記録
          - - その箱に、1世帯でどれだけ時間がかかるか
            - 見学で測った1世帯の時間のうち、どの箱の分か
            - 手順2の観察の記録
      - type: p
        text: 出力をすぐ使い、後に回すと取り戻せない箱は、入口に残す候補です。出力を使うまでに時間の余裕があり、入力が入口の外でもそろう箱は、入口から動かせる候補です。どの箱がどちらに入るかは、資料と見学の記録しだいで、避難所によって変わります。だから区分には、理由と、元にした記録を書き添えます。
      - type: p
        text: この図では、まだ道具を決めません。機構の「受付の様式」が紙かアプリかは、手順8で選びます。道具を決めずに機能だけを描くと、アプリ以外の案も同じ図の上で考えられます。この手順でできるのは、IDEF0の図と、箱ごとの区分の表です。区分の表は、手順5で「入口の仕事を減らすと、列がどう変わるか」を計算するときの元になります。

  - id: queue
    label: 工程2と5にまたがる
    heading: 着く速さと処理の速さから、列が伸び続けるかを見積もる
    blocks:
      - type: point
        text: 1時間に着く世帯の数と、1時間に受け付けられる世帯の数を比べ、列が伸び続けるかを計算します。稼働率が1に近いと、いったんできた列はなかなか縮まりません。この見積もりが、要件の数字と係の人数の元になります。
      - type: p
        text: IDEF0の区分で、入口から動かせる仕事の候補が分かります。では、入口の仕事をどこまで減らせば、列が伸び続けずに済むのか。それを数で確かめるのが、この手順です。勘で「係を増やせばよい」と決めると、雨の中に机と明かりがいくつ要るかが見えないまま当日を迎えます。
      - type: heading
        text: 使う数は3つで、どれも前の手順から来る
      - type: table
        caption: 見積もりに使う数と、どこから得るか
        head:
          - 数
          - 意味
          - どこから得るか
          - 気をつけること
        rows:
          - - 着く速さλ
            - 1時間に入口へ着く世帯の数
            - 手順1の記録(避難した人の数と時間帯)、市が想定する避難者の数
            - 1日の平均ではなく、一番多く着く1時間の数を使う
          - - 1世帯の時間s
            - 1世帯が入口の机に着いてから離れるまでの分数
            - 手順2の観察の記録、IDEF0の箱ごとの時間
            - 訓練の参加者は手順に慣れている。本番は雨にぬれ、質問も増える
          - - 窓口の数c
            - 同時に受け付ける机や係の数
            - 入口と雨よけの屋根の広さ(手順2の聞き取り)、集められる係の数
            - 窓口を増やすと、机と明かりと係も増える
      - type: p
        text: 1つの窓口が1時間に受け付けられる世帯の数を、処理の速さμといいます。μは、60分を1世帯の分数sで割った数です。窓口がc個なら、入口全体では1時間にc×μ世帯を受け付けられます。この受け付ける力のうち、実際に使っている割合が稼働率ρです。式で書くと、ρ=λ÷(c×μ)になります。
      - type: p
        text: ρが1を超えるなら、着く世帯の数が受け付けられる数を上回るので、列は1時間に(λ−c×μ)世帯ずつ伸び続けます。最後尾に着いた世帯の待ち時間は、前に並んでいる世帯の数を、1時間に受け付けられる数c×μで割ると見積もれます。この待ち時間とペルソナの「立って待っていられる時間」を比べれば、立っていられない人が出るかが分かります。
      - type: heading
        text: 稼働率が1より小さくても、1に近いと列はなかなか縮まない
      - type: p
        text: 人は決まった間隔では着きません。車が続けば、数世帯がまとまって着きます。まとまって着いたときにできた列は、処理の速さに余裕があるときだけ縮み、余裕が小さいほど縮むのに時間がかかります。このような列の性質を扱うのが、**待ち行列理論**です。
      - type: p
        text: 一番簡単な待ち行列のモデル(窓口が1つで、着く間隔も1世帯の時間も指数分布に従ってばらつくとするモデル。M/M/1と呼ぶ)では、並んで待つ世帯の平均の数はρ²÷(1−ρ)になります。ρが0.5なら0.5世帯、0.8なら3.2世帯、0.9なら8.1世帯で、1に近づくほど急に増えます。車でまとまって着くと、列はこのモデルより長くなります。だから、着く速さと受け付ける速さが「ちょうど同じ」では足りず、稼働率に余裕を残します。どこまで残すかは、手順6で要件として決めます。
      - type: p
        text: 待ち時間と列の長さは、2つの式でつながります。最後尾の世帯の待ち時間は、前に並ぶ世帯の数をc×μで割った値なので、許せる列の長さは「立って待っていられる時間×c×μ」です。平均どうしでは、リトルの法則(並ぶ世帯の平均の数=着く速さλ×平均の待ち時間)が成り立ちます。平均を上限に合わせると、それより長く待つ世帯が出るので、上限には最後尾の式を使います。
      - type: heading
        text: 仕事を動かした先にも、列ができないかを確かめる
      - type: p
        text: IDEF0の区分で動かせる候補にした仕事を入口から外すと、入口の1世帯の時間sが短くなり、稼働率が下がります。区分の候補ごとにsを見積もり直し、稼働率を表にします。ただし、動かした仕事にも窓口が要ります。動かした先で係が1世帯ずつ順に受け付ける形なら、そこにも同じ計算をします。世帯が自分で受付カードを書き、係は書き終えたカードを確かめるだけなら、係の時間は確かめる分だけで計算します。ただし、字を書けない人や日本語を読めない人には係が代わりに書くので、その分の時間が加わります。その割合は訓練で確かめるまで分からないので、見積もりの表に「確かめていない数」と印を付けます。
      - type: p
        text: この手順でできるのは、見積もりの表です。行に入口のやり方の候補を、列に1世帯の時間・窓口の数・稼働率・列が伸び続けるかを並べ、どの数がどの記録から来たかを書きます。表の数は、手順6で要件の数字に、手順10で係の人数に使い、手順12の訓練で確かめ直します。

  - id: requirements
    step: 2
    heading: 見積もりとペルソナから、訓練で測れる要件を書く
    blocks:
      - type: point
        text: ここまでの手順で分かったことを、満たしたかどうかを訓練で確かめられる要件に書き直します。要件ごとに、数字の元になった手順と、確かめ方を書きます。
      - type: p
        text: 要件とは、設計が満たすべき条件を、満たしたかどうか確かめられる形で書いたものです。「早く中に入りたい」は要求(人の願い)で、「着いてから屋根の下に入るまで◯分以内」のように、測れる形で書けば要件になります。要件は、必須の要件、守るべき制約、あればうれしい要件の3つに分けます。
      - type: p
        text: 要件の数字は、前の手順の記録からたどれるように決めます。屋根の下に入るまでの時間は、ペルソナが立って待っていられる時間から決め、列で待つ時間と入口で聞かれる時間を足しても、その中に収まるようにします。入口で1世帯にかける時間は、手順5の見積もりで、稼働率に余裕が残る値から決めます。係への説明の時間は、受付に立つ側のペルソナから決めます。元をたどれるようにしておけば、訓練で要件に届かないとき、どの前提を見直すかが分かります。
      - type: table
        caption: 要件の表の形(数字は、ここまでの手順の記録から入れる)
        head:
          - 区分
          - 測ること
          - 数字の元
          - 確かめ方
        rows:
          - - 待たせず
            - 着いてから屋根の下に入るまでの時間
            - ペルソナが立って待っていられる時間
            - 着いた時刻と、屋根の下に入った時刻を記録する
          - - 待たせず
            - 入口で1世帯にかける時間
            - 手順5の見積もりで、稼働率に余裕が残る値
            - 聞き取りの時間をストップウォッチで測る
          - - 見落とさず
            - 手助けが要る人の見落としの数
            - 配慮のための場所を誰に使ってもらうかの、市の決まり
            - 手助けが要る役の参加者のうち、見落とした人数を数える
          - - 見落とさず
            - 日本語を読めない人が、受付の流れを分かるか
            - 聞き取りで挙がった、必要な言葉
            - 日本語を読めない役の人に、説明なしで通ってもらう
          - - 名簿を残す
            - 名簿の漏れの数と、人数の報告をまとめる時間
            - 市の災害対策本部へ人数を報告する間隔
            - 訓練の後に、名簿と参加者の数を突き合わせる
          - - 係
            - 初めての人が係を務めるまでの説明の時間
            - 受付に立つ側のペルソナ(手順をいつ知るか)
            - 初めての人に係を任せ、手順の間違いを数える
          - - 制約
            - 停電と通信の途絶の中でも続けられるか
            - 体育館の担当に聞いた、電源と明かりの備え
            - 照明と電源を切った状態で訓練する
          - - 制約(個人情報)
            - 名簿と受付カードを見られる人の範囲
            - 個人情報保護法と、市の決まり
            - 置き場所と、見た人の記録を確かめる
      - type: p
        text: 要件には、解決策を書きません。「紙のカードを使う」は要件ではなく案です。要件に書くと、手順7で紙以外の案を出せなくなります。「スムーズに受け付ける」のように測れない言葉も、訓練で確かめられないので、測ることと数字に書き直します。停電と通信の途絶を制約にするかも、決めつけずに、体育館の担当に聞いた電源と明かりの備えから決めます。
      - type: p
        text: 表の「確かめ方」の列は、そのまま手順12の訓練で測る項目になります。要件を書く時点で確かめ方まで決めておくと、試す段になって「何をもって成功とするか」で迷わずに済みます。
      - type: p
        text: "これで、目的の3つが、訓練で測れる物差しになります。屋根の下に入るまでの時間は「待たせず」を、手助けが要る人の見落としの数は「見落とさず」を、名簿の漏れは「名簿を残す」を確かめます。"

  - id: ideas
    step: 3
    heading: 制約とペルソナから方向を決め、IDEF0の箱ごとに案を出す
    blocks:
      - type: point
        text: 要件の表の制約は、案の方向を決めます。停電と通信の途絶を制約にしたなら、電気を使う案に加えて、電気がなくても動く方向でも案を出します。IDEF0の箱、ペルソナ、制約のそれぞれを、案の出どころにします。
      - type: p
        text: 制約は、案を減らすためだけのものではありません。「電気がなくても動くか」という問いは、紙・配置・掲示・係の分け方のように、道具以外の方向へ目を向けさせます。電気を使う案も捨てずに、「電気が止まったら、どう続けるか」とセットで考えます。電気が止まったときに受付まで止まる案は、手順8のふるいで外れます。
      - type: p
        text: 案は、部員が5分ずつ黙って書き出してから持ち寄ります。一人ずつ書けば、声の大きい人の案に引っ張られず、全員が同時に案を出せます。書き出す間は、良し悪しを言いません。比べるのは手順8です。案の出し方は、[[ideation#methods|案を広げる道具]]に書いています。
      - type: table
        caption: 案の出どころと、案を出すための問い
        head:
          - 出どころ
          - 案を出すための問い
        rows:
          - - IDEF0の箱「記録する」
            - 記録は、いつ、どこで、誰が書けば、入口に人を止めずに済むか
          - - IDEF0の箱「行き先を決める」
            - 何が分かれば行き先が決まるか。それを誰が、どうやって聞くか
          - - IDEF0の箱「案内する」
            - 着いた人が、迷わず、立ち止まらずに居場所へ着くには
          - - 制約「停電」
            - 電気がなくても、書ける、読める、見分けられるか
          - - 制約「通信の途絶」
            - 通信が使えない間の記録を、通信が戻ったときにどうまとめるか
          - - 避難する側のペルソナ
            - 立って待つ時間を減らすには。付き添いの人と本人が別々に動けるか
          - - 受付に立つ側のペルソナ
            - 当日の説明だけで動けるには。交代しても続けられるか
          - - 日本語を読めない人
            - 字を読まずに、問いに答えたり、流れを知ったりできるか
      - type: p
        text: 箱ごとに出た案は、[[ideation#chart|機能ごとの解き方の表]](行に箱を、列に解き方の案を並べる表)にまとめると、箱をまたいだ組み合わせを考えやすくなります。この手順でできるのは、案の一覧です。案ごとに、どの箱の案か、電気や通信が要るか、どの出どころから出たかを書きます。この一覧を、手順8でふるいにかけて比べます。

  - id: selection
    step: 4
    heading: 制約でふるいにかけ、要件を基準にして案を比べる
    blocks:
      - type: point
        text: まず、必須の要件と制約を満たせない案を外します。残った案は、要件から決めた基準で、ピューの概念選定法を使って比べます。一つの案で足りなければ、良いところを組み合わせます。
      - type: p
        text: 最初のふるいは、要件の表の必須の要件と制約です([[selection#must|必須の要件でふるいにかける]])。例えば停電と通信の途絶を制約にしたなら、案ごとに「電気が止まったときに、受付が止まるか」を確かめます。受付が止まる案は、受付の中心の案としては外します。ただし、電気が止まっても受付が続き、電気が使えるときだけ助けになる補助の案は残せます。外した案も、外した理由と一緒に記録します。
      - type: p
        text: 残った案は、ピューの概念選定法で比べます。基準案を一つ決め、他の案が評価の基準ごとに基準案より良ければ+、悪ければ-、同じならSを付けて、数を合計する方法です。基準案には、手順4で描いた今の受付を置きます。評価の基準には、要件の表の「測ること」をそのまま使い、案を見る前に決めておきます([[selection#criteria|基準は、案を見る前に決める]])。
      - type: heading
        text: 合計の数より、-の付いた基準を見る
      - type: p
        text: +とSと-は、手順5の見積もりや手順2の記録を基に付けます。元のない印には「見積もり」と書き添え、手順12の訓練で確かめる項目にします。合計が並んだら、それぞれの案の-がどの基準に付いたかを見ます。ある案の-を、別の案の+が補えるなら、2つを組み合わせた案をつくり、もう一度比べます。どの案もSばかりの基準があれば、その基準に効く案が足りないので、手順7に戻って案を足します。
      - type: p
        text: この手順でできるのは、比較の表と、選んだ理由と、選ばなかった案の理由です。選ばなかった理由を残しておけば、通信の備えや集められる係の人数が変わったときに、どの案を見直せばよいかが分かります。選んだ案の中身(入口で何を聞くか、受付の流れ、受付カード)は、次の手順から決めていきます。

  - id: questions
    label: 工程4と5にまたがる
    heading: 入口で聞くことは、答えで行き先が変わるかで選ぶ
    blocks:
      - type: point
        text: 入口で聞く問いは、候補を並べてから、答えで行き先が変わるか、後に回すと取り戻せないかなどの基準で選びます。問いが多すぎれば入口の時間を守れず、足りなければ手助けが要る人を見落とします。
      - type: p
        text: 案を選んでも、入口で何を聞き、答えごとにどこへ通すかは、まだ決まっていません。入口の問いは、手順5の「1世帯の時間」と、目的の「見落とさず」の両方を左右します。だから、問いは候補を並べ、一つずつ基準に照らして決めます。この手順は、選んだ案の中身を決める点で、選ぶ工程と形を詰める工程の両方にかかります。
      - type: heading
        text: 候補の問いは、様式と聞き取りと市の決まりから集める
      - type: p
        text: 候補は3つの所から集めます。手順1で読んだ様式の欄。手順2の聞き取りで挙がった「後から居場所を移ってもらった理由」。そして、市が配慮のための場所や福祉避難所を、誰に使ってもらうと決めているかです。どの人をどこへ通す決まりかが分かれば、それを見分けるために何を聞けばよいかが分かります。
      - type: heading
        text: 入口に残すかは、4つの基準で決める
      - type: table
        caption: 候補の問いを入口に残すかの基準
        head:
          - 基準
          - 確かめ方
          - 満たさないとき
        rows:
          - - 答えで行き先が変わるか
            - 答えが「はい」と「いいえ」で、通す場所や列や次の係が変わるかを書き出す
            - 入口では聞かず、受付カードの欄の候補にする
          - - 後に回すと取り戻せないか
            - 後で聞いたとき、居場所が埋まる、急ぐ手当てが遅れるなどが起きるか
            - 行き先が変わっても急がないなら、後で聞く候補にする
          - - 短く答えられるか
            - 「はい」か「いいえ」や指さしで答えられるか。かかる秒数を測る
            - 言い方を変えるか、他の問いとまとめる
          - - 周りに聞こえてよいか
            - 持病の名前など、周りに知られたくない中身に触れないか
            - 中身は聞かず、手助けが要るかだけを聞く
      - type: p
        text: 候補の問いごとに4つの基準を表にし、「入口で聞く」「後で受付カードに書く」「聞かない」のどれかに分けます。入口で聞く問いの数は、先に決め打ちしません。入口に残した問いの秒数を足し、手順6の要件「入口で1世帯にかける時間」に収まるかを確かめます。収まらなければ、問いをまとめるか、窓口の数を見直します。
      - type: heading
        text: 問いの言い方と、迷ったときの決まり
      - type: p
        text: 問いは「はい」か「いいえ」で答えられる形にし、日本語を読めない人には、絵や外国語でも答えられる形を考えます。代表者に「手助けが要りますか」と聞くと、代表者が自分のことだと受け取り、家族の中の手助けが要る人が抜ける恐れがあります。そこで、「この中に、歩くのに手助けが要る人はいますか」のように、世帯の中の誰かについて聞く形にします。
      - type: p
        text: 答えに迷う人をどちらへ通すかは、先に決めておきます。決め方は、2つの間違いの直しやすさを比べることです。手助けの要らない人を配慮のための場所へ通した場合と、手助けが要る人を一般の場所へ通した場合で、後から移ってもらう難しさを、体育館の配置と聞き取りの記録から見積もります。居場所はいったん決まると移ってもらうのが難しいので、この比べ方が、迷ったときの決まりの根拠になります。
      - type: p
        text: 行き先を札や掲示で示すなら、色だけで見分ける形にせず、記号と文字も入れます。色の見分けやすさは人によって違うからです。この手順でできるのは、問いの一覧です。問いごとに、残した理由、言い方(日本語と、絵や外国語)、答えごとの行き先を書きます。入口で聞かないことにした問いは、受付カードの欄の候補として手順11へ渡します。
        note: 誰にでも分かる掲示や札の考え方は、[[human-interface|ヒューマンインターフェース]]のページに書いています。

  - id: flow
    step: 5
    heading: 受付の流れと係の役目を、初めての人が動ける形に書く
    blocks:
      - type: point
        text: 入口から記録までの流れを、場所・やること・担当・目安の時間・使うものの表にします。係の役目は係ごとに1枚のカードにまとめ、交代した人もカードを読めば動けるようにします。
      - type: p
        text: 問いが決まれば、入口の後の流れを書けます。この手順の物差しは、受付に立つ側のペルソナに書いた「手順をいつ知るか」と、要件の「説明の時間」です。その人が説明の時間の中で動けるように、流れを表にし、係ごとにやることをカードにします。
      - type: table
        caption: 受付の流れの表に書く列と、その元になる手順
        head:
          - 列
          - 書くこと
          - 元になる手順
        rows:
          - - 場所
            - 入口、案内の道すじ、記録の場所など、仕事をする場所
            - 手順4のIDEF0の箱、手順8で選んだ案
          - - やること
            - その場所でする仕事を、動詞で1つずつ
            - 手順4の箱、手順9の問いの一覧
          - - 担当
            - どの係がするか
            - 手順5の窓口の数
          - - 目安の時間
            - 1世帯にかける時間、またはまとめる間隔
            - 手順5の見積もり、手順6の要件
          - - 使うもの
            - 様式、札、掲示、明かりなど
            - 手順8で選んだ案、手順6の制約
      - type: p
        text: 表の「目安の時間」を足し合わせ、要件の「屋根の下に入るまでの時間」に収まるかを確かめます。担当ごとの1世帯の時間からは、手順5と同じ計算で、係ごとの稼働率が出ます。係の人数は、この計算で稼働率に余裕が残る数にします。着く速さは時間帯で変わるので、多く着く時間帯と少ない時間帯で、係の人数を分けて書きます。
      - type: heading
        text: 役目のカードには、迷ったときの決まりまで書く
      - type: list
        items:
          - やること(流れの表の、その係の行を、順番通りに)
          - 迷ったときの決まり(手順9で決めた、答えに迷う人の通し方など)
          - 誰に何を伝えるか(配慮のための場所の空き具合、人数の報告など)
          - 見てよい情報と、見てはいけない情報(手順11で決める)
          - 交代の仕方(カードと道具を、そのまま次の人に渡す)
      - type: p
        text: カードは、受付に立つ側のペルソナが、要件の説明の時間の中で読み切れる長さにします。停電を制約にしたなら、どの場所にも電気を使わない明かりがあるか、掲示が暗くても読めるかも、流れの表で確かめます。この手順でできるのは、受付の流れの表と、係ごとの役目のカードです。どちらも、手順12の訓練でそのまま使います。

  - id: card
    step: 5
    heading: 受付カードの欄を、使い道と個人情報の決まりから決める
    blocks:
      - type: point
        text: 受付カードには、使い道を説明できる欄だけを置きます。持病などの情報は、見てよい係としまう場所を決めてから集めます。
      - type: p
        text: 受付カードは、名簿の元になる記録です。欄を増やすほど書く時間が延び、扱いに気をつける情報も増えます。だから、欄ごとに「何のためか」を書き、使い道を説明できる欄だけを残します。欄を決めずに白紙に書いてもらうと、書く中身が人によって変わり、人数を数えるのにも時間がかかります。
      - type: heading
        text: 欄の候補は、名簿の使い道から逆にたどる
      - type: p
        text: まず、名簿が何に使われるかを並べます。手順1で読んだ通り、名簿は物資の数を決め、安否の問い合わせに答え、市の災害対策本部へ人数を報告する元になります。配慮が要る人を、保健師などの係へつなぐのにも使います。使い道ごとに、そのために要る情報を書き出すと、欄の候補になります。手順9で入口では聞かないことにした問いも、ここで候補に加えます。
      - type: p
        text: 候補の中には、持病や障害のように、個人情報保護法の「要配慮個人情報」(病歴など、不当な差別や偏見が生じないよう、取り扱いに特に配慮が要る情報)に当たるものがあります。名前の似た「要配慮者」とは別の言葉です。こうした欄は、見てよい係と、しまう場所を決めてから置きます。
        note: 要配慮個人情報の定義は[個人情報保護法 第2条第3項(e-Gov法令検索)](https://laws.e-gov.go.jp/law/415AC0000000057)。
      - type: table
        caption: 欄の候補ごとに確かめること
        head:
          - 書くこと
          - 確かめること
        rows:
          - - 使い道
            - 名簿のどの使い道のための欄か。使い道を言えない欄は置かない
          - - いつ要るか
            - 着いてすぐ要るか、後でよいか。すぐ要るなら、入口の問いで足りていないか
          - - 誰が見るか
            - 記録の係だけか、配慮に必要な係(保健師など)も見るか
          - - 書き方
            - チェックや丸で答えられるか。字を書けない人や日本語を読めない人も答えられるか
          - - 扱いの決まり
            - 要配慮個人情報に当たるか。安否の問い合わせに答えてよいかを、本人に聞く欄が要るか
      - type: heading
        text: しまい方の決まりも、欄と一緒に決める
      - type: list
        items:
          - 受付カードを見てよい係を、役目ごとに決める
          - カードをしまう場所と、その場所から持ち出してよいかを決める
          - 名簿を、他の避難者の目に触れる場所に置かない
          - 安否の問い合わせに、誰の、どの情報を答えるかと、本人の意向の確かめ方を決める
          - 手助けが要ることの中身を、どの係にまで伝えるかを決める
          - 避難所を閉じるときのカードの扱い(市に渡すか、いつ処分するか)を、市の決まりに合わせて手順書に書く
      - type: p
        text: この手順でできるのは、受付カードの案と、欄ごとの使い道の表と、しまい方の決まりです。手順12の訓練では、カードを書く時間、名簿の漏れ、人数の報告をまとめる時間を測ります。

  - id: drill
    label: 試して直す
    heading: 役のカードを配った避難所開設訓練で、要件を一つずつ測る
    blocks:
      - type: point
        text: 手順書の案は、避難所開設訓練で試してから使います。参加者に役のカードを配り、見積もりに使った間隔で着いてもらい、要件の表の確かめ方通りに測ります。
      - type: p
        text: ここまでの時間や人数は、見積もりです。手順書は、書いた人の頭の中では動きます。初めての係と、暗さと、まとまって着く人が重なったときに動くかは、試すまで分かりません。できた手順は、避難所を運営する市や地域の人に見てもらってから、避難所開設訓練で試してもらいます。
        note: 内閣府のガイドラインも、避難者の受付と名簿の作成について実動訓練を行い、個人情報保護と安否確認の知識を共有するよう求めている。[内閣府「避難所運営等避難生活支援のためのガイドライン」(令和6年12月)](https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf)
      - type: heading
        text: 役のカードで、本番に来る人の幅をつくる
      - type: p
        text: 参加者には、車いすを使う人、日本語を読めない人、犬を連れた人などの役を書いたカードを配ります。役は、手順3のペルソナと、手順9の問いで通し分ける人がそろうように選びます。手助けが要る役のカードを何枚配ったかは、係には知らせずに記録しておきます。後で、通した先と突き合わせて、見落とした人数を数えるためです。車いすを使う人や留学生に本人として参加してもらえるなら、通った後に、迷った場所やつらかった場面を聞きます。
      - type: p
        text: 着く間隔も、本番に近づけます。手順5で使った「一番多く着く1時間」の世帯の数で3,600秒を割ると、平均の間隔が出ます。ただし、いつも同じ間隔で送り出すと、まとまって着く場面が抜けるので、ときどき数世帯を続けて送り出します。参加者が足りなければ、20分ほどに区切り、通り終えた人に入口へ戻ってもらって流れを続けます。受付の係には、受付が初めての人を選び、要件の説明の時間だけで始めてもらいます。停電を制約にしたなら、照明を消した状態で行います。
      - type: heading
        text: 測ることは、要件の表の確かめ方から決める
      - type: table
        caption: 訓練で測ることと、要件に届かないときに戻る手順
        head:
          - 測ること
          - 測り方
          - 届かないときに戻る手順
        rows:
          - - 着いてから屋根の下に入るまでの時間
            - 着いた時刻を役のカードの裏に書き、屋根の下に入った時刻と比べる
            - 手順5と9に戻り、窓口の数か問いを見直す
          - - 入口の聞き取りの時間
            - 観察の係がストップウォッチで測る
            - 手順9に戻り、問いをまとめるか、言い方を変える
          - - 見落とした人数
            - 手助けが要る役のカードと、通した先を突き合わせる
            - 手順9に戻り、問いの言い方を変える
          - - 日本語を読めない役の人が止まった場所
            - 観察の係がついて歩き、止まった場所を書く
            - 手順10に戻り、掲示の絵と置き場所を変える
          - - 初めての係の手順の間違い
            - 観察の係が数え、係が役目のカードを見返した場面も書く
            - 手順10に戻り、役目のカードを書き直す
          - - 記録の場所で待つ世帯の数
            - 5分ごとに数える
            - 手順5に戻り、代わりに書く人の割合を入れて計算し直す
          - - 名簿の漏れと、人数の報告をまとめる時間
            - 訓練の後に、名簿と参加者の数を突き合わせ、まとめる時間を測る
            - 手順11に戻り、欄と並びを見直す
      - type: p
        text: 試して要件とのずれが見つかったら、表の右の列の手順に戻って直し、直した手順書でもう一度試します。見積もりから外れた数は、手順5の見積もりの表に書き戻します。そうすれば、次の年の訓練の前に、同じ計算を新しい数でやり直せます。
      - type: p
        text: 受付の手順書は、初めて受付に立つ人が、読めばその通りに動けるように書きます。手順書に書くのは、次の項目です。
      - type: list
        items:
          - 入口で聞く問いと、その言い方
          - 答えごとの行き先と、迷ったときの決まり
          - 係の人数と役目、交代の仕方
          - 受付カードの書き方と、しまう場所、名簿を見てよい係
          - 停電のときの明かり
          - どの要件を、訓練でどうやって確かめるか

