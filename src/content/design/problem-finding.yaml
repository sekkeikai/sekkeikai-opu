title: 問題を見つける
en: Problem Finding
layer: step
order: 1
stepName: 問題発見
mode: diverge
tools: 観察・インタビュー・KJ法
short: 問題を見つける
question: 本当に解くべき問題は何か
summary: 解決策から始めず、誰が、どんな場面で、何に困っているのかを集めて、解くべき問題を一文にまとめる。
lead: 設計は、問題を見つけるところから始まります。最初の工程では、使う人を観察し、話を聞き、集めた事実から「誰の、どんな困りごとを解くのか」を見つけます。
chapters:
  - id: why
    heading: 解決策から始めると、解く問題を間違える
    blocks:
      - type: point
        text: 「何をつくるか」の前に、「誰が、どんな場面で、何に困っているか」を確かめます。問題を取り違えたら、その後の工程をどれだけ丁寧に進めても、出てくるのは的外れな答えです。
      - type: question
        text: 部室の予約が取り合いになっている。すぐに「予約アプリをつくろう」と決めてよいでしょうか?
        answer: まだ早いかもしれません。取り合いの本当の理由が「誰がいつ使うのか分からないこと」や「使い方の決まりがないこと」なら、必要なのはアプリより、予定の共有や使い方の決まりです。
      - type: p
        text: いきなり「こんなものをつくろう」と考え始めると、見当違いの問題を、見事に解いてしまうことがあります。最初の工程では、先入観をできるだけ脇に置いて、困りごとの事実を集めます。
      - type: p
        text: 手がかりは現場にあります。使っている人を観察し、話を聞き、今ある記録や数字を眺める。言葉にされない不満は、行動を見て初めて分かることも多いのです。使う人の特性と利用状況のつかみ方は[[human-interface]]、記録や数字をグラフにして読む方法は[[data-analysis]]のページにあります。

  - id: reframe
    heading: 問いを置き直すと、答えが変わる
    blocks:
      - type: point
        text: 頼まれた課題を、そのまま解き始める前に現場で確かめます。「何を解くか」を置き直しただけで、答えがまるごと変わることがあります。
      - type: example
        kind: real
        title: 電気が途切れても温める
        text: 2007年、スタンフォード大学の授業で、学生のチームが「安い保育器をつくる」という課題に取り組みました。ネパールを訪ねると、多くの出産は、病院から遠く電気の安定しない村で行われていました。寄付された保育器が、病院で使われずに置かれていることもありました。チームは問題を「電気がずっとつながっていなくても、赤ちゃんを温め続ける」に置き直し、温めたワックスの保温パックを入れる寝袋の形にしました。一度温めると、4~6時間ほど温度を保ちます。
        source: '[The Stanford Daily, 2010年11月18日](https://stanforddaily.com/2010/11/18/at-risk-babies-kept-warm-by-stanford-innovation/)、[Pomona College Magazine, 2011年](https://magazine.pomona.edu/?p=48)、[C-IP2(ジョージ・メイソン大学), 2017年](https://cip2.gmu.edu/?p=6397)。製品名は Embrace。'
      - type: p
        text: 決め手になったのは、性能の工夫より先に「安い保育器」という問いの立て方を疑ったことでした。問いのまま保育器を安くしても、電気の安定しない村では使えなかったはずです。
      - type: example
        kind: real
        title: 「行動」を見せる動物園
        text: 北海道旭川市の旭山動物園は、1990年代に入園者が年間26万人ほどまで減りました。職員たちは、来園者の多くが「動物の新たな魅力を発見したい」と期待していると考えました。そこで、動物の姿をただ見せるのではなく、泳ぐ、飛ぶ、木に登るといった、その動物らしい行動が見える展示(行動展示)に変えていきました。ペンギンが頭の上を泳ぐ水中トンネルなどが評判になり、2004年には、月によっては入園者数で上野動物園を上回りました。
        source: '[日本サービス大賞(第1回)受賞事例「旭川市旭山動物園」](https://service-award.jp/result_case/dl/creation01.pdf)と[政府広報オンライン「Highlighting Japan」2011年11月号(坂東元園長へのインタビュー)](https://www.gov-online.go.jp/eng/publicity/book/hlj/html/201111/201111_03j.html)。'
      - type: p
        text: 2つの例に共通するのは、「何をつくるか」より先に、使う人や来る人が本当は何に困り、何を求めているのかを、現場で確かめ直したことです。

  - id: listen
    heading: 「もしも」ではなく「この前」を聞く
    blocks:
      - type: point
        text: 聞き取りでは、意見や予想ではなく、最近実際にしたことを聞きます。「あったら使うか」と聞けば多くの人は「使う」と答えますが、実際の行動はそれと違うことがよくあります。
      - type: compare
        fromLabel: 避けたい聞き方
        toLabel: 事実が出てくる聞き方
        rows:
          - from: 予約アプリがあったら使う?
            to: 最後に部室を使ったのはいつ?
          - from: 部室の予約は不便ですか?
            to: 前回、空きをどう確かめた?
          - from: 毎週、部室を使いますか?
            to: 先週は何回、部室に行った?
          - from: 共有カレンダーは便利だと思う?
            to: 一番困ったのはどんなとき?
      - type: p
        text: もう一つのこつは、相手が自分の言葉で答える「開かれた質問(オープンクエスチョン)」をすることです。「不便ですか」と聞くと、相手は「はい」と答えて話が終わります。「そのとき、どうしましたか」と聞けば、こちらが想像していなかった工夫や回り道が出てきます。
        note: 意見や予想ではなく、過去の具体的な行動を聞くという助言は、[R. Fitzpatrick, The Mom Test (2013)](https://www.momtestbook.com/) などに見られる。
      - type: heading
        text: 見たことと、読み取ったことを分けて書く
      - type: p
        text: 記録するときは、見たこと・聞いたこと(事実)と、そこから自分が読み取ったこと(解釈)を**分けて書きます**。分けて書いておけば、後で解釈が間違っていたと分かったときも、元の事実に戻って考え直せます。次の章で紹介するKJ法でも、カードにはまず事実を書きます。
      - type: figure
        name: fact-vs-interpretation
      - type: steps
        ordered: true
        items:
          - title: 聞きたいことを絞る
            body: 確かめたいことを3つほどに絞り、それぞれについて「最近のできごと」を聞く質問にしておきます。
          - title: 現場で聞く・見る
            body: 2人で行き、1人が聞き、1人が書きます。答えに「どうしてですか」「そのときは?」と重ねて聞きます。
          - title: 事実と解釈を書き分ける
            body: 見たこと・聞いたことと、自分の読み取りを、別の欄やカードに書きます。言われた言葉は、そのまま書きます。
          - title: その日のうちに振り返る
            body: 記憶が新しいうちに2人で記録を読み合わせ、抜けを足します。気付いたことは解釈の欄に書きます。

  - id: kj
    heading: 分類の枠は、集めた事実から組み立てる
    blocks:
      - type: point
        text: 集めた事実はカードに書き、似たものどうしを集めて名前を付けます。枠を事実から組み立てるので、予想の外にある問題の形が見えてきます。
      - type: p
        text: 集めた事実を整理するには、文化人類学者の川喜田二郎が考案した**KJ法**が役立ちます。先に分類の枠を決めると、集めた事実を、予想通りの枠に押し込んでしまいます。用意した枠に合わない困りごとは、見落とされます。KJ法では、カードの集まりに付けた名前(表札)が、そのまま枠になります。集まりどうしの関係を図にし、最後に文章にまとめます。
        note: "[川喜田二郎『発想法 ― 創造性開発のために』中公新書, 1967年](https://ndlsearch.ndl.go.jp/books/R100000002-I000001091965)。"
      - type: figure
        name: kj-method

  - id: why-why
    heading: 原因は、「なぜ」を繰り返してたどる
    blocks:
      - type: point
        text: 目に見えた困りごとは、問題の入り口にすぎないことがあります。「なぜ」を繰り返して原因をたどると、本当に手を打つべきところが見えてきます。
      - type: p
        text: トヨタ自動車で生産方式を築いた大野耐一は、問題が起きたときに「なぜ」を5回繰り返して、本当の原因を突き止める方法を紹介しています。一度目の「なぜ」で出てくる答えは、たいてい表面の理由です。
        note: "[大野耐一『トヨタ生産方式 ― 脱規模の経営をめざして』ダイヤモンド社, 1978年](https://ndlsearch.ndl.go.jp/books/R100000002-I000001376735)。"
      - type: example
        title: 部室の予約なら(架空の例)
        text: 「なぜ」を繰り返すと、例えば次のようにたどれます。なぜ部室の取り合いが起きるのか。同じ時間に何人も来るから。なぜ同じ時間に来るのか。空いているか分からず、とりあえず行ってみるから。なぜ分からないのか。予定を書いておく場所がなく、部室の前まで行かないと確かめられないから。ここまでたどれれば、手を打つべきところは「部室の前まで行かないと空きが分からない」ことだと分かります。問題の一文には、解き方を含めずに「空き状況を前もって確かめられない」と書きます。どの答えも、話を聞いて確かめてから次の「なぜ」に進みます。
      - type: p
        text: 「なぜ」の答えは、2つ以上に枝分かれすることもあります。一つひとつの答えを、集めた事実で確かめながらたどります。

  - id: statement
    heading: 問題を、一文にまとめる
    blocks:
      - type: point
        text: 見えてきた問題は「誰の、どんな困りごとを、なぜ解くのか」という一文にまとめます。この一文が、次の工程で迷ったときの拠りどころになります。
      - type: p
        text: 一文にまとめるときは、困りごとだけを書き、解決策は[[ideation|案を広げる]]工程まで残しておくのがこつです。「予約アプリがない」ではなく「部員が、部室の空き状況を前もって確かめられず、行ってから引き返すことがある」と書けば、アプリ以外の解き方も考えられます。
      - type: p
        text: 集めた事実を基に、架空だが具体的な一人の利用者像(**ペルソナ**)を立てておくのも有効です。「週に2回、授業の合間に部室で作業する2年生」のように決めておくと、「この人は困るだろうか」と具体的に考えられます。

