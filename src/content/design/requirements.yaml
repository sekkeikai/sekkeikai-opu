title: 要件を定める
en: Requirements
layer: step
order: 2
stepName: 要件定義
mode: converge
tools: IDEF0・狩野モデル・要件の表
short: 要件を定める
question: 何を満たせば成功か
summary: 人の願い(要求)を、確かめられる条件(要件)に書き直す。要件は、完成したものを評価する物差しになる。
lead: 「使いやすいものが欲しい」という願いのままだと、目指す先も、できたものの良し悪しも、人によって変わります。この工程では、願いを、数や条件で確かめられる形に書き直し、誰が見ても同じ目標にします。
chapters:
  - id: why
    heading: 「使いやすい」のままでは、設計できない
    blocks:
      - type: point
        text: 人の願い(要求)を、設計が満たすべき確かめられる条件(要件)に書き直します。要件が決まって初めて、何を目指すかと、できたものの良し悪しが決まります。
      - type: question
        text: 「使いやすい予約の方法が欲しい」と頼まれたら、何が分かれば設計を始められるでしょう?
        answer: 誰が、どんな場面で、どのくらいの手間なら「使いやすい」と感じるのか。例えば「スマートフォンから3操作以内で予約できる」まで決まれば、案を考えることも、できた案を試すこともできます。
      - type: p
        text: 人の願い(**要求**)は、たいていあいまいです。「使いやすい」とは、誰にとって、どんな場面で、どの程度のことなのか。願いの言葉だけでは、そこが決まっていません。
      - type: p
        text: そこでこの工程では、まず目的を確かめます。次に「何ができればよいか」(機能要件)と、「どれくらいうまくできればよいか」(非機能要件。速さや使いやすさなど)を挙げます。守るべき制約も整理し、最後に、どれも数で確かめられる形(仕様)まで細かくします。
        note: 要求と要件の使い分けは、日本のソフトウェア開発の慣用による。国際規格 [ISO/IEC/IEEE 29148](https://www.iso.org/standard/72089.html) の日本語版 JIS X 0166 は requirement を「要求」と訳す。規格は、良い要求の条件として、必要であること、意味が一つに定まること、検証できること、実現できることなどを挙げている。
      - type: figure
        name: requirements-layers

  - id: functions
    heading: まず、果たすべき機能を図にする
    blocks:
      - type: point
        text: 「何をするものか」を、箱と矢印で書き出します。機能を言葉だけで並べるより、何を受け取り、何を生み、何に縛られるかが見えやすくなります。
      - type: p
        text: 機能を整理するのによく使われるのが、**IDEF0**という図の書き方です。箱が機能を表し、矢印は箱のどの辺に付くかで意味が決まっています。左から入るのが入力、右へ出るのが出力、上から入るのが守るべき決まり(制御)、下から入るのが機能を担う人や道具(機構)です。
        note: IDEF0は米空軍のICAM計画の中で開発され、1993年に米国の連邦情報処理規格[FIPS PUB 183](https://nvlpubs.nist.gov/nistpubs/Legacy/FIPS/fipspub183.pdf)になった。
      - type: idef0
        title: 「部室を予約する」をIDEF0で描く
        caption: 下の分解図では、全体の機能を3つの機能に分けている。予約をどんな道具で受け付けるか(機構)は、この工程では「未定」としておく。決めるのは「比べて選ぶ」工程。
        function: 部室を予約する
        inputs:
          - 使いたい日時
        controls:
          - 部室の使い方の決まり
          - 予約の締め切り
        outputs:
          - 確定した予約
          - 断りの連絡
        mechanisms:
          - 部員
          - 予約の仕組み(未定)
        steps:
          - name: 空き状況を調べる
            output: 空いている時間
          - name: 予約を申し込む
            output: 申し込み
          - name: 重なりを確かめて確定する
            output: 確定か断りの連絡
      - type: p
        text: 図にすると、言葉では見落としがちなことに気付きます。例えば最後の箱を動かすには、「予約が重なったら、誰がどう決めるのか」という決まり(制御)が要ります。これも要件の一つです。

  - id: write
    heading: 良い要件は、確かめられて、解き方を広く残す
    blocks:
      - type: point
        text: 要件は、できたものを前にして「満たしたか」を誰でも判定できる言葉で書きます。アプリや紙といった解き方は、次の工程に残します。
      - type: compare
        fromLabel: あいまいな書き方
        toLabel: 確かめられる書き方
        rows:
          - from: すぐに予約できる
            to: スマートフォンから3操作以内
          - from: 重ならないようにする
            to: 同じ時間帯の重なりは0件
          - from: 便利な通知
            to: 予約の前日に知らせが届く
          - from: なるべく安く
            to: 費用は0円
      - type: p
        text: 左の書き方では、できあがったものを前にしても、満たしたかどうかで意見が割れます。「すぐ」がどれくらいかは、人によって違うからです。右のように数や条件で書けば、試したり調べたりするだけで、誰が判定しても同じ結果になります。
      - type: p
        text: もう一つのこつは、要件には「何を満たすか」だけを書くことです。「予約アプリで3操作以内」と書くと、その時点で共有カレンダーや、他の予約の仕組みを借りる案が消えてしまいます。「どの道具で」は、次の[[ideation|案を広げる]]工程で考えます。
        note: "[ISO/IEC/IEEE 29148 の2011年版](https://www.iso.org/standard/45171.html)は、良い要求の条件の一つに、実現の方法から独立していること(implementation free)を挙げていた。"
      - type: heading
        text: 要件は、問題の一文までたどれるようにする
      - type: p
        text: 一つひとつの要件が、[[problem-finding#statement|問題を見つける工程]]でまとめた一文のどこから来たのかを、たどれるようにしておきます(トレーサビリティ)。どこにもたどれない要件があれば、余計な条件を疑います。予算のような制約は、問題の一文とは別に、部の事情から来ます。下の要件の表には、どこから来たかの列も付けています。

  - id: weight
    heading: 要件には、重みの違いがある
    blocks:
      - type: point
        text: 欠けたら困る必須の要件と、あればうれしい要件を分けます。限られた時間と費用を、どこに使うかを決めるためです。
      - type: p
        text: 要件の重みを決める手がかりは、元になった要求の性格にあります。要求の性格を見分ける道具として、日本で生まれた**狩野モデル**がよく使われます。満たされて当然で欠けると強い不満を生む「当たり前品質」、満たすほど満足が増す「一元的品質」、なくても不満はないがあると喜ばれる「魅力的品質」。どの要求に力を注ぐかを考える手がかりになります。
        note: "[狩野紀昭・瀬楽信彦・高橋文夫・辻新一「魅力的品質と当り前品質」『品質』14巻2号, 1984年](https://doi.org/10.20684/quality.14.2_147)。"
      - type: figure
        name: kano-model
      - type: p
        text: 部室の予約なら、重ならないことは「当たり前品質」、前日の知らせは「魅力的品質」に当たりそうです。どれに当たるかは、部員に聞いて確かめます。
      - type: table
        caption: 部室の予約の要件(架空の例)
        head:
          - 要件
          - 種類
          - どこから来たか
          - 確かめ方
        rows:
          - - スマートフォンから3操作以内で、空きを確かめて予約できる
            - 必須
            - 問題の一文の「前もって確かめられず」。空きを確かめて予約するまでの手間を小さくする
            - 部員5人に試してもらい、操作の数を数える
          - - 同じ時間帯の予約の重なりが0件
            - 必須
            - 問題の一文の「空き状況」。確かめた空きが、本当に空いているようにする
            - 1か月分の予約を見直す
          - - 費用は0円
            - 制約
            - 部の予算。部費を使わずに続けられるようにする
            - 使う道具の料金を調べる
          - - 予約の前日に知らせが届く
            - あればうれしい
            - 部員が予約を忘れること(聞き取りで確かめる)
            - 届いたかを部員に聞く
      - type: aside
        title: 要求を設計に結び付ける「品質表」
        body:
          - 要求を製品の特性に結び付ける方法に、**品質機能展開(QFD)**があります。その中心となる「品質表」では、使う人の声を表の行に、製品の技術的な特性を列に並べ、どの特性がどの要求に効くのかを一覧にします。品質機能展開は、それをさらに部品や製造工程にまで展開していく方法です。
          - 1960年代後半から1970年代にかけて、日本で赤尾洋二や水野滋らによって体系化されました([水野滋・赤尾洋二編『品質機能展開』1978年](https://ndlsearch.ndl.go.jp/books/R100000002-I000001379079))。1972年に三菱重工業神戸造船所でつくられた品質表が、よく知られた初期の例です([J. R. Hauser & D. Clausing, "The House of Quality", Harvard Business Review, 1988](https://hbr.org/1988/05/the-house-of-quality))。

  - id: check
    heading: 要件は、後で確かめる物差しになる
    blocks:
      - type: point
        text: 要件は、つくったものを確かめるときの物差しです。確かめられる形で書いておけば、守られているかを誰でも判定できます。
      - type: p
        text: ソフトウェア工学のバリー・ベームは、「製品を正しくつくっているか」(検証)と「正しい製品をつくっているか」(妥当性確認)を区別しました。どれほど精密に設計しても、要件そのものが間違っていれば、できあがるのは、正しくつくられた間違った製品です。
        note: '[B. W. Boehm, "Verifying and Validating Software Requirements and Design Specifications", IEEE Software, 1(1), 1984](https://doi.org/10.1109/MS.1984.233702)。'
      - type: figure
        name: v-model
      - type: p
        text: 上の図のV字モデルでは、要件定義で決めたことを、右側の一番上の段、受入試験で確かめます。要件が確かめられる形で書いてあれば、受入試験で何を試せば合格かが、初めから決まっています。
      - type: example
        kind: real
        title: 通知が届かなかった接触確認アプリ
        text: 新型コロナウイルスの接触確認アプリ「COCOA」では、2020年9月28日の更新(バージョン1.1.4)から、Android版で陽性者と接触しても通知が届かない状態になりました。一番大事な機能が働かない状態は、約4か月、見逃されました。更新の前に、通知が届くまでの一連の流れを試すテストは行われませんでした。その後のテストも、通知が出やすい設定で行われたため、不具合は見つかりませんでした。
        source: "[厚生労働省「接触確認アプリ『COCOA』の不具合の発生経緯の調査と再発防止の検討について（報告書）」2021年4月16日](https://www.mhlw.go.jp/content/000769774.pdf)。"
      - type: p
        text: 報告書は、発注者として全体を管理できていなかったことを原因の一つに挙げています。一番大事な要件ほど、誰がどう確かめるのかを、初めに決めておきます。

